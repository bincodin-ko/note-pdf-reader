<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe373"/><stop offset="1" stop-color="#ffcb14"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#7a5a00" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#g)"/>

  <!-- 강의자료 한 장 -->
  <g filter="url(#sh)">
    <rect x="232" y="168" width="560" height="688" rx="30" fill="#ffffff"/>
  </g>
  <g fill="#b6c4d2">
    <rect x="298" y="248" width="336" height="32" rx="16"/>
    <rect x="298" y="332" width="428" height="20" rx="10"/>
    <rect x="298" y="386" width="356" height="20" rx="10"/>
    <rect x="298" y="656" width="428" height="20" rx="10"/>
    <rect x="298" y="710" width="296" height="20" rx="10"/>
  </g>

  <!-- 드래그해서 오려낸 영역 -->
  <rect x="266" y="452" width="492" height="152" rx="6" fill="#141d27" fill-opacity="0.07"/>
  <rect x="266" y="452" width="492" height="152" rx="6" fill="none" stroke="#141d27" stroke-width="22"/>
  <g fill="#141d27">
    <rect x="242" y="428" width="48" height="48" rx="12"/>
    <rect x="734" y="428" width="48" height="48" rx="12"/>
    <rect x="242" y="580" width="48" height="48" rx="12"/>
    <rect x="734" y="580" width="48" height="48" rx="12"/>
  </g>
</svg>
