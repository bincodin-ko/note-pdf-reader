import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
}

/*
 * 버전은 package.json 하나에서 읽는다. 두 곳에 적어 두면 한쪽만 올리고 만다.
 * versionCode는 0.24.0 → 2400. 안드로이드는 이 숫자가 커야 덮어 깔린다.
 */
def pkg = new JsonSlurper().parse(file("../../package.json"))
def ver = pkg.version.toString()
def nums = ver.tokenize(".-").take(3).collect { it.isInteger() ? it.toInteger() : 0 }

android {
    namespace "com.capnote.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.capnote.app"
        // 29(안드로이드 10)부터 권한 없이 다운로드 폴더에 쓸 수 있다
        minSdk 29
        targetSdk 35
        versionCode nums[0] * 10000 + nums[1] * 100 + nums[2]
        versionName ver
    }

    /*
     * 서명 키를 저장소에 둔다.
     *
     * 빌드마다 새 키로 서명하면 다음 버전을 덮어 깔 수 없어 지우고 다시 깔아야
     * 하는데, 지우면 태블릿에 쌓아 둔 메모가 같이 사라진다. 그래서 늘 같은
     * 키로 서명한다. 스토어에 올리는 앱이 아니라 직접 깔아 쓰는 앱이라 이걸로
     * 충분하다 — 스토어에 올릴 때는 이 키를 바꿔야 한다.
     */
    signingConfigs {
        capnote {
            storeFile file("../capnote.keystore")
            storePassword "capnote"
            keyAlias "capnote"
            keyPassword "capnote"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.capnote
        }
        debug {
            signingConfig signingConfigs.capnote
        }
    }

    // 화면은 public/ 을 그대로 담는다. 복사본을 두면 언젠가 서로 달라진다
    sourceSets {
        main {
            assets.srcDirs = ["../../public"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
