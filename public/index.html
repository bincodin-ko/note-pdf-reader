    state.cards.push(card);
    renderCards();

    if (state.auto) runCard(card, state.auto.mode || null, state.auto.free || "");
  }

  async function runCard(card, mode, free) {
    var crop = pendingCrops[card.id] || { b64: null, text: "" };
    card.awaiting = false;
    card.pending = true;
    card.failed = false;
    card.mode = mode ? modeLabel(mode) : "직접 물음";
    card.askText = free || "";
    renderCards();

    var ctx = recentContext();
    var how = mode ? modeHow(mode) : ("다음 질문에 답하세요: " + free);

    var prompt =
      "대학 강의자료 " + card.page + "쪽에서 오려낸 부분입니다.\n" +
      (crop.text ? "이 영역의 원문 텍스트: " + crop.text + "\n" : "") +
      (ctx ? "직전에 오려낸 것들: " + ctx + "\n" : "") +
      "\n" + how + "\n" +
      "\n한국어로 답하고, 아래 JSON만 출력하세요. 설명이나 코드블록 표시는 넣지 마세요.\n" +
      "글 안에도 마크다운 표시(**, ##)는 쓰지 마세요. 목록은 \"- \"로만 적으세요.\n" +
      '{"memo": "PDF에 붙일 핵심 3~5줄. 각 줄 28자 이내로 끊고 줄바꿈 \\n 으로 구분. ' +
      '나중에 이 줄만 봐도 무슨 내용인지 알 수 있게 구체적으로.", ' +
      '"summary": "위에서 시킨 대로 쓴 본문"}';

    var content = [];
    if (crop.b64) {
      content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: crop.b64 } });
    }
    content.push({ type: "text", text: prompt });

    try {
      var raw = await callClaude([{ role: "user", content: content }]);
      var clean = raw.replace(/```json|```/g, "").trim();
      var parsed;
      try { parsed = JSON.parse(clean); }
      catch (e) { parsed = { memo: clean.slice(0, 40), summary: clean }; }
      card.memo = (parsed.memo || "").slice(0, 300);   // 3~5줄이 들어가야 한다
      card.summary = parsed.summary || clean;
      card.pending = false;
      setStatus("");
    } catch (err) {
      card.pending = false;
      card.summary = "정리를 받아오지 못했습니다.";
      card.failed = true;
      setStatus(String(err.message || err), true);
    }

    renderCards();
    saveCard(card);

    if (!card.failed && state.auto) {
      card.inserted = true;
      if (!card.box && card.rect && card.rect.w > 0) {
        card.box = { x: card.rect.x, y: card.rect.y, w: card.rect.w, h: card.rect.h };
      }
      await placeMemoFor(card);
      renderCards(); drawMemos(); saveCard(card);
    }
  }

  async function expand(card) {
    card.detail = "…";
    renderCards();
    try {
      card.detail = await callClaude([{
        role: "user",
        content: [{
          type: "text",
          text: "다음은 대학 강의자료 " + card.page + "쪽의 한 부분을 정리한 것입니다.\n\n" +
            card.summary +
            "\n\n이걸 처음 배우는 학생이 이해할 수 있게 한국어로 더 풀어서 설명해 주세요. " +
            "왜 그런지, 어디에 쓰이는지까지. 8줄 이내."
        }]
      }]);
    } catch (e) {
      card.detail = "더 자세한 설명을 받아오지 못했습니다.";
    }
    renderCards();
    saveCard(card);
  }

  /*
   * AI에게 직접 묻기
   *
   * 지금 보고 있는 쪽을 이미지로 같이 보낸다. 수업 중에 나오는 질문은
   * 대개 "이거 뭐야"라서, 화면을 안 보여주면 답이 겉돈다.
   * 오려내기와 달리 PDF에 붙일 자리가 없으므로 메모 제안은 하지 않는다.
   */
  /*
   * 답에 섞여 오는 마크다운 표시를 사람이 읽는 모양으로 바꾼다.
   *
   * **굵게**, ### 제목, - 목록 같은 표시가 글자 그대로 보여 읽기 나빴다.
   * 모델에게 쓰지 말라고 일러 두어도 섞여 오므로 여기서 받아낸다.
   * 모델이 만든 글이니 태그로 해석되지 않게 먼저 막아 둔다.
   */
  function mdInline(t) {
    t = t.replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
    t = t.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    return t;
  }

  function renderText(el, text) {
    el.textContent = "";
    String(text == null ? "" : text).split("\n").forEach(function (line) {
      var t = line.trim();
      var d = document.createElement("div");
      var h = t.match(/^#{1,6}\s+(.*)$/);
      if (h) { d.className = "mdh"; d.innerHTML = mdInline(h[1]); }
      else if (/^([-*•]|\d+\.)\s+/.test(t)) {
        d.className = "mdli";
        d.innerHTML = mdInline(t.replace(/^([-*•]|\d+\.)\s+/, ""));
      } else if (!t) { d.className = "mdgap"; }
      else { d.innerHTML = mdInline(t); }
      el.appendChild(d);
    });
  }

  /*
   * 종이(PDF)와 메모에는 표시를 벗겨서 넣는다. 거기서는 굵게 할 수 없으므로
   * 별표가 그대로 남으면 지저분하기만 하다.
   */
  function mdPlain(text) {
    return String(text == null ? "" : text)
      .split("\n")
      .map(function (line) {
        var t = line.replace(/\*\*([^*\n]+)\*\*/g, "$1").replace(/`([^`\n]+)`/g, "$1");
        t = t.replace(/^#{1,6}\s+/, "");
        t = t.replace(/^([-*])\s+/, "· ");
        return t;
      })
      .join("\n");
  }

  /*
   * 답을 쪽마다 나눠 붙인다.
   *
   * 전체·여러 쪽으로 물으면 답 하나가 여러 쪽 이야기를 한다. 그걸 통째로 한
   * 쪽에 붙이면 정작 그 내용이 있는 쪽에는 아무것도 안 남는다. 답에 "N쪽"을
   * 밝히도록 시켜 두었으니(그 표시로 이동 단추도 만든다), 같은 표시를 따라
   * 잘라 쪽마다 제 몫만 붙인다. 쪽을 하나도 안 밝힌 답은 나누지 않는다.
   */
  var PUT_MAX = 8;          // 한 번에 붙이는 쪽 수 — 답 하나가 자료를 덮지 않게

  function answerParts(card) {
    var here = card.scope === "chat" || !card.page ? state.page : card.page;
    var one = [{ page: here, text: card.summary || "" }];
    if (card.scope !== "all" && card.scope !== "range") return one;

    var by = {}, order = [], cur = 0, intro = [];
    String(card.summary || "").split("\n").forEach(function (ln) {
      var m = ln.match(/(\d{1,4})\s*쪽/);
      var n = m ? parseInt(m[1], 10) : 0;
      if (n >= 1 && n <= state.pages) cur = n;
      if (!cur) { intro.push(ln); return; }
      if (!by[cur]) { by[cur] = []; order.push(cur); }
      by[cur].push(ln);
    });
    if (!order.length) return one;
    order.sort(function (a, b) { return a - b; });
    if (intro.length) by[order[0]] = intro.concat(by[order[0]]);   // 머리말은 첫 쪽에
    return order.slice(0, PUT_MAX).map(function (p) {
      return { page: p, text: by[p].join("\n") };
    });
  }

  function memoText(t) {
    return mdPlain(t).replace(/\n{2,}/g, "\n").trim().slice(0, 300);
  }

  /*
   * 첫 쪽은 카드 자신이 맡고, 나머지 쪽은 목록에 올리지 않는 메모로 따로
   * 만든다(loose). 쪽마다 카드가 하나씩 생기면 질문 하나가 목록을 다 채운다.
   */
  async function attachAnswer(card, quiet) {
    var parts = answerParts(card);
    card.page = parts[0].page;
    card.memo = memoText(parts[0].text);
    card.inserted = true;
    card.declined = false;
    card.pin = null;
    await placeMemoFor(card);

    for (var i = 1; i < parts.length; i++) {
      var kid = {
        id: "a" + Date.now() + "_" + i,
        page: parts[i].page,
        loose: true,
        inserted: true,
        qna: true,
        scope: card.scope,
        question: card.question,
        memo: memoText(parts[i].text),
        summary: parts[i].text
      };
      state.cards.push(kid);
      await placeMemoFor(kid);
      saveCard(kid);
    }

    card.putPages = parts.map(function (p) { return p.page; });
    saveCard(card);
    closeMemoEdit();
    // 한 쪽뿐이면 바로 줄일 수 있게 열어 준다. 여러 쪽이면 어느 걸 여는지가 애매하다
    if (!quiet && parts.length === 1) card.editingMemo = true;
    renderCards(); drawMemos();
    setStatus(card.putPages.join("·") + "쪽에 붙였습니다.");
  }

  /*
   * 물어본 답을 마무리한다.
   *
   * "묻지 말고 자동으로 넣기"는 오려낸 것에만 걸려 있었다. 그래서 전체·여러
   * 쪽으로 물으면 답은 오는데 쪽에는 아무것도 안 남았다. 한쪽만 자동이면
   * 규칙이 아니라 예외다 — 답도 켜져 있으면 바로 붙인다.
   */
  async function finishAsk(card) {
    card.pending = false;
    renderCards();
    saveCard(card);
    if (!card.failed && state.auto && card.summary) await attachAnswer(card, true);
  }

  async function askQuestion(text) {
    var card = {
      id: "q" + Date.now(),
      page: state.page,
      qna: true,
      scope: Q_SCOPES[qScope].id,
      range: Q_SCOPES[qScope].id === "range" ? $("qRange").value.trim() : null,
      question: text,
      summary: "",
      pending: true
    };
    state.cards.push(card);
    renderCards();
    $("cards").scrollTop = $("cards").scrollHeight;

    var content = [];

    /*
     * 대화 — 자료를 보내지 않는다.
     *
     * 자료를 같이 보내면 모델이 거기에 매여 "자료에 없습니다"로 답한다.
     * 여기서는 아무것도 안 보내고, 대신 앞서 나눈 대화만 이어 붙인다.
     * 서버가 CLI로 갈 때 역할(role)이 한 덩어리로 합쳐지므로, 주고받은 말을
     * 우리가 직접 적어 넣어야 이어진다.
     */
    if (card.scope === "chat") {
      var hist = state.cards.filter(function (c) {
        return c.qna && c.scope === "chat" && c !== card && c.summary && !c.failed;
      }).slice(-6).map(function (c) {
        return "나: " + c.question + "\n너: " + String(c.summary).replace(/\s+/g, " ").slice(0, 500);
      }).join("\n\n");

      content.push({
        type: "text",
        text:
          "강의를 듣다가 떠오른 것을 묻습니다. 강의자료와는 상관없는 물음일 수 있습니다.\n" +
          (hist ? "\n지금까지 나눈 이야기:\n" + hist + "\n" : "") +
          "\n물음: " + text + "\n\n" +
          "한국어로, 수업 중에 읽을 것이므로 짧고 구체적으로 답하세요. 8줄 이내.\n" +
          "마크다운 표시(**, ##)는 쓰지 마세요. 목록은 \"- \"로만 적으세요."
      });
      try {
        card.summary = await callClaude([{ role: "user", content: content }]);
        setStatus("");
      } catch (err) {
        card.summary = "답을 받아오지 못했습니다.";
        card.failed = true;
        setStatus(String(err.message || err), true);
      }
      await finishAsk(card);
      return;
    }

    /*
     * 여러 쪽 — 정한 범위를 그림으로 보내 보고 답하게 한다.
     *
     * 전체 쪽은 글자만 보내므로 스캔본에서는 아무것도 못 읽는다. 한 단원 정도는
     * 눈으로 보여 주는 편이 확실하다. 다만 그림은 무겁다 — 여덟 쪽까지만 보낸다.
     */
    if (card.scope === "range") {
      var rg = parseRange(card.range);
      if (!rg || !rg.pages.length) {
        card.summary = "쪽 범위를 \"120-135\"처럼 적어 주세요.";
        card.failed = true; card.pending = false;
        renderCards(); saveCard(card);
        return;
      }
      card.pageFrom = rg.pages[0];
      card.pageTo = rg.pages[rg.pages.length - 1];
      card.page = rg.pages[0];
      if (rg.asked > rg.pages.length) {
        card.note = "한 번에 " + RANGE_MAX + "쪽까지만 볼 수 있어 " +
                    card.pageFrom + "–" + card.pageTo + "쪽만 봤습니다. 범위를 좁혀 다시 물어보세요.";
      }
      setStatus(card.pageFrom + "–" + card.pageTo + "쪽을 읽는 중…");

      for (var ri = 0; ri < rg.pages.length; ri++) {
        try {
          var shotP = await cropFromPdf(rg.pages[ri], { x: 0, y: 0, w: 1, h: 1 }, 1100);
          content.push({
            type: "text",
            text: rg.pages[ri] + "쪽:"
          });
          content.push({
            type: "image",
            source: { type: "base64", media_type: "image/jpeg",
                      data: shotP.toDataURL("image/jpeg", 0.75).split(",")[1] }
          });
        } catch (e) { /* 한 쪽을 못 그려도 나머지로 답한다 */ }
      }

      content.push({
        type: "text",
        text:
          "위는 강의자료 " + card.pageFrom + "–" + card.pageTo + "쪽을 찍은 그림입니다.\n" +
          "\n학생 질문: " + text + "\n\n" +
          "한국어로 구체적으로 답하세요. 12줄 이내. " +
          "어느 쪽에서 나온 내용인지 \"N쪽\" 형식으로 밝히세요. " +
          "그림에 없는 내용이면 없다고 먼저 말하세요.\n" +
          "마크다운 표시(**, ##)는 쓰지 마세요. 목록은 \"- \"로만 적으세요."
      });

      try {
        card.summary = await callClaude([{ role: "user", content: content }]);
        setStatus("");
      } catch (err) {
        card.summary = "답을 받아오지 못했습니다.";
        card.failed = true;
        setStatus(String(err.message || err), true);
      }
      await finishAsk(card);
      return;
    }

    if (card.scope === "all") {
      var digest = await allPagesDigest(text);

      /*
       * 글자 정보가 없는 스캔본은 전체 쪽에서 찾을 수가 없다. 예전에는 빈 글을
       * 보내 놓고 모델이 "자료에 없습니다"라고 답했는데, 없는 게 아니라 못 읽은
       * 것이므로 그렇게 말해 주는 편이 맞다.
       */
      if (!digest.pages) {
        card.summary = "이 자료에서는 글자를 읽어낼 수 없습니다(그림으로만 된 스캔본입니다).\n" +
                       "찾으려는 쪽으로 가서 \"이 쪽\"으로 물어보시면 화면을 보고 답합니다.";
        card.failed = true;
        card.pending = false;
        renderCards();
        saveCard(card);
        return;
      }

      /*
       * 얼마나 읽어냈는지 먼저 알려 준다.
       *
       * 스캔본은 쪽 몇 개만 글자가 남아 있는 일이 흔하다. 그러면 모델은 받은
       * 만큼만 보고 "없습니다"라고 답하는데, 사용자 눈에는 앱이 자료를 안 읽은
       * 것처럼 보인다. 앱이 못 읽은 것이라고 먼저 말해 주는 편이 맞다.
       */
      card.note =
        digest.pages < state.pages * 0.4
          ? "이 자료는 " + state.pages + "쪽 중 " + digest.pages +
            "쪽에서만 글자를 읽어낼 수 있었습니다(나머지는 그림입니다). 아래 답은 그 " +
            digest.pages + "쪽만 보고 쓴 것입니다 — 찾으시는 쪽으로 가서 \"이 쪽\"으로 물어보세요."
          : digest.sent < digest.pages
            ? "자료가 길어 " + digest.pages + "쪽을 통째로 보낼 수는 없었습니다. " +
              (digest.matched
                ? "물음에 나온 말이 있는 " + digest.sent + "쪽을 골라 봤습니다 — 찾는 게 안 나오면 말을 바꿔 다시 물어보세요."
                : "물음에 걸리는 말이 없어 앞쪽부터 " + digest.sent + "쪽을 봤습니다 — 찾는 낱말을 넣어 물으면 그 쪽을 찾아 봅니다.")
            : "";

      content.push({
        type: "text",
        text:
          "다음은 강의자료 " + state.pages + "쪽 중 글자를 읽어낸 " + digest.pages + "쪽 가운데, " +
          (digest.sent < digest.pages
            ? (digest.matched ? "물음에 나온 말이 있는 " : "앞쪽부터 ") + digest.sent + "쪽을 담은 원문입니다"
            : "전부의 원문입니다") +
          ". 쪽 번호는 자료 그대로입니다.\n\n" + digest.text +
          "\n\n학생 질문: " + text + "\n\n" +
          "한국어로 구체적으로 답하세요. 10줄 이내. " +
          "찾은 내용이 어느 쪽에 있는지 반드시 \"N쪽\" 형식으로 밝히세요. " +
          "위 원문을 끝까지 살펴본 뒤에 답하고, 비슷한 말로 적혀 있으면 그것도 찾으세요. " +
          "정말 없을 때만 없다고 하세요.\n" +
          "마크다운 표시(**, ##)는 쓰지 마세요. 목록은 \"- \"로만 적으세요."
      });
      try {
        card.summary = await callClaude([{ role: "user", content: content }]);
        setStatus("");
      } catch (err) {
        card.summary = "답을 받아오지 못했습니다.";
        card.failed = true;
        setStatus(String(err.message || err), true);
      }
      await finishAsk(card);
      return;
    }

    try {
      // 두 쪽 보기라도 묻는 건 지금 쪽 하나다. 그 자리만 잘라 보낸다
      var sl = slotOf(card.page) || (state.slots || [])[0];
      var shot = cropImage(
        sl ? { x: sl.x, y: sl.y, w: sl.w, h: sl.h }
           : { x: 0, y: 0, w: state.viewport.width / state.dprUsed, h: state.viewport.height / state.dprUsed },
        1100
      );
      content.push({
        type: "image",
        source: { type: "base64", media_type: "image/jpeg", data: shot.toDataURL("image/jpeg", 0.8).split(",")[1] }
      });
    } catch (e) { /* 이미지가 안 잡혀도 질문은 보낸다 */ }

    var ctx = recentContext();
    content.push({
      type: "text",
      text:
        "대학 강의자료 " + card.page + "쪽 화면입니다.\n" +
        (ctx ? "직전에 오려낸 것들: " + ctx + "\n" : "") +
        "\n학생 질문: " + text + "\n\n" +
        "한국어로, 수업 중에 읽을 것이므로 짧고 구체적으로 답하세요. 6줄 이내. " +
        "자료에 없는 내용이면 그렇다고 먼저 말하세요.\n" +
        "마크다운 표시(**, ##)는 쓰지 마세요. 목록은 \"- \"로만 적으세요."
    });

    try {
      card.summary = await callClaude([{ role: "user", content: content }]);
      setStatus("");
    } catch (err) {
      card.summary = "답을 받아오지 못했습니다.";
      card.failed = true;
      setStatus(String(err.message || err), true);
    }
    await finishAsk(card);
  }

  /*
   * 전체 쪽에서 찾기
   *
   * 쪽마다 원문을 뽑아 두고(한 번 읽으면 쟁여 둔다), 물음과 관련 있어 보이는
   * 쪽만 골라 보낸다.
   *
   * 전에는 앞쪽부터 예산이 찰 때까지 밀어 넣었다. 700쪽짜리 교재라면 266쪽에서
   * 끊기고, 540쪽에 있는 내용을 물으면 "자료에 없다"는 답이 돌아왔다. 실은
   * 보내지도 않은 것이었다. 통째로 보낼 수 없는 분량이라면, 어디를 보낼지
   * 고르는 게 맞다.
   */
  var _pageText = null;

  async function allPagesText() {
    if (_pageText) return _pageText;
    var out = [];
    for (var i = 1; i <= state.pages; i++) {
      try {
        var pg = await state.pdf.getPage(i);
        var tc = await pg.getTextContent();
        var t = tc.items.map(function (x) { return x.str; }).join(" ").replace(/\s+/g, " ").trim();
        if (t) out.push({ page: i, text: t });
      } catch (e) { /* 한 쪽을 못 읽어도 나머지로 답한다 */ }
    }
    _pageText = out;
    return out;
  }

  /*
   * 물음에서 찾을 말을 뽑는다.
   *
   * 한국어는 말 뒤에 조사가 붙어("분만의", "임신과") 그대로는 안 맞는다.
   * 흔한 조사만 떼어 내고, 아주 여러 쪽에 나오는 말은 무게를 0으로 둔다 —
   * "설명"이나 "내용" 같은 말로 쪽을 고를 수는 없기 때문이다.
   */
  var JOSA = /(으로서|으로써|에서는|에게서|이라고|에서|에게|한테|부터|까지|보다|으로|로서|로써|라고|처럼|과의|와의|에는|의|를|을|은|는|이|가|에|로|와|과|도|만)$/;

  function qTerms(q) {
    var seen = {}, out = [];
    String(q || "").split(/[^0-9A-Za-z가-힣]+/).forEach(function (w) {
      if (w.length < 2) return;
      var t = w.replace(JOSA, "");
      if (t.length < 2) t = w;
      if (!seen[t]) { seen[t] = 1; out.push(t); }
    });
    return out;
  }

  function countIn(hay, needle) {
    var n = 0, i = 0;
    while ((i = hay.indexOf(needle, i)) >= 0) { n++; i += needle.length; }
    return n;
  }

  /*
   * 물음과 관련 있어 보이는 쪽을 골라 예산만큼 담는다.
   * 아무 말도 안 걸리면 앞쪽부터 담는다 — "이 자료 무슨 내용이야" 같은 물음이다.
   */
  function pickPages(pages, question, budget, per) {
    var terms = qTerms(question);
    var weight = {};
    terms.forEach(function (t) {
      var df = 0;
      pages.forEach(function (p) { if (p.text.indexOf(t) >= 0) df++; });
      // 서너 쪽에 한 번꼴로 나오는 말은 쪽을 고르는 데 쓸모가 없다
      weight[t] = (pages.length && df / pages.length > 0.3) ? 0 : t.length;
    });

    var scored = pages.map(function (p) {
      var sc = 0;
      terms.forEach(function (t) {
        if (!weight[t]) return;
        sc += weight[t] * Math.min(3, countIn(p.text, t));
      });
      return { page: p.page, text: p.text, score: sc };
    });

    var hits = scored.filter(function (p) { return p.score > 0; });
    var byScore = hits.length
      ? hits.slice().sort(function (a, b) { return b.score - a.score || a.page - b.page; })
      : scored.slice();

    var take = [], used = 0;
    for (var i = 0; i < byScore.length; i++) {
      var t2 = byScore[i].text;
      if (t2.length > per) t2 = t2.slice(0, per);
      if (used + t2.length > budget) break;
      used += t2.length;
      take.push({ page: byScore[i].page, text: t2 });
    }
    take.sort(function (a, b) { return a.page - b.page; });
    return { picked: take, matched: hits.length, used: used };
  }

  async function allPagesDigest(question) {
    var pages = await allPagesText();
    var BUDGET = 240000, PER = 6000;
    var r = pickPages(pages, question, BUDGET, PER);
    return {
      text: r.picked.map(function (p) { return p.page + "쪽: " + p.text; }).join("\n"),
      pages: pages.length,            // 글자를 읽어낸 쪽 수 (전체를 다 센다)
      sent: r.picked.length,
      matched: r.matched,
      total: state.pages
    };
  }

  /*
   * 무엇을 두고 묻는지 — 이 쪽 / 전체 쪽 / 그냥 대화.
   *
   * 수업 중에 떠오르는 물음이 늘 자료 안에 있는 건 아니다. "이거 실제로는
   * 어떻게 쓰여?" 같은 건 자료를 들이밀 필요가 없고, 오히려 자료를 같이
   * 보내면 "자료에 없습니다"만 돌아온다. 그래서 자료를 아예 빼는 칸을 뒀다.
   * 버튼 하나를 눌러 돌려 쓴다 — 칸을 늘리면 그만큼 자료 볼 자리가 준다.
   */
  var Q_SCOPES = [
    { id: "page",  label: "이 쪽",   hint: "이 쪽에 대해 물어보기" },
    { id: "all",   label: "전체",    hint: "전체 쪽에서 찾아보기" },
    { id: "range", label: "여러 쪽", hint: "이 범위를 보고 답합니다" },
    { id: "chat",  label: "대화",    hint: "자료와 상관없이 물어보기" }
  ];
  var RANGE_MAX = 8;                      // 그림으로 보내는 쪽 수 상한
  var qScope = 0;

  function applyQScope() {
    var s = Q_SCOPES[qScope];
    $("qscope").textContent = s.label;
    $("qscope").classList.toggle("all", s.id === "all" || s.id === "range");
    $("qscope").classList.toggle("chat", s.id === "chat");
    $("qscope").title =
      s.id === "chat" ? "자료를 보내지 않고 그냥 묻습니다. 앞서 나눈 대화는 이어집니다"
      : s.id === "all" ? "자료 전체의 원문에서 찾습니다"
      : s.id === "range" ? "정한 범위의 쪽을 그림으로 보고 답합니다. 글자가 없는 스캔본에서도 됩니다"
      : "지금 보고 있는 쪽 화면을 보고 답합니다";
    $("q").placeholder = s.hint;

    var r = $("qRange");
    r.classList.toggle("gone", s.id !== "range");
    if (s.id === "range" && !r.value.trim() && state.pdf) {
      var to = Math.min(state.pages, state.page + RANGE_MAX - 1);
      r.value = state.page + "-" + to;
    }
  }

  /*
   * "120-135" 같은 글을 쪽 목록으로. 한 쪽만 적어도 된다.
   * 그림으로 보내는 것이라 무한정 늘릴 수 없어 상한을 둔다.
   */
  function parseRange(text) {
    var m = String(text || "").replace(/\s|쪽/g, "").match(/^(\d+)(?:[-~–](\d+))?$/);
    if (!m) return null;
    var a = parseInt(m[1], 10), b = m[2] ? parseInt(m[2], 10) : a;
    if (b < a) { var t = a; a = b; b = t; }
    a = Math.max(1, a); b = Math.min(state.pages, b);
    if (!(a >= 1 && b >= a)) return null;
    var out = [];
    for (var i = a; i <= b && out.length < RANGE_MAX; i++) out.push(i);
    return { pages: out, asked: b - a + 1 };
  }

  $("qscope").onclick = function () {
    qScope = (qScope + 1) % Q_SCOPES.length;
    applyQScope();
  };
  applyQScope();

  function sendQuestion() {
    var el = $("q");
    var text = el.value.trim();
    if (!text || !state.pdf) return;
    el.value = "";
    askQuestion(text);
  }

  $("qRange").addEventListener("keydown", function (e) {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); $("q").focus(); }
  });

  $("qsend").onclick = sendQuestion;
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sendQuestion(); }
    e.stopPropagation();      // 좌우 화살표가 페이지를 넘기지 않게
  });

  /* ---------- 카드 ---------- */

  function renderCards() {
    var box = $("cards");
    box.innerHTML = "";
    var list = state.cards.filter(function (c) { return !c.manual && !c.loose; });
    $("count").textContent = list.length ? list.length + "장" : "";

    if (!list.length) {
      box.innerHTML = '<div class="hint">아직 오려낸 것이 없습니다.<br />PDF 위에서 드래그해 보세요.<br />빈 곳을 두 번 누르면 직접 메모를 쓸 수 있고,<br />메모는 끌어서 옮길 수 있습니다.<br />아래 칸에 바로 물어봐도 됩니다.</div>';
      return;
    }

    list.forEach(function (card) {
      var el = document.createElement("div");
      el.className = "card" + (card.qna ? " qna" : "");

      // 질문 카드와 쪽 전체 정리에는 오려낸 그림이 없다. 빈 자리를 만들지 않는다
      if (!card.qna && card.img) {
        var img = document.createElement("img");
        img.src = card.img;
        img.alt = card.page + "쪽에서 오려낸 부분";
        el.appendChild(img);
      }

      var body = document.createElement("div");
      body.className = "cardbody";

      var meta = document.createElement("div");
      meta.className = "cardmeta";
      // 쪽 표시를 누르면 그 쪽으로 간다 — 목록에서 자료로 되짚어 가는 길
      var jumpable = !(card.qna && (card.scope === "all" || card.scope === "chat"));
      var pg = document.createElement(jumpable ? "button" : "span");
      if (jumpable) {
        pg.className = "gopage";
        pg.title = card.page + "쪽으로 갑니다";
        pg.onclick = function () { gotoPage(card.page); };
      }
      // 대화는 쪽도 "질문"도 붙이지 않는다 — 자료와 상관없는 말이라 그 편이 맞다
      pg.textContent = card.qna && card.scope === "chat"
        ? "대화"
        : (card.qna && card.scope === "all" ? "전체"
           : card.qna && card.scope === "range" ? card.pageFrom + "–" + card.pageTo + "쪽"
           : card.page + "쪽") +
          (card.qna ? " · 질문" : "");
      if (card.mode && !card.qna) {
        var tag = document.createElement("span");
        tag.className = "modetag";
        tag.textContent = " · " + card.mode;
        pg.appendChild(tag);
      }

      var acts = document.createElement("span");
      acts.style.display = "flex";
      acts.style.gap = "6px";

      if (!card.pending && !card.failed && !card.editing && !card.qna) {
        var ed = document.createElement("button");
        ed.textContent = "고치기";
        ed.onclick = function () { card.editing = true; renderCards(); };
        acts.appendChild(ed);
      }

      var del = document.createElement("button");
      del.textContent = "지우기";
      del.onclick = function () {
        var at = state.cards.indexOf(card);
        state.cards = state.cards.filter(function (c) { return c !== card; });
        deleteCard(card);
        renderCards();
        drawMemos();
        offerUndo("카드를 지웠습니다.", function () {
          card.editingMemo = false;
          state.cards.splice(at, 0, card);
          saveCard(card);
          renderCards(); drawMemos();
          setStatus("되돌렸습니다.");
        });
      };
      acts.appendChild(del);

      meta.appendChild(pg);
      meta.appendChild(acts);
      body.appendChild(meta);

      // 아직 무엇을 시킬지 안 골랐다 — 여기서 고른다
      if (card.awaiting) {
        var pick = document.createElement("div");
        pick.className = "pick";
        var pt = document.createElement("div");
        pt.className = "picktitle";
        pt.textContent = "이 부분을 어떻게 해줄까요?";
        pick.appendChild(pt);

        var prow = document.createElement("div");
        prow.className = "pickrow";
        ASK_MODES.forEach(function (m) {
          if (m.id === "n") {                      // 숫자를 정해서 고르는 칸
            prow.appendChild(nSentRow(function () { runCard(card, m); }));
            return;
          }
          var b = document.createElement("button");
          b.textContent = modeLabel(m);
          if (m.id === "core") b.className = "primary";
          b.onclick = function () { runCard(card, m); };
          prow.appendChild(b);
        });
        pick.appendChild(prow);

        var pf = document.createElement("div");
        pf.className = "pickfree";
        var pin2 = document.createElement("input");
        pin2.type = "text";
        pin2.placeholder = "직접 물어보기";
        pin2.maxLength = 300;
        var pgo = document.createElement("button");
        pgo.textContent = "묻기";
        pgo.onclick = function () {
          var v = pin2.value.trim();
          if (v) runCard(card, null, v);
        };
        pin2.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); pgo.click(); }
          e.stopPropagation();          // 좌우 화살표가 페이지를 넘기지 않게
        });
        pf.appendChild(pin2); pf.appendChild(pgo);
        pick.appendChild(pf);

        body.appendChild(pick);
        el.appendChild(body);
        box.appendChild(el);
        return;
      }

      if (card.editing) {
        var edit = document.createElement("div");
        edit.className = "cardedit";

        var l1 = document.createElement("label");
        l1.textContent = "PDF에 붙는 한 줄";
        var memoIn = document.createElement("input");
        memoIn.type = "text";
        memoIn.value = card.memo || "";
        memoIn.maxLength = 60;

        var l2 = document.createElement("label");
        l2.textContent = "정리";
        var sumIn = document.createElement("textarea");
        sumIn.rows = 6;
        sumIn.value = card.summary || "";

        edit.appendChild(l1);
        edit.appendChild(memoIn);
        edit.appendChild(l2);
        edit.appendChild(sumIn);

        var detIn = null;
        if (card.detail) {
          var l3 = document.createElement("label");
          l3.textContent = "자세한 설명";
          detIn = document.createElement("textarea");
          detIn.rows = 6;
          detIn.value = card.detail;
          edit.appendChild(l3);
          edit.appendChild(detIn);
        }

        var eb = document.createElement("div");
        eb.className = "editbtns";
        var ok = document.createElement("button");
        ok.className = "primary";
        ok.textContent = "저장";
        ok.onclick = function () {
          card.memo = memoIn.value.slice(0, 60);
          card.summary = sumIn.value;
          if (detIn) card.detail = detIn.value;
          card.editing = false;
          renderCards();
          drawMemos();
          saveCard(card);
        };
        var cancel = document.createElement("button");
        cancel.textContent = "취소";
        cancel.onclick = function () { card.editing = false; renderCards(); };
        eb.appendChild(ok);
        eb.appendChild(cancel);
        edit.appendChild(eb);

        body.appendChild(edit);
        el.appendChild(body);
        box.appendChild(el);
        return;
      }

      if (card.qna) {
        var q = document.createElement("div");
        q.className = "qtext";
        q.textContent = "“" + card.question + "”";
        body.appendChild(q);
      }

      if (card.note && !card.pending) {
        var nt = document.createElement("div");
        nt.className = "cardnote";
        nt.textContent = card.note;
        body.appendChild(nt);
      }

      var txt = document.createElement("div");
      txt.className = "cardtext" + (card.pending ? " loading" : "");
      if (card.pending) txt.textContent = card.qna ? "답하는 중…" : "정리하는 중…";
      else renderText(txt, card.summary);
      body.appendChild(txt);

      if (card.detail) {
        var det = document.createElement("div");
        det.className = "cardtext";
        det.style.marginTop = "9px";
        det.style.color = "var(--muted)";
        renderText(det, card.detail);
        body.appendChild(det);
      }

      // 답에 나온 쪽 번호로 바로 갈 수 있게 한다
      if (card.qna && !card.pending && card.summary) {
        var pages = [];
        String(card.summary).replace(/(\d{1,4})\s*쪽/g, function (_, n) {
          n = parseInt(n, 10);
          if (n >= 1 && n <= state.pages && pages.indexOf(n) < 0) pages.push(n);
          return _;
        });
        if (pages.length) {
          var jr = document.createElement("div");
          jr.className = "jump";
          pages.slice(0, 8).forEach(function (n) {
            var jb = document.createElement("button");
            jb.textContent = n + "쪽으로";
            jb.onclick = function () {
              state.page = n; closeMemoEdit(); renderPage();
            };
            jr.appendChild(jb);
          });
          body.appendChild(jr);
        }
      }

      /*
       * 물어본 답도 쪽에 붙일 수 있게 한다.
       *
       * 대화로 나눈 것까지 메모가 되면 수업 중에 떠올린 것을 그 자리에 남길 수
       * 있다. 답은 길 수 있으니 붙일 때 짧게 줄이고, 바로 고칠 수 있게 편집칸을
       * 연다 — 붙여 놓고 다듬는 게 자연스럽다.
       */
      if (!card.pending && !card.failed && card.qna) {
        if (card.inserted) {
          var qdone = document.createElement("div");
          qdone.className = "done";
          qdone.textContent = "PDF " + (card.putPages || [card.page]).join("·") +
                              "쪽에 메모로 붙였습니다";
          body.appendChild(qdone);
        } else {
          var qput = document.createElement("div");
          qput.className = "more";
          var qb = document.createElement("button");
          // 어디에 붙는지 단추에 적는다 — 전체·여러 쪽이면 보고 있는 쪽이 아니다
          var tgt = answerParts(card).map(function (p) { return p.page; });
          qb.textContent = tgt.length > 1
            ? tgt.join("·") + "쪽에 나눠 붙이기"
            : tgt[0] + "쪽에 메모로 붙이기";
          qb.title = tgt.length > 1
            ? "답에 나온 쪽마다 그 쪽 이야기만 붙입니다"
            : "이 답을 그 쪽에 메모로 붙입니다";
          qb.onclick = function () { attachAnswer(card); };
          qput.appendChild(qb);
          body.appendChild(qput);
        }
      }

      if (!card.pending && !card.failed && !card.qna) {
        if (!card.detail) {
          var more = document.createElement("div");
          more.className = "more";
          var mb = document.createElement("button");
          mb.textContent = "더 자세히";
          mb.onclick = function () { expand(card); };
          more.appendChild(mb);
          body.appendChild(more);
        }

        if (card.inserted) {
          var done = document.createElement("div");
          done.className = "done";
          done.textContent = "PDF " + card.page + "쪽에 메모로 붙였습니다";
          body.appendChild(done);
        } else if (card.declined) {
          /*
           * 예전에는 한 번 빼면 declined가 남아 다시 붙일 길이 없었다.
           * 언제든 도로 붙일 수 있게 버튼을 남긴다.
           */
          var re = document.createElement("div");
          re.className = "reput";
          var rb = document.createElement("button");
          rb.textContent = "PDF에 다시 붙이기";
          rb.onclick = async function () {
            card.inserted = true;
            card.declined = false;
            if (!card.box && card.rect && card.rect.w > 0) {
              card.box = { x: card.rect.x, y: card.rect.y, w: card.rect.w, h: card.rect.h };
            }
            if (!card.pin) await placeMemoFor(card);
            saveCard(card);
            renderCards(); drawMemos();
          };
          re.appendChild(rb);
          body.appendChild(re);
        } else {
          var ask = document.createElement("div");
          ask.className = "ask";
          ask.textContent = "이 내용을 그 자리에 메모로 붙일까요? — “" + card.memo + "”";
          var row = document.createElement("div");
          row.className = "askrow";
          var yes = document.createElement("button");
          yes.className = "primary";
          yes.textContent = "예";
          yes.onclick = async function () {
            card.inserted = true;
            // 오려낸 자리를 테두리로 남긴다. 이후 조정해도 rect(AI에 보낸 범위)는 그대로다
            if (!card.box && card.rect && card.rect.w > 0) {
              card.box = { x: card.rect.x, y: card.rect.y, w: card.rect.w, h: card.rect.h };
            }
            await placeMemoFor(card);       // 붙이는 순간 자리를 정해 화면과 PDF를 맞춘다
            renderCards(); drawMemos(); saveCard(card);
          };
          var no = document.createElement("button");
          no.textContent = "아니요";
          no.onclick = function () {
            card.declined = true;
            renderCards(); saveCard(card);
          };
          row.appendChild(yes); row.appendChild(no);
          ask.appendChild(row);
          body.appendChild(ask);
        }
      }

      if (card.failed) {
        var retry = document.createElement("div");
        retry.className = "more";
        var rb = document.createElement("button");
        rb.textContent = "다시 시도";
        rb.onclick = function () {
          var q = card.qna ? card.question : null;
          state.cards = state.cards.filter(function (c) { return c !== card; });
          deleteCard(card);
          renderCards();
          // 질문은 내용이 남아 있으니 바로 다시 보낼 수 있다. 오려낸 건 그림이 필요하다
          if (q) askQuestion(q);
          else setStatus("같은 부분을 다시 그어 주세요.");
        };
        retry.appendChild(rb);
        body.appendChild(retry);
      }

      el.appendChild(body);
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  }

  /* ---------- 페이지 위 메모 ---------- */

  /*
   * 메모 치수는 PDF 포인트로 한 번만 정한다.
   * 화면은 이 값을 배율만 맞춰 그리므로 화면과 내보낸 PDF가 같아진다.
   * 8.5pt로 줄인 건, 예전 13pt 상자가 슬라이드 위에서 원문을 가릴 만큼 컸기 때문이다.
   */
  var MEMO = { w: 190, fs: 8.5, lh: 11.6, pad: 6, bar: 3 };

  /*
   * 메모 글자 크기는 사람마다 다르다. 슬라이드가 빽빽하면 작게, 큰 화면에
   * 띄워 놓고 보면 크게 쓴다. 폭도 같이 늘려 한 줄에 들어가는 글자 수를
   * 유지한다 — 폭을 두면 글자만 커져서 상자가 세로로만 길어진다.
   * PDF마다 갈리는 값이 아니라 localStorage에 적는다.
   */
  var MEMO_FS_MIN = 6, MEMO_FS_MAX = 16, MEMO_FS_BASE = 8.5, MEMO_W_BASE = 190;

  /*
   * 메모 하나의 치수. card.fs가 있으면 그 메모만 그 크기로 간다.
   * 폭도 같이 늘려야 한 줄에 들어가는 글자 수가 유지된다 — 글자만 키우면
   * 상자가 세로로만 길어진다.
   */
  function memoDims(fs) {
    var f = fs > 0 ? fs : MEMO.fs;
    if (f === MEMO.fs) return MEMO;                  // 기본 크기는 만들지 않고 그대로 쓴다
    return {
      fs: f,
      lh: Math.round(f * 1.365 * 10) / 10,
      w: Math.round(MEMO_W_BASE * f / MEMO_FS_BASE),
      pad: MEMO.pad,
      bar: MEMO.bar
    };
  }

  function applyMemoFs(v, quiet) {
    var fs = Math.max(MEMO_FS_MIN, Math.min(MEMO_FS_MAX, Math.round(v * 2) / 2));
    MEMO.fs = fs;
    MEMO.lh = Math.round(fs * 1.365 * 10) / 10;
    MEMO.w = Math.round(MEMO_W_BASE * fs / MEMO_FS_BASE);
    try { localStorage.setItem("capnote:memofs", String(fs)); } catch (e) {}
    if ($("mfsDown")) {
      $("mfsDown").disabled = !state.pdf || fs <= MEMO_FS_MIN;
      $("mfsUp").disabled = !state.pdf || fs >= MEMO_FS_MAX;
    }
    if (!quiet) {
      drawMemos();
      setStatus("메모 글자 " + fs + "pt");
    }
  }

  (function () {
    var v = parseFloat(localStorage.getItem("capnote:memofs"));
    applyMemoFs(v >= MEMO_FS_MIN && v <= MEMO_FS_MAX ? v : MEMO_FS_BASE, true);
  })();

  /*
   * 글자 크기를 올리고 내린다.
   *
   * 전에는 크기가 하나뿐이라 한 메모를 키우면 전부 같이 커졌다. 보통은 중요한
   * 메모 하나만 크게 두고 싶다. 그래서 고치는 중인 메모가 있으면 그 메모만
   * 바꾸고, 아무것도 안 고치는 중이면 예전처럼 기본 크기를 바꾼다
   * (앞으로 붙일 메모와, 따로 정하지 않은 메모들이 따라간다).
   */
  function bumpMemoFs(step) {
    var card = memoEditor && memoEditor.card;
    if (!card) { applyMemoFs(MEMO.fs + step); return; }

    // 다시 그리면 편집칸을 새로 만드니, 치던 글을 먼저 챙긴다
    if (memoEditor.ta.value !== (card.memo || "")) card.memo = memoEditor.ta.value;

    var cur = card.fs > 0 ? card.fs : MEMO.fs;
    var v = Math.max(MEMO_FS_MIN, Math.min(MEMO_FS_MAX, Math.round((cur + step) * 2) / 2));
    if (v === cur) return;
    card.fs = v;
    saveCard(card);
    drawMemos();
    setStatus("이 메모만 글자 " + v + "pt");
  }

  /*
   * 쪽을 넘길 때 오른쪽 아래에 "12 / 668"을 잠깐 띄운다.
   * 수업 중에 쓰는 도구라 계속 떠 있으면 거슬린다 — 넘길 때만 알리고 사라진다.
   */
  var badgeTimer = null;
  function showPageBadge() {
    var el = $("pageBadge");
    if (!el || !state.pdf) return;
    var seen = visiblePages();
    el.textContent = (seen.length > 1 ? seen[0] + "–" + seen[seen.length - 1] : state.page) +
                     " / " + state.pages;
    el.classList.add("show");
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(function () { el.classList.remove("show"); }, 1400);
  }

  function ptPx(slot) {                   // 화면에서 1pt가 몇 px인가 (쪽 하나 기준)
    var sl = slot || (state.slots || [])[0];
    if (!sl || !sl.pw) return 1;
    return sl.w / sl.pw;
  }

  /*
   * 줄바꿈을 한 곳에서만 계산해 화면과 PDF가 같은 줄을 쓰게 한다.
   * 각자 접으면 폰트 계산이 미묘하게 달라져 줄 수가 어긋난다.
   *
   * 폭을 190pt로 못 박아 두니 자리를 많이 버렸다. 한 문장이 애매하게 두 줄로
   * 접혀 오른쪽이 늘 비었고, 짧은 메모도 같은 폭을 차지했다.
   *
   * 그래서 두 걸음으로 접는다. (1) 넓게 잡아 줄 수를 가장 적게 만들고,
   * (2) 그 줄 수를 지키는 선에서 폭을 끝까지 줄인다. 상자 넓이를 줄이는 쪽으로
   * 고르면 안 된다 — 글 넓이는 어차피 같아서, 좁고 긴 탑이 뽑힌다. 자료를
   * 가리는 건 높이 쪽이라 납작한 편이 낫고, (2)가 오른쪽 빈자리를 없앤다.
   */
  var MEMO_W_MAX = 250, MEMO_W_MIN = 64;   // 8.5pt 기준. 글자를 키우면 같이 는다

  /*
   * 어디서 접어도 되는지 나눈다 — 띄어쓰기 자리에서만.
   *
   * 한글은 글자 사이 아무 데서나 접어도 규칙에는 맞다. 그래서 전에는 글자
   * 단위로 접었는데, 그러면 "조직을"이 "조 / 직을"로 갈라져 읽다가 걸린다.
   * 상자 폭에 글을 억지로 맞추는 꼴이다. 접는 자리는 글이 정하고 폭이
   * 따라와야 한다. 한 어절이 상자보다 길 때만(긴 영어 낱말 따위) 어쩔 수
   * 없이 쪼갠다 — wrapUnits가 그때만 글자로 내려간다.
   */
  function breakUnits(s) {
    var units = [], i = 0, j;
    while (i < s.length) {
      j = s.indexOf(" ", i);
      if (j < 0) { units.push(s.slice(i)); break; }
      while (j + 1 < s.length && s[j + 1] === " ") j++;     // 연이은 공백은 앞에 붙인다
      units.push(s.slice(i, j + 1));
      i = j + 1;
    }
    return units;
  }

  function wrapUnits(units, max, mw) {
    var lines = [], cur = "", i, u;
    for (i = 0; i < units.length; i++) {
      u = units[i];
      if (mw(u) > max && u.length > 1) {          // 칸보다 긴 덩어리는 별수 없이 쪼갠다
        units = units.slice(0, i).concat(u.split(""), units.slice(i + 1));
        u = units[i];
      }
      var next = cur + u;
      if (cur && mw(next.replace(/\s+$/, "")) > max) {
        lines.push(cur.replace(/\s+$/, ""));
        cur = u.replace(/^\s+/, "");
      } else cur = next;
    }
    lines.push(cur.replace(/\s+$/, ""));
    return lines;
  }

  var _measure = null, _layout = {}, _layoutN = 0;
  function memoLayout(text, fs) {
    var d = memoDims(fs);
    var key = d.fs + "\u0000" + (text == null ? "" : text);
    if (_layout[key]) return _layout[key];

    if (!_measure) _measure = document.createElement("canvas").getContext("2d");
    _measure.font = d.fs + "px sans-serif";
    var mw = function (t) { return _measure.measureText(t).width; };

    var k = d.fs / MEMO_FS_BASE, edge = d.pad * 2 + d.bar;
    var hi = Math.round(MEMO_W_MAX * k) - edge;
    var lo = Math.max(20, Math.round(MEMO_W_MIN * k) - edge);
    var paras = String(text == null ? "" : text).split("\n").map(breakUnits);
    var step = Math.max(3, Math.round(d.fs / 2));

    /*
     * 문장(줄) 하나를 접는다. 먼저 제일 넓게 잡아 줄 수를 최소로 만들고,
     * 그 줄 수를 지키는 선에서 폭을 끝까지 줄인다. 좁히기는 폭을 아끼려는
     * 것이기도 하지만 무엇보다 줄을 고르게 만든다 — 그리디로 접으면 마지막
     * 줄에 한 어절만 남는("…기도 확보가 / 필요하다") 꼴이 나온다.
     * 문장마다 따로 재야 한다. 다 같이 재면 긴 문장 하나 때문에 짧은
     * 문장들까지 끌려간다.
     */
    function fold(units) {
      var base = wrapUnits(units, hi, mw), n = base.length;
      if (n < 2) return base;
      for (var w = hi - step; w >= lo; w -= step) {
        var ls = wrapUnits(units, w, mw);
        if (ls.length > n) break;
        base = ls;
      }
      return base;
    }

    var lines = [], used = 0, p, q, ls;
    for (p = 0; p < paras.length; p++) {
      ls = fold(paras[p]);
      for (q = 0; q < ls.length; q++) { lines.push(ls[q]); used = Math.max(used, mw(ls[q])); }
    }
    var best = {
      lines: lines,
      w: Math.max(Math.round(MEMO_W_MIN * k), Math.ceil(used) + edge),
      h: d.pad * 2 + lines.length * d.lh
    };

    if (++_layoutN > 400) { _layout = {}; _layoutN = 1; }   // 오래 켜 둬도 안 불어나게
    _layout[key] = best;
    return best;
  }

  /*
   * 편집 중인 메모를 닫는다.
   *
   * 빈 곳을 누르거나 쪽을 넘기면 편집이 끝나야 한다. 이때 적던 내용을 그냥
   * 버리면 한참 쓴 글이 사라진다 — 저장 버튼을 안 눌렀다고 글이 없어지는 쪽이
   * 더 놀라운 일이라, 닫으면서 저장까지 한다.
   */
  var memoEditor = null;                    // 지금 열려 있는 편집기 { card, ta }
  function closeMemoEdit() {
    var open = memoEditor;
    memoEditor = null;
    var had = state.cards.some(function (c) { return c.editingMemo; });
    state.cards.forEach(function (c) { c.editingMemo = false; });
    if (open && open.ta.value !== (open.card.memo || "")) {
      open.card.memo = open.ta.value;
      saveCard(open.card);
      renderCards();
    }
    if (had) drawMemos();
  }

  // 자리를 아직 못 정한 옛 카드를 위한 최소한의 자리
  function fallbackPin(card, size) {
    var pw = state.pageW || 1, ph = state.pageH || 1;
    var x = card.rect.x + card.rect.w + 6 / pw;
    if (x + size.w / pw > 1) x = Math.max(0, 1 - size.w / pw);
    return { x: x, y: Math.max(0, Math.min(card.rect.y, 1 - size.h / ph)) };
  }

  /*
   * 범위 테두리 그리기 · 옮기기 · 크기 바꾸기
   *
   * card.box는 card.rect를 베껴 시작하지만 그 뒤로는 따로 논다.
   * rect는 AI에 보낸 그림의 범위라 손대면 이미 받은 정리와 어긋난다.
   */
  function drawBoxes() {
    if (!state.layer || !state.viewport) return;
    Array.prototype.forEach.call(state.layer.querySelectorAll(".boxsel, .bdel"), function (b) { b.remove(); });

    state.cards.forEach(function (card) {
      if (!card.inserted || !card.box) return;
      var slot = slotOf(card.page);
      if (!slot) return;
      var W = slot.w, H = slot.h;

      var el = document.createElement("div");
      el.className = "boxsel";
      var del = null;                      // 아래에서 만든다. place가 먼저 볼 수 있게 여기 둔다
      function place() {
        var bx = slot.x + card.box.x * W, by = slot.y + card.box.y * H, bw = card.box.w * W;
        el.style.left = bx + "px";
        el.style.top = by + "px";
        el.style.width = bw + "px";
        el.style.height = (card.box.h * H) + "px";
        if (del) {
          // 종이 맨 위에 그은 테두리는 버튼이 종이 밖으로 나간다 — 그때만 안으로
          var up = by >= 26;
          del.style.left = (bx + bw - (up ? 1 : 3)) + "px";
          del.style.top = (up ? by - 24 : by + 3) + "px";
        }
      }
      place();
      el.title = "끌어서 옮기고, 모서리로 크기를 맞춥니다";

      // 잡을 수 있는 건 테두리 선과 모서리뿐. 안쪽은 종이로 남긴다
      ["t", "r", "b", "l"].forEach(function (k) {
        var ed = document.createElement("div");
        ed.className = "be " + k;
        el.appendChild(ed);
      });
      ["nw", "ne", "sw", "se"].forEach(function (k) {
        var hd = document.createElement("div");
        hd.className = "bh " + k;
        hd.dataset.k = k;
        el.appendChild(hd);
      });

      del = document.createElement("button");
      del.className = "bdel";
      del.textContent = "테두리 빼기";
      del.onclick = function (e) {
        e.stopPropagation();
        var had = card.box;
        card.box = null;
        saveCard(card);
        drawBoxes();
        offerUndo("테두리를 뺐습니다.", function () {
          card.box = had; saveCard(card); drawBoxes(); setStatus("되돌렸습니다.");
        });
      };
      del.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      state.layer.appendChild(del);
      place();                             // 버튼이 생긴 뒤라야 자리를 잡을 수 있다

      var drag = null;
      el.addEventListener("pointerdown", function (e) {
        e.stopPropagation();                 // 레이어의 영역 선택이 시작되지 않게
        el.setPointerCapture(e.pointerId);
        var r = state.layer.getBoundingClientRect();
        drag = {
          k: e.target.dataset ? e.target.dataset.k : null,   // 모서리면 크기 조절
          px: e.clientX - r.left,
          py: e.clientY - r.top,
          box: { x: card.box.x, y: card.box.y, w: card.box.w, h: card.box.h }
        };
      });

      el.addEventListener("pointermove", function (e) {
        if (!drag) return;
        var r = state.layer.getBoundingClientRect();
        var dx = (e.clientX - r.left - drag.px) / W;
        var dy = (e.clientY - r.top - drag.py) / H;
        var b = drag.box, n;

        if (!drag.k) {
          n = { x: b.x + dx, y: b.y + dy, w: b.w, h: b.h };
        } else {
          n = { x: b.x, y: b.y, w: b.w, h: b.h };
          if (drag.k.indexOf("w") >= 0) { n.x = b.x + dx; n.w = b.w - dx; }
          if (drag.k.indexOf("e") >= 0) { n.w = b.w + dx; }
          if (drag.k.indexOf("n") >= 0) { n.y = b.y + dy; n.h = b.h - dy; }
          if (drag.k.indexOf("s") >= 0) { n.h = b.h + dy; }
          var MIN = 8 / W;                   // 너무 작아지면 다시 잡을 수 없다
          if (n.w < MIN) { n.w = MIN; n.x = b.x; }
          if (n.h < MIN) { n.h = MIN; n.y = b.y; }
        }
        n.x = Math.max(0, Math.min(n.x, 1 - n.w));
        n.y = Math.max(0, Math.min(n.y, 1 - n.h));
        card.box = n;
        place();
      });

      function done() {
        if (!drag) return;
        drag = null;
        saveCard(card);
      }
      el.addEventListener("pointerup", done);
      el.addEventListener("pointercancel", done);

      state.layer.appendChild(el);
    });
  }

  function drawMemos() {
    if (!state.layer || !state.viewport) return;
    memoEditor = null;                      // 아래에서 다시 그리며 새로 잡는다
    Array.prototype.forEach.call(state.layer.querySelectorAll(".memo"), function (m) { m.remove(); });

    state.cards.forEach(function (card) {
      if (!card.inserted) return;
      var slot = slotOf(card.page);
      if (!slot) return;
      var k = ptPx(slot);
      var W = slot.w, H = slot.h;

      var dim = memoDims(card.fs);
      // PDF에 심을 때도 별표를 떼므로(memoToPng) 화면에서도 같은 글로 접어야
      // 상자 크기가 어긋나지 않는다. 고칠 때는 원문 그대로 보여 준다.
      var box = memoLayout(mdPlain(card.memo || ""), card.fs);
      var lines = box.lines;
      /*
       * 고치는 중에는 상자를 좁히지 않는다. 글칸 아래에 저장·빼기·글자 크기
       * 단추가 나란히 들어가야 해서, 글에 맞춰 줄이면 단추가 무너진다.
       */
      var size = card.editingMemo
        ? { w: Math.max(box.w, dim.w), h: Math.max(box.h, dim.pad * 2 + dim.lh * 3) }
        : box;
      if (!card.pin) card.pin = fallbackPin(card, size);

      var el = document.createElement("div");
      el.className = "memo" + (card.manual ? " manual" : "") + (card.editingMemo ? " editing" : "");
      el.style.left = (slot.x + card.pin.x * W) + "px";
      el.style.top = (slot.y + card.pin.y * H) + "px";
      el.style.width = (size.w * k) + "px";
      el.style.height = (size.h * k) + "px";
      el.style.padding = (dim.pad * k) + "px";
      el.style.borderLeftWidth = (dim.bar * k) + "px";
      el.style.fontSize = (dim.fs * k) + "px";
      el.style.lineHeight = (dim.lh * k) + "px";
      el.title = "끌어서 옮기고, 눌러서 고칩니다";

      if (card.editingMemo) {
        var ta = document.createElement("textarea");
        ta.value = card.memo || "";
        ta.setAttribute("aria-label", "메모 내용");
        el.appendChild(ta);
        memoEditor = { card: card, ta: ta };

        /*
         * 치는 동안 상자가 글을 따라 늘게 한다. 저장할 때가 되어서야 모양이
         * 바뀌면 자리를 다시 봐야 한다 — 치면서 바로 보이는 편이 낫다.
         */
        ta.addEventListener("input", function () {
          var b = memoLayout(mdPlain(ta.value), card.fs);
          el.style.width = (Math.max(b.w, dim.w) * k) + "px";
          el.style.height = (Math.max(b.h, dim.pad * 2 + dim.lh * 3) * k) + "px";
        });

        var acts = document.createElement("div");
        acts.className = "memoacts";
        var ok = document.createElement("button");
        ok.className = "primary";
        ok.textContent = "저장";
        ok.onclick = function () {
          memoEditor = null;
          card.memo = ta.value;
          card.editingMemo = false;
          saveCard(card);
          drawMemos();
          renderCards();
        };
        var rm = document.createElement("button");
        // 목록에 카드가 없는 메모(직접 쓴 것, 답을 나눠 붙인 것)는 빼는 게 곧 지우는 것
        var own = card.manual || card.loose;
        rm.textContent = own ? "지우기" : "메모 빼기";
        rm.onclick = function () {
          memoEditor = null;
          if (own) {
            var at = state.cards.indexOf(card);
            state.cards = state.cards.filter(function (c) { return c !== card; });
            deleteCard(card);
            drawMemos(); renderCards();
            offerUndo((card.manual ? "직접 쓴 메모" : "붙인 메모") + "를 지웠습니다.", function () {
              card.editingMemo = false;      // 편집하다 지웠어도 되살릴 땐 평소 모습으로
              state.cards.splice(at, 0, card);
              saveCard(card);
              drawMemos(); renderCards();
              setStatus("되돌렸습니다.");
            });
          } else {
            var pin = card.pin;
            card.inserted = false;
            card.declined = true;
            card.editingMemo = false;
            saveCard(card);
            drawMemos(); renderCards();
            offerUndo("메모를 뺐습니다.", function () {
              card.inserted = true;
              card.declined = false;
              card.pin = pin;
              saveCard(card);
              drawMemos(); renderCards();
              setStatus("되돌렸습니다.");
            });
          }
        };
        var fsd = document.createElement("button");
        fsd.textContent = "가－";
        fsd.title = "이 메모만 글자 작게";
        fsd.onclick = function () { bumpMemoFs(-0.5); };
        var fsu = document.createElement("button");
        fsu.textContent = "가＋";
        fsu.title = "이 메모만 글자 크게";
        fsu.onclick = function () { bumpMemoFs(0.5); };

        acts.appendChild(ok); acts.appendChild(rm);
        acts.appendChild(fsd); acts.appendChild(fsu);
        acts.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        el.appendChild(acts);

        state.layer.appendChild(el);
        ta.focus();
        return;
      }

      lines.forEach(function (ln) {
        var d = document.createElement("div");
        d.className = "mline";
        d.textContent = ln;
        el.appendChild(d);
      });

      /*
       * 끌어 옮기기. 3px까지는 클릭으로 쳐서 손 떨림에 편집이 막히지 않게 한다.
       * 옮긴 자리는 정규화해 card.pin에 적고 내보낼 때 그대로 쓴다.
       */
      var drag = null;
      el.addEventListener("pointerdown", function (e) {
        if (card.editingMemo) return;
        e.stopPropagation();                 // 레이어의 영역 선택이 시작되지 않게
        el.setPointerCapture(e.pointerId);
        var r = state.layer.getBoundingClientRect();
        drag = {
          dx: e.clientX - r.left - parseFloat(el.style.left),
          dy: e.clientY - r.top - parseFloat(el.style.top),
          moved: false
        };
        el.style.cursor = "grabbing";
      });

      el.addEventListener("pointermove", function (e) {
        if (!drag) return;
        var r = state.layer.getBoundingClientRect();
        var x = e.clientX - r.left - drag.dx;
        var y = e.clientY - r.top - drag.dy;
        if (Math.abs(x - parseFloat(el.style.left)) > 3 ||
            Math.abs(y - parseFloat(el.style.top)) > 3) drag.moved = true;
        // 자기 쪽 밖으로는 못 나간다 (두 쪽 보기면 옆 쪽으로 넘어가지 않게)
        x = Math.max(slot.x, Math.min(x, slot.x + W - size.w * k));
        y = Math.max(slot.y, Math.min(y, slot.y + H - size.h * k));
        el.style.left = x + "px";
        el.style.top = y + "px";
      });

      el.addEventListener("pointerup", function () {
        if (!drag) return;
        var moved = drag.moved;
        drag = null;
        el.style.cursor = "grab";
        if (!moved) {
          closeMemoEdit();
          card.editingMemo = true;
          drawMemos();
          return;
        }
        card.pin = {
          x: (parseFloat(el.style.left) - slot.x) / W,
          y: (parseFloat(el.style.top) - slot.y) / H
        };
        saveCard(card);
      });

      el.addEventListener("pointercancel", function () { drag = null; });
      state.layer.appendChild(el);
    });
  
    // 테두리는 메모와 늘 같이 움직인다. 여기서 함께 그려야 지우고도 남는 일이 없다
    drawBoxes();
  }

  /*
   * 메모를 붙이는 순간 자리를 정한다.
   * 예전에는 내보낼 때 잡아서 화면에서 본 위치와 결과가 달랐다.
   */
  /* ---------- 내보낸 PDF를 다시 열기 위한 표시 ---------- */

  var CAPNOTE_KEY = "Capnote";

  /*
   * 주석에 글(/T, /Contents)을 달지 않는다.
   *
   * 달아 두면 뷰어가 메모 위에 마우스만 올려도 말풍선을 띄운다. 메모는 이미
   * 페이지에 보이는데 그 위를 덮으니 방해만 됐다. 게다가 pdf-lib의
   * PDFString.of는 글자를 바이트 그대로 적어서 한글이 깨져 나왔다
   * ("오려둔 공책"이 "$$T õE"처럼). 바로 적더라도 말풍선 자체가 군더더기라
   * 아예 뺀다. 우리가 다시 찾을 때 쓰는 표시는 /Capnote 하나면 된다.
   */
  function addMemoAnnot(doc, page, pngRef, x, y, w, h) {
    var ap = doc.context.stream("q " + w + " 0 0 " + h + " 0 0 cm /Img Do Q", {
      Type: "XObject", Subtype: "Form", FormType: 1,
      BBox: [0, 0, w, h],
      Resources: { XObject: { Img: pngRef } }
    });
    var annot = doc.context.obj({
      Type: "Annot", Subtype: "Stamp",
      Rect: [x, y, x + w, y + h],
      F: 4,                                    // 인쇄에도 나오게
      AP: { N: doc.context.register(ap) },
      Capnote: PDFLib.PDFBool.True             // 다음에 찾아 지우기 위한 표시
    });
    page.node.addAnnot(doc.context.register(annot));
  }

  /*
   * 형광펜은 PDF 표준 Highlight 주석으로 넣는다.
   *
   * 굿노트 같은 뷰어가 형광펜으로 알아보고, 진짜 형광펜처럼 글자가 비쳐 보인다.
   * 그림으로 구우면 글자를 덮어 버린다. Multiply를 쓰는 모양(AP)도 같이 넣어
   * 자체 렌더링을 안 하는 뷰어에서도 같게 보이게 한다.
   * 메모와 같은 /Capnote 표시를 달아 다시 내보낼 때 지우고 새로 넣는다.
   */
  function addMarkAnnot(doc, page, r, rgb) {
    var x = r.x, y = r.y, w = r.w, h = r.h;
    var ap = doc.context.stream(
      "/GS gs " + rgb[0] + " " + rgb[1] + " " + rgb[2] + " rg 0 0 " + w + " " + h + " re f",
      {
        Type: "XObject", Subtype: "Form", FormType: 1,
        BBox: [0, 0, w, h],
        Resources: { ExtGState: { GS: { Type: "ExtGState", BM: "Multiply", ca: 1 } } }
      }
    );
    var annot = doc.context.obj({
      Type: "Annot", Subtype: "Highlight",
      Rect: [x, y, x + w, y + h],
      // 왼위, 오른위, 왼아래, 오른아래 순서다
      QuadPoints: [x, y + h, x + w, y + h, x, y, x + w, y],
      C: rgb,
      CA: 1,
      F: 4,
      AP: { N: doc.context.register(ap) },
      Capnote: PDFLib.PDFBool.True
    });
    page.node.addAnnot(doc.context.register(annot));
  }

  /*
   * 범위 테두리는 Square 주석으로 넣는다. 화면에서 맞춰 둔 자리를 그대로 쓴다.
   * 메모·형광펜과 같은 /Capnote 표시를 달아 다시 내보낼 때 겹치지 않는다.
   */
  function addBoxAnnot(doc, page, r) {
    var ap = doc.context.stream(
      "1 0.85 0.24 RG 1.5 w 0.75 0.75 " + (r.w - 1.5) + " " + (r.h - 1.5) + " re S",
      { Type: "XObject", Subtype: "Form", FormType: 1, BBox: [0, 0, r.w, r.h] }
    );
    var annot = doc.context.obj({
      Type: "Annot", Subtype: "Square",
      Rect: [r.x, r.y, r.x + r.w, r.y + r.h],
      C: [1, 0.85, 0.24],
      BS: { W: 1.5, S: "S" },
      F: 4,
      AP: { N: doc.context.register(ap) },
      Capnote: PDFLib.PDFBool.True
    });
    page.node.addAnnot(doc.context.register(annot));
  }

  function removeMemoAnnots(doc, page) {
    var a = page.node.Annots();
    if (!a) return 0;
    var n = 0;
    for (var i = a.size() - 1; i >= 0; i--) {
      var d = doc.context.lookup(a.get(i));
      if (d && d.get && d.get(PDFLib.PDFName.of(CAPNOTE_KEY))) { a.remove(i); n++; }
    }
    return n;
  }

  /*
   * 카드 정보를 PDF 안에 적어 둔다. 이 파일을 다시 우리 앱에서 열면 메모를
   * 그대로 되살려 고칠 수 있다.
   *
   * 성공했는지를 돌려준다. 전에는 조용히 삼켰는데, 그러면 "메모를 넣었다"고
   * 안내해 놓고 실제로는 못 심은 파일이 나가도 알 길이 없었다.
   */
  function saveCardsIntoPdf(doc, cards, carriedMarks) {
    try {
      var slim = cards.map(function (c) {
        var o = {};
        Object.keys(c).forEach(function (k) {
          if (k === "img" || k === "editing" || k === "editingMemo") return;   // 썸네일은 다시 만들 수 있다
          o[k] = c[k];
        });
        return o;
      });
      // Info 사전이 아예 없는 PDF도 있다. 그럴 땐 만들어 붙인다
      var info = doc.context.trailerInfo.Info
        ? doc.context.lookup(doc.context.trailerInfo.Info) : null;
      if (!info || typeof info.set !== "function") {
        info = doc.context.obj({});
        doc.context.trailerInfo.Info = doc.context.register(info);
      }
      info.set(PDFLib.PDFName.of(CAPNOTE_KEY),
               PDFLib.PDFHexString.fromText(JSON.stringify({
                 v: 1, name: state.docName, cards: slim, marks: carriedMarks
               })));
      return true;
    } catch (e) {
      return false;
    }
  }

  async function readCardsFromPdf(pdf) {
    try {
      var md = await pdf.getMetadata();
      var raw = md && md.info && md.info.Custom ? md.info.Custom[CAPNOTE_KEY] : null;
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d) return null;
      return { cards: Array.isArray(d.cards) ? d.cards : [], marks: Array.isArray(d.marks) ? d.marks : [] };
    } catch (e) { return null; }
  }

  /*
   * 우리가 넣은 메모 주석을 벗겨낸다.
   *
   * 벗기지 않으면 화면에 주석이 그려진 채로 그 위에 우리 메모 상자가 또 얹혀
   * 두 겹으로 보인다. 벗겨내면 원본을 여는 것과 같아지고, 다시 내보낼 때도
   * 깨끗한 바탕에서 시작한다.
   */
  async function stripMemoAnnots(bytes) {
    try {
      var doc = await PDFLib.PDFDocument.load(bytes.slice(0));
      var n = 0;
      doc.getPages().forEach(function (pg) { n += removeMemoAnnots(doc, pg); });
      if (!n) return null;
      return (await doc.save()).buffer;
    } catch (e) { return null; }
  }

  var MEMO_GAP = 6, MEMO_MARGIN = 4;

  function overlapArea(a, b) {
    var dx = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    var dy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    return dx > 0 && dy > 0 ? dx * dy : 0;
  }

  /*
   * 본문 글자 상자를 PDF 좌표(왼쪽 아래 원점, 포인트)로 모은다.
   * 메모를 붙일 때마다 다시 읽으면 느려서 쪽마다 한 번만 읽고 쟁여 둔다.
   */
  var _textCache = {};
  async function textBoxes(pageNo) {
    if (_textCache[pageNo]) return _textCache[pageNo];
    var out = [];
    try {
      var page = await state.pdf.getPage(pageNo);
      var vp = page.getViewport({ scale: 1 });
      var tc = await textContentOf(pageNo);       // 같은 쪽 글자는 한 번만 읽는다
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(t[2], t[3]) || 10;
        if ((it.width || 0) > 0) out.push({ x: t[4], y: vp.height - t[5], w: it.width, h: h });
      });
    } catch (e) { /* 글자를 못 읽어도 배치는 계속돼야 한다 */ }
    _textCache[pageNo] = out;
    return out;
  }

  /*
   * 빈자리 찾기 (좌표는 PDF 기준, 왼쪽 아래 원점)
   *
   * hard — 오려낸 영역과 이미 놓인 메모. 덮으면 안 된다 (가중치 100)
   * soft — 본문 글자. 되도록 피한다 (가중치 1)
   * 정 자리가 없으면 글자를 조금 가리더라도 오려낸 그림만은 지키게 된다.
   */
  function placeMemo(sel, mw, mh, pw, ph, hard, soft) {
    var g = MEMO_GAP, m = MEMO_MARGIN, i;

    function fit(x, y) {
      return {
        x: Math.max(m, Math.min(x, pw - mw - m)),
        y: Math.max(m, Math.min(y, ph - mh - m)),
        w: mw, h: mh
      };
    }
    function score(c) {
      var v = 0;
      for (i = 0; i < hard.length; i++) v += overlapArea(c, hard[i]) * 100;
      for (i = 0; i < soft.length; i++) v += overlapArea(c, soft[i]);
      return v;
    }

    var spots = [
      fit(sel.x + sel.w + g, sel.y + sel.h - mh),   // 오른쪽
      fit(sel.x - g - mw,    sel.y + sel.h - mh),   // 왼쪽
      fit(sel.x,             sel.y - g - mh),       // 아래
      fit(sel.x,             sel.y + sel.h + g)     // 위
    ];
    var best = null, bestScore = Infinity;
    for (var k = 0; k < spots.length; k++) {
      var sc = score(spots[k]);
      if (sc === 0) return spots[k];
      if (sc < bestScore) { bestScore = sc; best = spots[k]; }
    }

    // 네 자리가 다 막혔으면 페이지를 훑어 가장 가까운 빈자리를 찾는다
    var cx = sel.x + sel.w / 2, cy = sel.y + sel.h / 2;
    var step = 12, nearD = Infinity, near = null;
    for (var y = m; y <= ph - mh - m; y += step) {
      for (var x = m; x <= pw - mw - m; x += step) {
        var c = { x: x, y: y, w: mw, h: mh };
        var v = score(c);
        if (v < bestScore) { bestScore = v; best = c; }
        if (v !== 0) continue;
        var d = (x + mw / 2 - cx) * (x + mw / 2 - cx) + (y + mh / 2 - cy) * (y + mh / 2 - cy);
        if (d < nearD) { nearD = d; near = c; }
      }
    }
    return near || best;
  }

  async function placeMemoFor(card) {
    var size = memoLayout(mdPlain(card.memo || ""), card.fs);
    // 두 쪽 보기면 그 카드가 붙은 쪽의 크기를 쓴다 (쪽마다 크기가 다를 수 있다)
    var sl = slotOf(card.page);
    var pw = sl ? sl.pw : state.pageW, ph = sl ? sl.ph : state.pageH;
    if (!pw || !ph) { card.pin = fallbackPin(card, size); return; }

    /*
     * 오려낸 자리가 없는 카드(물어본 것·대화)도 붙일 수 있어야 한다.
     * 그럴 땐 왼쪽 위 귀퉁이를 기준점으로 삼아 빈 곳을 찾는다.
     */
    var r = card.rect && card.rect.w > 0 ? card.rect : { x: 0.02, y: 0.02, w: 0.001, h: 0.001 };
    var sel = {
      x: r.x * pw, y: ph - (r.y + r.h) * ph,
      w: r.w * pw, h: r.h * ph
    };

    var hard = [];
    state.cards.forEach(function (c) {
      if (c.page !== card.page || c === card) return;
      if (c.inserted && c.pin) {                       // 이미 놓인 메모
        var sz = memoLayout(mdPlain(c.memo || ""), c.fs);
        hard.push({ x: c.pin.x * pw, y: ph - c.pin.y * ph - sz.h, w: sz.w, h: sz.h });
      }
      if (!c.manual && !c.qna && c.rect && c.rect.w > 0) {   // 다른 오려낸 영역
        hard.push({ x: c.rect.x * pw, y: ph - (c.rect.y + c.rect.h) * ph,
                    w: c.rect.w * pw, h: c.rect.h * ph });
      }
    });

    var soft = await textBoxes(card.page);
    var at = placeMemo(sel, size.w, size.h, pw, ph, hard, soft);
    card.pin = { x: at.x / pw, y: (ph - at.y - size.h) / ph };
  }

  /* ---------- 내보내기 ---------- */

  var openUrl = null;

  function closeSheet() {
    var v = document.querySelector(".veil");
    if (v) v.remove();
    if (openUrl) { URL.revokeObjectURL(openUrl); openUrl = null; }
  }

  // 코드가 링크를 대신 눌러 내려받는 방식은 아티팩트 보안 상자에서 막히고,
  // 막히면 그 주소로 화면이 이동해 앱이 통째로 사라진다.
  // 그래서 자동 클릭을 쓰지 않고, 사용자가 직접 누르는 링크만 띄운다.
  function showExport(title, opts) {
    closeSheet();
    var veil = document.createElement("div");
    veil.className = "veil";
    veil.addEventListener("pointerdown", function (e) {
      if (e.target === veil) closeSheet();
    });

    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    var h = document.createElement("h3");
    h.textContent = title;
    sheet.appendChild(h);

    var body = document.createElement("div");
    body.className = "sbody";
    if (opts.note) {
      var p = document.createElement("p");
      p.className = "note";
      p.textContent = opts.note;
      body.appendChild(p);
    }
    var ta = null;
    if (opts.text != null) {
      ta = document.createElement("textarea");
      ta.value = opts.text;
      ta.readOnly = true;
      body.appendChild(ta);
    }
    sheet.appendChild(body);

    var foot = document.createElement("div");
    foot.className = "sfoot";

    if (opts.blob) {
      openUrl = URL.createObjectURL(opts.blob);
      var a = document.createElement("a");
      a.className = "dl";
      a.href = openUrl;
      a.download = opts.filename;
      a.textContent = "내려받기";
      foot.appendChild(a);
    }

    if (ta) {
      var copy = document.createElement("button");
      copy.className = opts.blob ? "" : "primary";
      copy.textContent = "전체 복사";
      copy.onclick = function () {
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
        copy.textContent = "복사했습니다";
        setTimeout(function () { copy.textContent = "전체 복사"; }, 1600);
      };
      foot.appendChild(copy);
    }

    var sp = document.createElement("div");
    sp.className = "spacer";
    foot.appendChild(sp);

    var close = document.createElement("button");
    close.textContent = "닫기";
    close.onclick = closeSheet;
    foot.appendChild(close);

    sheet.appendChild(foot);
    veil.appendChild(sheet);
    $("root").appendChild(veil);
  }

  // 고른 항목만 담는다 (안 주면 전부)
  function buildMarkdown(only) {
    var src = only || state.cards;
    var lines = ["# " + state.docName, ""];
    var byPage = {};
    src.forEach(function (c) {
      (byPage[c.page] = byPage[c.page] || []).push(c);
    });
    Object.keys(byPage)
      .sort(function (a, b) { return a - b; })
      .forEach(function (pg) {
        lines.push("## " + pg + "쪽");
        lines.push("");
        byPage[pg].forEach(function (c) {
          if (c.hl) {
            lines.push("- (형광펜) " + (c.summary || "그은 자리"));
          } else if (c.manual) {
            lines.push("- (직접 쓴 메모) " + (c.memo || ""));
          } else if (c.qna) {
            lines.push("### Q. " + (c.scope === "chat" ? "(대화) " : "") + (c.question || ""));
            lines.push("");
            lines.push(c.summary || "");
          } else {
            lines.push("### " + (c.memo || "오려낸 부분"));
            lines.push("");
            lines.push(c.summary || "");
            if (c.detail) { lines.push(""); lines.push(c.detail); }
          }
          lines.push("");
        });
      });
    return lines.join("\n");
  }

  /* ---------- 정리 내보내기 (PDF) ---------- */

  /*
   * 정리를 PDF로 만든다.
   *
   * 예전에는 마크다운 텍스트만 줬는데, 오려낸 그림이 빠져서 나중에 보면
   * 무엇에 대한 정리인지 알 수 없었다. 그림과 설명을 같이 실어야 쓸모가 있다.
   *
   * 글자를 캔버스에 그려 쪽 이미지로 심는다. pdf-lib 표준 폰트에 한글이 없어서다
   * (메모를 이미지로 넣는 것과 같은 이유). 대신 글자를 고를 수는 없다.
   */
  async function buildSummaryPdf(cards) {
    var PW = 595.28, PH = 841.89, M = 44, CW = PW - M * 2;
    var K = 3;                                    // 캔버스 배율. 인쇄해도 뭉개지지 않게
    var mc = document.createElement("canvas").getContext("2d");

    function font(sz, bold) { return (bold ? "600 " : "") + sz + "px sans-serif"; }
    function wrap(text, sz, bold, maxW) {
      mc.font = font(sz, bold);
      var lines = [], cur = "";
      String(text == null ? "" : text).split("").forEach(function (ch) {
        if (ch === "\n") { lines.push(cur); cur = ""; return; }
        if (mc.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
        else cur += ch;
      });
      if (cur || !lines.length) lines.push(cur);
      return lines;
    }

    /*
     * 그림을 먼저 다 읽어 둔다. 크기를 알아야 자리를 잡을 수 있다.
     *
     * 카드에 들고 있는 그림은 목록에 쓰는 작은 것(가로 560)이라, 이 종이에
     * 가로 507pt로 키워 넣으면 뭉개진다. 그래서 내보낼 때 원본에서 다시,
     * 이 종이에 필요한 크기로 그려 온다. 원본이 없으면 들고 있던 것을 쓴다.
     */
    var imgs = {};
    await Promise.all(cards.map(async function (c) {
      if (!c.qna && state.pdf && c.rect && c.rect.w > 0 && c.page >= 1 && c.page <= state.pages) {
        try {
          // 형광펜은 우리가 화면에만 그려 둔 것이라, 여기서 다시 얹어야 보인다
          imgs[c.id] = paintMarksOn(await cropFromPdf(c.page, c.rect, Math.round(CW * K)), c.page, c.rect);
          return;
        } catch (e) { /* 아래에서 들고 있던 그림으로 간다 */ }
      }
      if (!c.img) return;
      await new Promise(function (res) {
        var im = new Image();
        im.onload = function () { imgs[c.id] = im; res(); };
        im.onerror = function () { res(); };
        im.src = c.img;
      });
    }));

    var pages = [], cur = null, y = 0;
    function newPage() {
      var cv = document.createElement("canvas");
      cv.width = Math.round(PW * K);
      cv.height = Math.round(PH * K);
      var g = cv.getContext("2d");
      g.scale(K, K);
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, PW, PH);
      cur = { cv: cv, g: g };
      pages.push(cur);
      y = M;
    }
    function need(h) { if (y + h > PH - M) newPage(); }

    function text(str, sz, bold, color, lh, maxW) {
      var lines = wrap(str, sz, bold, maxW || CW);
      lines.forEach(function (ln) {
        need(lh);
        cur.g.font = font(sz, bold);
        cur.g.fillStyle = color;
        cur.g.textBaseline = "alphabetic";
        cur.g.fillText(ln, M, y + sz);
        y += lh;
      });
    }

    newPage();
    text(state.docName || "정리", 17, true, "#111111", 25);
    text(new Date().toLocaleDateString("ko-KR") + " · " + cards.length + "항목",
         9.5, false, "#8a8a8a", 16);
    y += 8;

    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];

      // 항목 사이 구분선. 첫 항목 앞에는 넣지 않는다
      if (i > 0) {
        need(18);
        cur.g.strokeStyle = "#e2e2e2";
        cur.g.lineWidth = 0.7;
        cur.g.beginPath();
        cur.g.moveTo(M, y + 6); cur.g.lineTo(PW - M, y + 6); cur.g.stroke();
        y += 18;
      }

      var head = c.hl
        ? (c.page + "쪽 · 형광펜")
        : c.qna
          ? (c.scope === "chat" ? "대화"
             : (c.scope === "all" ? "전체"
                : c.scope === "range" ? c.pageFrom + "–" + c.pageTo + "쪽"
                : c.page + "쪽") + " · 질문")
          : (c.page + "쪽" + (c.mode ? " · " + c.mode : ""));
      text(head, 9.5, false, "#9a9a9a", 15);

      if (c.qna) {
        text("Q. " + (c.question || ""), 11.5, true, "#7a5c00", 17);
        y += 3;
        text(mdPlain(c.summary), 10.5, false, "#222222", 15.5);
      } else {
        var im = imgs[c.id];
        if (im && im.width) {
          var w = CW, h = CW * (im.height / im.width);
          if (h > 300) { h = 300; w = 300 * (im.width / im.height); }
          need(h + 8);
          cur.g.drawImage(im, M, y, w, h);
          cur.g.strokeStyle = "#dddddd";
          cur.g.lineWidth = 0.6;
          cur.g.strokeRect(M, y, w, h);
          y += h + 10;
        }
        if (c.memo) { text(mdPlain(c.memo), 11, true, "#7a5c00", 16); y += 2; }
        text(mdPlain(c.summary), 10.5, false, "#222222", 15.5);
        if (c.detail) { y += 4; text(mdPlain(c.detail), 10, false, "#555555", 15); }
      }
      y += 6;
    }

    var doc = await PDFLib.PDFDocument.create();
    for (var pi = 0; pi < pages.length; pi++) {
      var jpg = await doc.embedJpg(pages[pi].cv.toDataURL("image/jpeg", 0.9));
      var pg = doc.addPage([PW, PH]);
      pg.drawImage(jpg, { x: 0, y: 0, width: PW, height: PH });
    }
    return { blob: new Blob([await doc.save()], { type: "application/pdf" }), pages: pages.length };
  }

  /*
   * 무엇을 내보낼지 고르는 창.
   * 전부 담아 봐야 쓸모없는 것도 섞여 나오므로 항목을 고를 수 있어야 한다.
   */
  /*
   * 형광펜 그은 자리도 정리에 넣는다.
   *
   * 그어 놓고 정리 PDF를 열면 그 대목이 아예 없었다. 수업 중에는 오려내지
   * 않고 형광펜만 긋고 지나가는 일이 더 많다. 자국 하나를 항목 하나로 삼아
   * 그 자리를 그림으로 담고, 밑에 그 자리의 원문을 적는다.
   */
  async function markItems() {
    var out = [];
    for (var i = 0; i < state.marks.length; i++) {
      var m = state.marks[i];
      if (!m.rects || !m.rects.length) continue;
      var x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      m.rects.forEach(function (r) {
        x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y);
        x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h);
      });
      // 그림은 앞뒤를 조금 넓혀 잘라야 무슨 대목인지 안다. 글은 그은 띠에서만 뽑는다
      var px = 0.015, py = 0.022;
      var rect = {
        x: Math.max(0, x0 - px), y: Math.max(0, y0 - py),
        w: Math.min(1, x1 + px) - Math.max(0, x0 - px),
        h: Math.min(1, y1 + py) - Math.max(0, y0 - py)
      };
      out.push({
        id: "hl:" + m.id, page: m.page, hl: true, color: m.color,
        rect: rect, memo: "", summary: await textUnderBands(m.page, m.rects)
      });
    }
    return out.sort(function (a, b) { return a.page - b.page; });
  }

      if (c.loose) return false;
      return c.qna ? c.summary : (!c.manual && (c.summary || c.memo));
    });
    list = list.concat(await markItems());

      var pb = document.createElement("div");
