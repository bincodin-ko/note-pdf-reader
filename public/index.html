  $("expMd").onclick = showSummaryPicker;

  // 한글은 표준 PDF 폰트에 없으므로, 메모를 캔버스에 그려 이미지로 심는다
  /*
   * 메모를 PNG로 그린다. 한글이 pdf-lib 표준 폰트에 없어서 이미지로 심는다.
   * 치수와 줄바꿈은 화면과 같은 값(memoLayout)을 쓴다 — 그래야 화면에서
   * 맞춰 둔 자리와 크기가 그대로 나간다.
   */
  function memoToPng(text, manual, fs) {
    text = mdPlain(text);                  // 종이에는 별표가 그대로 남으면 지저분하다
    var dim = memoDims(fs);
    var size = memoLayout(text, fs);
    var lines = size.lines;
    var s = 3;                       // 인쇄해도 뭉개지지 않게 3배로 그린다
    var cv = document.createElement("canvas");
    cv.width = Math.round(size.w * s);
    cv.height = Math.round(size.h * s);
    var c = cv.getContext("2d");
    c.scale(s, s);

    c.fillStyle = "#fff8dc";
    c.fillRect(0, 0, size.w, size.h);
    c.fillStyle = manual ? "#4aa3e0" : "#ffd83d";
    c.fillRect(0, 0, dim.bar, size.h);

    c.fillStyle = "#241d00";
    c.font = dim.fs + "px sans-serif";
    c.textBaseline = "middle";
    lines.forEach(function (ln, i) {
      c.fillText(ln, dim.bar + dim.pad, dim.pad + i * dim.lh + dim.lh / 2);
    });
    return { dataUrl: cv.toDataURL("image/png"), w: size.w, h: size.h };
  }

  $("expPdf").onclick = async function () {
    var inserted = state.cards.filter(function (c) { return c.inserted; });
    if (!inserted.length && !state.marks.length) {
      setStatus("쪽에 붙인 메모도 형광펜도 아직 없습니다. 정리 카드에서 \"예\"를 눌러 붙이거나 빈 곳을 두 번 눌러 메모를 쓰세요.", true);
      return;
    }

    /*
     * 쪽이 많은 자료를 매번 통째로 내려받는 건 부담이다.
     * 기본은 "메모 있는 쪽만" — 보통 그것만 다시 볼 것이기 때문이다.
     */
    var scope = $("expScope").value;
    /*
     * 굽기 — 메모를 주석이 아니라 페이지 그림으로 그려 넣는다.
     *
     * 주석으로 넣는 편이 낫다(다시 고칠 수 있다). 다만 주석을 아예 안 그리는
     * 뷰어가 있어서, 거기서는 메모가 통째로 안 보인다. 그런 곳에 낼 파일은
     * 구워서 내보낸다. 대신 구운 것은 지울 수 없으므로 되열어 고칠 수 없다.
     */
    var burn = $("expBurn").checked;
    if (scope === "page" && !inserted.some(function (c) { return c.page === state.page; })) {
      setStatus("이 쪽에는 붙인 메모가 없습니다.");
      return;
    }
    setStatus("메모를 넣는 중…");
    try {
      /*
       * 필요한 쪽만 새 문서로 옮겨 담는다.
       *
       * 예전에는 원본을 통째로 열고 removePage로 덜어냈는데, 그건 쪽 목록에서
       * 빼기만 할 뿐 그 쪽의 그림·글꼴은 파일에 그대로 남는다. 그래서 "메모 있는
       * 쪽만"으로 골라도 용량이 전체와 똑같았다.
       * copyPages는 그 쪽이 실제로 쓰는 것만 따라오므로 파일이 진짜로 줄어든다.
       */
      var src = await PDFLib.PDFDocument.load(state.bytes.slice(0));
      var doc = src, pageMap = null;

      if (scope !== "all") {
        var keep = {};
        if (scope === "page") keep[state.page] = true;
        else {
          inserted.forEach(function (c) { keep[c.page] = true; });
          state.marks.forEach(function (m) { keep[m.page] = true; });
        }
        var order = Object.keys(keep).map(Number).sort(function (a, b) { return a - b; });
        pageMap = {};
        order.forEach(function (pnum, idx) { pageMap[pnum] = idx + 1; });

        doc = await PDFLib.PDFDocument.create();
        var copied = await doc.copyPages(src, order.map(function (n) { return n - 1; }));
        copied.forEach(function (pg) { doc.addPage(pg); });
      }

      // 원본 쪽 번호를 결과 문서의 쪽 번호로 옮긴다
      function outPage(n) { return pageMap ? pageMap[n] : n; }

      /*
       * 메모를 페이지에 굽지 않고 주석(Stamp)으로 넣는다.
       *
       * 구우면 지울 수 없어서, 내보낸 PDF를 다시 열어 고친 뒤 또 내보내면
       * 예전 메모 위에 새 메모가 겹쳤다. 주석은 /Capnote 표시를 달아 두면
       * 다음 번에 찾아서 지우고 새로 넣을 수 있다.
       * F:4는 인쇄 플래그다 — 없으면 화면에만 보이고 인쇄에서 빠진다.
       */
      // 이전에 넣은 우리 주석(메모·형광펜)을 모두 걷어낸 뒤 새로 넣는다
      doc.getPages().forEach(function (pg) { removeMemoAnnots(doc, pg); });

      var putMarks = 0, putMemos = 0, skipped = [];

      state.marks.forEach(function (mk) {
        var op = outPage(mk.page);
        if (!op || op < 1 || op > doc.getPageCount()) return;
        putMarks++;
        var pg = doc.getPage(op - 1);
        var pw = pg.getWidth(), ph = pg.getHeight();
        var rgb = penOf(mk.color).rgb;
        mk.rects.forEach(function (r) {
          var q = { x: r.x * pw, y: ph - (r.y + r.h) * ph, w: r.w * pw, h: r.h * ph };
          if (burn) {
            // 곱하기로 겹쳐야 밑의 글자가 비쳐 형광펜처럼 보인다
            pg.drawRectangle({
              x: q.x, y: q.y, width: q.w, height: q.h,
              color: PDFLib.rgb(rgb[0], rgb[1], rgb[2]),
              blendMode: "Multiply"
            });
          } else {
            addMarkAnnot(doc, pg, q, rgb);
          }
        });
      });

      for (var i = 0; i < inserted.length; i++) {
        var card = inserted[i];
        var op = outPage(card.page);
        if (!op || op < 1 || op > doc.getPageCount()) { skipped.push(card.page); continue; }
        var pg = doc.getPage(op - 1);
        var pw = pg.getWidth(), ph = pg.getHeight();

        /*
         * 오려낸 영역에 노란 테두리를 두르던 것을 뺐다.
         * 어디를 오렸는지는 정리 PDF에 그림으로 남는다. 원본 위에서는
         * 표시가 오히려 지저분했고, 강조는 형광펜이 맡는다.
         */

        // 화면에서 맞춰 둔 테두리를 그대로 넣는다 (뺐으면 안 넣는다)
        if (card.box) {
          var bx = {
            x: card.box.x * pw,
            y: ph - (card.box.y + card.box.h) * ph,
            w: card.box.w * pw,
            h: card.box.h * ph
          };
          if (burn) {
            pg.drawRectangle({
              x: bx.x, y: bx.y, width: bx.w, height: bx.h,
              borderColor: PDFLib.rgb(1, 0.85, 0.24), borderWidth: 1.5
            });
          } else {
            addBoxAnnot(doc, pg, bx);
          }
        }

        var memo = memoToPng(card.memo || card.summary, card.manual, card.fs);
        var png = await doc.embedPng(memo.dataUrl);

        // 자리는 화면에서 이미 정해졌다(card.pin). 여기서 다시 계산하지 않는다
        var m = MEMO_MARGIN;
        var pin = card.pin || fallbackPin(card, memo);
        var x = Math.max(m, Math.min(pin.x * pw, pw - memo.w - m));
        var y = Math.max(m, Math.min(ph - pin.y * ph - memo.h, ph - memo.h - m));
        if (burn) pg.drawImage(png, { x: x, y: y, width: memo.w, height: memo.h });
        else addMemoAnnot(doc, pg, png.ref, x, y, memo.w, memo.h);
        putMemos++;
      }

      /*
       * 카드 정보를 PDF 안에 적어 둔다. 이걸 다시 우리 앱에서 열면 메모를
       * 그대로 되살려 고칠 수 있다. 썸네일(img)은 빼서 파일을 가볍게 유지하고,
       * 다시 열 때 쪽에서 새로 잘라 만든다.
       */
      // 이 파일을 다시 열었을 때를 위해 쪽 번호를 결과 기준으로 다시 매긴다
      var carriedCards = state.cards;
      if (pageMap) {
        carriedCards = state.cards.filter(function (c) { return pageMap[c.page]; })
          .map(function (c) {
            var o = {};
            Object.keys(c).forEach(function (k) { o[k] = c[k]; });
            o.page = pageMap[c.page];
            return o;
          });
      }

      var carriedMarks = pageMap
        ? state.marks.filter(function (m) { return pageMap[m.page]; })
            .map(function (m) { return { id: m.id, page: pageMap[m.page], color: m.color, rects: m.rects }; })
        : state.marks;
      /*
       * 구운 파일에는 카드 정보를 심지 않는다.
       * 심어 두면 다시 열었을 때 이미 구워진 메모 위에 같은 메모가 또 그려져
       * 두 겹으로 보인다. 이어서 고칠 때는 원본을 열면 된다 — 메모는 원본
       * 이름으로 브라우저에 남아 있다.
       */
      var carried = burn ? false : saveCardsIntoPdf(doc, carriedCards, carriedMarks);

      var out = await doc.save();

      /*
       * 무엇을 정말 넣었는지 세어서 말한다.
       *
       * 전에는 붙인 메모 수를 그대로 적었다. 그래서 한 개도 못 넣은 파일에도
       * "메모 3개"라고 적혀 나갔고, 뭐가 잘못됐는지 알 길이 없었다.
       */
      var note = "메모 " + putMemos + "개" +
                 (putMarks ? " · 형광펜 " + putMarks + "곳" : "") +
                 " · " + doc.getPageCount() + "쪽입니다. ";
      /*
       * 메모가 한 개도 안 나갔으면 그 말부터 한다.
       *
       * 쪽에 붙인 메모만 나간다 — 정리 카드에 글이 있어도 "예"를 눌러 붙이지
       * 않았으면 PDF에는 넣을 자리가 없다. 그걸 모르면 "원본이 하나 더 생겼다"로만
       * 보인다.
       */
      if (!putMemos) {
        note = "메모가 한 개도 안 들어갔습니다 — 쪽에 붙인 메모만 나갑니다. " +
               "오른쪽 정리 카드에서 \"예\"를 눌러 붙이거나, 쪽의 빈 곳을 두 번 눌러 직접 메모를 쓰세요. " +
               (putMarks ? "형광펜 " + putMarks + "곳은 들어갔습니다. " : "") +
               doc.getPageCount() + "쪽입니다. ";
      }
      if (skipped.length) {
        note += "메모 " + skipped.length + "개는 이 파일에 없는 쪽(" +
                skipped.slice(0, 5).join(", ") + "쪽)이라 빠졌습니다. ";
      }
      note += burn
        ? "메모를 페이지에 구웠습니다. 어떤 뷰어에서도 보이지만 이 파일로는 다시 고칠 수 없습니다 — 이어서 고칠 때는 원본을 여세요."
        : carried
          ? "메모가 PDF 주석으로 들어갔습니다. 이 파일을 다시 이 앱에 열면 그대로 고칠 수 있지만, 주석을 안 그리는 뷰어에서는 메모가 안 보입니다 — 그때는 \"굽기\"를 켜고 다시 내보내세요."
          : "메모가 PDF 주석으로 들어갔지만, 다시 고치기 위한 정보는 심지 못했습니다. 이 파일을 다시 열면 메모가 안 보일 수 있습니다 — \"굽기\"를 켜고 다시 내보내세요.";

      showExport("페이지 추출", {
        note: note,
        blob: new Blob([out], { type: "application/pdf" }),
        filename: state.docName + " 메모.pdf"
      });
      setStatus("");
    } catch (e) {
      setStatus("PDF를 만들지 못했습니다. 다른 파일로 시도해 보세요.", true);
    }
  };

  /* ---------- 글자 크기 · 확대 축소 ---------- */

  /*
   * 정리 패널 글자 크기
   *
   * 수업 중에는 크게, 훑을 때는 작게 보고 싶다. 다음에 켤 때도 유지되게
   * localStorage에 적어 둔다 (IndexedDB는 PDF마다 갈리므로 여기엔 안 맞는다).
   */
  var NOTE_FS_MIN = 11, NOTE_FS_MAX = 24;
  var noteFs = 14;
  try {
    var saved = parseFloat(localStorage.getItem("capnote:notefs"));
    if (saved >= NOTE_FS_MIN && saved <= NOTE_FS_MAX) noteFs = saved;
  } catch (e) { /* 저장소가 막혀 있어도 기본값으로 돌아간다 */ }

  function applyNoteFs() {
    document.documentElement.style.setProperty("--note-fs", noteFs + "px");
    $("fsDown").disabled = noteFs <= NOTE_FS_MIN;
    $("fsUp").disabled = noteFs >= NOTE_FS_MAX;
    try { localStorage.setItem("capnote:notefs", String(noteFs)); } catch (e) {}
  }
  function bumpNoteFs(d) {
    noteFs = Math.max(NOTE_FS_MIN, Math.min(NOTE_FS_MAX, noteFs + d));
    applyNoteFs();
    setStatus("글자 크기 " + noteFs + "px");
  }
  // PDF에 붙는 메모 글자 크기 (Ctrl+> / Ctrl+< 와 같은 동작)
  $("mfsUp").onclick = function () { bumpMemoFs(0.5); };
  $("mfsDown").onclick = function () { bumpMemoFs(-0.5); };

  $("fsUp").onclick = function () { bumpNoteFs(1); };
  $("fsDown").onclick = function () { bumpNoteFs(-1); };
  applyNoteFs();

  // PDF만 확대·축소한다. 화면 전체가 커지면 정리 패널까지 같이 흔들린다
  /*
   * 확대·축소는 눈에 먼저 보여야 한다.
   *
   * 전에는 배율이 바뀔 때마다 그 쪽을 처음부터 다시 그렸다. 휠을 한 번 굴리면
   * 이벤트가 열댓 번 오니 그만큼 다시 그렸고, 다 그릴 때까지 화면은 그대로라
   * 굼떠 보였다. 게다가 배율이 바뀌면 미리 그려 둔 쪽이 전부 못 쓰게 돼,
   * 한 눈금 움직일 때마다 문서 전체를 다시 그리는 일이 뒤에서 돌았다.
   *
   * 이제 이미 그려 둔 그림을 CSS로 늘려 그 자리에서 보여 주고(잠깐 흐릿하다),
   * 손을 멈춘 뒤에 한 번만 또렷하게 다시 그린다. 메모·형광펜이 얹힌 층도
   * 같이 늘려야 글자와 어긋나지 않는다.
   */
  function previewZoom() {
    var wrap = document.querySelector(".pagewrap");
    if (!wrap || !state.canvas || !state.layer || !state.drawnScale) return;
    var k = state.scale / state.drawnScale;
    var w = state.canvas.width / state.dprUsed, h = state.canvas.height / state.dprUsed;
    state.canvas.style.width = (w * k) + "px";
    state.canvas.style.height = (h * k) + "px";
    wrap.style.width = (w * k) + "px";
    state.layer.style.width = w + "px";     // 층은 늘리기 전 크기로 못 박고
    state.layer.style.height = h + "px";
    state.layer.style.transformOrigin = "top left";
    state.layer.style.transform = k === 1 ? "none" : "scale(" + k + ")";
  }

  var zoomTimer = null;
  function zoomPdf(d) {
    if (!state.pdf) return;
    var next = Math.max(0.25, Math.min(4, Math.round((state.scale + d) * 1000) / 1000));
    if (Math.abs(next - state.scale) < 0.001) return;
    state.scale = next;
    state.userZoomed = true;
    previewZoom();
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(function () {
      zoomTimer = null;
      closeMemoEdit();
      renderPage();
    }, 120);
  }

  /*
   * Ctrl+휠은 브라우저·Electron 기본 동작이 "화면 전체 확대"다.
   * 그걸 막고 PDF 배율만 바꾼다. 막지 않으면 정리 패널 글자까지 같이 커져
   * 레이아웃이 흐트러진다.
   */
  $("stage").addEventListener("wheel", function (e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoomPdf(e.deltaY < 0 ? 0.1 : -0.1);
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;

    if (e.key === "z" || e.key === "Z") {
      // 글을 치는 중이면 브라우저의 글자 되돌리기가 맡는다. 여기서 가로채면
      // 오타 하나 되돌리려다 방금 만든 메모가 통째로 사라진다
      var t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
      e.preventDefault();
      doUndo();
      return;
    }

    /*
     * Ctrl+> / Ctrl+< 는 PDF에 붙는 메모 글자 크기다.
     * 정리 패널 글자는 패널 머리의 가－/가＋ 버튼이 맡는다 — 둘 다 단축키에
     * 걸어 두면 지금 무엇이 커지는지 헷갈린다.
     */
    if (e.key === ">" || e.key === "." ) { e.preventDefault(); bumpMemoFs(0.5); return; }
    if (e.key === "<" || e.key === ",") { e.preventDefault(); bumpMemoFs(-0.5); return; }

    // Ctrl +/- 도 화면 전체 대신 PDF만
    if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomPdf(0.25); return; }
    if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomPdf(-0.25); return; }
    if (e.key === "0") {                          // 원래대로 = 창에 맞추기
      e.preventDefault();
      if (!state.pdf) return;
      state.pdf.getPage(state.page).then(function (pg) {
        state.scale = fitScale(pg);
        state.userZoomed = false;
        renderPage();
        setStatus("창에 맞췄습니다");
      });
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey) return;
    if (!state.pdf) return;

    /*
     * 글을 치는 중이면 자판은 글칸의 것이다.
     *
     * 메모를 고치다 화살표로 커서를 옮기려는데 쪽이 넘어갔다. Delete만 막아
     * 두었던 걸 모든 단축키로 넓힌다. Esc는 예외 — 글칸에서도 빠져나가는
     * 열쇠라 그것만 먼저 받는다.
     */
    var t = e.target;
    var typing = !!t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);

    if (e.key === "Escape") {
      var busy = typing || state.selMark ||
                 !$("autoPop").classList.contains("gone") ||
                 state.cards.some(function (c) { return c.editingMemo; });
      state.selMark = null;
      drawMarks();
      closeMemoEdit();
      closeAuto();
      if (typing && t.blur) t.blur();
      if (!busy && state.focus) setFocus(false);   // 닫을 게 없으면 PDF만 보기를 끈다
      return;
    }
    if (typing) return;

    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "Delete" || e.key === "Backspace") {
      if (!state.selMark) return;
      e.preventDefault();
      var mk = state.marks.filter(function (m) { return m.id === state.selMark; })[0];
      if (mk) removeMark(mk);
    }
  });
})();
</script>

</body>
</html>
