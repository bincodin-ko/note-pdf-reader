          if (k === "img" || k === "editing" || k === "editingMemo") return;   // 썸네일은 다시 만들 수 있다
          o[k] = c[k];
        });
        return o;
      });
      var info = doc.context.lookup(doc.context.trailerInfo.Info);
      info.set(PDFLib.PDFName.of(CAPNOTE_KEY),
               PDFLib.PDFHexString.fromText(JSON.stringify({
                 v: 1, name: state.docName, cards: slim, marks: carriedMarks
               })));
    } catch (e) { /* 못 심어도 PDF 자체는 나가야 한다 */ }
  }

  async function readCardsFromPdf(pdf) {
    try {
      var md = await pdf.getMetadata();
      var raw = md && md.info && md.info.Custom ? md.info.Custom[CAPNOTE_KEY] : null;
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d) return null;
      return { cards: Array.isArray(d.cards) ? d.cards : [], marks: Array.isArray(d.marks) ? d.marks : [] };
    } catch (e) { return null; }
  }

  /*
   * 우리가 넣은 메모 주석을 벗겨낸다.
   *
   * 벗기지 않으면 화면에 주석이 그려진 채로 그 위에 우리 메모 상자가 또 얹혀
   * 두 겹으로 보인다. 벗겨내면 원본을 여는 것과 같아지고, 다시 내보낼 때도
   * 깨끗한 바탕에서 시작한다.
   */
  async function stripMemoAnnots(bytes) {
    try {
      var doc = await PDFLib.PDFDocument.load(bytes.slice(0));
      var n = 0;
      doc.getPages().forEach(function (pg) { n += removeMemoAnnots(doc, pg); });
      if (!n) return null;
      return (await doc.save()).buffer;
    } catch (e) { return null; }
  }

  var MEMO_GAP = 6, MEMO_MARGIN = 4;

  function overlapArea(a, b) {
    var dx = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    var dy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    return dx > 0 && dy > 0 ? dx * dy : 0;
  }

  /*
   * 본문 글자 상자를 PDF 좌표(왼쪽 아래 원점, 포인트)로 모은다.
   * 메모를 붙일 때마다 다시 읽으면 느려서 쪽마다 한 번만 읽고 쟁여 둔다.
   */
  var _textCache = {};
  async function textBoxes(pageNo) {
    if (_textCache[pageNo]) return _textCache[pageNo];
    var out = [];
    try {
      var page = await state.pdf.getPage(pageNo);
      var vp = page.getViewport({ scale: 1 });
      var tc = await textContentOf(pageNo);       // 같은 쪽 글자는 한 번만 읽는다
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(t[2], t[3]) || 10;
        if ((it.width || 0) > 0) out.push({ x: t[4], y: vp.height - t[5], w: it.width, h: h });
      });
    } catch (e) { /* 글자를 못 읽어도 배치는 계속돼야 한다 */ }
    _textCache[pageNo] = out;
    return out;
  }

  /*
   * 빈자리 찾기 (좌표는 PDF 기준, 왼쪽 아래 원점)
   *
   * hard — 오려낸 영역과 이미 놓인 메모. 덮으면 안 된다 (가중치 100)
   * soft — 본문 글자. 되도록 피한다 (가중치 1)
   * 정 자리가 없으면 글자를 조금 가리더라도 오려낸 그림만은 지키게 된다.
   */
  function placeMemo(sel, mw, mh, pw, ph, hard, soft) {
    var g = MEMO_GAP, m = MEMO_MARGIN, i;

    function fit(x, y) {
      return {
        x: Math.max(m, Math.min(x, pw - mw - m)),
        y: Math.max(m, Math.min(y, ph - mh - m)),
        w: mw, h: mh
      };
    }
    function score(c) {
      var v = 0;
      for (i = 0; i < hard.length; i++) v += overlapArea(c, hard[i]) * 100;
      for (i = 0; i < soft.length; i++) v += overlapArea(c, soft[i]);
      return v;
    }

    var spots = [
      fit(sel.x + sel.w + g, sel.y + sel.h - mh),   // 오른쪽
      fit(sel.x - g - mw,    sel.y + sel.h - mh),   // 왼쪽
      fit(sel.x,             sel.y - g - mh),       // 아래
      fit(sel.x,             sel.y + sel.h + g)     // 위
    ];
    var best = null, bestScore = Infinity;
    for (var k = 0; k < spots.length; k++) {
      var sc = score(spots[k]);
      if (sc === 0) return spots[k];
      if (sc < bestScore) { bestScore = sc; best = spots[k]; }
    }

    // 네 자리가 다 막혔으면 페이지를 훑어 가장 가까운 빈자리를 찾는다
    var cx = sel.x + sel.w / 2, cy = sel.y + sel.h / 2;
    var step = 12, nearD = Infinity, near = null;
    for (var y = m; y <= ph - mh - m; y += step) {
      for (var x = m; x <= pw - mw - m; x += step) {
        var c = { x: x, y: y, w: mw, h: mh };
        var v = score(c);
        if (v < bestScore) { bestScore = v; best = c; }
        if (v !== 0) continue;
        var d = (x + mw / 2 - cx) * (x + mw / 2 - cx) + (y + mh / 2 - cy) * (y + mh / 2 - cy);
        if (d < nearD) { nearD = d; near = c; }
      }
    }
    return near || best;
  }

  async function placeMemoFor(card) {
    var size = memoSize(memoLines(card.memo || ""));
    var pw = state.pageW, ph = state.pageH;
    if (!pw || !ph) { card.pin = fallbackPin(card, size); return; }

    var sel = {
      x: card.rect.x * pw, y: ph - (card.rect.y + card.rect.h) * ph,
      w: card.rect.w * pw, h: card.rect.h * ph
    };

    var hard = [];
    state.cards.forEach(function (c) {
      if (c.page !== card.page || c === card) return;
      if (c.inserted && c.pin) {                       // 이미 놓인 메모
        var sz = memoSize(memoLines(c.memo || ""));
        hard.push({ x: c.pin.x * pw, y: ph - c.pin.y * ph - sz.h, w: sz.w, h: sz.h });
      }
      if (!c.manual && !c.qna && c.rect && c.rect.w > 0) {   // 다른 오려낸 영역
        hard.push({ x: c.rect.x * pw, y: ph - (c.rect.y + c.rect.h) * ph,
                    w: c.rect.w * pw, h: c.rect.h * ph });
      }
    });

    var soft = await textBoxes(card.page);
    var at = placeMemo(sel, size.w, size.h, pw, ph, hard, soft);
    card.pin = { x: at.x / pw, y: (ph - at.y - size.h) / ph };
  }

  /* ---------- 내보내기 ---------- */

  var openUrl = null;

  function closeSheet() {
    var v = document.querySelector(".veil");
    if (v) v.remove();
    if (openUrl) { URL.revokeObjectURL(openUrl); openUrl = null; }
  }

  // 코드가 링크를 대신 눌러 내려받는 방식은 아티팩트 보안 상자에서 막히고,
  // 막히면 그 주소로 화면이 이동해 앱이 통째로 사라진다.
  // 그래서 자동 클릭을 쓰지 않고, 사용자가 직접 누르는 링크만 띄운다.
  function showExport(title, opts) {
    closeSheet();
    var veil = document.createElement("div");
    veil.className = "veil";
    veil.addEventListener("pointerdown", function (e) {
      if (e.target === veil) closeSheet();
    });

    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    var h = document.createElement("h3");
    h.textContent = title;
    sheet.appendChild(h);

    var body = document.createElement("div");
    body.className = "sbody";
    if (opts.note) {
      var p = document.createElement("p");
      p.className = "note";
      p.textContent = opts.note;
      body.appendChild(p);
    }
    var ta = null;
    if (opts.text != null) {
      ta = document.createElement("textarea");
      ta.value = opts.text;
      ta.readOnly = true;
      body.appendChild(ta);
    }
    sheet.appendChild(body);

    var foot = document.createElement("div");
    foot.className = "sfoot";

    if (opts.blob) {
      openUrl = URL.createObjectURL(opts.blob);
      var a = document.createElement("a");
      a.className = "dl";
      a.href = openUrl;
      a.download = opts.filename;
      a.textContent = "내려받기";
      foot.appendChild(a);
    }

    if (ta) {
      var copy = document.createElement("button");
      copy.className = opts.blob ? "" : "primary";
      copy.textContent = "전체 복사";
      copy.onclick = function () {
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
        copy.textContent = "복사했습니다";
        setTimeout(function () { copy.textContent = "전체 복사"; }, 1600);
      };
      foot.appendChild(copy);
    }

    var sp = document.createElement("div");
    sp.className = "spacer";
    foot.appendChild(sp);

    var close = document.createElement("button");
    close.textContent = "닫기";
    close.onclick = closeSheet;
    foot.appendChild(close);

    sheet.appendChild(foot);
    veil.appendChild(sheet);
    $("root").appendChild(veil);
  }

  // 고른 항목만 담는다 (안 주면 전부)
  function buildMarkdown(only) {
    var src = only || state.cards;
    var lines = ["# " + state.docName, ""];
    var byPage = {};
    src.forEach(function (c) {
      (byPage[c.page] = byPage[c.page] || []).push(c);
    });
    Object.keys(byPage)
      .sort(function (a, b) { return a - b; })
      .forEach(function (pg) {
        lines.push("## " + pg + "쪽");
        lines.push("");
        byPage[pg].forEach(function (c) {
          if (c.manual) {
            lines.push("- (직접 쓴 메모) " + (c.memo || ""));
          } else if (c.qna) {
            lines.push("### Q. " + (c.question || ""));
            lines.push("");
            lines.push(c.summary || "");
          } else {
            lines.push("### " + (c.memo || "오려낸 부분"));
            lines.push("");
            lines.push(c.summary || "");
            if (c.detail) { lines.push(""); lines.push(c.detail); }
          }
          lines.push("");
        });
      });
    return lines.join("\n");
  }

  /* ---------- 정리 내보내기 (PDF) ---------- */

  /*
   * 정리를 PDF로 만든다.
   *
   * 예전에는 마크다운 텍스트만 줬는데, 오려낸 그림이 빠져서 나중에 보면
   * 무엇에 대한 정리인지 알 수 없었다. 그림과 설명을 같이 실어야 쓸모가 있다.
   *
   * 글자를 캔버스에 그려 쪽 이미지로 심는다. pdf-lib 표준 폰트에 한글이 없어서다
   * (메모를 이미지로 넣는 것과 같은 이유). 대신 글자를 고를 수는 없다.
   */
  async function buildSummaryPdf(cards) {
    var PW = 595.28, PH = 841.89, M = 44, CW = PW - M * 2;
    var K = 2.5;                                  // 캔버스 배율. 인쇄해도 뭉개지지 않게
    var mc = document.createElement("canvas").getContext("2d");

    function font(sz, bold) { return (bold ? "600 " : "") + sz + "px sans-serif"; }
    function wrap(text, sz, bold, maxW) {
      mc.font = font(sz, bold);
      var lines = [], cur = "";
      String(text == null ? "" : text).split("").forEach(function (ch) {
        if (ch === "\n") { lines.push(cur); cur = ""; return; }
        if (mc.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
        else cur += ch;
      });
      if (cur || !lines.length) lines.push(cur);
      return lines;
    }

    // 그림을 먼저 다 읽어 둔다. 크기를 알아야 자리를 잡을 수 있다
    var imgs = {};
    await Promise.all(cards.map(function (c) {
      return new Promise(function (res) {
        if (!c.img) return res();
        var im = new Image();
        im.onload = function () { imgs[c.id] = im; res(); };
        im.onerror = function () { res(); };
        im.src = c.img;
      });
    }));

    var pages = [], cur = null, y = 0;
    function newPage() {
      var cv = document.createElement("canvas");
      cv.width = Math.round(PW * K);
      cv.height = Math.round(PH * K);
      var g = cv.getContext("2d");
      g.scale(K, K);
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, PW, PH);
      cur = { cv: cv, g: g };
      pages.push(cur);
      y = M;
    }
    function need(h) { if (y + h > PH - M) newPage(); }

    function text(str, sz, bold, color, lh, maxW) {
      var lines = wrap(str, sz, bold, maxW || CW);
      lines.forEach(function (ln) {
        need(lh);
        cur.g.font = font(sz, bold);
        cur.g.fillStyle = color;
        cur.g.textBaseline = "alphabetic";
        cur.g.fillText(ln, M, y + sz);
        y += lh;
      });
    }

    newPage();
    text(state.docName || "정리", 17, true, "#111111", 25);
    text(new Date().toLocaleDateString("ko-KR") + " · " + cards.length + "항목",
         9.5, false, "#8a8a8a", 16);
    y += 8;

    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];

      // 항목 사이 구분선. 첫 항목 앞에는 넣지 않는다
      if (i > 0) {
        need(18);
        cur.g.strokeStyle = "#e2e2e2";
        cur.g.lineWidth = 0.7;
        cur.g.beginPath();
        cur.g.moveTo(M, y + 6); cur.g.lineTo(PW - M, y + 6); cur.g.stroke();
        y += 18;
      }

      var head = c.qna
        ? ((c.scope === "all" ? "전체" : c.page + "쪽") + " · 질문")
        : (c.page + "쪽" + (c.mode ? " · " + c.mode : ""));
      text(head, 9.5, false, "#9a9a9a", 15);

      if (c.qna) {
        text("Q. " + (c.question || ""), 11.5, true, "#7a5c00", 17);
        y += 3;
        text(c.summary || "", 10.5, false, "#222222", 15.5);
      } else {
        var im = imgs[c.id];
        if (im && im.width) {
          var w = CW, h = CW * (im.height / im.width);
          if (h > 300) { h = 300; w = 300 * (im.width / im.height); }
          need(h + 8);
          cur.g.drawImage(im, M, y, w, h);
          cur.g.strokeStyle = "#dddddd";
          cur.g.lineWidth = 0.6;
          cur.g.strokeRect(M, y, w, h);
          y += h + 10;
        }
        if (c.memo) { text(c.memo, 11, true, "#7a5c00", 16); y += 2; }
        text(c.summary || "", 10.5, false, "#222222", 15.5);
        if (c.detail) { y += 4; text(c.detail, 10, false, "#555555", 15); }
      }
      y += 6;
    }

    var doc = await PDFLib.PDFDocument.create();
    for (var pi = 0; pi < pages.length; pi++) {
      var jpg = await doc.embedJpg(pages[pi].cv.toDataURL("image/jpeg", 0.9));
      var pg = doc.addPage([PW, PH]);
      pg.drawImage(jpg, { x: 0, y: 0, width: PW, height: PH });
    }
    return { blob: new Blob([await doc.save()], { type: "application/pdf" }), pages: pages.length };
  }

  /*
   * 무엇을 내보낼지 고르는 창.
   * 전부 담아 봐야 쓸모없는 것도 섞여 나오므로 항목을 고를 수 있어야 한다.
   */
  function showSummaryPicker() {
    var list = state.cards.filter(function (c) {
      return c.qna ? c.summary : (!c.manual && (c.summary || c.memo));
    });
    if (!list.length) { setStatus("내보낼 정리가 아직 없습니다."); return; }

    closeSheet();
    var veil = document.createElement("div");
    veil.className = "veil";
    veil.addEventListener("pointerdown", function (e) { if (e.target === veil) closeSheet(); });

    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    var h = document.createElement("h3");
    h.textContent = "정리 내보내기";
    sheet.appendChild(h);

    var body = document.createElement("div");
    body.className = "sbody";
    var note = document.createElement("p");
    note.className = "note";
    note.textContent = "내보낼 항목을 고르세요. 오려낸 그림과 설명이 함께 들어갑니다.";
    body.appendChild(note);

    var bar = document.createElement("div");
    bar.className = "pickbar";
    var all = document.createElement("button");
    all.textContent = "모두 선택";
    var none = document.createElement("button");
    none.textContent = "모두 해제";
    var nEl = document.createElement("span");
    nEl.className = "n";
    bar.appendChild(all); bar.appendChild(none); bar.appendChild(nEl);
    body.appendChild(bar);

    var box = document.createElement("div");
    box.className = "picklist";
    var boxes = [];

    list.forEach(function (c) {
      var row = document.createElement("label");
      row.className = "pickitem";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      boxes.push({ cb: cb, card: c });

      var thumb = null;
      if (c.img) { thumb = document.createElement("img"); thumb.src = c.img; }

      var pi = document.createElement("div");
      pi.className = "pi";
      var ph = document.createElement("div");
      ph.className = "pih";
      ph.textContent = c.qna
        ? ((c.scope === "all" ? "전체" : c.page + "쪽") + " · 질문")
        : (c.page + "쪽" + (c.mode ? " · " + c.mode : ""));
      var pb = document.createElement("div");
      pb.className = "pib";
      pb.textContent = c.qna ? (c.question || "") : (c.memo || c.summary || "");
      pi.appendChild(ph); pi.appendChild(pb);

      row.appendChild(cb);
      if (thumb) row.appendChild(thumb);
      row.appendChild(pi);
      box.appendChild(row);
      cb.addEventListener("change", count);
    });
    body.appendChild(box);
    sheet.appendChild(body);

    function picked() {
      return boxes.filter(function (b) { return b.cb.checked; }).map(function (b) { return b.card; });
    }
    function count() {
      var n = picked().length;
      nEl.textContent = n + " / " + boxes.length + " 고름";
      make.disabled = n === 0;
    }
    all.onclick = function () { boxes.forEach(function (b) { b.cb.checked = true; }); count(); };
    none.onclick = function () { boxes.forEach(function (b) { b.cb.checked = false; }); count(); };

    var foot = document.createElement("div");
    foot.className = "sfoot";
    var make = document.createElement("button");
    make.className = "primary";
    make.textContent = "PDF로 만들기";
    make.onclick = async function () {
      var chosen = picked();
      make.disabled = true;
      make.textContent = "만드는 중…";
      try {
        var r = await buildSummaryPdf(chosen);
        showExport("정리 PDF", {
          note: chosen.length + "항목 · " + r.pages + "쪽으로 만들었습니다.",
          blob: r.blob,
          filename: (state.docName || "정리") + " 정리.pdf"
        });
      } catch (e) {
        make.disabled = false;
        make.textContent = "PDF로 만들기";
        setStatus("정리 PDF를 만들지 못했습니다: " + (e.message || e), true);
      }
    };

    var md = document.createElement("button");
    md.textContent = "마크다운 복사";
    md.title = "노션 등에 붙여 넣을 때";
    md.onclick = function () {
      var t = buildMarkdown(picked());
      navigator.clipboard.writeText(t).then(function () {
        md.textContent = "복사했습니다";
        setTimeout(function () { md.textContent = "마크다운 복사"; }, 1600);
      }).catch(function () { setStatus("복사하지 못했습니다.", true); });
    };

    var sp = document.createElement("div");
    sp.className = "spacer";
    var close = document.createElement("button");
    close.textContent = "닫기";
    close.onclick = closeSheet;

    foot.appendChild(make); foot.appendChild(md);
    foot.appendChild(sp); foot.appendChild(close);
    sheet.appendChild(foot);
    veil.appendChild(sheet);
    $("root").appendChild(veil);
    count();
  }

  $("expMd").onclick = showSummaryPicker;

  // 한글은 표준 PDF 폰트에 없으므로, 메모를 캔버스에 그려 이미지로 심는다
  /*
   * 메모를 PNG로 그린다. 한글이 pdf-lib 표준 폰트에 없어서 이미지로 심는다.
   * 치수와 줄바꿈은 화면과 같은 값(MEMO, memoLines)을 쓴다 — 그래야 화면에서
   * 맞춰 둔 자리와 크기가 그대로 나간다.
   */
  function memoToPng(text, manual) {
    var lines = memoLines(text);
    var size = memoSize(lines);
    var s = 3;                       // 인쇄해도 뭉개지지 않게 3배로 그린다
    var cv = document.createElement("canvas");
    cv.width = Math.round(size.w * s);
    cv.height = Math.round(size.h * s);
    var c = cv.getContext("2d");
    c.scale(s, s);

    c.fillStyle = "#fff8dc";
    c.fillRect(0, 0, size.w, size.h);
    c.fillStyle = manual ? "#4aa3e0" : "#ffd83d";
    c.fillRect(0, 0, MEMO.bar, size.h);

    c.fillStyle = "#241d00";
    c.font = MEMO.fs + "px sans-serif";
    c.textBaseline = "middle";
    lines.forEach(function (ln, i) {
      c.fillText(ln, MEMO.bar + MEMO.pad, MEMO.pad + i * MEMO.lh + MEMO.lh / 2);
    });
    return { dataUrl: cv.toDataURL("image/png"), w: size.w, h: size.h };
  }

  $("expPdf").onclick = async function () {
    var inserted = state.cards.filter(function (c) { return c.inserted; });
    if (!inserted.length && !state.marks.length) {
      setStatus("PDF에 붙인 메모도 형광펜도 아직 없습니다.");
      return;
    }

    /*
     * 쪽이 많은 자료를 매번 통째로 내려받는 건 부담이다.
     * 기본은 "메모 있는 쪽만" — 보통 그것만 다시 볼 것이기 때문이다.
     */
    var scope = $("expScope").value;
    if (scope === "page" && !inserted.some(function (c) { return c.page === state.page; })) {
      setStatus("이 쪽에는 붙인 메모가 없습니다.");
      return;
    }
    setStatus("메모를 넣는 중…");
    try {
      /*
       * 필요한 쪽만 새 문서로 옮겨 담는다.
       *
       * 예전에는 원본을 통째로 열고 removePage로 덜어냈는데, 그건 쪽 목록에서
       * 빼기만 할 뿐 그 쪽의 그림·글꼴은 파일에 그대로 남는다. 그래서 "메모 있는
       * 쪽만"으로 골라도 용량이 전체와 똑같았다.
       * copyPages는 그 쪽이 실제로 쓰는 것만 따라오므로 파일이 진짜로 줄어든다.
       */
      var src = await PDFLib.PDFDocument.load(state.bytes.slice(0));
      var doc = src, pageMap = null;

      if (scope !== "all") {
        var keep = {};
        if (scope === "page") keep[state.page] = true;
        else {
          inserted.forEach(function (c) { keep[c.page] = true; });
          state.marks.forEach(function (m) { keep[m.page] = true; });
        }
        var order = Object.keys(keep).map(Number).sort(function (a, b) { return a - b; });
        pageMap = {};
        order.forEach(function (pnum, idx) { pageMap[pnum] = idx + 1; });

        doc = await PDFLib.PDFDocument.create();
        var copied = await doc.copyPages(src, order.map(function (n) { return n - 1; }));
        copied.forEach(function (pg) { doc.addPage(pg); });
      }

      // 원본 쪽 번호를 결과 문서의 쪽 번호로 옮긴다
      function outPage(n) { return pageMap ? pageMap[n] : n; }

      /*
       * 메모를 페이지에 굽지 않고 주석(Stamp)으로 넣는다.
       *
       * 구우면 지울 수 없어서, 내보낸 PDF를 다시 열어 고친 뒤 또 내보내면
       * 예전 메모 위에 새 메모가 겹쳤다. 주석은 /Capnote 표시를 달아 두면
       * 다음 번에 찾아서 지우고 새로 넣을 수 있다.
       * F:4는 인쇄 플래그다 — 없으면 화면에만 보이고 인쇄에서 빠진다.
       */
      // 이전에 넣은 우리 주석(메모·형광펜)을 모두 걷어낸 뒤 새로 넣는다
      doc.getPages().forEach(function (pg) { removeMemoAnnots(doc, pg); });

      state.marks.forEach(function (mk) {
        var op = outPage(mk.page);
        if (!op || op < 1 || op > doc.getPageCount()) return;
        var pg = doc.getPage(op - 1);
        var pw = pg.getWidth(), ph = pg.getHeight();
        var rgb = penOf(mk.color).rgb;
        mk.rects.forEach(function (r) {
          addMarkAnnot(doc, pg, {
            x: r.x * pw, y: ph - (r.y + r.h) * ph, w: r.w * pw, h: r.h * ph
          }, rgb);
        });
      });

      for (var i = 0; i < inserted.length; i++) {
        var card = inserted[i];
        var op = outPage(card.page);
        if (!op) continue;
        var pg = doc.getPage(op - 1);
        var pw = pg.getWidth(), ph = pg.getHeight();

        /*
         * 오려낸 영역에 노란 테두리를 두르던 것을 뺐다.
         * 어디를 오렸는지는 정리 PDF에 그림으로 남는다. 원본 위에서는
         * 표시가 오히려 지저분했고, 강조는 형광펜이 맡는다.
         */

        // 화면에서 맞춰 둔 테두리를 그대로 넣는다 (뺐으면 안 넣는다)
        if (card.box) {
          addBoxAnnot(doc, pg, {
            x: card.box.x * pw,
            y: ph - (card.box.y + card.box.h) * ph,
            w: card.box.w * pw,
            h: card.box.h * ph
          });
        }

        var memo = memoToPng(card.memo || card.summary, card.manual);
        var png = await doc.embedPng(memo.dataUrl);

        // 자리는 화면에서 이미 정해졌다(card.pin). 여기서 다시 계산하지 않는다
        var m = MEMO_MARGIN;
        var pin = card.pin || fallbackPin(card, memo);
        var x = Math.max(m, Math.min(pin.x * pw, pw - memo.w - m));
        var y = Math.max(m, Math.min(ph - pin.y * ph - memo.h, ph - memo.h - m));
        addMemoAnnot(doc, pg, png.ref, x, y, memo.w, memo.h, card.memo || "");
      }

      /*
       * 카드 정보를 PDF 안에 적어 둔다. 이걸 다시 우리 앱에서 열면 메모를
       * 그대로 되살려 고칠 수 있다. 썸네일(img)은 빼서 파일을 가볍게 유지하고,
       * 다시 열 때 쪽에서 새로 잘라 만든다.
       */
      // 이 파일을 다시 열었을 때를 위해 쪽 번호를 결과 기준으로 다시 매긴다
      var carriedCards = state.cards;
      if (pageMap) {
        carriedCards = state.cards.filter(function (c) { return pageMap[c.page]; })
          .map(function (c) {
            var o = {};
            Object.keys(c).forEach(function (k) { o[k] = c[k]; });
            o.page = pageMap[c.page];
            return o;
          });
      }

      var carriedMarks = pageMap
        ? state.marks.filter(function (m) { return pageMap[m.page]; })
            .map(function (m) { return { id: m.id, page: pageMap[m.page], color: m.color, rects: m.rects }; })
        : state.marks;
      saveCardsIntoPdf(doc, carriedCards, carriedMarks);

      var out = await doc.save();
      showExport("메모 넣은 PDF", {
        note: "메모 " + carriedCards.filter(function (c) { return c.inserted; }).length +
              "개 · " + doc.getPageCount() + "쪽입니다. " +
              "내려받아 굿노트 등에서 이어 쓰세요. 이 파일을 다시 이 앱에 열면 메모를 그대로 고칠 수 있습니다.",
        blob: new Blob([out], { type: "application/pdf" }),
        filename: state.docName + " 메모.pdf"
      });
      setStatus("");
    } catch (e) {
      setStatus("PDF를 만들지 못했습니다. 다른 파일로 시도해 보세요.", true);
    }
  };

  /* ---------- 글자 크기 · 확대 축소 ---------- */

  /*
   * 정리 패널 글자 크기
   *
   * 수업 중에는 크게, 훑을 때는 작게 보고 싶다. 다음에 켤 때도 유지되게
   * localStorage에 적어 둔다 (IndexedDB는 PDF마다 갈리므로 여기엔 안 맞는다).
   */
  var NOTE_FS_MIN = 11, NOTE_FS_MAX = 24;
  var noteFs = 14;
  try {
    var saved = parseFloat(localStorage.getItem("capnote:notefs"));
    if (saved >= NOTE_FS_MIN && saved <= NOTE_FS_MAX) noteFs = saved;
  } catch (e) { /* 저장소가 막혀 있어도 기본값으로 돌아간다 */ }

  function applyNoteFs() {
    document.documentElement.style.setProperty("--note-fs", noteFs + "px");
    $("fsDown").disabled = noteFs <= NOTE_FS_MIN;
    $("fsUp").disabled = noteFs >= NOTE_FS_MAX;
    try { localStorage.setItem("capnote:notefs", String(noteFs)); } catch (e) {}
  }
  function bumpNoteFs(d) {
    noteFs = Math.max(NOTE_FS_MIN, Math.min(NOTE_FS_MAX, noteFs + d));
    applyNoteFs();
    setStatus("글자 크기 " + noteFs + "px");
  }
  $("fsUp").onclick = function () { bumpNoteFs(1); };
  $("fsDown").onclick = function () { bumpNoteFs(-1); };
  applyNoteFs();

  // PDF만 확대·축소한다. 화면 전체가 커지면 정리 패널까지 같이 흔들린다
  function zoomPdf(d) {
    if (!state.pdf) return;
    var next = Math.max(0.25, Math.min(4, state.scale + d));
    if (Math.abs(next - state.scale) < 0.001) return;
    state.scale = next;
    state.userZoomed = true;
    closeMemoEdit();
    renderPage();
  }

  /*
   * Ctrl+휠은 브라우저·Electron 기본 동작이 "화면 전체 확대"다.
   * 그걸 막고 PDF 배율만 바꾼다. 막지 않으면 정리 패널 글자까지 같이 커져
   * 레이아웃이 흐트러진다.
   */
  $("stage").addEventListener("wheel", function (e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoomPdf(e.deltaY < 0 ? 0.1 : -0.1);
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;

    // Ctrl+> / Ctrl+< 로 정리 패널 글자 크기
    if (e.key === "z" || e.key === "Z") { e.preventDefault(); doUndo(); return; }
    if (e.key === ">" || e.key === "." ) { e.preventDefault(); bumpNoteFs(1); return; }
    if (e.key === "<" || e.key === ",") { e.preventDefault(); bumpNoteFs(-1); return; }

    // Ctrl +/- 도 화면 전체 대신 PDF만
    if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomPdf(0.25); return; }
    if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomPdf(-0.25); return; }
    if (e.key === "0") {                          // 원래대로 = 창에 맞추기
      e.preventDefault();
      if (!state.pdf) return;
      state.pdf.getPage(state.page).then(function (pg) {
        state.scale = fitScale(pg);
        state.userZoomed = false;
        renderPage();
        setStatus("창에 맞췄습니다");
      });
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey) return;
    if (!state.pdf) return;
    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "Escape") { state.selMark = null; drawMarks(); closeMemoEdit(); }
    if (e.key === "Delete" || e.key === "Backspace") {
      // 글을 치는 중에는 건드리지 않는다
      var t = e.target && e.target.tagName;
      if (t === "INPUT" || t === "TEXTAREA") return;
      if (!state.selMark) return;
      e.preventDefault();
      var mk = state.marks.filter(function (m) { return m.id === state.selMark; })[0];
      if (mk) removeMark(mk);
    }
  });
})();
</script>

</body>
</html>
