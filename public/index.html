<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오려둔 공책</title>
<script src="storage.js"></script>
</head>
<body>
<div id="root">
<style>
  :root {
    --ink: #141d27;
    --ink-2: #1b2836;
    --ink-3: #22323f;
    --rule: #2f4457;
    --paper: #ffffff;
    --text: #dfe8f0;
    --muted: #8ba0b4;
    --marker: #ffd83d;
    --marker-soft: rgba(255, 216, 61, 0.22);
    --danger: #ff8b6b;
  }

  * { box-sizing: border-box; }

  #root {
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 15px;
    line-height: 1.6;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--ink-2);
    flex-wrap: wrap;
  }

  .mark {
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-right: 4px;
    font-size: 15px;
  }
  .mark span { color: var(--marker); }
  /* 어느 빌드를 보고 있는지 한눈에 — 설치파일 이름만으로는 구분이 안 된다 */
  .ver {
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-left: -2px;
    align-self: center;
  }

  button {
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--marker); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }

  .primary {
    background: var(--marker);
    color: #1c1500;
    border-color: var(--marker);
    font-weight: 650;
  }

  .pageno {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    min-width: 74px;
    text-align: center;
    font-size: 14px;
  }

  .spacer { flex: 1; }

  .toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .toggle input { accent-color: var(--marker); width: 15px; height: 15px; }

  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .stage {
    flex: 1;
    overflow: auto;
    padding: 20px;
    display: flex;
    justify-content: center;
    /*
     * safe를 붙이는 이유: 그냥 center면 페이지가 화면보다 클 때
     * 위쪽이 잘려 나가고 스크롤로도 못 올라간다.
     * safe는 넘칠 때만 자동으로 시작 정렬로 돌아간다.
     */
    align-items: safe center;
    min-width: 0;
  }

  .empty {
    margin: auto;
    text-align: center;
    max-width: 380px;
    color: var(--muted);
  }
  .empty h2 {
    color: var(--text);
    font-size: 19px;
    font-weight: 650;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .empty p { margin: 0 0 18px; font-size: 14px; }

  .pagewrap {
    position: relative;
    background: var(--paper);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    line-height: 0;
  }
  canvas { display: block; }

  .layer {
    position: absolute;
    inset: 0;
    cursor: crosshair;
    touch-action: none;
  }

  .sel {
    position: absolute;
    border: 2px solid var(--marker);
    background: var(--marker-soft);
    pointer-events: none;
  }

  .pin {
    position: absolute;
    background: var(--marker);
    color: #1c1500;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    width: 21px;
    height: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .pinnote {
    position: absolute;
    background: #fff8dc;
    color: #241d00;
    border-left: 3px solid var(--marker);
    border-radius: 3px;
    padding: 7px 9px;
    font-size: 12px;
    line-height: 1.45;
    width: 190px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    z-index: 5;
  }
  .pinnote textarea {
    width: 100%;
    border: 0;
    background: transparent;
    font: inherit;
    color: inherit;
    resize: none;
    outline: none;
    overflow: hidden;
  }
  .pinnote .pinbtns {
    display: flex;
    gap: 8px;
    margin-top: 5px;
    font-size: 11px;
  }
  .pinnote .pinbtns button {
    padding: 2px 7px;
    font-size: 11px;
    background: rgba(0, 0, 0, 0.06);
    border-color: rgba(0, 0, 0, 0.15);
    color: #241d00;
    border-radius: 4px;
  }

  .notes {
    width: 350px;
    flex-shrink: 0;
    border-left: 1px solid var(--rule);
    background: var(--ink-2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .noteshead {
    padding: 12px 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .noteshead strong { font-size: 14px; font-weight: 650; }
  .noteshead .count { color: var(--muted); font-size: 13px; }

  .cards { flex: 1; overflow-y: auto; padding: 12px; }

  .hint {
    color: var(--muted);
    font-size: 13px;
    padding: 22px 8px;
    text-align: center;
    line-height: 1.7;
  }

  .card {
    background: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 9px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .card img {
    width: 100%;
    display: block;
    background: #fff;
    border-bottom: 1px solid var(--rule);
  }
  .cardbody { padding: 10px 12px 12px; }
  .cardmeta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cardmeta button {
    padding: 2px 7px;
    font-size: 11px;
    border-radius: 5px;
    color: var(--muted);
  }
  .cardtext { font-size: 14px; white-space: pre-wrap; }
  .cardtext.loading { color: var(--muted); }

  .cardedit label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 4px;
  }
  .cardedit input,
  .cardedit textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 9px;
    resize: vertical;
  }
  .cardedit input:focus,
  .cardedit textarea:focus { outline: none; border-color: var(--marker); }
  .cardedit .editbtns { display: flex; gap: 8px; margin-top: 10px; }
  .cardedit .editbtns button { padding: 5px 14px; font-size: 13px; }

  .ask {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-size: 13px;
    color: var(--muted);
  }
  .askrow { display: flex; gap: 8px; margin-top: 7px; }
  .askrow button { padding: 5px 14px; font-size: 13px; }

  .done {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px dashed var(--rule);
    font-size: 12px;
    color: var(--marker);
  }

  .more { margin-top: 9px; }
  .more button { font-size: 13px; padding: 5px 11px; }

  /*
   * Claude 상태 칩 — 늘 보인다.
   * 예전에는 AI를 부르다 실패해야만 안내가 떴다. 그때는 이미 늦다.
   */
  .chip {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: var(--ink-2);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { display: inline-flex; }
  .chip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .chip.ready { color: var(--muted); }
  .chip.ready .dot { background: #57c98a; }
  .chip.need { color: var(--marker); border-color: rgba(255,216,61,0.45); }
  .chip.need .dot { background: var(--marker); }
  .chip:hover { border-color: var(--marker); }

  /* Claude Code가 준비 안 됐을 때만 뜨는 띠 */
  .cliwarn {
    display: none;
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    background: rgba(255, 139, 107, 0.10);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text);
  }
  .cliwarn.on { display: block; }
  .cliwarn .why { color: var(--muted); margin-bottom: 8px; }
  .cliwarn .row { display: flex; gap: 8px; }
  .cliwarn button { font-size: 12px; padding: 6px 10px; }
  .cliwarn code {
    background: var(--ink);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11.5px;
  }

  /* 질문 입력칸 — 내보내기 버튼 위, 카드 목록 바로 아래 */
  .askbar {
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 8px;
  }
  .askbar input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 8px 10px;
  }
  .askbar input:focus { outline: none; border-color: var(--marker); }
  .askbar button { font-size: 13px; padding: 8px 12px; }

  /* 질문 카드는 오려낸 카드와 구분되게 왼쪽에 띠를 둔다 */
  .card.qna { border-left: 3px solid var(--marker); }
  .qtext {
    font-size: 13px;
    color: var(--marker);
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .foot {
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 8px;
  }
  .foot button { flex: 1; font-size: 13px; padding: 8px; }

  .status {
    padding: 6px 14px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--rule);
    background: var(--ink-2);
    min-height: 31px;
  }
  .status.err { color: var(--danger); }

  .veil {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 17, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .sheet {
    background: var(--ink-2);
    border: 1px solid var(--rule);
    border-radius: 12px;
    width: min(620px, 100%);
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet h3 {
    margin: 0;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 650;
    border-bottom: 1px solid var(--rule);
  }
  .sheet .sbody { padding: 14px 16px; overflow: auto; }
  .sheet textarea {
    width: 100%;
    height: 300px;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
  }
  .sheet .note { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .sheet .sfoot {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--rule);
    align-items: center;
  }
  .dl {
    display: inline-block;
    background: var(--marker);
    color: #1c1500;
    font-weight: 650;
    font-size: 14px;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 7px;
  }
  .sheet .sfoot .spacer { flex: 1; }

  .pin.manual { background: #9fd8ff; }

  /*
   * 양옆 페이지 넘김 버튼
   *
   * flex 흐름 안에 두어 페이지가 가운데를 유지하게 한다 (absolute로 얹으면
   * 좁은 창에서 페이지 위를 덮어 드래그 선택을 가로챈다).
   * 세로로는 sticky로 붙여, 긴 페이지를 스크롤해도 손이 닿는 자리에 남는다.
   */
  .pageflip {
    position: sticky;
    top: 42vh;
    align-self: flex-start;
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    margin: 0 10px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: rgba(34, 50, 63, 0.78);
    color: var(--text);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    /* 수업 중에 시선을 뺏지 않도록 평소엔 흐리게 두고, 가져가면 또렷해진다 */
    opacity: 0.32;
    transition: opacity 0.15s;
  }
  .pageflip:hover { opacity: 1; }
  /* 첫/끝 쪽에서는 감추되 자리는 남긴다 — 사라지면 페이지가 좌우로 튄다 */
  .pageflip:disabled { opacity: 0; pointer-events: none; }
  .pageflip.gone { display: none; }

  @media (max-width: 820px) {
    .main { flex-direction: column; }
    .notes { width: auto; border-left: 0; border-top: 1px solid var(--rule); max-height: 46vh; }
    .stage { padding: 12px; }
  }
</style>

<div class="bar">
  <div class="mark">오려둔 <span>공책</span></div>
  <span class="ver" id="ver"></span>
  <button class="chip" id="chip" title="Claude Code 상태"><span class="dot"></span><span id="chipText">확인 중…</span></button>
  <button id="open">PDF 열기</button>
  <input type="file" id="file" accept="application/pdf" hidden />
  <button id="prev" disabled>←</button>
  <span class="pageno" id="pageno">– / –</span>
  <button id="next" disabled>→</button>
  <button id="zoomout" disabled>축소</button>
  <button id="zoomin" disabled>확대</button>
  <div class="spacer"></div>
  <label class="toggle">
    <input type="checkbox" id="auto" />
    이번 수업은 묻지 말고 자동으로 넣기
  </label>
</div>

<div class="main">
  <div class="stage" id="stage">
    <button class="pageflip gone" id="flipPrev" title="이전 쪽">←</button>
    <div class="empty" id="empty">
      <h2>강의자료를 열고 궁금한 부분에 네모를 그으세요</h2>
      <p>그은 부분이 잘려서 오른쪽에 정리로 쌓이고, 원하면 그 자리에 한 줄 메모로 붙습니다.</p>
      <button class="primary" id="open2">PDF 열기</button>
    </div>
    <button class="pageflip gone" id="flipNext" title="다음 쪽">→</button>
  </div>

  <div class="notes">
    <div class="noteshead">
      <strong>정리</strong>
      <span class="count" id="count"></span>
    </div>
    <div class="cards" id="cards">
      <div class="hint">아직 오려낸 것이 없습니다.<br />PDF 위에서 드래그해 보세요.</div>
    </div>
    <div class="cliwarn" id="cliwarn">
      <div class="why" id="cliwhy"></div>
      <div class="row">
        <button class="primary" id="cliLogin">로그인 창 열기</button>
        <button id="cliRecheck">다시 확인</button>
      </div>
    </div>
    <div class="askbar">
      <input id="q" type="text" placeholder="이 쪽에 대해 물어보기" maxlength="300" disabled />
      <button id="qsend" disabled>묻기</button>
    </div>
    <div class="foot">
      <button id="expMd" disabled>정리 내보내기</button>
      <button id="expPdf" disabled>메모 넣은 PDF</button>
    </div>
  </div>
</div>

<div class="status" id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function () {
  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  var $ = function (id) { return document.getElementById(id); };

  // 버전 표시. 실패해도 조용히 넘어간다 — 이것 때문에 앱이 안 뜨면 안 된다
  fetch("/api/version")
    .then(function (r) { return r.json(); })
    .then(function (d) { $("ver").textContent = "v" + d.version; })
    .catch(function () {});

  /*
   * Claude Code 준비 상태
   *
   * "정리를 받아오지 못했습니다"만 뜨면 사용자는 뭘 해야 할지 알 수 없다.
   * 깔려 있는지 먼저 확인해서, 아니면 무엇이 문제인지와 할 일을 같이 보여준다.
   */
  function setChip(cls, text) {
    var c = $("chip");
    c.className = "chip on " + cls;
    $("chipText").textContent = text;
  }

  function showCliWarn(msg, open) {
    $("cliwhy").innerHTML = msg;
    if (open) $("cliwarn").classList.add("on");
  }

  /*
   * 시작하자마자 확인한다.
   * 설치 여부만 보면 "깔려는 있는데 로그인 안 된" 상태가 통과해서,
   * 정작 AI를 부를 때가 되어서야 실패했다. 로그인까지 본다.
   */
  function checkCli() {
    setChip("", "확인 중…");
    return fetch("/api/status")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.mode !== "cli") {              // API 모드면 Claude Code가 필요 없다
          setChip("ready", "API 모드");
          $("cliwarn").classList.remove("on");
          return true;
        }
        var c = d.claude || {};
        if (!c.installed) {
          setChip("need", "Claude Code 설치 필요");
          showCliWarn(
            "AI 정리를 쓰려면 Claude Code가 필요합니다.<br />" +
            "터미널에서 <code>npm i -g @anthropic-ai/claude-code</code> 로 설치한 뒤, " +
            "아래 버튼으로 로그인하세요.", true);
          return false;
        }
        if (!c.loggedIn) {
          setChip("need", "Claude 로그인 필요");
          showCliWarn(
            "Claude Code는 설치돼 있는데 <b>로그인이 안 돼 있습니다.</b><br />" +
            "아래 버튼을 누르면 로그인 창이 열립니다. 마치고 “다시 확인”을 눌러 주세요.", true);
          return false;
        }
        setChip("ready", "Claude 준비됨");
        showCliWarn(
          "Claude Code에 로그인돼 있습니다" + (c.version ? " (" + c.version + ")" : "") + ".<br />" +
          "계정을 바꾸려면 아래에서 다시 로그인하세요.", false);
        $("cliwarn").classList.remove("on");
        return true;
      })
      .catch(function () {
        setChip("", "상태 확인 실패");
        return true;                          // 확인이 안 될 뿐이니 굳이 막지 않는다
      });
  }

  // 칩을 누르면 언제든 로그인 칸을 열 수 있다 — 준비된 상태에서도 계정을 바꿀 수 있어야 한다
  $("chip").onclick = function () {
    var w = $("cliwarn");
    if (w.classList.contains("on")) { w.classList.remove("on"); return; }
    w.classList.add("on");
    checkCli().then(function (ok) { if (ok) w.classList.add("on"); });
  };

  $("cliLogin").onclick = function () {
    var b = $("cliLogin");
    b.disabled = true;
    b.textContent = "여는 중…";
    fetch("/api/login", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        b.textContent = d.ok ? "터미널을 열었습니다" : "열지 못했습니다";
        if (!d.ok) {
          showCliWarn("터미널을 열지 못했습니다. 직접 터미널에서 <code>claude auth login</code> 을 실행해 주세요.", true);
        }
      })
      .catch(function () { b.textContent = "열지 못했습니다"; })
      .then(function () {
        setTimeout(function () { b.disabled = false; b.textContent = "로그인 창 열기"; }, 2500);
      });
  };

  $("cliRecheck").onclick = function () {
    $("cliRecheck").textContent = "확인 중…";
    checkCli().then(function (ok) {
      $("cliRecheck").textContent = "다시 확인";
      if (ok) setStatus("Claude Code가 준비됐습니다.");
    });
  };

  checkCli();

  var state = {
    pdf: null,
    bytes: null,          // 내보내기용 원본 사본
    docKey: null,
    docName: "",
    page: 1,
    pages: 0,
    scale: 1.25,
    userZoomed: false,      // 손으로 확대한 뒤에는 자동 맞춤이 끼어들지 않게
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    viewport: null,
    canvas: null,
    layer: null,
    cards: [],            // {id,page,img,memo,summary,detail,rect,inserted}
    openPin: null,
    renderTask: null
  };

  function setStatus(msg, isErr) {
    var el = $("status");
    el.textContent = msg || "";
    el.className = "status" + (isErr ? " err" : "");
  }

  /* ---------- 저장 ---------- */

  function hasStorage() {
    return typeof window !== "undefined" && window.storage && window.storage.get;
  }

  function indexKey() { return "capnote:" + state.docKey + ":index"; }
  function cardKey(id) { return "capnote:" + state.docKey + ":card:" + id; }

  async function saveCard(card) {
    if (!hasStorage() || !state.docKey) return;
    try {
      await window.storage.set(cardKey(card.id), JSON.stringify(card));
      await window.storage.set(
        indexKey(),
        JSON.stringify({ name: state.docName, ids: state.cards.map(function (c) { return c.id; }) })
      );
    } catch (e) { /* 저장 실패는 사용을 막지 않음 */ }
  }

  async function deleteCard(card) {
    if (!hasStorage() || !state.docKey) return;
    try {
      await window.storage.delete(cardKey(card.id));
      await window.storage.set(
        indexKey(),
        JSON.stringify({ name: state.docName, ids: state.cards.map(function (c) { return c.id; }) })
      );
    } catch (e) {}
  }

  async function loadCards() {
    state.cards = [];
    if (!hasStorage() || !state.docKey) return;
    var idx = null;
    try {
      var r = await window.storage.get(indexKey());
      idx = r ? JSON.parse(r.value) : null;
    } catch (e) { return; }
    if (!idx || !idx.ids) return;
    for (var i = 0; i < idx.ids.length; i++) {
      try {
        var c = await window.storage.get(cardKey(idx.ids[i]));
        if (c) state.cards.push(JSON.parse(c.value));
      } catch (e) {}
    }
    renderCards();
    drawPins();
  }

  /* ---------- PDF 열기 ---------- */

  $("open").onclick = $("open2").onclick = function () { $("file").click(); };

  $("file").onchange = async function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    setStatus("여는 중…");
    try {
      var buf = await f.arrayBuffer();
      state.bytes = buf.slice(0);                       // pdf.js가 원본을 가져가므로 사본 보관
      state.pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      state.pages = state.pdf.numPages;
      state.page = 1;
      state.docName = f.name.replace(/\.pdf$/i, "");
      state.docKey = (f.name + ":" + f.size).replace(/[^\w가-힣.:-]/g, "_").slice(0, 120);
      $("empty").style.display = "none";

      // 열자마자 창에 맞춘다
      state.scale = fitScale(await state.pdf.getPage(1));
      state.userZoomed = false;

      await loadCards();
      await renderPage();
      setStatus(state.docName + " · " + state.pages + "쪽");
    } catch (err) {
      setStatus("이 파일을 열지 못했습니다. 다른 PDF로 시도해 보세요.", true);
    }
    e.target.value = "";
  };

  /*
   * 창에 맞는 배율 찾기
   *
   * 배율이 1.25로 고정이라 창 크기와 상관없이 같은 크기로 그려졌다.
   * 16:9 강의 슬라이드는 옆이 남고 A4는 아래가 잘리는 식으로 매번 어긋났다.
   * 페이지 전체가 들어오도록 맞춘다 — 강의자료는 한 장을 통째로 보는 게 먼저다.
   */
  function fitScale(page) {
    var vp = page.getViewport({ scale: 1 });
    var st = $("stage");
    var cs = getComputedStyle(st);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var flips = (46 + 20) * 2;      // 양옆 넘김 버튼이 차지하는 폭
    var w = st.clientWidth - padX - flips;
    var h = st.clientHeight - padY;
    if (!(w > 0 && h > 0)) return state.scale;
    return Math.max(0.25, Math.min(3, Math.min(w / vp.width, h / vp.height)));
  }

  /* ---------- 페이지 그리기 ---------- */

  async function renderPage() {
    if (!state.pdf) return;
    var page = await state.pdf.getPage(state.page);
    var vp = page.getViewport({ scale: state.scale * state.dpr });
    state.viewport = vp;

    var wrap = document.querySelector(".pagewrap");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.className = "pagewrap";
      var cv = document.createElement("canvas");
      var ly = document.createElement("div");
      ly.className = "layer";
      wrap.appendChild(cv);
      wrap.appendChild(ly);
      $("stage").insertBefore(wrap, $("flipNext"));   // 두 넘김 버튼 사이에 놓는다
      state.canvas = cv;
      state.layer = ly;
      bindSelection(ly);
    }

    state.canvas.width = vp.width;
    state.canvas.height = vp.height;
    state.canvas.style.width = vp.width / state.dpr + "px";
    state.canvas.style.height = vp.height / state.dpr + "px";
    wrap.style.width = vp.width / state.dpr + "px";

    if (state.renderTask) { try { state.renderTask.cancel(); } catch (e) {} }
    state.renderTask = page.render({ canvasContext: state.canvas.getContext("2d"), viewport: vp });
    try { await state.renderTask.promise; } catch (e) { return; }

    $("pageno").textContent = state.page + " / " + state.pages;
    ["prev", "next", "zoomin", "zoomout", "expMd", "expPdf", "q", "qsend"].forEach(function (id) {
      $(id).disabled = false;
    });
    $("prev").disabled = state.page <= 1;
    $("next").disabled = state.page >= state.pages;

    // 양옆 버튼은 위 툴바 버튼과 같은 상태를 따른다
    ["flipPrev", "flipNext"].forEach(function (id) { $(id).classList.remove("gone"); });
    $("flipPrev").disabled = $("prev").disabled;
    $("flipNext").disabled = $("next").disabled;

    drawPins();
  }

  $("prev").onclick = $("flipPrev").onclick =
    function () { if (state.page > 1) { state.page--; closePin(); renderPage(); } };
  $("next").onclick = $("flipNext").onclick =
    function () { if (state.page < state.pages) { state.page++; closePin(); renderPage(); } };
  $("zoomin").onclick = function () {
    state.scale = Math.min(3, state.scale + 0.25); state.userZoomed = true; renderPage();
  };
  $("zoomout").onclick = function () {
    state.scale = Math.max(0.25, state.scale - 0.25); state.userZoomed = true; renderPage();
  };

  /*
   * 창 크기가 바뀌면 다시 맞춘다. 손으로 확대한 뒤에는 건드리지 않는다 —
   * 일부러 키워 놓은 걸 창 옮겼다고 되돌리면 성가시다.
   */
  var fitTimer = null;
  window.addEventListener("resize", function () {
    if (!state.pdf || state.userZoomed) return;
    clearTimeout(fitTimer);
    fitTimer = setTimeout(async function () {
      var s = fitScale(await state.pdf.getPage(state.page));
      if (Math.abs(s - state.scale) < 0.01) return;
      state.scale = s;
      closePin();
      renderPage();
    }, 150);
  });

  /* ---------- 영역 선택 ---------- */

  function bindSelection(layer) {
    var box = null, start = null;

    layer.addEventListener("pointerdown", function (e) {
      if (e.target !== layer) return;      // 핀이나 메모를 누른 경우는 제외
      closePin();
      layer.setPointerCapture(e.pointerId);
      var r = layer.getBoundingClientRect();
      start = { x: e.clientX - r.left, y: e.clientY - r.top };
      box = document.createElement("div");
      box.className = "sel";
      layer.appendChild(box);
    });

    layer.addEventListener("pointermove", function (e) {
      if (!start || !box) return;
      var r = layer.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      box.style.left = Math.min(x, start.x) + "px";
      box.style.top = Math.min(y, start.y) + "px";
      box.style.width = Math.abs(x - start.x) + "px";
      box.style.height = Math.abs(y - start.y) + "px";
    });

    function finish(e) {
      if (!start || !box) return;
      var r = layer.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      var rect = {
        x: Math.min(x, start.x), y: Math.min(y, start.y),
        w: Math.abs(x - start.x), h: Math.abs(y - start.y)
      };
      box.remove(); box = null; start = null;
      if (rect.w > 14 && rect.h > 14) capture(rect);
    }

    layer.addEventListener("pointerup", finish);
    layer.addEventListener("pointercancel", function () {
      if (box) box.remove();
      box = null; start = null;
    });

    // 직접 쓰는 메모: 빈 곳을 더블클릭하면 그 자리에 텍스트 상자가 생긴다
    layer.addEventListener("dblclick", function (e) {
      if (e.target !== layer) return;
      var r = layer.getBoundingClientRect();
      var W = state.viewport.width / state.dpr;
      var H = state.viewport.height / state.dpr;
      var card = {
        id: "n" + Date.now(),
        page: state.page,
        manual: true,
        inserted: true,
        memo: "",
        summary: "",
        rect: { x: (e.clientX - r.left) / W, y: (e.clientY - r.top) / H, w: 0, h: 0 }
      };
      state.cards.push(card);
      saveCard(card);
      drawPins();
      var pins = state.layer.querySelectorAll(".pin");
      openPin(card, pins[pins.length - 1]);
    });
  }

  /* ---------- 잘라내기 + 텍스트 뽑기 ---------- */

  function cropImage(rect, maxW) {
    var d = state.dpr;
    var sx = rect.x * d, sy = rect.y * d, sw = rect.w * d, sh = rect.h * d;
    var out = document.createElement("canvas");
    var k = Math.min(1, (maxW || 1400) / sw);
    out.width = Math.max(1, Math.round(sw * k));
    out.height = Math.max(1, Math.round(sh * k));
    var ctx = out.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(state.canvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
    return out;
  }

  async function textInRect(rect) {
    try {
      var page = await state.pdf.getPage(state.page);
      var vp = state.viewport;
      var tc = await page.getTextContent();
      var d = state.dpr;
      var out = [];
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(vp.transform, it.transform);
        var x = t[4] / d, y = t[5] / d;
        var h = Math.hypot(t[2], t[3]) / d;
        var w = (it.width || 0) * state.scale;
        var cx = x + w / 2, cy = y - h / 2;
        if (cx >= rect.x && cx <= rect.x + rect.w && cy >= rect.y && cy <= rect.y + rect.h) {
          out.push(it.str);
        }
      });
      return out.join(" ").replace(/\s+/g, " ").trim().slice(0, 2500);
    } catch (e) { return ""; }
  }

  /* ---------- Claude 호출 ---------- */

  async function callClaude(messages) {
    var res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages })
    });
    if (!res.ok) {
      // 서버가 알려준 진짜 이유를 그대로 올려보낸다.
      // 그러지 않으면 Claude Code 미설치도 그냥 "연결 실패"로만 보인다.
      var why = "";
      try { why = (await res.json()).error || ""; } catch (e) {}
      if (/ENOENT|claude CLI/.test(why)) {
        why = "Claude Code가 설치돼 있지 않습니다. 터미널에서 npm i -g @anthropic-ai/claude-code 후 claude auth login 하세요.";
      }
      // 실패했으면 준비 상태를 다시 살펴 안내를 띄운다
      if (/claude|ENOENT|찾지 못했|끝났습니다/.test(why)) checkCli();
      throw new Error(why || ("http " + res.status));
    }
    var data = await res.json();
    return (data.content || [])
      .map(function (i) { return i.type === "text" ? i.text : ""; })
      .filter(Boolean)
      .join("\n");
  }

  function recentContext() {
    return state.cards.slice(-2).map(function (c) {
      return "(" + c.page + "쪽) " + (c.memo || "");
    }).join(" / ");
  }

  async function capture(rect) {
    var full = cropImage(rect, 1400);
    var thumb = cropImage(rect, 560);
    var id = "c" + Date.now();

    var card = {
      id: id,
      page: state.page,
      img: thumb.toDataURL("image/jpeg", 0.72),
      rect: {
        x: rect.x / (state.viewport.width / state.dpr),
        y: rect.y / (state.viewport.height / state.dpr),
        w: rect.w / (state.viewport.width / state.dpr),
        h: rect.h / (state.viewport.height / state.dpr)
      },
      memo: "",
      summary: "",
      detail: "",
      inserted: false,
      pending: true
    };
    state.cards.push(card);
    renderCards();

    var text = await textInRect(rect);
    var b64 = full.toDataURL("image/jpeg", 0.85).split(",")[1];
    var ctx = recentContext();

    var prompt =
      "대학 강의자료 " + state.page + "쪽에서 오려낸 부분입니다.\n" +
      (text ? "이 영역의 원문 텍스트: " + text + "\n" : "") +
      (ctx ? "직전에 오려낸 것들: " + ctx + "\n" : "") +
      "\n한국어로 답하고, 아래 JSON만 출력하세요. 설명이나 코드블록 표시는 넣지 마세요.\n" +
      '{"memo": "PDF에 붙일 한 줄 (40자 이내, 이 부분이 뭔지 딱 알아보게)", ' +
      '"summary": "3~5줄 정리. 수업 중에 읽을 것이므로 짧고 구체적으로."}';

    try {
      var raw = await callClaude([{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } },
          { type: "text", text: prompt }
        ]
      }]);
      var clean = raw.replace(/```json|```/g, "").trim();
      var parsed;
      try { parsed = JSON.parse(clean); }
      catch (e) { parsed = { memo: clean.slice(0, 40), summary: clean }; }
      card.memo = (parsed.memo || "").slice(0, 60);
      card.summary = parsed.summary || clean;
      card.pending = false;
      setStatus("");
    } catch (err) {
      card.pending = false;
      card.summary = "정리를 받아오지 못했습니다. 카드의 다시 시도를 눌러 보세요.";
      card.failed = true;
      setStatus(String(err.message || err), true);
    }

    if ($("auto").checked && !card.failed) {
      card.inserted = true;
    }
    renderCards();
    drawPins();
    saveCard(card);
  }

  async function expand(card) {
    card.detail = "…";
    renderCards();
    try {
      card.detail = await callClaude([{
        role: "user",
        content: [{
          type: "text",
          text: "다음은 대학 강의자료 " + card.page + "쪽의 한 부분을 정리한 것입니다.\n\n" +
            card.summary +
            "\n\n이걸 처음 배우는 학생이 이해할 수 있게 한국어로 더 풀어서 설명해 주세요. " +
            "왜 그런지, 어디에 쓰이는지까지. 8줄 이내."
        }]
      }]);
    } catch (e) {
      card.detail = "더 자세한 설명을 받아오지 못했습니다.";
    }
    renderCards();
    saveCard(card);
  }

  /*
   * AI에게 직접 묻기
   *
   * 지금 보고 있는 쪽을 이미지로 같이 보낸다. 수업 중에 나오는 질문은
   * 대개 "이거 뭐야"라서, 화면을 안 보여주면 답이 겉돈다.
   * 오려내기와 달리 PDF에 붙일 자리가 없으므로 메모 제안은 하지 않는다.
   */
  async function askQuestion(text) {
    var card = {
      id: "q" + Date.now(),
      page: state.page,
      qna: true,
      question: text,
      summary: "",
      pending: true
    };
    state.cards.push(card);
    renderCards();
    $("cards").scrollTop = $("cards").scrollHeight;

    var content = [];
    try {
      // 화면 전체를 그대로 보내면 크므로 폭을 줄인다
      var shot = cropImage(
        { x: 0, y: 0, w: state.viewport.width / state.dpr, h: state.viewport.height / state.dpr },
        1100
      );
      content.push({
        type: "image",
        source: { type: "base64", media_type: "image/jpeg", data: shot.toDataURL("image/jpeg", 0.8).split(",")[1] }
      });
    } catch (e) { /* 이미지가 안 잡혀도 질문은 보낸다 */ }

    var ctx = recentContext();
    content.push({
      type: "text",
      text:
        "대학 강의자료 " + card.page + "쪽 화면입니다.\n" +
        (ctx ? "직전에 오려낸 것들: " + ctx + "\n" : "") +
        "\n학생 질문: " + text + "\n\n" +
        "한국어로, 수업 중에 읽을 것이므로 짧고 구체적으로 답하세요. 6줄 이내. " +
        "자료에 없는 내용이면 그렇다고 먼저 말하세요."
    });

    try {
      card.summary = await callClaude([{ role: "user", content: content }]);
      setStatus("");
    } catch (err) {
      card.summary = "답을 받아오지 못했습니다.";
      card.failed = true;
      setStatus(String(err.message || err), true);
    }
    card.pending = false;
    renderCards();
    saveCard(card);
  }

  function sendQuestion() {
    var el = $("q");
    var text = el.value.trim();
    if (!text || !state.pdf) return;
    el.value = "";
    askQuestion(text);
  }

  $("qsend").onclick = sendQuestion;
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sendQuestion(); }
    e.stopPropagation();      // 좌우 화살표가 페이지를 넘기지 않게
  });

  /* ---------- 카드 ---------- */

  function renderCards() {
    var box = $("cards");
    box.innerHTML = "";
    var list = state.cards.filter(function (c) { return !c.manual; });
    $("count").textContent = list.length ? list.length + "장" : "";

    if (!list.length) {
      box.innerHTML = '<div class="hint">아직 오려낸 것이 없습니다.<br />PDF 위에서 드래그해 보세요.<br />빈 곳을 두 번 누르면 직접 메모를 쓸 수 있고,<br />메모는 끌어서 옮길 수 있습니다.<br />아래 칸에 바로 물어봐도 됩니다.</div>';
      return;
    }

    list.forEach(function (card) {
      var el = document.createElement("div");
      el.className = "card" + (card.qna ? " qna" : "");

      if (!card.qna) {                      // 질문 카드는 오려낸 그림이 없다
        var img = document.createElement("img");
        img.src = card.img;
        img.alt = card.page + "쪽에서 오려낸 부분";
        el.appendChild(img);
      }

      var body = document.createElement("div");
      body.className = "cardbody";

      var meta = document.createElement("div");
      meta.className = "cardmeta";
      var pg = document.createElement("span");
      pg.textContent = card.page + "쪽" + (card.qna ? " · 질문" : "");

      var acts = document.createElement("span");
      acts.style.display = "flex";
      acts.style.gap = "6px";

      if (!card.pending && !card.failed && !card.editing && !card.qna) {
        var ed = document.createElement("button");
        ed.textContent = "고치기";

  /* ---------- 페이지 위 메모 핀 ---------- */

  function closePin() {
    var n = document.querySelector(".pinnote");
    if (n) n.remove();
    state.openPin = null;
  }

  function drawPins() {
    if (!state.layer) return;
    Array.prototype.forEach.call(state.layer.querySelectorAll(".pin"), function (p) { p.remove(); });
    closePin();

    var W = state.viewport.width / state.dpr;
    var H = state.viewport.height / state.dpr;

    state.cards.forEach(function (card) {
      if (!card.inserted || card.page !== state.page) return;
      var pin = document.createElement("div");
      pin.className = "pin" + (card.manual ? " manual" : "");
      pin.textContent = card.manual ? "쓴" : "메";
      pin.title = card.memo || "빈 메모";

      // 손으로 옮긴 자리가 있으면 그걸 쓰고, 없으면 오려낸 영역 오른쪽에 붙인다
      var left, top;
      if (card.pin) {
        left = card.pin.x * W;
        top = card.pin.y * H;
      } else {
        left = (card.rect.x + card.rect.w) * W + (card.manual ? 0 : 6);
        if (left > W - 26) left = W - 26;
        top = card.rect.y * H;
      }
      pin.style.left = left + "px";
      pin.style.top = top + "px";

      /*
       * 핀 끌어 옮기기
       *
       * 옮겨도 card.rect(오려낸 영역)는 건드리지 않고 card.pin에 따로 적는다.
       * rect를 움직이면 내보낸 PDF의 강조 네모와 카드 썸네일의 기준까지 틀어진다.
       *
       * 클릭과 드래그를 나누는 기준은 "움직였는가"다. 손이 조금 떨려도
       * 열림이 막히지 않도록 3px까지는 클릭으로 친다.
       */
      var drag = null;
      pin.addEventListener("pointerdown", function (e) {
        e.stopPropagation();        // 레이어의 영역 선택이 시작되지 않게
        pin.setPointerCapture(e.pointerId);
        var r = state.layer.getBoundingClientRect();
        drag = {
          dx: e.clientX - r.left - parseFloat(pin.style.left),
          dy: e.clientY - r.top - parseFloat(pin.style.top),
          moved: false
        };
        closePin();
      });

      pin.addEventListener("pointermove", function (e) {
        if (!drag) return;
        var r = state.layer.getBoundingClientRect();
        var x = e.clientX - r.left - drag.dx;
        var y = e.clientY - r.top - drag.dy;
        if (Math.abs(x - parseFloat(pin.style.left)) > 3 ||
            Math.abs(y - parseFloat(pin.style.top)) > 3) drag.moved = true;
        // 페이지 밖으로 나가면 다시 잡을 수 없다
        x = Math.max(0, Math.min(x, W - 26));
        y = Math.max(0, Math.min(y, H - 26));
        pin.style.left = x + "px";
        pin.style.top = y + "px";
      });

      pin.addEventListener("pointerup", function () {
        if (!drag) return;
        var wasMoved = drag.moved;
        drag = null;
        if (!wasMoved) { openPin(card, pin); return; }
        card.pin = { x: parseFloat(pin.style.left) / W, y: parseFloat(pin.style.top) / H };
        saveCard(card);
      });

      pin.addEventListener("pointercancel", function () { drag = null; });

      state.layer.appendChild(pin);
    });
  }

  function openPin(card, pin) {
    if (state.openPin === card) { closePin(); return; }
    closePin();
    state.openPin = card;

    var W = state.viewport.width / state.dpr;
    var note = document.createElement("div");
    note.className = "pinnote";
    var left = parseFloat(pin.style.left) + 26;
    if (left + 190 > W) left = Math.max(4, parseFloat(pin.style.left) - 196);
    note.style.left = left + "px";
    note.style.top = pin.style.top;

    var ta = document.createElement("textarea");
    ta.value = card.memo;
    ta.rows = 3;
    ta.setAttribute("aria-label", "메모 내용");
    note.appendChild(ta);

    var btns = document.createElement("div");
    btns.className = "pinbtns";
    var save = document.createElement("button");
    save.textContent = "저장";
    save.onclick = function () {
      card.memo = ta.value;
      saveCard(card);
      closePin();
      drawPins();
    };
    var rm = document.createElement("button");
    rm.textContent = card.manual ? "지우기" : "메모 빼기";
    rm.onclick = function () {
      if (card.manual) {
        state.cards = state.cards.filter(function (c) { return c !== card; });
        deleteCard(card);
      } else {
        card.inserted = false;
        card.declined = true;
        saveCard(card);
      }
      closePin();
      drawPins();
      renderCards();
    };
    btns.appendChild(save); btns.appendChild(rm);
    note.appendChild(btns);

    note.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    state.layer.appendChild(note);
    ta.focus();
  }

  function buildMarkdown() {
    var lines = ["# " + state.docName, ""];
    var byPage = {};
    state.cards.forEach(function (c) {
      (byPage[c.page] = byPage[c.page] || []).push(c);
    });
    Object.keys(byPage)
      .sort(function (a, b) { return a - b; })
      .forEach(function (pg) {
        lines.push("## " + pg + "쪽");
        lines.push("");
        byPage[pg].forEach(function (c) {
          if (c.manual) {
            lines.push("- (직접 쓴 메모) " + (c.memo || ""));
          } else if (c.qna) {
            lines.push("### Q. " + (c.question || ""));
            lines.push("");
            lines.push(c.summary || "");
          } else {
            lines.push("### " + (c.memo || "오려낸 부분"));
            lines.push("");
            lines.push(c.summary || "");
            if (c.detail) { lines.push(""); lines.push(c.detail); }
          }
          lines.push("");
        });
      });
    return lines.join("\n");
  }

  // 한글은 표준 PDF 폰트에 없으므로, 메모를 캔버스에 그려 이미지로 심는다
  function memoToPng(text) {
    var pad = 8, w = 230, fs = 13, lh = 18;
    var m = document.createElement("canvas").getContext("2d");
    m.font = fs + "px sans-serif";
    var words = String(text).split("");
    var lines = [], cur = "";
    words.forEach(function (ch) {
      if (m.measureText(cur + ch).width > w - pad * 2 - 6) { lines.push(cur); cur = ch; }
      else cur += ch;
    });
    if (cur) lines.push(cur);

    var h = pad * 2 + lines.length * lh;
    var cv = document.createElement("canvas");
    var s = 2;
    cv.width = w * s; cv.height = h * s;
    var c = cv.getContext("2d");
    c.scale(s, s);
    c.fillStyle = "#fff8dc";
    c.fillRect(0, 0, w, h);
    c.fillStyle = "#ffd83d";
    c.fillRect(0, 0, 3, h);
    c.fillStyle = "#241d00";
    c.font = fs + "px sans-serif";
    c.textBaseline = "top";
    lines.forEach(function (ln, i) { c.fillText(ln, pad, pad + i * lh); });
    return { dataUrl: cv.toDataURL("image/png"), w: w, h: h };
  }

  /*
   * 메모를 놓을 자리 고르기
   *
   * 예전에는 오려낸 영역 오른쪽에 붙이고, 폭이 모자라면 페이지 오른쪽 끝으로 밀었다.
   * 그런데 강의 슬라이드는 폭을 거의 다 쓰기 때문에 그 "밀기"가 곧바로 본문을 덮었다.
   * 오려낸 그림 위에 메모가 얹히면 무엇을 오렸는지 안 보여서 앞뒤가 바뀐다.
   *
   * 피할 것을 두 등급으로 나눈다.
   *   hard — 오려낸 영역과 이미 놓은 메모. 이건 덮으면 안 된다
   *   soft — 본문 글자. 되도록 피하되, 빽빽한 슬라이드에서는 어쩔 수 없을 수 있다
   * 가중치를 다르게 줘서, 정 자리가 없으면 글자를 조금 가리더라도
   * 오려낸 그림만은 지키는 쪽으로 고른다.
   */
  var MEMO_GAP = 6, MEMO_MARGIN = 4;

  function overlapArea(a, b) {
    var dx = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    var dy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    return dx > 0 && dy > 0 ? dx * dy : 0;
  }

  /*
   * 본문 글자 상자들을 PDF 좌표(왼쪽 아래 원점, 포인트 단위)로 모은다.
   * 내보내기는 pdf-lib가 하지만 글자 위치는 이미 열려 있는 pdf.js 쪽이 알고 있다.
   */
  async function textBoxes(pageNo) {
    try {
      var page = await state.pdf.getPage(pageNo);
      var vp = page.getViewport({ scale: 1 });        // 뷰포트 배율 1 = PDF 포인트
      var tc = await page.getTextContent();
      var out = [];
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(t[2], t[3]) || 10;
        var w = it.width || 0;
        if (w > 0) out.push({ x: t[4], y: vp.height - t[5], w: w, h: h });
      });
      return out;
    } catch (e) {
      return [];        // 글자를 못 읽어도 배치는 계속돼야 한다
    }
  }

  // 좌표는 PDF 기준(왼쪽 아래가 원점)이다
  function placeMemo(sel, mw, mh, pw, ph, hard, soft) {
    var g = MEMO_GAP, m = MEMO_MARGIN, i;

    function fit(x, y) {
      return {
        x: Math.max(m, Math.min(x, pw - mw - m)),
        y: Math.max(m, Math.min(y, ph - mh - m)),
        w: mw, h: mh
      };
    }

    function score(c) {
      var v = 0;
      for (i = 0; i < hard.length; i++) v += overlapArea(c, hard[i]) * 100;
      for (i = 0; i < soft.length; i++) v += overlapArea(c, soft[i]);
      return v;
    }

    // 먼저 오려낸 영역 바로 옆의 보기 좋은 자리부터 본다
    var spots = [
      fit(sel.x + sel.w + g, sel.y + sel.h - mh),   // 오른쪽 (위 맞춤)
      fit(sel.x - g - mw,    sel.y + sel.h - mh),   // 왼쪽
      fit(sel.x,             sel.y - g - mh),       // 아래
      fit(sel.x,             sel.y + sel.h + g)     // 위
    ];
    var best = null, bestScore = Infinity;
    for (var k = 0; k < spots.length; k++) {
      var sc = score(spots[k]);
      if (sc === 0) return spots[k];
      if (sc < bestScore) { bestScore = sc; best = spots[k]; }
    }

    /*
     * 네 자리가 다 막혔으면 페이지를 훑어 가장 가까운 빈자리를 찾는다.
     * 강의 슬라이드는 여백이 넉넉한 편이라 보통 여기서 걸린다.
     */
    var cx = sel.x + sel.w / 2, cy = sel.y + sel.h / 2;
    var step = 12, nearD = Infinity, near = null;
    for (var y = m; y <= ph - mh - m; y += step) {
      for (var x = m; x <= pw - mw - m; x += step) {
        var c = { x: x, y: y, w: mw, h: mh };
        var v = score(c);
        if (v < bestScore) { bestScore = v; best = c; }
        if (v !== 0) continue;
        var d = (x + mw / 2 - cx) * (x + mw / 2 - cx) + (y + mh / 2 - cy) * (y + mh / 2 - cy);
        if (d < nearD) { nearD = d; near = c; }
      }
    }
    return near || best;   // 정말 빈자리가 없으면 가장 덜 가리는 자리
  }

  $("expPdf").onclick = async function () {
    var inserted = state.cards.filter(function (c) { return c.inserted; });
    if (!inserted.length) { setStatus("PDF에 붙인 메모가 아직 없습니다."); return; }
    setStatus("메모를 넣는 중…");
    try {
      var doc = await PDFLib.PDFDocument.load(state.bytes.slice(0));

      // 쪽마다 "이미 찬 자리"를 들고 다닌다. 메모끼리 겹치는 것도 막아야 하기 때문이다
      var takenByPage = {};
      var textByPage = {};      // 본문 글자 상자는 쪽마다 한 번만 읽는다

      // 오려낸 영역은 전부 미리 피할 대상으로 잡는다.
      // 2번 메모가 1번이 오려낸 그림을 덮으면 안 된다
      var selByPage = {};
      inserted.forEach(function (c) {
        var pg0 = doc.getPage(c.page - 1);
        var w0 = pg0.getWidth(), h0 = pg0.getHeight();
        (selByPage[c.page] = selByPage[c.page] || []).push({
          x: c.rect.x * w0,
          y: h0 - (c.rect.y + c.rect.h) * h0,
          w: c.rect.w * w0,
          h: c.rect.h * h0
        });
      });

      for (var i = 0; i < inserted.length; i++) {
        var card = inserted[i];
        var pg = doc.getPage(card.page - 1);
        var pw = pg.getWidth(), ph = pg.getHeight();

        var sel = {
          x: card.rect.x * pw,
          y: ph - (card.rect.y + card.rect.h) * ph,
          w: card.rect.w * pw,
          h: card.rect.h * ph
        };

        pg.drawRectangle({
          x: sel.x, y: sel.y, width: sel.w, height: sel.h,
          borderColor: PDFLib.rgb(1, 0.85, 0.24),
          borderWidth: 1.5,
          opacity: 0
        });

        var memo = memoToPng(card.memo || card.summary);
        var png = await doc.embedPng(memo.dataUrl);

        var taken = takenByPage[card.page] = takenByPage[card.page] || [];
        if (!(card.page in textByPage)) textByPage[card.page] = await textBoxes(card.page);

        var at;
        if (card.pin) {
          /*
           * 손으로 옮긴 자리가 있으면 자동 배치보다 그쪽을 따른다.
           * 일부러 옮겼는데 내보낼 때 딴 데로 가면 그게 더 당황스럽다.
           * 페이지 밖으로만 안 나가게 잡아준다.
           */
          var m = MEMO_MARGIN;
          at = {
            x: Math.max(m, Math.min(card.pin.x * pw, pw - memo.w - m)),
            y: Math.max(m, Math.min(ph - card.pin.y * ph - memo.h, ph - memo.h - m))
          };
        } else {
          var hard = (selByPage[card.page] || []).concat(taken);
          at = placeMemo(sel, memo.w, memo.h, pw, ph, hard, textByPage[card.page]);
        }

        pg.drawImage(png, { x: at.x, y: at.y, width: memo.w, height: memo.h });
        taken.push({ x: at.x, y: at.y, w: memo.w, h: memo.h });
      }
      var out = await doc.save();
      showExport("메모 넣은 PDF", {
        note: "메모 " + inserted.length + "개를 넣었습니다. 아래 버튼으로 내려받아 굿노트 등에서 이어 쓰세요.",
        blob: new Blob([out], { type: "application/pdf" }),
        filename: state.docName + " 메모.pdf"
      });
      setStatus("");
    } catch (e) {
      setStatus("PDF를 만들지 못했습니다. 다른 파일로 시도해 보세요.", true);
    }
  };

  document.addEventListener("keydown", function (e) {
    if (!state.pdf) return;
    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "Escape") closePin();
  });
})();
</script>

</body>
</html>
