<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오려둔 공책</title>
<script src="storage.js"></script>
</head>
<body>
<div id="root">
<style>
  :root {
    --ink: #141d27;
    --ink-2: #1b2836;
    --ink-3: #22323f;
    --rule: #2f4457;
    --paper: #ffffff;
    --text: #dfe8f0;
    --muted: #8ba0b4;
    --marker: #ffd83d;
    --marker-soft: rgba(255, 216, 61, 0.22);
    --danger: #ff8b6b;
  }

  * { box-sizing: border-box; }

  #root {
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 15px;
    line-height: 1.6;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--ink-2);
    flex-wrap: wrap;
  }

  .mark {
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-right: 4px;
    font-size: 15px;
  }
  .mark span { color: var(--marker); }
  /* 어느 빌드를 보고 있는지 한눈에 — 설치파일 이름만으로는 구분이 안 된다 */
  .ver {
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-left: -2px;
    align-self: center;
  }

  button {
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--marker); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }

  .primary {
    background: var(--marker);
    color: #1c1500;
    border-color: var(--marker);
    font-weight: 650;
  }

  .pageno {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    min-width: 74px;
    text-align: center;
    font-size: 14px;
  }

  .spacer { flex: 1; }

  .toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .toggle input { accent-color: var(--marker); width: 15px; height: 15px; }

  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .stage {
    flex: 1;
    overflow: auto;
    padding: 20px;
    display: flex;
    justify-content: center;
    /*
     * safe를 붙이는 이유: 그냥 center면 페이지가 화면보다 클 때
     * 위쪽이 잘려 나가고 스크롤로도 못 올라간다.
     * safe는 넘칠 때만 자동으로 시작 정렬로 돌아간다.
     */
    align-items: safe center;
    min-width: 0;
  }

  .empty {
    margin: auto;
    text-align: center;
    max-width: 380px;
    color: var(--muted);
  }
  .empty h2 {
    color: var(--text);
    font-size: 19px;
    font-weight: 650;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .empty p { margin: 0 0 18px; font-size: 14px; }

  .pagewrap {
    position: relative;
    background: var(--paper);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    line-height: 0;
  }
  canvas { display: block; }

  .layer {
    position: absolute;
    inset: 0;
    cursor: crosshair;
    touch-action: none;
  }

  .sel {
    position: absolute;
    border: 2px solid var(--marker);
    background: var(--marker-soft);
    pointer-events: none;
  }

  /*
   * 화면의 메모 = 내보낸 PDF의 메모
   *
   * 예전에는 화면엔 21px 핀을, PDF엔 230pt 상자를 그렸다. 서로 다른 물건이라
   * "넣을 때 본 자리"가 내보내면 의미가 없었다. 이제 치수를 PDF 포인트로 한 번만
   * 정하고, 화면은 그걸 배율만 맞춰 그린다. 크기·줄바꿈·자리가 같아진다.
   */
  .memo {
    position: absolute;
    box-sizing: border-box;
    background: #fff8dc;
    color: #241d00;
    border-left-style: solid;
    border-left-color: var(--marker);
    font-family: sans-serif;
    cursor: grab;
    overflow: hidden;
    z-index: 4;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
  }
  .memo.manual { border-left-color: #4aa3e0; }
  .memo:hover { outline: 1px solid var(--marker); }
  .memo.editing { cursor: default; overflow: visible; z-index: 8; }
  .memo .mline { white-space: pre; }
  .memo textarea {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    border: 0;
    background: #fffdf2;
    color: inherit;
    font: inherit;
    padding: inherit;
    resize: none;
    outline: none;
  }
  .memoacts {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 5px;
    display: flex;
    gap: 6px;
    white-space: nowrap;
  }
  .memoacts button { font-size: 12px; padding: 4px 9px; border-radius: 5px; }

  .notes {
    width: 350px;
    flex-shrink: 0;
    border-left: 1px solid var(--rule);
    background: var(--ink-2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .noteshead {
    padding: 12px 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .noteshead strong { font-size: 14px; font-weight: 650; }
  .noteshead .count { color: var(--muted); font-size: 13px; }

  .cards { flex: 1; overflow-y: auto; padding: 12px; }

  .hint {
    color: var(--muted);
    font-size: 13px;
    padding: 22px 8px;
    text-align: center;
    line-height: 1.7;
  }

  .card {
    background: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 9px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .card img {
    width: 100%;
    display: block;
    background: #fff;
    border-bottom: 1px solid var(--rule);
  }
  .cardbody { padding: 10px 12px 12px; }
  .cardmeta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cardmeta button {
    padding: 2px 7px;
    font-size: 11px;
    border-radius: 5px;
    color: var(--muted);
  }
  .cardtext { font-size: 14px; white-space: pre-wrap; }
  .cardtext.loading { color: var(--muted); }

  .cardedit label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 4px;
  }
  .cardedit input,
  .cardedit textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 9px;
    resize: vertical;
  }
  .cardedit input:focus,
  .cardedit textarea:focus { outline: none; border-color: var(--marker); }
  .cardedit .editbtns { display: flex; gap: 8px; margin-top: 10px; }
  .cardedit .editbtns button { padding: 5px 14px; font-size: 13px; }

  .ask {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-size: 13px;
    color: var(--muted);
  }
  .askrow { display: flex; gap: 8px; margin-top: 7px; }
  .askrow button { padding: 5px 14px; font-size: 13px; }

  .done {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px dashed var(--rule);
    font-size: 12px;
    color: var(--marker);
  }

  .more { margin-top: 9px; }
  .more button { font-size: 13px; padding: 5px 11px; }

  /*
   * Claude 상태 칩 — 늘 보인다.
   * 예전에는 AI를 부르다 실패해야만 안내가 떴다. 그때는 이미 늦다.
   */
  .chip {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: var(--ink-2);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { display: inline-flex; }
  .chip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .chip.ready { color: var(--muted); }
  .chip.ready .dot { background: #57c98a; }
  .chip.need { color: var(--marker); border-color: rgba(255,216,61,0.45); }
  .chip.need .dot { background: var(--marker); }
  .chip:hover { border-color: var(--marker); }

  /* Claude Code가 준비 안 됐을 때만 뜨는 띠 */
  .cliwarn {
    display: none;
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    background: rgba(255, 139, 107, 0.10);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text);
  }
  .cliwarn.on { display: block; }
  .cliwarn .why { color: var(--muted); margin-bottom: 8px; }
  .cliwarn .row { display: flex; gap: 8px; }
  .cliwarn button { font-size: 12px; padding: 6px 10px; }
  .cliwarn code {
    background: var(--ink);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11.5px;
  }

  /* 질문 입력칸 — 내보내기 버튼 위, 카드 목록 바로 아래 */
  .askbar {
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 8px;
  }
  .askbar input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 8px 10px;
  }
  .askbar input:focus { outline: none; border-color: var(--marker); }
  .askbar button { font-size: 13px; padding: 8px 12px; }

  /* 질문 카드는 오려낸 카드와 구분되게 왼쪽에 띠를 둔다 */
  .card.qna { border-left: 3px solid var(--marker); }
  .qtext {
    font-size: 13px;
    color: var(--marker);
    margin-bottom: 8px;
    line-height: 1.5;
  }

  /* 질문 범위 토글 — 이 쪽 / 전체 */
  /* 오려낸 뒤 무엇을 시킬지 고르는 칸 */
  .pick { padding-top: 2px; }
  .picktitle { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .pickrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .pickrow button { font-size: 12px; padding: 5px 10px; border-radius: 6px; }
  .pickfree { display: flex; gap: 6px; }
  .pickfree input {
    flex: 1; min-width: 0; font: inherit; font-size: 12.5px;
    color: var(--text); background: var(--ink);
    border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px;
  }
  .pickfree input:focus { outline: none; border-color: var(--marker); }
  .pickfree button { font-size: 12px; padding: 6px 10px; }
  .modetag { color: var(--marker); font-size: 11.5px; }

  .scope {
    font-size: 11.5px;
    padding: 6px 8px;
    border-radius: 7px;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .scope.all { color: var(--marker); border-color: rgba(255, 216, 61, 0.5); }

  /* 답에서 쪽 번호를 뽑아 만든 이동 버튼 */
  .jump { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .jump button { font-size: 11.5px; padding: 3px 9px; border-radius: 5px; }

  .foot select {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 6px;
    flex: 0 0 auto;
  }

  .foot {
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 8px;
  }
  .foot button { flex: 1; font-size: 13px; padding: 8px; }

  .status {
    padding: 6px 14px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--rule);
    background: var(--ink-2);
    min-height: 31px;
  }
  .status.err { color: var(--danger); }

  .veil {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 17, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .sheet {
    background: var(--ink-2);
    border: 1px solid var(--rule);
    border-radius: 12px;
    width: min(620px, 100%);
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet h3 {
    margin: 0;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 650;
    border-bottom: 1px solid var(--rule);
  }
  .sheet .sbody { padding: 14px 16px; overflow: auto; }
  .sheet textarea {
    width: 100%;
    height: 300px;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
  }
  .sheet .note { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .sheet .sfoot {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--rule);
    align-items: center;
  }
  .dl {
    display: inline-block;
    background: var(--marker);
    color: #1c1500;
    font-weight: 650;
    font-size: 14px;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 7px;
  }
  .sheet .sfoot .spacer { flex: 1; }

  .pageflip {
    position: sticky;
    top: 42vh;
    align-self: flex-start;
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    margin: 0 10px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: rgba(34, 50, 63, 0.78);
    color: var(--text);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    /* 수업 중에 시선을 뺏지 않도록 평소엔 흐리게 두고, 가져가면 또렷해진다 */
    opacity: 0.32;
    transition: opacity 0.15s;
  }
  .pageflip:hover { opacity: 1; }
  /* 첫/끝 쪽에서는 감추되 자리는 남긴다 — 사라지면 페이지가 좌우로 튄다 */
  .pageflip:disabled { opacity: 0; pointer-events: none; }
  .pageflip.gone { display: none; }


  @media (max-width: 820px) {
    .main { flex-direction: column; }
    .notes { width: auto; border-left: 0; border-top: 1px solid var(--rule); max-height: 46vh; }
    .stage { padding: 12px; }
  }
</style>

<div class="bar">
  <div class="mark">오려둔 <span>공책</span></div>
  <span class="ver" id="ver"></span>
  <button class="chip" id="chip" title="Claude Code 상태"><span class="dot"></span><span id="chipText">확인 중…</span></button>
  <button id="open">PDF 열기</button>
  <input type="file" id="file" accept="application/pdf" hidden />
  <button id="prev" disabled>←</button>
  <span class="pageno" id="pageno">– / –</span>
  <button id="next" disabled>→</button>
  <button id="zoomout" disabled>축소</button>
  <button id="zoomin" disabled>확대</button>
  <div class="spacer"></div>
  <label class="toggle">
    <input type="checkbox" id="auto" />
    이번 수업은 묻지 말고 자동으로 넣기
  </label>
</div>

<div class="main">
  <div class="stage" id="stage">
    <button class="pageflip gone" id="flipPrev" title="이전 쪽">←</button>
    <div class="empty" id="empty">
      <h2>강의자료를 열고 궁금한 부분에 네모를 그으세요</h2>
      <p>그은 부분이 잘려서 오른쪽에 정리로 쌓이고, 원하면 그 자리에 한 줄 메모로 붙습니다.</p>
      <button class="primary" id="open2">PDF 열기</button>
    </div>
    <button class="pageflip gone" id="flipNext" title="다음 쪽">→</button>
  </div>

  <div class="notes">
    <div class="noteshead">
      <strong>정리</strong>
      <span class="count" id="count"></span>
    </div>
    <div class="cards" id="cards">
      <div class="hint">아직 오려낸 것이 없습니다.<br />PDF 위에서 드래그해 보세요.</div>
    </div>
    <div class="cliwarn" id="cliwarn">
      <div class="why" id="cliwhy"></div>
      <div class="row">
        <button class="primary" id="cliLogin">로그인 창 열기</button>
        <button id="cliRecheck">다시 확인</button>
      </div>
    </div>
    <div class="askbar">
      <button class="scope" id="qscope" title="질문 범위를 바꿉니다" disabled>이 쪽</button>
      <input id="q" type="text" placeholder="이 쪽에 대해 물어보기" maxlength="300" disabled />
      <button id="qsend" disabled>묻기</button>
    </div>
    <div class="foot">
      <button id="expMd" disabled>정리 내보내기</button>
      <select id="expScope" disabled title="어느 쪽을 내보낼지">
        <option value="memo">메모 있는 쪽만</option>
        <option value="all">전체 쪽</option>
        <option value="page">이 쪽만</option>
      </select>
      <button id="expPdf" disabled>메모 넣은 PDF</button>
    </div>
  </div>
</div>

<div class="status" id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function () {
  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  var $ = function (id) { return document.getElementById(id); };

  // 버전 표시. 실패해도 조용히 넘어간다 — 이것 때문에 앱이 안 뜨면 안 된다
  fetch("/api/version")
    .then(function (r) { return r.json(); })
    .then(function (d) { $("ver").textContent = "v" + d.version; })
    .catch(function () {});

  /*
   * Claude Code 준비 상태
   *
   * "정리를 받아오지 못했습니다"만 뜨면 사용자는 뭘 해야 할지 알 수 없다.
   * 깔려 있는지 먼저 확인해서, 아니면 무엇이 문제인지와 할 일을 같이 보여준다.
   */
  function setChip(cls, text) {
    var c = $("chip");
    c.className = "chip on " + cls;
    $("chipText").textContent = text;
  }

  function showCliWarn(msg, open) {
    $("cliwhy").innerHTML = msg;
    if (open) $("cliwarn").classList.add("on");
  }

  /*
   * 시작하자마자 확인한다.
   * 설치 여부만 보면 "깔려는 있는데 로그인 안 된" 상태가 통과해서,
   * 정작 AI를 부를 때가 되어서야 실패했다. 로그인까지 본다.
   */
  function checkCli() {
    setChip("", "확인 중…");
    return fetch("/api/status")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.mode !== "cli") {              // API 모드면 Claude Code가 필요 없다
          setChip("ready", "API 모드");
          $("cliwarn").classList.remove("on");
          return true;
        }
        var c = d.claude || {};
        if (!c.installed) {
          setChip("need", "Claude Code 설치 필요");
          showCliWarn(
            "AI 정리를 쓰려면 Claude Code가 필요합니다.<br />" +
            "터미널에서 <code>npm i -g @anthropic-ai/claude-code</code> 로 설치한 뒤, " +
            "아래 버튼으로 로그인하세요.", true);
          return false;
        }
        if (!c.loggedIn) {
          setChip("need", "Claude 로그인 필요");
          showCliWarn(
            "Claude Code는 설치돼 있는데 <b>로그인이 안 돼 있습니다.</b><br />" +
            "아래 버튼을 누르면 로그인 창이 열립니다. 마치고 “다시 확인”을 눌러 주세요.", true);
          return false;
        }
        setChip("ready", "Claude 준비됨");
        showCliWarn(
          "Claude Code에 로그인돼 있습니다" + (c.version ? " (" + c.version + ")" : "") + ".<br />" +
          "계정을 바꾸려면 아래에서 다시 로그인하세요.", false);
        $("cliwarn").classList.remove("on");
        return true;
      })
      .catch(function () {
        setChip("", "상태 확인 실패");
        return true;                          // 확인이 안 될 뿐이니 굳이 막지 않는다
      });
  }

  // 칩을 누르면 언제든 로그인 칸을 열 수 있다 — 준비된 상태에서도 계정을 바꿀 수 있어야 한다
  $("chip").onclick = function () {
    var w = $("cliwarn");
    if (w.classList.contains("on")) { w.classList.remove("on"); return; }
    w.classList.add("on");
    checkCli().then(function (ok) { if (ok) w.classList.add("on"); });
  };

  $("cliLogin").onclick = function () {
    var b = $("cliLogin");
    b.disabled = true;
    b.textContent = "여는 중…";
    fetch("/api/login", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        b.textContent = d.ok ? "터미널을 열었습니다" : "열지 못했습니다";
        if (!d.ok) {
          showCliWarn("터미널을 열지 못했습니다. 직접 터미널에서 <code>claude auth login</code> 을 실행해 주세요.", true);
        }
      })
      .catch(function () { b.textContent = "열지 못했습니다"; })
      .then(function () {
        setTimeout(function () { b.disabled = false; b.textContent = "로그인 창 열기"; }, 2500);
      });
  };

  $("cliRecheck").onclick = function () {
    $("cliRecheck").textContent = "확인 중…";
    checkCli().then(function (ok) {
      $("cliRecheck").textContent = "다시 확인";
      if (ok) setStatus("Claude Code가 준비됐습니다.");
    });
  };

  checkCli();

  var state = {
    pdf: null,
    bytes: null,          // 내보내기용 원본 사본
    docKey: null,
    docName: "",
    page: 1,
    pages: 0,
    scale: 1.25,
    userZoomed: false,      // 손으로 확대한 뒤에는 자동 맞춤이 끼어들지 않게
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    viewport: null,
    pageW: 0,               // 쪽 크기(PDF 포인트). 메모를 같은 치수로 그리려면 필요하다
    pageH: 0,
    canvas: null,
    layer: null,
    cards: [],            // {id,page,img,memo,summary,detail,rect,inserted}
    openPin: null,
    renderTask: null
  };

  function setStatus(msg, isErr) {
    var el = $("status");
    el.textContent = msg || "";
    el.className = "status" + (isErr ? " err" : "");
  }

  /* ---------- 저장 ---------- */

  function hasStorage() {
    return typeof window !== "undefined" && window.storage && window.storage.get;
  }

  function indexKey() { return "capnote:" + state.docKey + ":index"; }
  function cardKey(id) { return "capnote:" + state.docKey + ":card:" + id; }

  async function saveCard(card) {
    if (!hasStorage() || !state.docKey) return;
    try {
      await window.storage.set(cardKey(card.id), JSON.stringify(card));
      await window.storage.set(
        indexKey(),
        JSON.stringify({ name: state.docName, ids: state.cards.map(function (c) { return c.id; }) })
      );
    } catch (e) { /* 저장 실패는 사용을 막지 않음 */ }
  }

  async function deleteCard(card) {
    if (!hasStorage() || !state.docKey) return;
    try {
      await window.storage.delete(cardKey(card.id));
      await window.storage.set(
        indexKey(),
        JSON.stringify({ name: state.docName, ids: state.cards.map(function (c) { return c.id; }) })
      );
    } catch (e) {}
  }

  async function loadCards() {
    state.cards = [];
    if (!hasStorage() || !state.docKey) return;
    var idx = null;
    try {
      var r = await window.storage.get(indexKey());
      idx = r ? JSON.parse(r.value) : null;
    } catch (e) { return; }
    if (!idx || !idx.ids) return;
    for (var i = 0; i < idx.ids.length; i++) {
      try {
        var c = await window.storage.get(cardKey(idx.ids[i]));
        if (c) state.cards.push(JSON.parse(c.value));
      } catch (e) {}
    }
    renderCards();
    drawMemos();
  }

  /* ---------- PDF 열기 ---------- */

  $("open").onclick = $("open2").onclick = function () { $("file").click(); };

  $("file").onchange = async function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    setStatus("여는 중…");
    try {
      var buf = await f.arrayBuffer();
      state.bytes = buf.slice(0);                       // pdf.js가 원본을 가져가므로 사본 보관
      state.pdf = await pdfjsLib.getDocument({ data: buf }).promise;

      /*
       * 우리가 내보낸 PDF라면 메모를 되살린다.
       *
       * 메모 주석은 벗겨내고 다시 읽는다. 안 벗기면 주석이 그려진 그림 위에
       * 우리 메모 상자가 또 얹혀 두 겹으로 보이고, 다시 내보낼 때도 지저분해진다.
       * 벗겨낸 바이트를 원본 삼아 두므로 이후 흐름은 처음 여는 것과 같다.
       */
      var carried = await readCardsFromPdf(state.pdf);
      if (carried) {
        var cleaned = await stripMemoAnnots(state.bytes);
        if (cleaned) {
          state.bytes = cleaned.slice(0);
          state.pdf = await pdfjsLib.getDocument({ data: cleaned }).promise;
        }
      }

      state.pages = state.pdf.numPages;
      state.page = 1;
      state.docName = f.name.replace(/\.pdf$/i, "");
      state.docKey = (f.name + ":" + f.size).replace(/[^\w가-힣.:-]/g, "_").slice(0, 120);
      $("empty").style.display = "none";
      _textCache = {};

      // 열자마자 창에 맞춘다
      state.scale = fitScale(await state.pdf.getPage(1));
      state.userZoomed = false;

      await loadCards();
      if (carried && !state.cards.length) {
        state.cards = carried;
        state.cards.forEach(function (c) { saveCard(c); });
        setStatus("이 PDF에 들어 있던 메모 " + carried.length + "개를 불러왔습니다.");
      }
      await renderPage();
      setStatus(state.docName + " · " + state.pages + "쪽");
    } catch (err) {
      setStatus("이 파일을 열지 못했습니다. 다른 PDF로 시도해 보세요.", true);
    }
    e.target.value = "";
  };

  /*
   * 창에 맞는 배율 찾기
   *
   * 배율이 1.25로 고정이라 창 크기와 상관없이 같은 크기로 그려졌다.
   * 16:9 강의 슬라이드는 옆이 남고 A4는 아래가 잘리는 식으로 매번 어긋났다.
   * 페이지 전체가 들어오도록 맞춘다 — 강의자료는 한 장을 통째로 보는 게 먼저다.
   */
  function fitScale(page) {
    var vp = page.getViewport({ scale: 1 });
    var st = $("stage");
    var cs = getComputedStyle(st);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var flips = (46 + 20) * 2;      // 양옆 넘김 버튼이 차지하는 폭
    var w = st.clientWidth - padX - flips;
    var h = st.clientHeight - padY;
    if (!(w > 0 && h > 0)) return state.scale;
    return Math.max(0.25, Math.min(3, Math.min(w / vp.width, h / vp.height)));
  }

  /* ---------- 페이지 그리기 ---------- */

  async function renderPage() {
    if (!state.pdf) return;
    var page = await state.pdf.getPage(state.page);
    var vp = page.getViewport({ scale: state.scale * state.dpr });
    state.viewport = vp;

    var vp1 = page.getViewport({ scale: 1 });     // 포인트 단위 쪽 크기
    state.pageW = vp1.width;
    state.pageH = vp1.height;

    var wrap = document.querySelector(".pagewrap");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.className = "pagewrap";
      var cv = document.createElement("canvas");
      var ly = document.createElement("div");
      ly.className = "layer";
      wrap.appendChild(cv);
      wrap.appendChild(ly);
      $("stage").insertBefore(wrap, $("flipNext"));   // 두 넘김 버튼 사이에 놓는다
      state.canvas = cv;
      state.layer = ly;
      bindSelection(ly);
    }

    state.canvas.width = vp.width;
    state.canvas.height = vp.height;
    state.canvas.style.width = vp.width / state.dpr + "px";
    state.canvas.style.height = vp.height / state.dpr + "px";
    wrap.style.width = vp.width / state.dpr + "px";

    if (state.renderTask) { try { state.renderTask.cancel(); } catch (e) {} }
    state.renderTask = page.render({ canvasContext: state.canvas.getContext("2d"), viewport: vp });
    try { await state.renderTask.promise; } catch (e) { return; }

    $("pageno").textContent = state.page + " / " + state.pages;
    ["prev", "next", "zoomin", "zoomout", "expMd", "expPdf", "q", "qsend", "qscope", "expScope"].forEach(function (id) {
      $(id).disabled = false;
    });
    $("prev").disabled = state.page <= 1;
    $("next").disabled = state.page >= state.pages;

    // 양옆 버튼은 위 툴바 버튼과 같은 상태를 따른다
    ["flipPrev", "flipNext"].forEach(function (id) { $(id).classList.remove("gone"); });
    $("flipPrev").disabled = $("prev").disabled;
    $("flipNext").disabled = $("next").disabled;

    drawMemos();
    refillThumbs();
  }

  /*
   * 되살린 카드에는 썸네일이 없다 (파일을 가볍게 하려고 안 심었다).
   * 지금 그린 쪽에 해당하는 것만 다시 잘라 채운다.
   */
  function refillThumbs() {
    var changed = false;
    state.cards.forEach(function (c) {
      if (c.img || c.qna || c.manual || c.page !== state.page) return;
      if (!c.rect || !(c.rect.w > 0)) return;
      var W = state.viewport.width / state.dpr, H = state.viewport.height / state.dpr;
      try {
        c.img = cropImage({ x: c.rect.x * W, y: c.rect.y * H, w: c.rect.w * W, h: c.rect.h * H }, 560)
                  .toDataURL("image/jpeg", 0.72);
        changed = true;
      } catch (e) {}
    });
    if (changed) renderCards();
  }

  $("prev").onclick = $("flipPrev").onclick =
    function () { if (state.page > 1) { state.page--; closeMemoEdit(); renderPage(); } };
  $("next").onclick = $("flipNext").onclick =
    function () { if (state.page < state.pages) { state.page++; closeMemoEdit(); renderPage(); } };
  $("zoomin").onclick = function () {
    state.scale = Math.min(3, state.scale + 0.25); state.userZoomed = true; renderPage();
  };
  $("zoomout").onclick = function () {
    state.scale = Math.max(0.25, state.scale - 0.25); state.userZoomed = true; renderPage();
  };

  /*
   * 창 크기가 바뀌면 다시 맞춘다. 손으로 확대한 뒤에는 건드리지 않는다 —
   * 일부러 키워 놓은 걸 창 옮겼다고 되돌리면 성가시다.
   */
  var fitTimer = null;
  window.addEventListener("resize", function () {
    if (!state.pdf || state.userZoomed) return;
    clearTimeout(fitTimer);
    fitTimer = setTimeout(async function () {
      var s = fitScale(await state.pdf.getPage(state.page));
      if (Math.abs(s - state.scale) < 0.01) return;
      state.scale = s;
      closeMemoEdit();
      renderPage();
    }, 150);
  });

  /* ---------- 영역 선택 ---------- */

  function bindSelection(layer) {
    var box = null, start = null;

    layer.addEventListener("pointerdown", function (e) {
      if (e.target !== layer) return;      // 핀이나 메모를 누른 경우는 제외
      closeMemoEdit();
      layer.setPointerCapture(e.pointerId);
      var r = layer.getBoundingClientRect();
      start = { x: e.clientX - r.left, y: e.clientY - r.top };
      box = document.createElement("div");
      box.className = "sel";
      layer.appendChild(box);
    });

    layer.addEventListener("pointermove", function (e) {
      if (!start || !box) return;
      var r = layer.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      box.style.left = Math.min(x, start.x) + "px";
      box.style.top = Math.min(y, start.y) + "px";
      box.style.width = Math.abs(x - start.x) + "px";
      box.style.height = Math.abs(y - start.y) + "px";
    });

    function finish(e) {
      if (!start || !box) return;
      var r = layer.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      var rect = {
        x: Math.min(x, start.x), y: Math.min(y, start.y),
        w: Math.abs(x - start.x), h: Math.abs(y - start.y)
      };
      box.remove(); box = null; start = null;
      if (rect.w > 14 && rect.h > 14) capture(rect);
    }

    layer.addEventListener("pointerup", finish);
    layer.addEventListener("pointercancel", function () {
      if (box) box.remove();
      box = null; start = null;
    });

    // 직접 쓰는 메모: 빈 곳을 더블클릭하면 그 자리에 생기고 바로 고칠 수 있다
    layer.addEventListener("dblclick", function (e) {
      if (e.target !== layer) return;
      var r = layer.getBoundingClientRect();
      var W = state.viewport.width / state.dpr;
      var H = state.viewport.height / state.dpr;
      var at = { x: (e.clientX - r.left) / W, y: (e.clientY - r.top) / H };
      var card = {
        id: "n" + Date.now(),
        page: state.page,
        manual: true,
        inserted: true,
        memo: "",
        summary: "",
        rect: { x: at.x, y: at.y, w: 0, h: 0 },
        pin: at            // 누른 자리가 곧 의도다. 자동 배치를 끼워 넣지 않는다
      };
      state.cards.push(card);
      saveCard(card);
      closeMemoEdit();
      card.editingMemo = true;
      drawMemos();
    });
  }

  /* ---------- 잘라내기 + 텍스트 뽑기 ---------- */

  function cropImage(rect, maxW) {
    var d = state.dpr;
    var sx = rect.x * d, sy = rect.y * d, sw = rect.w * d, sh = rect.h * d;
    var out = document.createElement("canvas");
    var k = Math.min(1, (maxW || 1400) / sw);
    out.width = Math.max(1, Math.round(sw * k));
    out.height = Math.max(1, Math.round(sh * k));
    var ctx = out.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(state.canvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
    return out;
  }

  async function textInRect(rect) {
    try {
      var page = await state.pdf.getPage(state.page);
      var vp = state.viewport;
      var tc = await page.getTextContent();
      var d = state.dpr;
      var out = [];
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(vp.transform, it.transform);
        var x = t[4] / d, y = t[5] / d;
        var h = Math.hypot(t[2], t[3]) / d;
        var w = (it.width || 0) * state.scale;
        var cx = x + w / 2, cy = y - h / 2;
        if (cx >= rect.x && cx <= rect.x + rect.w && cy >= rect.y && cy <= rect.y + rect.h) {
          out.push(it.str);
        }
      });
      return out.join(" ").replace(/\s+/g, " ").trim().slice(0, 2500);
    } catch (e) { return ""; }
  }

  /* ---------- Claude 호출 ---------- */

  async function callClaude(messages) {
    var res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages })
    });
    if (!res.ok) {
      // 서버가 알려준 진짜 이유를 그대로 올려보낸다.
      // 그러지 않으면 Claude Code 미설치도 그냥 "연결 실패"로만 보인다.
      var why = "";
      try { why = (await res.json()).error || ""; } catch (e) {}
      if (/ENOENT|claude CLI/.test(why)) {
        why = "Claude Code가 설치돼 있지 않습니다. 터미널에서 npm i -g @anthropic-ai/claude-code 후 claude auth login 하세요.";
      }
      // 실패했으면 준비 상태를 다시 살펴 안내를 띄운다
      if (/claude|ENOENT|찾지 못했|끝났습니다/.test(why)) checkCli();
      throw new Error(why || ("http " + res.status));
    }
    var data = await res.json();
    return (data.content || [])
      .map(function (i) { return i.type === "text" ? i.text : ""; })
      .filter(Boolean)
      .join("\n");
  }

  function recentContext() {
    return state.cards.slice(-2).map(function (c) {
      return "(" + c.page + "쪽) " + (c.memo || "");
    }).join(" / ");
  }

  /*
   * 오려낸 다음에 무엇을 시킬지 고른다.
   *
   * 예전에는 드래그하자마자 "핵심 정리"를 써 버렸다. 그런데 필요한 게 매번
   * 다르다 — 시험 포인트만 볼 때가 있고, 아예 모르는 개념이라 12살에게
   * 설명하듯 풀어야 할 때가 있다. 한 번 부르고 마는 대신 고르게 한다.
   * 위쪽 "묻지 말고 자동으로 넣기"를 켜면 핵심 정리로 바로 간다.
   */
  var ASK_MODES = [
    { id: "core",  label: "핵심만 정리",
      how: "3~5줄로 짧고 구체적으로 정리하세요. 수업 중에 읽을 것입니다." },
    { id: "deep",  label: "자세히 설명",
      how: "왜 그런지, 어디에 쓰이는지까지 풀어서 설명하세요. 10줄 이내." },
    { id: "kid",   label: "12살에게 설명하듯",
      how: "12살이 알아들을 수 있게 쉬운 말과 비유로 풀어서 설명하세요. " +
           "전문용어를 쓰면 바로 옆에 뜻을 붙이세요. 10줄 이내." },
    { id: "exam",  label: "시험 포인트",
      how: "시험에 나올 만한 것만 뽑으세요. 외워야 할 정의·수치·조건 위주로 5줄 이내." },
    { id: "terms", label: "용어 풀이",
      how: "이 부분에 나오는 용어만 뽑아 '용어 — 뜻' 형식으로 한 줄씩 적으세요." }
  ];

  // 오려낸 원본 그림과 원문은 카드에 넣지 않는다. 저장소에 들어가면 무겁다
  var pendingCrops = {};

  async function capture(rect) {
    var full = cropImage(rect, 1400);
    var thumb = cropImage(rect, 560);
    var id = "c" + Date.now();

    var card = {
      id: id,
      page: state.page,
      img: thumb.toDataURL("image/jpeg", 0.72),
      rect: {
        x: rect.x / (state.viewport.width / state.dpr),
        y: rect.y / (state.viewport.height / state.dpr),
        w: rect.w / (state.viewport.width / state.dpr),
        h: rect.h / (state.viewport.height / state.dpr)
      },
      memo: "", summary: "", detail: "",
      inserted: false,
      awaiting: true                       // 무엇을 시킬지 아직 안 골랐다
    };

    pendingCrops[id] = {
      b64: full.toDataURL("image/jpeg", 0.85).split(",")[1],
      text: await textInRect(rect)
    };

    state.cards.push(card);
    renderCards();

    if ($("auto").checked) runCard(card, ASK_MODES[0]);
  }

  async function runCard(card, mode, free) {
    var crop = pendingCrops[card.id] || { b64: null, text: "" };
    card.awaiting = false;
    card.pending = true;
    card.failed = false;
    card.mode = mode ? mode.label : "직접 물음";
    card.askText = free || "";
    renderCards();

    var ctx = recentContext();
    var how = mode ? mode.how : ("다음 질문에 답하세요: " + free);

    var prompt =
      "대학 강의자료 " + card.page + "쪽에서 오려낸 부분입니다.\n" +
      (crop.text ? "이 영역의 원문 텍스트: " + crop.text + "\n" : "") +
      (ctx ? "직전에 오려낸 것들: " + ctx + "\n" : "") +
      "\n" + how + "\n" +
      "\n한국어로 답하고, 아래 JSON만 출력하세요. 설명이나 코드블록 표시는 넣지 마세요.\n" +
      '{"memo": "PDF에 붙일 한 줄 (40자 이내, 이 부분이 뭔지 딱 알아보게)", ' +
      '"summary": "위에서 시킨 대로 쓴 본문"}';

    var content = [];
    if (crop.b64) {
      content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: crop.b64 } });
    }
    content.push({ type: "text", text: prompt });

    try {
      var raw = await callClaude([{ role: "user", content: content }]);
      var clean = raw.replace(/```json|```/g, "").trim();
      var parsed;
      try { parsed = JSON.parse(clean); }
      catch (e) { parsed = { memo: clean.slice(0, 40), summary: clean }; }
      card.memo = (parsed.memo || "").slice(0, 60);
      card.summary = parsed.summary || clean;
      card.pending = false;
      setStatus("");
    } catch (err) {
      card.pending = false;
      card.summary = "정리를 받아오지 못했습니다.";
      card.failed = true;
      setStatus(String(err.message || err), true);
    }

    renderCards();
    saveCard(card);

    if (!card.failed && $("auto").checked) {
      card.inserted = true;
      await placeMemoFor(card);
      renderCards(); drawMemos(); saveCard(card);
    }
  }

  async function expand(card) {
    card.detail = "…";
    renderCards();
    try {
      card.detail = await callClaude([{
        role: "user",
        content: [{
          type: "text",
          text: "다음은 대학 강의자료 " + card.page + "쪽의 한 부분을 정리한 것입니다.\n\n" +
            card.summary +
            "\n\n이걸 처음 배우는 학생이 이해할 수 있게 한국어로 더 풀어서 설명해 주세요. " +
            "왜 그런지, 어디에 쓰이는지까지. 8줄 이내."
        }]
      }]);
    } catch (e) {
      card.detail = "더 자세한 설명을 받아오지 못했습니다.";
    }
    renderCards();
    saveCard(card);
  }

  /*
   * AI에게 직접 묻기
   *
   * 지금 보고 있는 쪽을 이미지로 같이 보낸다. 수업 중에 나오는 질문은
   * 대개 "이거 뭐야"라서, 화면을 안 보여주면 답이 겉돈다.
   * 오려내기와 달리 PDF에 붙일 자리가 없으므로 메모 제안은 하지 않는다.
   */
  async function askQuestion(text) {
    var card = {
      id: "q" + Date.now(),
      page: state.page,
      qna: true,
      scope: qAll ? "all" : "page",
      question: text,
      summary: "",
      pending: true
    };
    state.cards.push(card);
    renderCards();
    $("cards").scrollTop = $("cards").scrollHeight;

    var content = [];
    if (card.scope === "all") {
      var digest = await allPagesDigest();
      content.push({
        type: "text",
        text:
          "다음은 강의자료 " + state.pages + "쪽 전체의 원문입니다.\n\n" + digest +
          "\n\n학생 질문: " + text + "\n\n" +
          "한국어로 짧고 구체적으로 답하세요. 6줄 이내. " +
          "찾은 내용이 어느 쪽에 있는지 반드시 \"N쪽\" 형식으로 밝히세요. " +
          "자료에 없으면 없다고 먼저 말하세요."
      });
      try {
        card.summary = await callClaude([{ role: "user", content: content }]);
        setStatus("");
      } catch (err) {
        card.summary = "답을 받아오지 못했습니다.";
        card.failed = true;
        setStatus(String(err.message || err), true);
      }
      card.pending = false;
      renderCards();
      saveCard(card);
      return;
    }

    try {
      // 화면 전체를 그대로 보내면 크므로 폭을 줄인다
      var shot = cropImage(
        { x: 0, y: 0, w: state.viewport.width / state.dpr, h: state.viewport.height / state.dpr },
        1100
      );
      content.push({
        type: "image",
        source: { type: "base64", media_type: "image/jpeg", data: shot.toDataURL("image/jpeg", 0.8).split(",")[1] }
      });
    } catch (e) { /* 이미지가 안 잡혀도 질문은 보낸다 */ }

    var ctx = recentContext();
    content.push({
      type: "text",
      text:
        "대학 강의자료 " + card.page + "쪽 화면입니다.\n" +
        (ctx ? "직전에 오려낸 것들: " + ctx + "\n" : "") +
        "\n학생 질문: " + text + "\n\n" +
        "한국어로, 수업 중에 읽을 것이므로 짧고 구체적으로 답하세요. 6줄 이내. " +
        "자료에 없는 내용이면 그렇다고 먼저 말하세요."
    });

    try {
      card.summary = await callClaude([{ role: "user", content: content }]);
      setStatus("");
    } catch (err) {
      card.summary = "답을 받아오지 못했습니다.";
      card.failed = true;
      setStatus(String(err.message || err), true);
    }
    card.pending = false;
    renderCards();
    saveCard(card);
  }

  /*
   * 전체 쪽에서 찾기
   *
   * "어떤 내용이 어느 쪽에 있더라"를 찾을 때 쓴다. 그림은 못 보내므로
   * 쪽마다 원문을 조금씩 잘라 붙여 보낸다. 한 번 읽은 건 쟁여 둔다.
   */
  var _allText = null;
  async function allPagesDigest() {
    if (_allText) return _allText;
    var out = [];
    for (var i = 1; i <= state.pages; i++) {
      try {
        var pg = await state.pdf.getPage(i);
        var tc = await pg.getTextContent();
        var t = tc.items.map(function (x) { return x.str; }).join(" ").replace(/\s+/g, " ").trim();
        if (t) out.push(i + "쪽: " + t.slice(0, 700));
      } catch (e) { /* 한 쪽을 못 읽어도 나머지로 답한다 */ }
    }
    _allText = out.join("\n").slice(0, 60000);
    return _allText;
  }

  var qAll = false;
  $("qscope").onclick = function () {
    qAll = !qAll;
    $("qscope").classList.toggle("all", qAll);
    $("qscope").textContent = qAll ? "전체" : "이 쪽";
    $("q").placeholder = qAll ? "전체 쪽에서 찾아보기" : "이 쪽에 대해 물어보기";
  };

  function sendQuestion() {
    var el = $("q");
    var text = el.value.trim();
    if (!text || !state.pdf) return;
    el.value = "";
    askQuestion(text);
  }

  $("qsend").onclick = sendQuestion;
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sendQuestion(); }
    e.stopPropagation();      // 좌우 화살표가 페이지를 넘기지 않게
  });

  /* ---------- 카드 ---------- */

  function renderCards() {
    var box = $("cards");
    box.innerHTML = "";
    var list = state.cards.filter(function (c) { return !c.manual; });
    $("count").textContent = list.length ? list.length + "장" : "";

    if (!list.length) {
      box.innerHTML = '<div class="hint">아직 오려낸 것이 없습니다.<br />PDF 위에서 드래그해 보세요.<br />빈 곳을 두 번 누르면 직접 메모를 쓸 수 있고,<br />메모는 끌어서 옮길 수 있습니다.<br />아래 칸에 바로 물어봐도 됩니다.</div>';
      return;
    }

    list.forEach(function (card) {
      var el = document.createElement("div");
      el.className = "card" + (card.qna ? " qna" : "");

      if (!card.qna) {                      // 질문 카드는 오려낸 그림이 없다
        var img = document.createElement("img");
        img.src = card.img;
        img.alt = card.page + "쪽에서 오려낸 부분";
        el.appendChild(img);
      }

      var body = document.createElement("div");
      body.className = "cardbody";

      var meta = document.createElement("div");
      meta.className = "cardmeta";
      var pg = document.createElement("span");
      pg.textContent = (card.qna && card.scope === "all" ? "전체" : card.page + "쪽") +
                       (card.qna ? " · 질문" : "");
      if (card.mode && !card.qna) {
        var tag = document.createElement("span");
        tag.className = "modetag";
        tag.textContent = " · " + card.mode;
        pg.appendChild(tag);
      }

      var acts = document.createElement("span");
      acts.style.display = "flex";
      acts.style.gap = "6px";

      if (!card.pending && !card.failed && !card.editing && !card.qna) {
        var ed = document.createElement("button");
        ed.textContent = "고치기";
        ed.onclick = function () { card.editing = true; renderCards(); };
        acts.appendChild(ed);
      }

      var del = document.createElement("button");
      del.textContent = "지우기";
      del.onclick = function () {
        state.cards = state.cards.filter(function (c) { return c !== card; });
        deleteCard(card);
        renderCards();
        drawMemos();
      };
      acts.appendChild(del);

      meta.appendChild(pg);
      meta.appendChild(acts);
      body.appendChild(meta);

      // 아직 무엇을 시킬지 안 골랐다 — 여기서 고른다
      if (card.awaiting) {
        var pick = document.createElement("div");
        pick.className = "pick";
        var pt = document.createElement("div");
        pt.className = "picktitle";
        pt.textContent = "이 부분을 어떻게 해줄까요?";
        pick.appendChild(pt);

        var prow = document.createElement("div");
        prow.className = "pickrow";
        ASK_MODES.forEach(function (m) {
          var b = document.createElement("button");
          b.textContent = m.label;
          if (m.id === "core") b.className = "primary";
          b.onclick = function () { runCard(card, m); };
          prow.appendChild(b);
        });
        pick.appendChild(prow);

        var pf = document.createElement("div");
        pf.className = "pickfree";
        var pin2 = document.createElement("input");
        pin2.type = "text";
        pin2.placeholder = "직접 물어보기";
        pin2.maxLength = 300;
        var pgo = document.createElement("button");
        pgo.textContent = "묻기";
        pgo.onclick = function () {
          var v = pin2.value.trim();
          if (v) runCard(card, null, v);
        };
        pin2.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); pgo.click(); }
          e.stopPropagation();          // 좌우 화살표가 페이지를 넘기지 않게
        });
        pf.appendChild(pin2); pf.appendChild(pgo);
        pick.appendChild(pf);

        body.appendChild(pick);
        el.appendChild(body);
        box.appendChild(el);
        return;
      }

      if (card.editing) {
        var edit = document.createElement("div");
        edit.className = "cardedit";

        var l1 = document.createElement("label");
        l1.textContent = "PDF에 붙는 한 줄";
        var memoIn = document.createElement("input");
        memoIn.type = "text";
        memoIn.value = card.memo || "";
        memoIn.maxLength = 60;

        var l2 = document.createElement("label");
        l2.textContent = "정리";
        var sumIn = document.createElement("textarea");
        sumIn.rows = 6;
        sumIn.value = card.summary || "";

        edit.appendChild(l1);
        edit.appendChild(memoIn);
        edit.appendChild(l2);
        edit.appendChild(sumIn);

        var detIn = null;
        if (card.detail) {
          var l3 = document.createElement("label");
          l3.textContent = "자세한 설명";
          detIn = document.createElement("textarea");
          detIn.rows = 6;
          detIn.value = card.detail;
          edit.appendChild(l3);
          edit.appendChild(detIn);
        }

        var eb = document.createElement("div");
        eb.className = "editbtns";
        var ok = document.createElement("button");
        ok.className = "primary";
        ok.textContent = "저장";
        ok.onclick = function () {
          card.memo = memoIn.value.slice(0, 60);
          card.summary = sumIn.value;
          if (detIn) card.detail = detIn.value;
          card.editing = false;
          renderCards();
          drawMemos();
          saveCard(card);
        };
        var cancel = document.createElement("button");
        cancel.textContent = "취소";
        cancel.onclick = function () { card.editing = false; renderCards(); };
        eb.appendChild(ok);
        eb.appendChild(cancel);
        edit.appendChild(eb);

        body.appendChild(edit);
        el.appendChild(body);
        box.appendChild(el);
        return;
      }

      if (card.qna) {
        var q = document.createElement("div");
        q.className = "qtext";
        q.textContent = "“" + card.question + "”";
        body.appendChild(q);
      }

      var txt = document.createElement("div");
      txt.className = "cardtext" + (card.pending ? " loading" : "");
      txt.textContent = card.pending
        ? (card.qna ? "답하는 중…" : "정리하는 중…")
        : card.summary;
      body.appendChild(txt);

      if (card.detail) {
        var det = document.createElement("div");
        det.className = "cardtext";
        det.style.marginTop = "9px";
        det.style.color = "var(--muted)";
        det.textContent = card.detail;
        body.appendChild(det);
      }

      // 답에 나온 쪽 번호로 바로 갈 수 있게 한다
      if (card.qna && !card.pending && card.summary) {
        var pages = [];
        String(card.summary).replace(/(\d{1,4})\s*쪽/g, function (_, n) {
          n = parseInt(n, 10);
          if (n >= 1 && n <= state.pages && pages.indexOf(n) < 0) pages.push(n);
          return _;
        });
        if (pages.length) {
          var jr = document.createElement("div");
          jr.className = "jump";
          pages.slice(0, 8).forEach(function (n) {
            var jb = document.createElement("button");
            jb.textContent = n + "쪽으로";
            jb.onclick = function () {
              state.page = n; closeMemoEdit(); renderPage();
            };
            jr.appendChild(jb);
          });
          body.appendChild(jr);
        }
      }

      if (!card.pending && !card.failed && !card.qna) {
        if (!card.detail) {
          var more = document.createElement("div");
          more.className = "more";
          var mb = document.createElement("button");
          mb.textContent = "더 자세히";
          mb.onclick = function () { expand(card); };
          more.appendChild(mb);
          body.appendChild(more);
        }

        if (card.inserted) {
          var done = document.createElement("div");
          done.className = "done";
          done.textContent = "PDF " + card.page + "쪽에 메모로 붙였습니다";
          body.appendChild(done);
        } else if (!card.declined) {
          var ask = document.createElement("div");
          ask.className = "ask";
          ask.textContent = "이 내용을 그 자리에 메모로 붙일까요? — “" + card.memo + "”";
          var row = document.createElement("div");
          row.className = "askrow";
          var yes = document.createElement("button");
          yes.className = "primary";
          yes.textContent = "예";
          yes.onclick = async function () {
            card.inserted = true;
            await placeMemoFor(card);       // 붙이는 순간 자리를 정해 화면과 PDF를 맞춘다
            renderCards(); drawMemos(); saveCard(card);
          };
          var no = document.createElement("button");
          no.textContent = "아니요";
          no.onclick = function () {
            card.declined = true;
            renderCards(); saveCard(card);
          };
          row.appendChild(yes); row.appendChild(no);
          ask.appendChild(row);
          body.appendChild(ask);
        }
      }

      if (card.failed) {
        var retry = document.createElement("div");
        retry.className = "more";
        var rb = document.createElement("button");
        rb.textContent = "다시 시도";
        rb.onclick = function () {
          var q = card.qna ? card.question : null;
          state.cards = state.cards.filter(function (c) { return c !== card; });
          deleteCard(card);
          renderCards();
          // 질문은 내용이 남아 있으니 바로 다시 보낼 수 있다. 오려낸 건 그림이 필요하다
          if (q) askQuestion(q);
          else setStatus("같은 부분을 다시 그어 주세요.");
        };
        retry.appendChild(rb);
        body.appendChild(retry);
      }

      el.appendChild(body);
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  }

  /* ---------- 페이지 위 메모 ---------- */

  /*
   * 메모 치수는 PDF 포인트로 한 번만 정한다.
   * 화면은 이 값을 배율만 맞춰 그리므로 화면과 내보낸 PDF가 같아진다.
   * 8.5pt로 줄인 건, 예전 13pt 상자가 슬라이드 위에서 원문을 가릴 만큼 컸기 때문이다.
   */
  var MEMO = { w: 190, fs: 8.5, lh: 11.6, pad: 6, bar: 3 };

  function ptPx() {                       // 화면에서 1pt가 몇 px인가
    if (!state.viewport || !state.pageW) return 1;
    return (state.viewport.width / state.dpr) / state.pageW;
  }

  /*
   * 줄바꿈을 한 곳에서만 계산해 화면과 PDF가 같은 줄을 쓰게 한다.
   * 각자 접으면 폰트 계산이 미묘하게 달라져 줄 수가 어긋난다.
   */
  var _measure = null;
  function memoLines(text) {
    if (!_measure) _measure = document.createElement("canvas").getContext("2d");
    _measure.font = MEMO.fs + "px sans-serif";
    var max = MEMO.w - MEMO.pad * 2 - MEMO.bar;
    var lines = [], cur = "";
    String(text == null ? "" : text).split("").forEach(function (ch) {
      if (ch === "\n") { lines.push(cur); cur = ""; return; }
      if (_measure.measureText(cur + ch).width > max) { lines.push(cur); cur = ch; }
      else cur += ch;
    });
    if (cur || !lines.length) lines.push(cur);
    return lines;
  }

  function memoSize(lines) {
    return { w: MEMO.w, h: MEMO.pad * 2 + lines.length * MEMO.lh };
  }

  function closeMemoEdit() {
    state.cards.forEach(function (c) { c.editingMemo = false; });
  }

  // 자리를 아직 못 정한 옛 카드를 위한 최소한의 자리
  function fallbackPin(card, size) {
    var pw = state.pageW || 1, ph = state.pageH || 1;
    var x = card.rect.x + card.rect.w + 6 / pw;
    if (x + size.w / pw > 1) x = Math.max(0, 1 - size.w / pw);
    return { x: x, y: Math.max(0, Math.min(card.rect.y, 1 - size.h / ph)) };
  }

  function drawMemos() {
    if (!state.layer || !state.viewport) return;
    Array.prototype.forEach.call(state.layer.querySelectorAll(".memo"), function (m) { m.remove(); });

    var k = ptPx();
    var W = state.viewport.width / state.dpr;
    var H = state.viewport.height / state.dpr;

    state.cards.forEach(function (card) {
      if (!card.inserted || card.page !== state.page) return;

      var lines = memoLines(card.memo || "");
      var size = memoSize(lines);
      if (!card.pin) card.pin = fallbackPin(card, size);

      var el = document.createElement("div");
      el.className = "memo" + (card.manual ? " manual" : "") + (card.editingMemo ? " editing" : "");
      el.style.left = (card.pin.x * W) + "px";
      el.style.top = (card.pin.y * H) + "px";
      el.style.width = (size.w * k) + "px";
      el.style.height = (size.h * k) + "px";
      el.style.padding = (MEMO.pad * k) + "px";
      el.style.borderLeftWidth = (MEMO.bar * k) + "px";
      el.style.fontSize = (MEMO.fs * k) + "px";
      el.style.lineHeight = (MEMO.lh * k) + "px";
      el.title = "끌어서 옮기고, 눌러서 고칩니다";

      if (card.editingMemo) {
        var ta = document.createElement("textarea");
        ta.value = card.memo || "";
        ta.setAttribute("aria-label", "메모 내용");
        el.appendChild(ta);

        var acts = document.createElement("div");
        acts.className = "memoacts";
        var ok = document.createElement("button");
        ok.className = "primary";
        ok.textContent = "저장";
        ok.onclick = function () {
          card.memo = ta.value;
          card.editingMemo = false;
          saveCard(card);
          drawMemos();
          renderCards();
        };
        var rm = document.createElement("button");
        rm.textContent = card.manual ? "지우기" : "메모 빼기";
        rm.onclick = function () {
          if (card.manual) {
            state.cards = state.cards.filter(function (c) { return c !== card; });
            deleteCard(card);
          } else {
            card.inserted = false;
            card.declined = true;
            card.editingMemo = false;
            saveCard(card);
          }
          drawMemos();
          renderCards();
        };
        acts.appendChild(ok); acts.appendChild(rm);
        acts.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        el.appendChild(acts);

        state.layer.appendChild(el);
        ta.focus();
        return;
      }

      lines.forEach(function (ln) {
        var d = document.createElement("div");
        d.className = "mline";
        d.textContent = ln;
        el.appendChild(d);
      });

      /*
       * 끌어 옮기기. 3px까지는 클릭으로 쳐서 손 떨림에 편집이 막히지 않게 한다.
       * 옮긴 자리는 정규화해 card.pin에 적고 내보낼 때 그대로 쓴다.
       */
      var drag = null;
      el.addEventListener("pointerdown", function (e) {
        if (card.editingMemo) return;
        e.stopPropagation();                 // 레이어의 영역 선택이 시작되지 않게
        el.setPointerCapture(e.pointerId);
        var r = state.layer.getBoundingClientRect();
        drag = {
          dx: e.clientX - r.left - parseFloat(el.style.left),
          dy: e.clientY - r.top - parseFloat(el.style.top),
          moved: false
        };
        el.style.cursor = "grabbing";
      });

      el.addEventListener("pointermove", function (e) {
        if (!drag) return;
        var r = state.layer.getBoundingClientRect();
        var x = e.clientX - r.left - drag.dx;
        var y = e.clientY - r.top - drag.dy;
        if (Math.abs(x - parseFloat(el.style.left)) > 3 ||
            Math.abs(y - parseFloat(el.style.top)) > 3) drag.moved = true;
        x = Math.max(0, Math.min(x, W - size.w * k));
        y = Math.max(0, Math.min(y, H - size.h * k));
        el.style.left = x + "px";
        el.style.top = y + "px";
      });

      el.addEventListener("pointerup", function () {
        if (!drag) return;
        var moved = drag.moved;
        drag = null;
        el.style.cursor = "grab";
        if (!moved) {
          closeMemoEdit();
          card.editingMemo = true;
          drawMemos();
          return;
        }
        card.pin = { x: parseFloat(el.style.left) / W, y: parseFloat(el.style.top) / H };
        saveCard(card);
      });

      el.addEventListener("pointercancel", function () { drag = null; });
      state.layer.appendChild(el);
    });
  }

  /*
   * 메모를 붙이는 순간 자리를 정한다.
   * 예전에는 내보낼 때 잡아서 화면에서 본 위치와 결과가 달랐다.
   */
  /* ---------- 내보낸 PDF를 다시 열기 위한 표시 ---------- */

  var CAPNOTE_KEY = "Capnote";

  function addMemoAnnot(doc, page, pngRef, x, y, w, h, text) {
    var ap = doc.context.stream("q " + w + " 0 0 " + h + " 0 0 cm /Img Do Q", {
      Type: "XObject", Subtype: "Form", FormType: 1,
      BBox: [0, 0, w, h],
      Resources: { XObject: { Img: pngRef } }
    });
    var annot = doc.context.obj({
      Type: "Annot", Subtype: "Stamp",
      Rect: [x, y, x + w, y + h],
      F: 4,                                    // 인쇄에도 나오게
      AP: { N: doc.context.register(ap) },
      T: PDFLib.PDFString.of("오려둔 공책"),
      Contents: PDFLib.PDFString.of(String(text).slice(0, 300)),
      Capnote: PDFLib.PDFBool.True             // 다음에 찾아 지우기 위한 표시
    });
    page.node.addAnnot(doc.context.register(annot));
  }

  function removeMemoAnnots(doc, page) {
    var a = page.node.Annots();
    if (!a) return 0;
    var n = 0;
    for (var i = a.size() - 1; i >= 0; i--) {
      var d = doc.context.lookup(a.get(i));
      if (d && d.get && d.get(PDFLib.PDFName.of(CAPNOTE_KEY))) { a.remove(i); n++; }
    }
    return n;
  }

  function saveCardsIntoPdf(doc, cards) {
    try {
      var slim = cards.map(function (c) {
        var o = {};
        Object.keys(c).forEach(function (k) {
          if (k === "img" || k === "editing" || k === "editingMemo") return;   // 썸네일은 다시 만들 수 있다
          o[k] = c[k];
        });
        return o;
      });
      var info = doc.context.lookup(doc.context.trailerInfo.Info);
      info.set(PDFLib.PDFName.of(CAPNOTE_KEY),
               PDFLib.PDFHexString.fromText(JSON.stringify({ v: 1, name: state.docName, cards: slim })));
    } catch (e) { /* 못 심어도 PDF 자체는 나가야 한다 */ }
  }

  async function readCardsFromPdf(pdf) {
    try {
      var md = await pdf.getMetadata();
      var raw = md && md.info && md.info.Custom ? md.info.Custom[CAPNOTE_KEY] : null;
      if (!raw) return null;
      var d = JSON.parse(raw);
      return d && Array.isArray(d.cards) ? d.cards : null;
    } catch (e) { return null; }
  }

  /*
   * 우리가 넣은 메모 주석을 벗겨낸다.
   *
   * 벗기지 않으면 화면에 주석이 그려진 채로 그 위에 우리 메모 상자가 또 얹혀
   * 두 겹으로 보인다. 벗겨내면 원본을 여는 것과 같아지고, 다시 내보낼 때도
   * 깨끗한 바탕에서 시작한다.
   */
  async function stripMemoAnnots(bytes) {
    try {
      var doc = await PDFLib.PDFDocument.load(bytes.slice(0));
      var n = 0;
      doc.getPages().forEach(function (pg) { n += removeMemoAnnots(doc, pg); });
      if (!n) return null;
      return (await doc.save()).buffer;
    } catch (e) { return null; }
  }

  var MEMO_GAP = 6, MEMO_MARGIN = 4;

  function overlapArea(a, b) {
    var dx = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    var dy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    return dx > 0 && dy > 0 ? dx * dy : 0;
  }

  /*
   * 본문 글자 상자를 PDF 좌표(왼쪽 아래 원점, 포인트)로 모은다.
   * 메모를 붙일 때마다 다시 읽으면 느려서 쪽마다 한 번만 읽고 쟁여 둔다.
   */
  var _textCache = {};
  async function textBoxes(pageNo) {
    if (_textCache[pageNo]) return _textCache[pageNo];
    var out = [];
    try {
      var page = await state.pdf.getPage(pageNo);
      var vp = page.getViewport({ scale: 1 });
      var tc = await page.getTextContent();
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(t[2], t[3]) || 10;
        if ((it.width || 0) > 0) out.push({ x: t[4], y: vp.height - t[5], w: it.width, h: h });
      });
    } catch (e) { /* 글자를 못 읽어도 배치는 계속돼야 한다 */ }
    _textCache[pageNo] = out;
    return out;
  }

  /*
   * 빈자리 찾기 (좌표는 PDF 기준, 왼쪽 아래 원점)
   *
   * hard — 오려낸 영역과 이미 놓인 메모. 덮으면 안 된다 (가중치 100)
   * soft — 본문 글자. 되도록 피한다 (가중치 1)
   * 정 자리가 없으면 글자를 조금 가리더라도 오려낸 그림만은 지키게 된다.
   */
  function placeMemo(sel, mw, mh, pw, ph, hard, soft) {
    var g = MEMO_GAP, m = MEMO_MARGIN, i;

    function fit(x, y) {
      return {
        x: Math.max(m, Math.min(x, pw - mw - m)),
        y: Math.max(m, Math.min(y, ph - mh - m)),
        w: mw, h: mh
      };
    }
    function score(c) {
      var v = 0;
      for (i = 0; i < hard.length; i++) v += overlapArea(c, hard[i]) * 100;
      for (i = 0; i < soft.length; i++) v += overlapArea(c, soft[i]);
      return v;
    }

    var spots = [
      fit(sel.x + sel.w + g, sel.y + sel.h - mh),   // 오른쪽
      fit(sel.x - g - mw,    sel.y + sel.h - mh),   // 왼쪽
      fit(sel.x,             sel.y - g - mh),       // 아래
      fit(sel.x,             sel.y + sel.h + g)     // 위
    ];
    var best = null, bestScore = Infinity;
    for (var k = 0; k < spots.length; k++) {
      var sc = score(spots[k]);
      if (sc === 0) return spots[k];
      if (sc < bestScore) { bestScore = sc; best = spots[k]; }
    }

    // 네 자리가 다 막혔으면 페이지를 훑어 가장 가까운 빈자리를 찾는다
    var cx = sel.x + sel.w / 2, cy = sel.y + sel.h / 2;
    var step = 12, nearD = Infinity, near = null;
    for (var y = m; y <= ph - mh - m; y += step) {
      for (var x = m; x <= pw - mw - m; x += step) {
        var c = { x: x, y: y, w: mw, h: mh };
        var v = score(c);
        if (v < bestScore) { bestScore = v; best = c; }
        if (v !== 0) continue;
        var d = (x + mw / 2 - cx) * (x + mw / 2 - cx) + (y + mh / 2 - cy) * (y + mh / 2 - cy);
        if (d < nearD) { nearD = d; near = c; }
      }
    }
    return near || best;
  }

  async function placeMemoFor(card) {
    var size = memoSize(memoLines(card.memo || ""));
    var pw = state.pageW, ph = state.pageH;
    if (!pw || !ph) { card.pin = fallbackPin(card, size); return; }

    var sel = {
      x: card.rect.x * pw, y: ph - (card.rect.y + card.rect.h) * ph,
      w: card.rect.w * pw, h: card.rect.h * ph
    };

    var hard = [];
    state.cards.forEach(function (c) {
      if (c.page !== card.page || c === card) return;
      if (c.inserted && c.pin) {                       // 이미 놓인 메모
        var sz = memoSize(memoLines(c.memo || ""));
        hard.push({ x: c.pin.x * pw, y: ph - c.pin.y * ph - sz.h, w: sz.w, h: sz.h });
      }
      if (!c.manual && !c.qna && c.rect && c.rect.w > 0) {   // 다른 오려낸 영역
        hard.push({ x: c.rect.x * pw, y: ph - (c.rect.y + c.rect.h) * ph,
                    w: c.rect.w * pw, h: c.rect.h * ph });
      }
    });

    var soft = await textBoxes(card.page);
    var at = placeMemo(sel, size.w, size.h, pw, ph, hard, soft);
    card.pin = { x: at.x / pw, y: (ph - at.y - size.h) / ph };
  }

  /* ---------- 내보내기 ---------- */

  var openUrl = null;

  function closeSheet() {
    var v = document.querySelector(".veil");
    if (v) v.remove();
    if (openUrl) { URL.revokeObjectURL(openUrl); openUrl = null; }
  }

  // 코드가 링크를 대신 눌러 내려받는 방식은 아티팩트 보안 상자에서 막히고,
  // 막히면 그 주소로 화면이 이동해 앱이 통째로 사라진다.
  // 그래서 자동 클릭을 쓰지 않고, 사용자가 직접 누르는 링크만 띄운다.
  function showExport(title, opts) {
    closeSheet();
    var veil = document.createElement("div");
    veil.className = "veil";
    veil.addEventListener("pointerdown", function (e) {
      if (e.target === veil) closeSheet();
    });

    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    var h = document.createElement("h3");
    h.textContent = title;
    sheet.appendChild(h);

    var body = document.createElement("div");
    body.className = "sbody";
    if (opts.note) {
      var p = document.createElement("p");
      p.className = "note";
      p.textContent = opts.note;
      body.appendChild(p);
    }
    var ta = null;
    if (opts.text != null) {
      ta = document.createElement("textarea");
      ta.value = opts.text;
      ta.readOnly = true;
      body.appendChild(ta);
    }
    sheet.appendChild(body);

    var foot = document.createElement("div");
    foot.className = "sfoot";

    if (opts.blob) {
      openUrl = URL.createObjectURL(opts.blob);
      var a = document.createElement("a");
      a.className = "dl";
      a.href = openUrl;
      a.download = opts.filename;
      a.textContent = "내려받기";
      foot.appendChild(a);
    }

    if (ta) {
      var copy = document.createElement("button");
      copy.className = opts.blob ? "" : "primary";
      copy.textContent = "전체 복사";
      copy.onclick = function () {
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
        copy.textContent = "복사했습니다";
        setTimeout(function () { copy.textContent = "전체 복사"; }, 1600);
      };
      foot.appendChild(copy);
    }

    var sp = document.createElement("div");
    sp.className = "spacer";
    foot.appendChild(sp);

    var close = document.createElement("button");
    close.textContent = "닫기";
    close.onclick = closeSheet;
    foot.appendChild(close);

    sheet.appendChild(foot);
    veil.appendChild(sheet);
    $("root").appendChild(veil);
  }

  function buildMarkdown() {
    var lines = ["# " + state.docName, ""];
    var byPage = {};
    state.cards.forEach(function (c) {
      (byPage[c.page] = byPage[c.page] || []).push(c);
    });
    Object.keys(byPage)
      .sort(function (a, b) { return a - b; })
      .forEach(function (pg) {
        lines.push("## " + pg + "쪽");
        lines.push("");
        byPage[pg].forEach(function (c) {
          if (c.manual) {
            lines.push("- (직접 쓴 메모) " + (c.memo || ""));
          } else if (c.qna) {
            lines.push("### Q. " + (c.question || ""));
            lines.push("");
            lines.push(c.summary || "");
          } else {
            lines.push("### " + (c.memo || "오려낸 부분"));
            lines.push("");
            lines.push(c.summary || "");
            if (c.detail) { lines.push(""); lines.push(c.detail); }
          }
          lines.push("");
        });
      });
    return lines.join("\n");
  }

  $("expMd").onclick = function () {
    if (!state.cards.length) { setStatus("내보낼 내용이 아직 없습니다."); return; }
    var md = buildMarkdown();
    showExport("정리 내보내기", {
      note: "복사해서 노션이나 메모장에 붙이거나, 파일로 내려받으세요.",
      text: md,
      blob: new Blob([md], { type: "text/markdown" }),
      filename: state.docName + " 정리.md"
    });
  };

  // 한글은 표준 PDF 폰트에 없으므로, 메모를 캔버스에 그려 이미지로 심는다
  /*
   * 메모를 PNG로 그린다. 한글이 pdf-lib 표준 폰트에 없어서 이미지로 심는다.
   * 치수와 줄바꿈은 화면과 같은 값(MEMO, memoLines)을 쓴다 — 그래야 화면에서
   * 맞춰 둔 자리와 크기가 그대로 나간다.
   */
  function memoToPng(text, manual) {
    var lines = memoLines(text);
    var size = memoSize(lines);
    var s = 3;                       // 인쇄해도 뭉개지지 않게 3배로 그린다
    var cv = document.createElement("canvas");
    cv.width = Math.round(size.w * s);
    cv.height = Math.round(size.h * s);
    var c = cv.getContext("2d");
    c.scale(s, s);

    c.fillStyle = "#fff8dc";
    c.fillRect(0, 0, size.w, size.h);
    c.fillStyle = manual ? "#4aa3e0" : "#ffd83d";
    c.fillRect(0, 0, MEMO.bar, size.h);

    c.fillStyle = "#241d00";
    c.font = MEMO.fs + "px sans-serif";
    c.textBaseline = "middle";
    lines.forEach(function (ln, i) {
      c.fillText(ln, MEMO.bar + MEMO.pad, MEMO.pad + i * MEMO.lh + MEMO.lh / 2);
    });
    return { dataUrl: cv.toDataURL("image/png"), w: size.w, h: size.h };
  }

  $("expPdf").onclick = async function () {
    var inserted = state.cards.filter(function (c) { return c.inserted; });
    if (!inserted.length) { setStatus("PDF에 붙인 메모가 아직 없습니다."); return; }

    /*
     * 쪽이 많은 자료를 매번 통째로 내려받는 건 부담이다.
     * 기본은 "메모 있는 쪽만" — 보통 그것만 다시 볼 것이기 때문이다.
     */
    var scope = $("expScope").value;
    if (scope === "page" && !inserted.some(function (c) { return c.page === state.page; })) {
      setStatus("이 쪽에는 붙인 메모가 없습니다.");
      return;
    }
    setStatus("메모를 넣는 중…");
    try {
      var doc = await PDFLib.PDFDocument.load(state.bytes.slice(0));

      /*
       * 메모를 페이지에 굽지 않고 주석(Stamp)으로 넣는다.
       *
       * 구우면 지울 수 없어서, 내보낸 PDF를 다시 열어 고친 뒤 또 내보내면
       * 예전 메모 위에 새 메모가 겹쳤다. 주석은 /Capnote 표시를 달아 두면
       * 다음 번에 찾아서 지우고 새로 넣을 수 있다.
       * F:4는 인쇄 플래그다 — 없으면 화면에만 보이고 인쇄에서 빠진다.
       */
      inserted.forEach(function (c) { removeMemoAnnots(doc, doc.getPage(c.page - 1)); });
      state.cards.forEach(function (c) { removeMemoAnnots(doc, doc.getPage(c.page - 1)); });

      for (var i = 0; i < inserted.length; i++) {
        var card = inserted[i];
        var pg = doc.getPage(card.page - 1);
        var pw = pg.getWidth(), ph = pg.getHeight();

        if (!card.manual && card.rect && card.rect.w > 0) {
          pg.drawRectangle({
            x: card.rect.x * pw,
            y: ph - (card.rect.y + card.rect.h) * ph,
            width: card.rect.w * pw,
            height: card.rect.h * ph,
            borderColor: PDFLib.rgb(1, 0.85, 0.24),
            borderWidth: 1.5,
            opacity: 0
          });
        }

        var memo = memoToPng(card.memo || card.summary, card.manual);
        var png = await doc.embedPng(memo.dataUrl);

        // 자리는 화면에서 이미 정해졌다(card.pin). 여기서 다시 계산하지 않는다
        var m = MEMO_MARGIN;
        var pin = card.pin || fallbackPin(card, memo);
        var x = Math.max(m, Math.min(pin.x * pw, pw - memo.w - m));
        var y = Math.max(m, Math.min(ph - pin.y * ph - memo.h, ph - memo.h - m));
        addMemoAnnot(doc, pg, png.ref, x, y, memo.w, memo.h, card.memo || "");
      }

      /*
       * 카드 정보를 PDF 안에 적어 둔다. 이걸 다시 우리 앱에서 열면 메모를
       * 그대로 되살려 고칠 수 있다. 썸네일(img)은 빼서 파일을 가볍게 유지하고,
       * 다시 열 때 쪽에서 새로 잘라 만든다.
       */
      /*
       * 안 쓸 쪽을 덜어낸다. 뒤에서부터 지워야 앞 쪽 번호가 안 밀린다.
       * 남은 쪽 기준으로 카드의 쪽 번호도 다시 매겨야, 이 파일을 다시 열었을 때
       * 메모가 엉뚱한 쪽에 붙지 않는다.
       */
      var carriedCards = state.cards;
      if (scope !== "all") {
        var keep = {};
        if (scope === "page") keep[state.page] = true;
        else inserted.forEach(function (c) { keep[c.page] = true; });

        for (var pi = doc.getPageCount() - 1; pi >= 0; pi--) {
          if (!keep[pi + 1]) doc.removePage(pi);
        }

        var order = Object.keys(keep).map(Number).sort(function (a, b) { return a - b; });
        var map = {};
        order.forEach(function (pnum, idx) { map[pnum] = idx + 1; });
        carriedCards = state.cards.filter(function (c) { return map[c.page]; })
          .map(function (c) {
            var o = {};
            Object.keys(c).forEach(function (k) { o[k] = c[k]; });
            o.page = map[c.page];
            return o;
          });
      }

      saveCardsIntoPdf(doc, carriedCards);

      var out = await doc.save();
      showExport("메모 넣은 PDF", {
        note: "메모 " + carriedCards.filter(function (c) { return c.inserted; }).length +
              "개 · " + doc.getPageCount() + "쪽입니다. " +
              "내려받아 굿노트 등에서 이어 쓰세요. 이 파일을 다시 이 앱에 열면 메모를 그대로 고칠 수 있습니다.",
        blob: new Blob([out], { type: "application/pdf" }),
        filename: state.docName + " 메모.pdf"
      });
      setStatus("");
    } catch (e) {
      setStatus("PDF를 만들지 못했습니다. 다른 파일로 시도해 보세요.", true);
    }
  };

  document.addEventListener("keydown", function (e) {
    if (!state.pdf) return;
    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === "ArrowRight") $("next").click();
    if (e.key === "Escape") closeMemoEdit();
  });
})();
</script>

</body>
</html>
