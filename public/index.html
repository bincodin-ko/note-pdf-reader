<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오려둔 공책</title>
<script src="storage.js"></script>
</head>
<body>
<div id="root">
<style>
  :root {
    --ink: #141d27;
    --ink-2: #1b2836;
    --ink-3: #22323f;
    --rule: #2f4457;
    --paper: #ffffff;
    --text: #dfe8f0;
    --muted: #8ba0b4;
    --marker: #ffd83d;
    --marker-soft: rgba(255, 216, 61, 0.22);
    --danger: #ff8b6b;
    --note-fs: 14px;        /* 정리 패널 글자 크기. 사용자가 바꾼다 */
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; overflow: hidden; }

  #root {
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    /*
     * min-height가 아니라 height다.
     * min-height면 정리 패널 내용이 길어질 때 #root가 화면 밖으로 늘어나고,
     * flex:1인 PDF 영역까지 같이 늘어나 비율이 무너졌다.
     * 높이를 화면에 고정하고, 넘치는 건 안쪽 패널이 스스로 스크롤한다.
     */
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-size: 15px;
    line-height: 1.6;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--ink-2);
    flex-wrap: wrap;
  }

  .mark {
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-right: 4px;
    font-size: 15px;
  }
  .mark span { color: var(--marker); }
  /* 어느 빌드를 보고 있는지 한눈에 — 설치파일 이름만으로는 구분이 안 된다 */
  .ver {
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-left: -2px;
    align-self: center;
  }

  button {
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--marker); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }

  .primary {
    background: var(--marker);
    color: #1c1500;
    border-color: var(--marker);
    font-weight: 650;
  }

  .pageno {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .pageno input {
    width: 42px;
    text-align: center;
    font: inherit;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 4px 2px;
  }
  .pageno input:focus { outline: none; border-color: var(--marker); }

  .spacer { flex: 1; }

  .toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .toggle input { accent-color: var(--marker); width: 15px; height: 15px; }

  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .stage {
    flex: 1;
    overflow: auto;
    padding: 20px;
    display: flex;
    justify-content: center;
    /*
     * safe를 붙이는 이유: 그냥 center면 페이지가 화면보다 클 때
     * 위쪽이 잘려 나가고 스크롤로도 못 올라간다.
     * safe는 넘칠 때만 자동으로 시작 정렬로 돌아간다.
     */
    align-items: safe center;
    min-width: 0;
  }

  .empty {
    margin: auto;
    text-align: center;
    max-width: 380px;
    color: var(--muted);
  }
  .empty h2 {
    color: var(--text);
    font-size: 19px;
    font-weight: 650;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .empty p { margin: 0 0 18px; font-size: 14px; }

  .pagewrap {
    position: relative;
    background: var(--paper);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    line-height: 0;
  }
  canvas { display: block; }

  .layer {
    position: absolute;
    inset: 0;
    cursor: crosshair;
    touch-action: none;
  }

  .sel {
    position: absolute;
    border: 2px solid var(--marker);
    background: var(--marker-soft);
    pointer-events: none;
  }

  /*
   * 화면의 메모 = 내보낸 PDF의 메모
   *
   * 예전에는 화면엔 21px 핀을, PDF엔 230pt 상자를 그렸다. 서로 다른 물건이라
   * "넣을 때 본 자리"가 내보내면 의미가 없었다. 이제 치수를 PDF 포인트로 한 번만
   * 정하고, 화면은 그걸 배율만 맞춰 그린다. 크기·줄바꿈·자리가 같아진다.
   */
  .memo {
    position: absolute;
    box-sizing: border-box;
    background: #fff8dc;
    color: #241d00;
    border-left-style: solid;
    border-left-color: var(--marker);
    font-family: sans-serif;
    cursor: grab;
    overflow: hidden;
    z-index: 4;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
  }
  .memo.manual { border-left-color: #4aa3e0; }
  .memo:hover { outline: 1px solid var(--marker); }
  .memo.editing { cursor: default; overflow: visible; z-index: 8; }
  .memo .mline { white-space: pre; }
  .memo textarea {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    border: 0;
    background: #fffdf2;
    color: inherit;
    font: inherit;
    padding: inherit;
    resize: none;
    outline: none;
  }
  .memoacts {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 5px;
    display: flex;
    gap: 6px;
    white-space: nowrap;
  }
  .memoacts button { font-size: 12px; padding: 4px 9px; border-radius: 5px; }

  .notes {
    /* 폭을 못 늘리게 못 박는다. 긴 글이 들어와도 PDF 영역을 밀지 않게 */
    flex: 0 0 350px;
    width: 350px;
    min-width: 0;
    border-left: 1px solid var(--rule);
    background: var(--ink-2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .noteshead {
    padding: 12px 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .noteshead strong { font-size: 14px; font-weight: 650; }
  .noteshead .count { color: var(--muted); font-size: 13px; }
  .noteshead .fs {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }
  .noteshead .fs button {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 5px;
    color: var(--muted);
  }

  .cards { flex: 1; overflow-y: auto; padding: 12px; }

  .hint {
    color: var(--muted);
    font-size: calc(var(--note-fs) - 1px);
    padding: 22px 8px;
    text-align: center;
    line-height: 1.7;
  }

  .card {
    background: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 9px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .card img {
    width: 100%;
    display: block;
    background: #fff;
    border-bottom: 1px solid var(--rule);
  }
  .cardbody { padding: 10px 12px 12px; }
  .cardmeta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  /* 카드의 쪽 표시를 눌러 그 쪽으로 간다 */
  .gopage {
    background: none;
    border: 0;
    padding: 0;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 3px;
  }
  .gopage:hover { color: var(--marker); }

  .cardmeta button {
    padding: 2px 7px;
    font-size: 11px;
    border-radius: 5px;
    color: var(--muted);
  }
  /* 띄어쓰기 없는 긴 문자열이 들어와도 패널을 밀지 않게 강제로 접는다 */
  .cardtext {
    font-size: var(--note-fs);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .cardtext.loading { color: var(--muted); }

  .cardedit label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 4px;
  }
  .cardedit input,
  .cardedit textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 9px;
    resize: vertical;
  }
  .cardedit input:focus,
  .cardedit textarea:focus { outline: none; border-color: var(--marker); }
  .cardedit .editbtns { display: flex; gap: 8px; margin-top: 10px; }
  .cardedit .editbtns button { padding: 5px 14px; font-size: 13px; }

  .ask {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-size: 13px;
    color: var(--muted);
  }
  .askrow { display: flex; gap: 8px; margin-top: 7px; }
  .askrow button { padding: 5px 14px; font-size: 13px; }

  .done {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px dashed var(--rule);
    font-size: 12px;
    color: var(--marker);
  }

  .more { margin-top: 9px; }
  .more button { font-size: 13px; padding: 5px 11px; }

  /*
   * Claude 상태 칩 — 늘 보인다.
   * 예전에는 AI를 부르다 실패해야만 안내가 떴다. 그때는 이미 늦다.
   */
  .chip {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: var(--ink-2);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { display: inline-flex; }
  .chip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .chip.ready { color: var(--muted); }
  .chip.ready .dot { background: #57c98a; }
  .chip.need { color: var(--marker); border-color: rgba(255,216,61,0.45); }
  .chip.need .dot { background: var(--marker); }
  .chip:hover { border-color: var(--marker); }

  /* Claude Code가 준비 안 됐을 때만 뜨는 띠 */
  .cliwarn {
    display: none;
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    background: rgba(255, 139, 107, 0.10);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text);
  }
  .cliwarn.on { display: block; }
  .cliwarn .why { color: var(--muted); margin-bottom: 8px; }
  .cliwarn .row { display: flex; gap: 8px; }
  .cliwarn button { font-size: 12px; padding: 6px 10px; }
  .cliwarn code {
    background: var(--ink);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11.5px;
  }

  /* 질문 입력칸 — 내보내기 버튼 위, 카드 목록 바로 아래 */
  .askbar {
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 8px;
  }
  .askbar input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 8px 10px;
  }
  .askbar input:focus { outline: none; border-color: var(--marker); }
  .askbar button { font-size: 13px; padding: 8px 12px; }

  /* 질문 카드는 오려낸 카드와 구분되게 왼쪽에 띠를 둔다 */
  .card.qna { border-left: 3px solid var(--marker); }
  .qtext {
    font-size: calc(var(--note-fs) - 1px);
    overflow-wrap: anywhere;
    color: var(--marker);
    margin-bottom: 8px;
    line-height: 1.5;
  }

  /* 질문 범위 토글 — 이 쪽 / 전체 */
  /* 오려낸 뒤 무엇을 시킬지 고르는 칸 */
  .pick { padding-top: 2px; }
  .picktitle { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .pickrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .pickrow button { font-size: 12px; padding: 5px 10px; border-radius: 6px; }
  .pickfree { display: flex; gap: 6px; }
  .pickfree input {
    flex: 1; min-width: 0; font: inherit; font-size: 12.5px;
    color: var(--text); background: var(--ink);
    border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px;
  }
  .pickfree input:focus { outline: none; border-color: var(--marker); }
  .pickfree button { font-size: 12px; padding: 6px 10px; }
  .modetag { color: var(--marker); font-size: 11.5px; }

  .scope {
    font-size: 11.5px;
    padding: 6px 8px;
    border-radius: 7px;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .scope.all { color: var(--marker); border-color: rgba(255, 216, 61, 0.5); }

  /* 답에서 쪽 번호를 뽑아 만든 이동 버튼 */
  .jump { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .jump button { font-size: 11.5px; padding: 3px 9px; border-radius: 5px; }

  .foot select {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 6px;
    flex: 0 0 auto;
  }

  .foot {
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 8px;
  }
  .foot button { flex: 1; font-size: 13px; padding: 8px; }

  .status {
    padding: 6px 14px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--rule);
    background: var(--ink-2);
    min-height: 31px;
  }
  .status.err { color: var(--danger); }
  .status button {
    margin-left: 8px;
    font-size: 12px;
    padding: 2px 9px;
    border-radius: 5px;
    color: var(--marker);
    border-color: rgba(255, 216, 61, 0.5);
  }
  /* 뺀 메모를 다시 붙이는 자리 */
  .reput { margin-top: 9px; }
  .reput button { font-size: 12px; padding: 5px 11px; border-radius: 6px; }

  .veil {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 17, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .sheet {
    background: var(--ink-2);
    border: 1px solid var(--rule);
    border-radius: 12px;
    width: min(620px, 100%);
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet h3 {
    margin: 0;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 650;
    border-bottom: 1px solid var(--rule);
  }
  .sheet .sbody { padding: 14px 16px; overflow: auto; }
  .sheet textarea {
    width: 100%;
    height: 300px;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
  }
  .sheet .note { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  /* 정리 내보내기 — 항목 고르기 */
  .picklist { max-height: 46vh; overflow-y: auto; margin-top: 6px; }
  .pickitem {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px 6px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .pickitem:hover { background: rgba(255, 255, 255, 0.03); }
  .pickitem input { margin-top: 3px; flex: 0 0 auto; }
  .pickitem img {
    width: 62px; height: 44px; object-fit: cover;
    border-radius: 4px; background: #fff; flex: 0 0 auto;
  }
  .pickitem .pi { min-width: 0; flex: 1; }
  .pickitem .pih { font-size: 11.5px; color: var(--muted); }
  .pickitem .pib {
    font-size: 13px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .pickbar { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .pickbar button { font-size: 12px; padding: 5px 10px; }
  .pickbar .n { margin-left: auto; color: var(--muted); font-size: 12px; }

  .sheet .sfoot {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--rule);
    align-items: center;
  }
  .dl {
    display: inline-block;
    background: var(--marker);
    color: #1c1500;
    font-weight: 650;
    font-size: 14px;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 7px;
  }
  .sheet .sfoot .spacer { flex: 1; }

  /* 도구 고르기 — 오려내기 / 형광펜 */
  .tool {
    display: inline-flex;
    border: 1px solid var(--rule);
    border-radius: 8px;
    overflow: hidden;
  }
  .tool button {
    border: 0;
    border-radius: 0;
    font-size: 12.5px;
    padding: 6px 10px;
    color: var(--muted);
    background: transparent;
  }
  .tool button.on { background: var(--marker); color: #1c1500; font-weight: 650; }

  .pens { display: none; gap: 5px; align-items: center; }
  .pens.on { display: inline-flex; }
  .pens button {
    width: 20px; height: 20px; padding: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  .pens button.on { border-color: var(--text); }

  /*
   * 형광펜 자국. 클래스 이름이 .mark면 앱 로고(.mark)와 부딪힌다.
   * multiply를 쓰는 이유는 진짜 형광펜처럼 글자가 비쳐 보이게 하려는 것이다.
   * 불투명하게 덮으면 정작 읽어야 할 글자가 가려진다.
   */
  /*
   * 범위 표시 테두리
   *
   * 오려낸 자리를 알려 주는 노란 네모다. AI에 보낸 그림 범위(card.rect)와는
   * 따로 둔다 — 이건 눈으로 보기 좋게 글자에 맞추려고 만지는 것이라,
   * 여기를 옮긴다고 이미 물어본 그림이 달라지면 안 된다.
   */
  .boxsel {
    position: absolute;
    border: 2px solid var(--marker);
    border-radius: 2px;
    background: transparent;
    cursor: move;
    z-index: 3;
  }
  .boxsel .bh {
    position: absolute;
    width: 11px;
    height: 11px;
    background: var(--marker);
    border: 1px solid #6b5500;
    border-radius: 2px;
  }
  .boxsel .bh.nw { left: -6px; top: -6px; cursor: nwse-resize; }
  .boxsel .bh.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .boxsel .bh.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
  .boxsel .bh.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .boxsel .bdel {
    position: absolute;
    right: -1px;
    top: -23px;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
  }

  .hlmark {
    position: absolute;
    z-index: 2;              /* 테두리·메모보다 아래 */
    mix-blend-mode: multiply;
    border-radius: 2px;
    cursor: pointer;
  }
  .hlmark:hover { outline: 1px solid rgba(0, 0, 0, 0.35); }
  /* 고른 자국은 테두리로 알린다. 지우기는 X 버튼이나 Delete 키로 한다 */
  .hlmark.on { outline: 2px solid #333; }
  .hldel {
    position: absolute;
    z-index: 6;
    width: 20px;
    height: 20px;
    padding: 0;
    line-height: 1;
    font-size: 13px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--text);
    border: 1px solid var(--rule);
  }
  .hldel:hover { border-color: var(--danger); color: var(--danger); }

  .pageflip {
    position: sticky;
    top: 42vh;
    align-self: flex-start;
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    margin: 0 10px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: rgba(34, 50, 63, 0.78);
    color: var(--text);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    /* 수업 중에 시선을 뺏지 않도록 평소엔 흐리게 두고, 가져가면 또렷해진다 */
    opacity: 0.32;
    transition: opacity 0.15s;
  }
  .pageflip:hover { opacity: 1; }
  /* 첫/끝 쪽에서는 감추되 자리는 남긴다 — 사라지면 페이지가 좌우로 튄다 */
  .pageflip:disabled { opacity: 0; pointer-events: none; }
  .pageflip.gone { display: none; }


  @media (max-width: 820px) {
    .main { flex-direction: column; }
    .notes { width: auto; border-left: 0; border-top: 1px solid var(--rule); max-height: 46vh; }
    .stage { padding: 12px; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function () {
  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  var $ = function (id) { return document.getElementById(id); };

  // 버전 표시. 실패해도 조용히 넘어간다 — 이것 때문에 앱이 안 뜨면 안 된다
  fetch("/api/version")
    .then(function (r) { return r.json(); })
    .then(function (d) { $("ver").textContent = "v" + d.version; })
    .catch(function () {});

  /*
   * Claude Code 준비 상태
   *
   * "정리를 받아오지 못했습니다"만 뜨면 사용자는 뭘 해야 할지 알 수 없다.
   * 깔려 있는지 먼저 확인해서, 아니면 무엇이 문제인지와 할 일을 같이 보여준다.
   */
  function setChip(cls, text) {
    var c = $("chip");
    c.className = "chip on " + cls;
    $("chipText").textContent = text;
  }

  function showCliWarn(msg, open) {
    $("cliwhy").innerHTML = msg;
    if (open) $("cliwarn").classList.add("on");
  }

  /*
   * 시작하자마자 확인한다.
   * 설치 여부만 보면 "깔려는 있는데 로그인 안 된" 상태가 통과해서,
   * 정작 AI를 부를 때가 되어서야 실패했다. 로그인까지 본다.
   */
  function checkCli() {
    setChip("", "확인 중…");
    return fetch("/api/status")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.mode !== "cli") {              // API 모드면 Claude Code가 필요 없다
          setChip("ready", "API 모드");
          $("cliwarn").classList.remove("on");
          return true;
        }
        var c = d.claude || {};
        if (!c.installed) {
          setChip("need", "Claude Code 설치 필요");
          showCliWarn(
            "AI 정리를 쓰려면 Claude Code가 필요합니다.<br />" +
            "터미널에서 <code>npm i -g @anthropic-ai/claude-code</code> 로 설치한 뒤, " +
            "아래 버튼으로 로그인하세요.", true);
          return false;
        }
        if (!c.loggedIn) {
          setChip("need", "Claude 로그인 필요");
          showCliWarn(
            "Claude Code는 설치돼 있는데 <b>로그인이 안 돼 있습니다.</b><br />" +
            "아래 버튼을 누르면 로그인 창이 열립니다. 마치고 “다시 확인”을 눌러 주세요.", true);
          return false;
        }
        setChip("ready", "Claude 준비됨");
        showCliWarn(
          "Claude Code에 로그인돼 있습니다" + (c.version ? " (" + c.version + ")" : "") + ".<br />" +
          "계정을 바꾸려면 아래에서 다시 로그인하세요.", false);
        $("cliwarn").classList.remove("on");
        return true;
      })
      .catch(function () {
        setChip("", "상태 확인 실패");
        return true;                          // 확인이 안 될 뿐이니 굳이 막지 않는다
      });
  }

  // 칩을 누르면 언제든 로그인 칸을 열 수 있다 — 준비된 상태에서도 계정을 바꿀 수 있어야 한다
  $("chip").onclick = function () {
    var w = $("cliwarn");
    if (w.classList.contains("on")) { w.classList.remove("on"); return; }
    w.classList.add("on");
    checkCli().then(function (ok) { if (ok) w.classList.add("on"); });
  };

  $("cliLogin").onclick = function () {
    var b = $("cliLogin");
    b.disabled = true;
    b.textContent = "여는 중…";
    fetch("/api/login", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        b.textContent = d.ok ? "터미널을 열었습니다" : "열지 못했습니다";
        if (!d.ok) {
          showCliWarn("터미널을 열지 못했습니다. 직접 터미널에서 <code>claude auth login</code> 을 실행해 주세요.", true);
        }
      })
      .catch(function () { b.textContent = "열지 못했습니다"; })
      .then(function () {
        setTimeout(function () { b.disabled = false; b.textContent = "로그인 창 열기"; }, 2500);
      });
  };

  $("cliRecheck").onclick = function () {
    $("cliRecheck").textContent = "확인 중…";
    checkCli().then(function (ok) {
      $("cliRecheck").textContent = "다시 확인";
      if (ok) setStatus("Claude Code가 준비됐습니다.");
    });
  };

  checkCli();

  var state = {
    pdf: null,
    bytes: null,          // 내보내기용 원본 사본
    docKey: null,
    docName: "",
    page: 1,
    pages: 0,
    scale: 1.25,
    userZoomed: false,      // 손으로 확대한 뒤에는 자동 맞춤이 끼어들지 않게
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    dprUsed: Math.min(window.devicePixelRatio || 1, 2),   // 픽셀 상한을 걸고 실제로 쓴 배율
    viewport: null,
    pageW: 0,               // 쪽 크기(PDF 포인트). 메모를 같은 치수로 그리려면 필요하다
    pageH: 0,
    canvas: null,
    layer: null,
    cards: [],            // {id,page,img,memo,summary,detail,rect,inserted}
    marks: [],            // 형광펜 자국 {id,page,color,rects:[정규화]}
    selMark: null,        // 고른 형광펜
    tool: "clip",
    hlColor: 0,
    openPin: null,
    renderTask: null
  };

  /*
   * 되돌리기
   *
   * 붙인 메모를 빼거나 카드를 지우면 되살릴 방법이 없었다. 특히 직접 쓴
   * 메모는 지우는 순간 글까지 사라진다. 마지막 한 번은 되돌릴 수 있게 한다
   * (상태줄의 되돌리기 버튼, 또는 Ctrl+Z).
   */
  var undoFn = null;

  function offerUndo(msg, fn) {
    undoFn = fn;
    var el = $("status");
    el.className = "status";
    el.textContent = msg + " ";
    var b = document.createElement("button");
    b.textContent = "되돌리기";
    b.onclick = doUndo;
    el.appendChild(b);
  }

  function doUndo() {
    if (!undoFn) { setStatus("되돌릴 것이 없습니다."); return; }
    var f = undoFn;
    undoFn = null;
    f();
  }

  function setStatus(msg, isErr) {
    undoFn = null;
    var el = $("status");
    el.textContent = msg || "";
    el.className = "status" + (isErr ? " err" : "");
  }

  /* ---------- 저장 ---------- */

  function hasStorage() {
    return typeof window !== "undefined" && window.storage && window.storage.get;
  }

  function indexKey() { return "capnote:" + state.docKey + ":index"; }
  function cardKey(id) { return "capnote:" + state.docKey + ":card:" + id; }

  async function saveCard(card) {
    if (!hasStorage() || !state.docKey) return;
    try {
      await window.storage.set(cardKey(card.id), JSON.stringify(card));
      await window.storage.set(
        indexKey(),
        JSON.stringify({ name: state.docName, ids: state.cards.map(function (c) { return c.id; }) })
      );
    } catch (e) { /* 저장 실패는 사용을 막지 않음 */ }
  }

  async function deleteCard(card) {
    if (!hasStorage() || !state.docKey) return;
    try {
      await window.storage.delete(cardKey(card.id));
      await window.storage.set(
        indexKey(),
        JSON.stringify({ name: state.docName, ids: state.cards.map(function (c) { return c.id; }) })
      );
    } catch (e) {}
  }

  /*
   * 저장된 게 없을 때도 화면을 다시 그려야 한다.
   *
   * 예전에는 불러올 게 없으면 renderCards()를 부르기 전에 빠져나갔다.
   * state.cards는 비웠는데 화면에는 앞서 열었던 PDF의 카드가 그대로 남아,
   * 다른 자료로 바꿔도 남의 정리가 붙어 있는 것처럼 보였다.
   */
  async function loadCards() {
    state.cards = [];
    try {
      if (hasStorage() && state.docKey) {
        var r = await window.storage.get(indexKey());
        var idx = r ? JSON.parse(r.value) : null;
        if (idx && idx.ids) {
          for (var i = 0; i < idx.ids.length; i++) {
            try {
              var c = await window.storage.get(cardKey(idx.ids[i]));
              if (c) state.cards.push(JSON.parse(c.value));
            } catch (e) {}
          }
        }
      }
    } catch (e) { /* 못 읽으면 빈 채로 간다 */ }

    renderCards();
    drawMemos();
    drawMarks();
  }

  /* ---------- 형광펜 ---------- */

  /*
   * 글자에 붙는 형광펜
   *
   * 손이 그은 궤적을 그대로 칠하면 강의 중에는 삐뚤빼뚤해서 보기 나쁘다.
   * 그은 영역 안에 있는 글자 줄만 찾아 그 줄에 딱 맞게 띠를 씌운다.
   * 대충 그어도 결과가 반듯하다. 글자 정보가 없는 스캔 PDF에서는
   * 그은 자리를 그대로 칠하는 쪽으로 물러난다.
   */
  var PENS = [
    { id: "y", name: "노랑", css: "#ffe14d", rgb: [1, 0.882, 0.302] },
    { id: "g", name: "초록", css: "#9fe6a0", rgb: [0.624, 0.902, 0.627] },
    { id: "p", name: "분홍", css: "#ffb3c8", rgb: [1, 0.702, 0.784] }
  ];

  function marksKey() { return "capnote:" + state.docKey + ":marks"; }

  async function saveMarks() {
    if (!hasStorage() || !state.docKey) return;
    try { await window.storage.set(marksKey(), JSON.stringify(state.marks)); } catch (e) {}
  }

  async function loadMarks() {
    state.marks = [];
    if (!hasStorage() || !state.docKey) return;
    try {
      var r = await window.storage.get(marksKey());
      if (r) state.marks = JSON.parse(r.value) || [];
    } catch (e) { state.marks = []; }
  }

  /*
   * 그은 영역 안의 글자를 줄 단위로 묶는다.
   * 같은 줄인지는 세로 중심이 글자 높이의 절반 안에 드는지로 본다.
   */
  async function bandsInRect(rect) {
    var vp = state.viewport, d = state.dprUsed;
    var tc = await textContentOf(state.page);
    var items = [];
    tc.items.forEach(function (it) {
      var t = pdfjsLib.Util.transform(vp.transform, it.transform);
      var h = Math.hypot(t[2], t[3]) / d;
      var w = (it.width || 0) * state.scale;
      var x = t[4] / d, base = t[5] / d;
      if (!(w > 0 && h > 0)) return;
      var top = base - h, cx = x + w / 2, cy = base - h / 2;
      if (cx < rect.x || cx > rect.x + rect.w || cy < rect.y || cy > rect.y + rect.h) return;
      items.push({ x: x, y: top, w: w, h: h, cy: cy });
    });
    if (!items.length) return null;

    items.sort(function (a, b) { return a.cy - b.cy || a.x - b.x; });
    var bands = [], cur = null;
    items.forEach(function (it) {
      if (cur && Math.abs(it.cy - cur.cy) <= Math.max(it.h, cur.h) * 0.5) {
        cur.x0 = Math.min(cur.x0, it.x);
        cur.x1 = Math.max(cur.x1, it.x + it.w);
        cur.y0 = Math.min(cur.y0, it.y);
        cur.y1 = Math.max(cur.y1, it.y + it.h);
        cur.cy = (cur.cy + it.cy) / 2;
        cur.h = Math.max(cur.h, it.h);
      } else {
        cur = { x0: it.x, x1: it.x + it.w, y0: it.y, y1: it.y + it.h, cy: it.cy, h: it.h };
        bands.push(cur);
      }
    });

    var pad = 1.5;
    return bands.map(function (b) {
      return { x: b.x0 - pad, y: b.y0 - pad, w: (b.x1 - b.x0) + pad * 2, h: (b.y1 - b.y0) + pad * 2 };
    });
  }

  async function addMark(rect) {
    var W = state.viewport.width / state.dprUsed;
    var H = state.viewport.height / state.dprUsed;
    var bands = await bandsInRect(rect);
    if (!bands) bands = [rect];          // 글자를 못 찾으면 그은 자리를 그대로

    var mark = {
      id: "m" + Date.now(),
      page: state.page,
      color: PENS[state.hlColor].id,
      rects: bands.map(function (b) {
        return { x: b.x / W, y: b.y / H, w: b.w / W, h: b.h / H };
      })
    };
    state.marks.push(mark);
    saveMarks();
    drawMarks();
  }

  function penOf(id) {
    for (var i = 0; i < PENS.length; i++) if (PENS[i].id === id) return PENS[i];
    return PENS[0];
  }

  /*
   * 형광펜 자국 그리기
   *
   * 예전에는 누르면 바로 지워졌다. 스치기만 해도 사라져서 위험했다.
   * 이제 누르면 고르기만 하고, 지우려면 오른쪽 위 X를 누르거나 Delete를 친다.
   */
  function drawMarks() {
    if (!state.layer || !state.viewport) return;
    Array.prototype.forEach.call(state.layer.querySelectorAll(".hlmark, .hldel"),
      function (m) { m.remove(); });

    var W = state.viewport.width / state.dprUsed;
    var H = state.viewport.height / state.dprUsed;

    state.marks.forEach(function (mk) {
      if (mk.page !== state.page) return;
      var picked = state.selMark === mk.id;
      var top = null, right = null;

      mk.rects.forEach(function (r) {
        var el = document.createElement("div");
        el.className = "hlmark" + (picked ? " on" : "");
        el.style.left = (r.x * W) + "px";
        el.style.top = (r.y * H) + "px";
        el.style.width = (r.w * W) + "px";
        el.style.height = (r.h * H) + "px";
        el.style.background = penOf(mk.color).css;
        el.title = "누르면 골라집니다. 지우려면 X 또는 Delete";
        el.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        el.onclick = function (e) {
          e.stopPropagation();
          state.selMark = picked ? null : mk.id;   // 다시 누르면 고르기 해제
          drawMarks();
        };
        state.layer.appendChild(el);

        if (top === null || r.y < top) top = r.y;
        if (right === null || r.x + r.w > right) right = r.x + r.w;
      });

      if (picked && top !== null) {
        var x = document.createElement("button");
        x.className = "hldel";
        x.textContent = "×";
        x.title = "이 형광펜 지우기";
        x.style.left = Math.min(right * W - 6, W - 22) + "px";
        x.style.top = Math.max(0, top * H - 22) + "px";
        x.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        x.onclick = function (e) { e.stopPropagation(); removeMark(mk); };
        state.layer.appendChild(x);
      }
    });
  }

  function removeMark(mk) {
    var at = state.marks.indexOf(mk);
    state.marks = state.marks.filter(function (x) { return x !== mk; });
    state.selMark = null;
    saveMarks();
    drawMarks();
    offerUndo("형광펜을 지웠습니다.", function () {
      state.marks.splice(at, 0, mk);
      saveMarks();
      drawMarks();
      setStatus("되돌렸습니다.");
    });
  }

  // 도구 · 색 고르기
  function setTool(t) {
    state.tool = t;
    $("toolClip").classList.toggle("on", t === "clip");
    $("toolHl").classList.toggle("on", t === "hl");
    $("pens").classList.toggle("on", t === "hl");
    if (state.layer) state.layer.style.cursor = t === "hl" ? "text" : "crosshair";
  }
  $("toolClip").onclick = function () { setTool("clip"); };
  $("toolHl").onclick = function () { setTool("hl"); };

  PENS.forEach(function (pen, i) {
    var b = document.createElement("button");
    b.style.background = pen.css;
    b.title = pen.name;
    b.className = i === 0 ? "on" : "";
    b.onclick = function () {
      state.hlColor = i;
      Array.prototype.forEach.call($("pens").children, function (c, j) {
        c.classList.toggle("on", j === i);
      });
    };
    $("pens").appendChild(b);
  });

  /* ---------- PDF 열기 ---------- */

  $("open").onclick = $("open2").onclick = function () { $("file").click(); };

  $("file").onchange = async function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    setStatus("여는 중…");
    try {
      /*
       * 다른 자료로 바꾸면 정리 패널을 먼저 비운다.
       * 저장소를 읽는 동안 앞 PDF의 카드가 남아 있으면, 새 자료에 남의 정리가
       * 붙어 있는 것처럼 보인다. 같은 PDF를 다시 열면 아래에서 되살아난다.
       */
      state.cards = [];
      state.marks = [];
      pendingCrops = {};
      undoFn = null;
      $("q").value = "";
      renderCards();
      if (state.layer) { drawMemos(); drawMarks(); }

      var buf = await f.arrayBuffer();
      state.bytes = buf.slice(0);                       // pdf.js가 원본을 가져가므로 사본 보관
      state.pdf = await pdfjsLib.getDocument({ data: buf }).promise;

      /*
       * 우리가 내보낸 PDF라면 메모를 되살린다.
       *
       * 메모 주석은 벗겨내고 다시 읽는다. 안 벗기면 주석이 그려진 그림 위에
       * 우리 메모 상자가 또 얹혀 두 겹으로 보이고, 다시 내보낼 때도 지저분해진다.
       * 벗겨낸 바이트를 원본 삼아 두므로 이후 흐름은 처음 여는 것과 같다.
       */
      var carried = await readCardsFromPdf(state.pdf);
      if (carried) {
        var cleaned = await stripMemoAnnots(state.bytes);
        if (cleaned) {
          state.bytes = cleaned.slice(0);
          state.pdf = await pdfjsLib.getDocument({ data: cleaned }).promise;
        }
      }

      state.pages = state.pdf.numPages;
      state.page = 1;
      state.docName = f.name.replace(/\.pdf$/i, "");
      state.docKey = (f.name + ":" + f.size).replace(/[^\w가-힣.:-]/g, "_").slice(0, 120);
      $("empty").style.display = "none";
      _textCache = {};
      _tcCache = {};
      _allText = null;
      cacheReset();

      // 열자마자 창에 맞춘다
      state.scale = fitScale(await state.pdf.getPage(1));
      state.userZoomed = false;

      /*
       * 메모는 적는 즉시 IndexedDB에 들어간다. 내보내기 전에 앱이 꺼져도
       * 같은 PDF를 다시 열면 그대로 돌아온다. 다만 그게 되고 있는지
       * 사용자가 알 방법이 없어서 몇 개를 불러왔는지 알려 준다.
       */
      await loadCards();
      await loadMarks();
      var restored = state.cards.length;
      if (carried && !state.cards.length) {
        state.cards = carried.cards;
        state.cards.forEach(function (c) { saveCard(c); });
      }
      if (carried && carried.marks.length && !state.marks.length) {
        state.marks = carried.marks;
        saveMarks();
      }
      await renderPage();
      setStatus(state.docName + " · " + state.pages + "쪽" +
                (restored ? " · 저장해 둔 정리 " + restored + "개를 불러왔습니다" : ""));
    } catch (err) {
      setStatus("이 파일을 열지 못했습니다. 다른 PDF로 시도해 보세요.", true);
    }
    e.target.value = "";
  };

  /*
   * 창에 맞는 배율 찾기
   *
   * 배율이 1.25로 고정이라 창 크기와 상관없이 같은 크기로 그려졌다.
   * 16:9 강의 슬라이드는 옆이 남고 A4는 아래가 잘리는 식으로 매번 어긋났다.
   * 페이지 전체가 들어오도록 맞춘다 — 강의자료는 한 장을 통째로 보는 게 먼저다.
   */
  function fitScale(page) {
    var vp = page.getViewport({ scale: 1 });
    var st = $("stage");
    var cs = getComputedStyle(st);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var flips = (46 + 20) * 2;      // 양옆 넘김 버튼이 차지하는 폭
    var w = st.clientWidth - padX - flips;
    var h = st.clientHeight - padY;
    if (!(w > 0 && h > 0)) return state.scale;
    return Math.max(0.25, Math.min(3, Math.min(w / vp.width, h / vp.height)));
  }

  /* ---------- 페이지 그리기 ---------- */

  async function renderPage() {
    if (!state.pdf) return;
    var page = await state.pdf.getPage(state.page);
    /*
     * 캔버스 픽셀 수에 상한을 둔다.
     *
     * 4K 화면을 꽉 채우면 폭*배율*dpr 로 8백만 화소가 넘어가고, 쪽을 넘길
     * 때마다 그만큼을 새로 그리느라 눈에 띄게 느려진다. 화질 차이는 거의
     * 없으면서 그 구간을 없앤다.
     */
    var dpr = state.dpr;
    var probe = page.getViewport({ scale: state.scale * dpr });
    var budget = 4.5e6;
    if (probe.width * probe.height > budget) {
      dpr = dpr * Math.sqrt(budget / (probe.width * probe.height));
    }

    var vp = page.getViewport({ scale: state.scale * dpr });
    state.dprUsed = dpr;
    state.viewport = vp;

    var vp1 = page.getViewport({ scale: 1 });     // 포인트 단위 쪽 크기
    state.pageW = vp1.width;
    state.pageH = vp1.height;

    var wrap = document.querySelector(".pagewrap");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.className = "pagewrap";
      var cv = document.createElement("canvas");
      var ly = document.createElement("div");
      ly.className = "layer";
      wrap.appendChild(cv);
      wrap.appendChild(ly);
      $("stage").insertBefore(wrap, $("flipNext"));   // 두 넘김 버튼 사이에 놓는다
      state.canvas = cv;
      state.layer = ly;
      bindSelection(ly);
    }

    state.canvas.width = vp.width;
    state.canvas.height = vp.height;
    state.canvas.style.width = vp.width / dpr + "px";
    state.canvas.style.height = vp.height / dpr + "px";
    wrap.style.width = vp.width / dpr + "px";

    if (state.renderTask) { try { state.renderTask.cancel(); } catch (e) {} }

    var hit = cacheValid() ? cache.map[state.page] : null;
    if (hit && hit.width === vp.width && hit.height === vp.height) {
      // 미리 그려 둔 게 있다 — 옮겨 붙이기만 한다
      state.canvas.getContext("2d").drawImage(hit, 0, 0);
    } else {
      state.renderTask = page.render({ canvasContext: state.canvas.getContext("2d"), viewport: vp });
      try { await state.renderTask.promise; } catch (e) { return; }
      if (!cacheValid()) { cacheReset(); cache.scale = state.scale; cache.dpr = dpr; }
      if (!cache.map[state.page]) {
        var keep = document.createElement("canvas");
        keep.width = vp.width; keep.height = vp.height;
        keep.getContext("2d").drawImage(state.canvas, 0, 0);
        cache.map[state.page] = keep;
        cache.px += keep.width * keep.height;
      }
    }

    $("pageIn").value = state.page;
    $("pageTotal").textContent = state.pages;
    ["prev", "next", "zoomin", "zoomout", "expMd", "expPdf", "q", "qsend", "qscope", "expScope", "toolClip", "toolHl"].forEach(function (id) {
      $(id).disabled = false;
    });
    $("prev").disabled = state.page <= 1;
    $("next").disabled = state.page >= state.pages;

    // 양옆 버튼은 위 툴바 버튼과 같은 상태를 따른다
    ["flipPrev", "flipNext"].forEach(function (id) { $(id).classList.remove("gone"); });
    prefetchAround();
    $("flipPrev").disabled = $("prev").disabled;
    $("flipNext").disabled = $("next").disabled;

    drawMarks();
    drawMemos();
    refillThumbs();
  }

  /*
   * 되살린 카드에는 썸네일이 없다 (파일을 가볍게 하려고 안 심었다).
   * 지금 그린 쪽에 해당하는 것만 다시 잘라 채운다.
   */
  function refillThumbs() {
    var changed = false;
    state.cards.forEach(function (c) {
      if (c.img || c.qna || c.manual || c.page !== state.page) return;
      if (!c.rect || !(c.rect.w > 0)) return;
      var W = state.viewport.width / state.dprUsed, H = state.viewport.height / state.dprUsed;
      try {
        c.img = cropImage({ x: c.rect.x * W, y: c.rect.y * H, w: c.rect.w * W, h: c.rect.h * H }, 560)
                  .toDataURL("image/jpeg", 0.72);
        changed = true;
      } catch (e) {}
    });
    if (changed) renderCards();
  }

  /*
   * 쪽을 미리 다 그려 둔다.
   *
   * 넘길 때마다 처음부터 그리느라 한 박자 쉬었다. 노트 앱처럼 미리 그려 두면
   * 넘기는 순간은 그림을 옮겨 붙이는 일만 남는다.
   *
   * 다만 전부 메모리에 이고 있을 수는 없다. 쪽 하나가 2백만 화소면 8MB쯤
   * 되므로, 화소 예산을 두고 현재 쪽에서 먼 것부터 버린다. 100쪽짜리를 열어도
   * 앞뒤로 십수 쪽은 늘 준비돼 있어 체감상 "다 불러온" 것과 같다.
   */
  var PAGE_BUDGET_PX = 40e6;
  var cache = { scale: 0, dpr: 0, map: {}, px: 0 };
  var prefetching = false;

  function cacheReset() {
    cache = { scale: 0, dpr: 0, map: {}, px: 0 };
  }

  function cacheValid() {
    return cache.scale === state.scale && cache.dpr === state.dprUsed;
  }

  function cacheEvict() {
    // 예산을 넘으면 지금 보는 쪽에서 가장 먼 것부터 버린다
    while (cache.px > PAGE_BUDGET_PX) {
      var far = null, farD = -1;
      Object.keys(cache.map).forEach(function (k) {
        var d = Math.abs(Number(k) - state.page);
        if (d > farD) { farD = d; far = k; }
      });
      if (far == null || farD <= 1) return;        // 현재 쪽 언저리는 남긴다
      var c = cache.map[far];
      cache.px -= c.width * c.height;
      delete cache.map[far];
    }
  }

  async function renderToCache(n) {
    if (!state.pdf || cache.map[n]) return cache.map[n];
    var scale = state.scale, dpr = state.dprUsed;
    var pg = await state.pdf.getPage(n);
    var vp = pg.getViewport({ scale: scale * dpr });
    var cv = document.createElement("canvas");
    cv.width = vp.width; cv.height = vp.height;
    await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    // 그리는 사이 배율이 바뀌었으면 버린다
    if (scale !== state.scale || dpr !== state.dprUsed) return null;
    if (!cacheValid()) { cacheReset(); cache.scale = scale; cache.dpr = dpr; }
    cache.map[n] = cv;
    cache.px += cv.width * cv.height;
    cacheEvict();
    return cv;
  }

  /*
   * 한가할 때 한 쪽씩 채운다. 현재 쪽에서 가까운 순서로 — 다음 쪽이 가장
   * 급하고, 그다음이 이전 쪽이다. 한 번에 몰아 그리면 화면이 멈춘다.
   */
  function prefetchAround() {
    if (prefetching || !state.pdf) return;
    if (!cacheValid()) { cacheReset(); cache.scale = state.scale; cache.dpr = state.dprUsed; }

    var order = [];
    for (var d = 1; d <= state.pages; d++) {
      if (state.page + d <= state.pages) order.push(state.page + d);
      if (state.page - d >= 1) order.push(state.page - d);
    }
    var next = null;
    for (var i = 0; i < order.length; i++) {
      if (!cache.map[order[i]]) { next = order[i]; break; }
    }
    if (next == null) return;
    if (cache.px > PAGE_BUDGET_PX) return;         // 예산을 다 썼으면 그만

    prefetching = true;
    var run = function () {
      renderToCache(next)
        .catch(function () {})
        .then(function () {
          prefetching = false;
          prefetchAround();                        // 다음 쪽으로 이어 간다
        });
    };
    if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 800 });
    else setTimeout(run, 60);
  }

  $("prev").onclick = $("flipPrev").onclick =
    function () { if (state.page > 1) { state.page--; closeMemoEdit(); renderPage(); } };
  $("next").onclick = $("flipNext").onclick =
    function () { if (state.page < state.pages) { state.page++; closeMemoEdit(); renderPage(); } };
  /*
   * 쪽 번호를 직접 넣어 이동한다. 12쪽짜리는 화살표로 넘겨도 되지만
   * 100쪽 자료에서 "37쪽 봐" 소리를 들으면 화살표로는 답이 없다.
   */
  function gotoPage(n) {
    n = parseInt(n, 10);
    if (!state.pdf || !(n >= 1 && n <= state.pages)) { $("pageIn").value = state.page; return; }
    if (n === state.page) return;
    state.page = n;
    closeMemoEdit();
    renderPage();
  }
  $("pageIn").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); gotoPage($("pageIn").value); $("pageIn").blur(); }
    e.stopPropagation();                    // 좌우 화살표로 쪽이 넘어가지 않게
  });
  $("pageIn").addEventListener("focus", function () { $("pageIn").select(); });
  $("pageIn").addEventListener("blur", function () { $("pageIn").value = state.page; });

  $("zoomin").onclick = function () { zoomPdf(0.25); };
  $("zoomout").onclick = function () { zoomPdf(-0.25); };

  /*
   * 창 크기가 바뀌면 다시 맞춘다. 손으로 확대한 뒤에는 건드리지 않는다 —
   * 일부러 키워 놓은 걸 창 옮겼다고 되돌리면 성가시다.
   */
  var fitTimer = null;
  window.addEventListener("resize", function () {
    if (!state.pdf || state.userZoomed) return;
    clearTimeout(fitTimer);
    fitTimer = setTimeout(async function () {
      var s = fitScale(await state.pdf.getPage(state.page));
      if (Math.abs(s - state.scale) < 0.01) return;
      state.scale = s;
      closeMemoEdit();
      renderPage();
    }, 150);
  });

  /* ---------- 영역 선택 ---------- */

  function bindSelection(layer) {
    var box = null, start = null;

    layer.addEventListener("pointerdown", function (e) {
      if (e.target !== layer) return;
      if (state.selMark) { state.selMark = null; drawMarks(); }      // 핀이나 메모를 누른 경우는 제외
      closeMemoEdit();
      layer.setPointerCapture(e.pointerId);
      var r = layer.getBoundingClientRect();
      start = { x: e.clientX - r.left, y: e.clientY - r.top };
      box = document.createElement("div");
      box.className = "sel";
      layer.appendChild(box);
    });

    layer.addEventListener("pointermove", function (e) {
      if (!start || !box) return;
      var r = layer.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      box.style.left = Math.min(x, start.x) + "px";
      box.style.top = Math.min(y, start.y) + "px";
      box.style.width = Math.abs(x - start.x) + "px";
      box.style.height = Math.abs(y - start.y) + "px";
    });

    function finish(e) {
      if (!start || !box) return;
      var r = layer.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      var rect = {
        x: Math.min(x, start.x), y: Math.min(y, start.y),
        w: Math.abs(x - start.x), h: Math.abs(y - start.y)
      };
      box.remove(); box = null; start = null;
      if (state.tool === "hl") {
        // 형광펜은 한 줄만 그어도 되므로 문턱을 낮춘다
        if (rect.w > 6 && rect.h > 4) addMark(rect);
      } else if (rect.w > 14 && rect.h > 14) {
        capture(rect);
      }
    }

    layer.addEventListener("pointerup", finish);
    layer.addEventListener("pointercancel", function () {
      if (box) box.remove();
      box = null; start = null;
    });

    // 직접 쓰는 메모: 빈 곳을 더블클릭하면 그 자리에 생기고 바로 고칠 수 있다
    layer.addEventListener("dblclick", function (e) {
      if (e.target !== layer) return;
      var r = layer.getBoundingClientRect();
      var W = state.viewport.width / state.dprUsed;
      var H = state.viewport.height / state.dprUsed;
      var at = { x: (e.clientX - r.left) / W, y: (e.clientY - r.top) / H };
      var card = {
        id: "n" + Date.now(),
        page: state.page,
        manual: true,
        inserted: true,
        memo: "",
        summary: "",
        rect: { x: at.x, y: at.y, w: 0, h: 0 },
        pin: at            // 누른 자리가 곧 의도다. 자동 배치를 끼워 넣지 않는다
      };
      state.cards.push(card);
      saveCard(card);
      closeMemoEdit();
      card.editingMemo = true;
      drawMemos();
    });
  }

  /* ---------- 잘라내기 + 텍스트 뽑기 ---------- */

  function cropImage(rect, maxW) {
    var d = state.dprUsed;
    var sx = rect.x * d, sy = rect.y * d, sw = rect.w * d, sh = rect.h * d;
    var out = document.createElement("canvas");
    var k = Math.min(1, (maxW || 1400) / sw);
    out.width = Math.max(1, Math.round(sw * k));
    out.height = Math.max(1, Math.round(sh * k));
    var ctx = out.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(state.canvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
    return out;
  }

  // 같은 쪽의 글자를 드래그할 때마다 다시 읽고 있었다. 한 번만 읽고 쟁여 둔다
  var _tcCache = {};
  async function textContentOf(pageNo) {
    if (_tcCache[pageNo]) return _tcCache[pageNo];
    var page = await state.pdf.getPage(pageNo);
    _tcCache[pageNo] = await page.getTextContent();
    return _tcCache[pageNo];
  }

  async function textInRect(rect) {
    try {
      var vp = state.viewport;
      var tc = await textContentOf(state.page);
      var d = state.dprUsed;
      var out = [];
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(vp.transform, it.transform);
        var x = t[4] / d, y = t[5] / d;
        var h = Math.hypot(t[2], t[3]) / d;
        var w = (it.width || 0) * state.scale;
        var cx = x + w / 2, cy = y - h / 2;
        if (cx >= rect.x && cx <= rect.x + rect.w && cy >= rect.y && cy <= rect.y + rect.h) {
          out.push(it.str);
        }
      });
      return out.join(" ").replace(/\s+/g, " ").trim().slice(0, 2500);
    } catch (e) { return ""; }
  }

  /* ---------- Claude 호출 ---------- */

  async function callClaude(messages) {
    var res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages })
    });
    if (!res.ok) {
      // 서버가 알려준 진짜 이유를 그대로 올려보낸다.
      // 그러지 않으면 Claude Code 미설치도 그냥 "연결 실패"로만 보인다.
      var why = "";
      try { why = (await res.json()).error || ""; } catch (e) {}
      if (/ENOENT|claude CLI/.test(why)) {
        why = "Claude Code가 설치돼 있지 않습니다. 터미널에서 npm i -g @anthropic-ai/claude-code 후 claude auth login 하세요.";
      }
      // 실패했으면 준비 상태를 다시 살펴 안내를 띄운다
      if (/claude|ENOENT|찾지 못했|끝났습니다/.test(why)) checkCli();
      throw new Error(why || ("http " + res.status));
    }
    var data = await res.json();
    return (data.content || [])
      .map(function (i) { return i.type === "text" ? i.text : ""; })
      .filter(Boolean)
      .join("\n");
  }

  function recentContext() {
    return state.cards.slice(-2).map(function (c) {
      return "(" + c.page + "쪽) " + (c.memo || "");
    }).join(" / ");
  }

  /*
   * 오려낸 다음에 무엇을 시킬지 고른다.
   *
   * 예전에는 드래그하자마자 "핵심 정리"를 써 버렸다. 그런데 필요한 게 매번
   * 다르다 — 시험 포인트만 볼 때가 있고, 아예 모르는 개념이라 12살에게
   * 설명하듯 풀어야 할 때가 있다. 한 번 부르고 마는 대신 고르게 한다.
   * 위쪽 "묻지 말고 자동으로 넣기"를 켜면 핵심 정리로 바로 간다.
   */
  var ASK_MODES = [
    { id: "core",  label: "핵심만 정리",
      how: "3~5줄로 짧고 구체적으로 정리하세요. 수업 중에 읽을 것입니다." },
    { id: "deep",  label: "자세히 설명",
      how: "왜 그런지, 어디에 쓰이는지까지 풀어서 설명하세요. 10줄 이내." },
    { id: "kid",   label: "12살에게 설명하듯",
      how: "12살이 알아들을 수 있게 쉬운 말과 비유로 풀어서 설명하세요. " +
           "전문용어를 쓰면 바로 옆에 뜻을 붙이세요. 10줄 이내." },
    { id: "exam",  label: "시험 포인트",
      how: "시험에 나올 만한 것만 뽑으세요. 외워야 할 정의·수치·조건 위주로 5줄 이내." },
    { id: "terms", label: "용어 풀이",
      how: "이 부분에 나오는 용어만 뽑아 '용어 — 뜻' 형식으로 한 줄씩 적으세요." }
  ];

  // 오려낸 원본 그림과 원문은 카드에 넣지 않는다. 저장소에 들어가면 무겁다
  var pendingCrops = {};

  async function capture(rect) {
    var full = cropImage(rect, 1400);
    var thumb = cropImage(rect, 560);
    var id = "c" + Date.now();

    var card = {
      id: id,
      page: state.page,
      img: thumb.toDataURL("image/jpeg", 0.72),
      rect: {
        x: rect.x / (state.viewport.width / state.dprUsed),
        y: rect.y / (state.viewport.height / state.dprUsed),
        w: rect.w / (state.viewport.width / state.dprUsed),
        h: rect.h / (state.viewport.height / state.dprUsed)
      },
      memo: "", summary: "", detail: "",
      inserted: false,
      awaiting: true                       // 무엇을 시킬지 아직 안 골랐다
    };

    pendingCrops[id] = {
      b64: full.toDataURL("image/jpeg", 0.85).split(",")[1],
      text: await textInRect(rect)
    };

    state.cards.push(card);
    renderCards();

    if ($("auto").checked) runCard(card, ASK_MODES[0]);
  }

  async function runCard(card, mode, free) {
    var crop = pendingCrops[card.id] || { b64: null, text: "" };
    card.awaiting = false;
    card.pending = true;
    card.failed = false;
    card.mode = mode ? mode.label : "직접 물음";
    card.askText = free || "";
    renderCards();

    var ctx = recentContext();
    var how = mode ? mode.how : ("다음 질문에 답하세요: " + free);

    var prompt =
      "대학 강의자료 " + card.page + "쪽에서 오려낸 부분입니다.\n" +
      (crop.text ? "이 영역의 원문 텍스트: " + crop.text + "\n" : "") +
      (ctx ? "직전에 오려낸 것들: " + ctx + "\n" : "") +
      "\n" + how + "\n" +
      "\n한국어로 답하고, 아래 JSON만 출력하세요. 설명이나 코드블록 표시는 넣지 마세요.\n" +
      '{"memo": "PDF에 붙일 핵심 3줄. 각 줄 28자 이내로 끊고 줄바꿈 \\n 으로 구분. ' +
      '나중에 이 줄만 봐도 무슨 내용인지 알 수 있게 구체적으로.", ' +
      '"summary": "위에서 시킨 대로 쓴 본문"}';

    var content = [];
    if (crop.b64) {
      content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: crop.b64 } });
    }
    content.push({ type: "text", text: prompt });

    try {
      var raw = await callClaude([{ role: "user", content: content }]);
      var clean = raw.replace(/```json|```/g, "").trim();
      var parsed;
      try { parsed = JSON.parse(clean); }
      catch (e) { parsed = { memo: clean.slice(0, 40), summary: clean }; }
      card.memo = (parsed.memo || "").slice(0, 180);   // 3줄이 들어가야 한다
      card.summary = parsed.summary || clean;
      card.pending = false;
      setStatus("");
    } catch (err) {
      card.pending = false;
      card.summary = "정리를 받아오지 못했습니다.";
      card.failed = true;
      setStatus(String(err.message || err), true);
    }

    renderCards();
    saveCard(card);

    if (!card.failed && $("auto").checked) {
      card.inserted = true;
      if (!card.box && card.rect && card.rect.w > 0) {
        card.box = { x: card.rect.x, y: card.rect.y, w: card.rect.w, h: card.rect.h };
      }
      await placeMemoFor(card);
      renderCards(); drawMemos(); saveCard(card);
    }
  }

  async function expand(card) {
    card.detail = "…";
    renderCards();
    try {
      card.detail = await callClaude([{
        role: "user",
        content: [{
          type: "text",
          text: "다음은 대학 강의자료 " + card.page + "쪽의 한 부분을 정리한 것입니다.\n\n" +
            card.summary +
            "\n\n이걸 처음 배우는 학생이 이해할 수 있게 한국어로 더 풀어서 설명해 주세요. " +
            "왜 그런지, 어디에 쓰이는지까지. 8줄 이내."
        }]
      }]);
    } catch (e) {
      card.detail = "더 자세한 설명을 받아오지 못했습니다.";
    }
    renderCards();
    saveCard(card);
  }

  /*
   * AI에게 직접 묻기
   *
   * 지금 보고 있는 쪽을 이미지로 같이 보낸다. 수업 중에 나오는 질문은
   * 대개 "이거 뭐야"라서, 화면을 안 보여주면 답이 겉돈다.
   * 오려내기와 달리 PDF에 붙일 자리가 없으므로 메모 제안은 하지 않는다.
   */
  async function askQuestion(text) {
    var card = {
      id: "q" + Date.now(),
      page: state.page,
      qna: true,
      scope: qAll ? "all" : "page",
      question: text,
      summary: "",
      pending: true
    };
    state.cards.push(card);
    renderCards();
    $("cards").scrollTop = $("cards").scrollHeight;

    var content = [];
    if (card.scope === "all") {
      var digest = await allPagesDigest();
      content.push({
        type: "text",
        text:
          "다음은 강의자료 " + state.pages + "쪽 전체의 원문입니다.\n\n" + digest +
          "\n\n학생 질문: " + text + "\n\n" +
          "한국어로 짧고 구체적으로 답하세요. 6줄 이내. " +
          "찾은 내용이 어느 쪽에 있는지 반드시 \"N쪽\" 형식으로 밝히세요. " +
          "자료에 없으면 없다고 먼저 말하세요."
      });
      try {
        card.summary = await callClaude([{ role: "user", content: content }]);
        setStatus("");
      } catch (err) {
        card.summary = "답을 받아오지 못했습니다.";
        card.failed = true;
        setStatus(String(err.message || err), true);
      }
      card.pending = false;
      renderCards();
      saveCard(card);
      return;
    }

    try {
      // 화면 전체를 그대로 보내면 크므로 폭을 줄인다
      var shot = cropImage(
        { x: 0, y: 0, w: state.viewport.width / state.dprUsed, h: state.viewport.height / state.dprUsed },
        1100
      );
      content.push({
        type: "image",
        source: { type: "base64", media_type: "image/jpeg", data: shot.toDataURL("image/jpeg", 0.8).split(",")[1] }
      });
    } catch (e) { /* 이미지가 안 잡혀도 질문은 보낸다 */ }

    var ctx = recentContext();
    content.push({
      type: "text",
      text:
        "대학 강의자료 " + card.page + "쪽 화면입니다.\n" +
        (ctx ? "직전에 오려낸 것들: " + ctx + "\n" : "") +
        "\n학생 질문: " + text + "\n\n" +
        "한국어로, 수업 중에 읽을 것이므로 짧고 구체적으로 답하세요. 6줄 이내. " +
        "자료에 없는 내용이면 그렇다고 먼저 말하세요."
    });

    try {
      card.summary = await callClaude([{ role: "user", content: content }]);
      setStatus("");
    } catch (err) {
      card.summary = "답을 받아오지 못했습니다.";
      card.failed = true;
      setStatus(String(err.message || err), true);
    }
    card.pending = false;
    renderCards();
    saveCard(card);
  }

  /*
   * 전체 쪽에서 찾기
   *
   * "어떤 내용이 어느 쪽에 있더라"를 찾을 때 쓴다. 그림은 못 보내므로
   * 쪽마다 원문을 조금씩 잘라 붙여 보낸다. 한 번 읽은 건 쟁여 둔다.
   */
  var _allText = null;
  async function allPagesDigest() {
    if (_allText) return _allText;
    var out = [];
    for (var i = 1; i <= state.pages; i++) {
      try {
        var pg = await state.pdf.getPage(i);
        var tc = await pg.getTextContent();
        var t = tc.items.map(function (x) { return x.str; }).join(" ").replace(/\s+/g, " ").trim();
        if (t) out.push(i + "쪽: " + t.slice(0, 700));
      } catch (e) { /* 한 쪽을 못 읽어도 나머지로 답한다 */ }
    }
    _allText = out.join("\n").slice(0, 60000);
    return _allText;
  }

  var qAll = false;
  $("qscope").onclick = function () {
    qAll = !qAll;
    $("qscope").classList.toggle("all", qAll);
    $("qscope").textContent = qAll ? "전체" : "이 쪽";
    $("q").placeholder = qAll ? "전체 쪽에서 찾아보기" : "이 쪽에 대해 물어보기";
  };

  function sendQuestion() {
    var el = $("q");
    var text = el.value.trim();
    if (!text || !state.pdf) return;
    el.value = "";
    askQuestion(text);
  }

  $("qsend").onclick = sendQuestion;
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); sendQuestion(); }
    e.stopPropagation();      // 좌우 화살표가 페이지를 넘기지 않게
  });

  /* ---------- 카드 ---------- */

  function renderCards() {
    var box = $("cards");
    box.innerHTML = "";
    var list = state.cards.filter(function (c) { return !c.manual; });
    $("count").textContent = list.length ? list.length + "장" : "";

    if (!list.length) {
      box.innerHTML = '<div class="hint">아직 오려낸 것이 없습니다.<br />PDF 위에서 드래그해 보세요.<br />빈 곳을 두 번 누르면 직접 메모를 쓸 수 있고,<br />메모는 끌어서 옮길 수 있습니다.<br />아래 칸에 바로 물어봐도 됩니다.</div>';
      return;
    }

    list.forEach(function (card) {
      var el = document.createElement("div");
      el.className = "card" + (card.qna ? " qna" : "");

      if (!card.qna) {                      // 질문 카드는 오려낸 그림이 없다
        var img = document.createElement("img");
        img.src = card.img;
        img.alt = card.page + "쪽에서 오려낸 부분";
        el.appendChild(img);
      }

      var body = document.createElement("div");
      body.className = "cardbody";

      var meta = document.createElement("div");
      meta.className = "cardmeta";
      // 쪽 표시를 누르면 그 쪽으로 간다 — 목록에서 자료로 되짚어 가는 길
      var jumpable = !(card.qna && card.scope === "all");
      var pg = document.createElement(jumpable ? "button" : "span");
      if (jumpable) {
        pg.className = "gopage";
        pg.title = card.page + "쪽으로 갑니다";
        pg.onclick = function () { gotoPage(card.page); };
      }
      pg.textContent = (card.qna && card.scope === "all" ? "전체" : card.page + "쪽") +
                       (card.qna ? " · 질문" : "");
      if (card.mode && !card.qna) {
        var tag = document.createElement("span");
        tag.className = "modetag";
        tag.textContent = " · " + card.mode;
        pg.appendChild(tag);
      }

      var acts = document.createElement("span");
      acts.style.display = "flex";
      acts.style.gap = "6px";

      if (!card.pending && !card.failed && !card.editing && !card.qna) {
        var ed = document.createElement("button");
        ed.textContent = "고치기";
        ed.onclick = function () { card.editing = true; renderCards(); };
        acts.appendChild(ed);
      }

      var del = document.createElement("button");
      del.textContent = "지우기";
      del.onclick = function () {
        var at = state.cards.indexOf(card);
        state.cards = state.cards.filter(function (c) { return c !== card; });
        deleteCard(card);
        renderCards();
        drawMemos();
        offerUndo("카드를 지웠습니다.", function () {
          card.editingMemo = false;
          state.cards.splice(at, 0, card);
          saveCard(card);
          renderCards(); drawMemos();
          setStatus("되돌렸습니다.");
        });
      };
      acts.appendChild(del);

      meta.appendChild(pg);
      meta.appendChild(acts);
      body.appendChild(meta);

      // 아직 무엇을 시킬지 안 골랐다 — 여기서 고른다
      if (card.awaiting) {
        var pick = document.createElement("div");
        pick.className = "pick";
        var pt = document.createElement("div");
        pt.className = "picktitle";
        pt.textContent = "이 부분을 어떻게 해줄까요?";
        pick.appendChild(pt);

        var prow = document.createElement("div");
        prow.className = "pickrow";
        ASK_MODES.forEach(function (m) {
          var b = document.createElement("button");
          b.textContent = m.label;
          if (m.id === "core") b.className = "primary";
          b.onclick = function () { runCard(card, m); };
          prow.appendChild(b);
        });
        pick.appendChild(prow);

        var pf = document.createElement("div");
        pf.className = "pickfree";
        var pin2 = document.createElement("input");
        pin2.type = "text";
        pin2.placeholder = "직접 물어보기";
        pin2.maxLength = 300;
        var pgo = document.createElement("button");
        pgo.textContent = "묻기";
        pgo.onclick = function () {
          var v = pin2.value.trim();
          if (v) runCard(card, null, v);
        };
        pin2.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); pgo.click(); }
          e.stopPropagation();          // 좌우 화살표가 페이지를 넘기지 않게
        });
        pf.appendChild(pin2); pf.appendChild(pgo);
        pick.appendChild(pf);

        body.appendChild(pick);
        el.appendChild(body);
        box.appendChild(el);
        return;
      }

      if (card.editing) {
        var edit = document.createElement("div");
        edit.className = "cardedit";

        var l1 = document.createElement("label");
        l1.textContent = "PDF에 붙는 한 줄";
        var memoIn = document.createElement("input");
        memoIn.type = "text";
        memoIn.value = card.memo || "";
        memoIn.maxLength = 60;

        var l2 = document.createElement("label");
        l2.textContent = "정리";
        var sumIn = document.createElement("textarea");
        sumIn.rows = 6;
        sumIn.value = card.summary || "";

        edit.appendChild(l1);
        edit.appendChild(memoIn);
        edit.appendChild(l2);
        edit.appendChild(sumIn);

        var detIn = null;
        if (card.detail) {
          var l3 = document.createElement("label");
          l3.textContent = "자세한 설명";
          detIn = document.createElement("textarea");
          detIn.rows = 6;
          detIn.value = card.detail;
          edit.appendChild(l3);
          edit.appendChild(detIn);
        }

        var eb = document.createElement("div");
        eb.className = "editbtns";
        var ok = document.createElement("button");
        ok.className = "primary";
        ok.textContent = "저장";
        ok.onclick = function () {
          card.memo = memoIn.value.slice(0, 60);
          card.summary = sumIn.value;
          if (detIn) card.detail = detIn.value;
          card.editing = false;
          renderCards();
          drawMemos();
          saveCard(card);
        };
        var cancel = document.createElement("button");
        cancel.textContent = "취소";
        cancel.onclick = function () { card.editing = false; renderCards(); };
        eb.appendChild(ok);
        eb.appendChild(cancel);
        edit.appendChild(eb);

        body.appendChild(edit);
        el.appendChild(body);
        box.appendChild(el);
        return;
      }

      if (card.qna) {
        var q = document.createElement("div");
        q.className = "qtext";
        q.textContent = "“" + card.question + "”";
        body.appendChild(q);
      }

      var txt = document.createElement("div");
      txt.className = "cardtext" + (card.pending ? " loading" : "");
      txt.textContent = card.pending
        ? (card.qna ? "답하는 중…" : "정리하는 중…")
        : card.summary;
      body.appendChild(txt);

      if (card.detail) {
        var det = document.createElement("div");
        det.className = "cardtext";
        det.style.marginTop = "9px";
        det.style.color = "var(--muted)";
        det.textContent = card.detail;
        body.appendChild(det);
      }

      // 답에 나온 쪽 번호로 바로 갈 수 있게 한다
      if (card.qna && !card.pending && card.summary) {
        var pages = [];
        String(card.summary).replace(/(\d{1,4})\s*쪽/g, function (_, n) {
          n = parseInt(n, 10);
          if (n >= 1 && n <= state.pages && pages.indexOf(n) < 0) pages.push(n);
          return _;
        });
        if (pages.length) {
          var jr = document.createElement("div");
          jr.className = "jump";
          pages.slice(0, 8).forEach(function (n) {
            var jb = document.createElement("button");
            jb.textContent = n + "쪽으로";
            jb.onclick = function () {
              state.page = n; closeMemoEdit(); renderPage();
            };
            jr.appendChild(jb);
          });
          body.appendChild(jr);
        }
      }

      if (!card.pending && !card.failed && !card.qna) {
        if (!card.detail) {
          var more = document.createElement("div");
          more.className = "more";
          var mb = document.createElement("button");
          mb.textContent = "더 자세히";
          mb.onclick = function () { expand(card); };
          more.appendChild(mb);
          body.appendChild(more);
        }

        if (card.inserted) {
          var done = document.createElement("div");
          done.className = "done";
          done.textContent = "PDF " + card.page + "쪽에 메모로 붙였습니다";
          body.appendChild(done);
        } else if (card.declined) {
          /*
           * 예전에는 한 번 빼면 declined가 남아 다시 붙일 길이 없었다.
           * 언제든 도로 붙일 수 있게 버튼을 남긴다.
           */
          var re = document.createElement("div");
          re.className = "reput";
          var rb = document.createElement("button");
          rb.textContent = "PDF에 다시 붙이기";
          rb.onclick = async function () {
            card.inserted = true;
            card.declined = false;
            if (!card.box && card.rect && card.rect.w > 0) {
              card.box = { x: card.rect.x, y: card.rect.y, w: card.rect.w, h: card.rect.h };
            }
            if (!card.pin) await placeMemoFor(card);
            saveCard(card);
            renderCards(); drawMemos();
          };
          re.appendChild(rb);
          body.appendChild(re);
        } else {
          var ask = document.createElement("div");
          ask.className = "ask";
          ask.textContent = "이 내용을 그 자리에 메모로 붙일까요? — “" + card.memo + "”";
          var row = document.createElement("div");
          row.className = "askrow";
          var yes = document.createElement("button");
          yes.className = "primary";
          yes.textContent = "예";
          yes.onclick = async function () {
            card.inserted = true;
            // 오려낸 자리를 테두리로 남긴다. 이후 조정해도 rect(AI에 보낸 범위)는 그대로다
            if (!card.box && card.rect && card.rect.w > 0) {
              card.box = { x: card.rect.x, y: card.rect.y, w: card.rect.w, h: card.rect.h };
            }
            await placeMemoFor(card);       // 붙이는 순간 자리를 정해 화면과 PDF를 맞춘다
            renderCards(); drawMemos(); saveCard(card);
          };
          var no = document.createElement("button");
          no.textContent = "아니요";
          no.onclick = function () {
            card.declined = true;
            renderCards(); saveCard(card);
          };
          row.appendChild(yes); row.appendChild(no);
          ask.appendChild(row);
          body.appendChild(ask);
        }
      }

      if (card.failed) {
        var retry = document.createElement("div");
        retry.className = "more";
        var rb = document.createElement("button");
        rb.textContent = "다시 시도";
        rb.onclick = function () {
          var q = card.qna ? card.question : null;
          state.cards = state.cards.filter(function (c) { return c !== card; });
          deleteCard(card);
          renderCards();
          // 질문은 내용이 남아 있으니 바로 다시 보낼 수 있다. 오려낸 건 그림이 필요하다
          if (q) askQuestion(q);
          else setStatus("같은 부분을 다시 그어 주세요.");
        };
        retry.appendChild(rb);
        body.appendChild(retry);
      }

      el.appendChild(body);
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  }

  /* ---------- 페이지 위 메모 ---------- */

  /*
   * 메모 치수는 PDF 포인트로 한 번만 정한다.
   * 화면은 이 값을 배율만 맞춰 그리므로 화면과 내보낸 PDF가 같아진다.
   * 8.5pt로 줄인 건, 예전 13pt 상자가 슬라이드 위에서 원문을 가릴 만큼 컸기 때문이다.
   */
  var MEMO = { w: 190, fs: 8.5, lh: 11.6, pad: 6, bar: 3 };

  function ptPx() {                       // 화면에서 1pt가 몇 px인가
    if (!state.viewport || !state.pageW) return 1;
    return (state.viewport.width / state.dprUsed) / state.pageW;
  }

  /*
   * 줄바꿈을 한 곳에서만 계산해 화면과 PDF가 같은 줄을 쓰게 한다.
   * 각자 접으면 폰트 계산이 미묘하게 달라져 줄 수가 어긋난다.
   */
  var _measure = null;
  function memoLines(text) {
    if (!_measure) _measure = document.createElement("canvas").getContext("2d");
    _measure.font = MEMO.fs + "px sans-serif";
    var max = MEMO.w - MEMO.pad * 2 - MEMO.bar;
    var lines = [], cur = "";
    String(text == null ? "" : text).split("").forEach(function (ch) {
      if (ch === "\n") { lines.push(cur); cur = ""; return; }
      if (_measure.measureText(cur + ch).width > max) { lines.push(cur); cur = ch; }
      else cur += ch;
    });
    if (cur || !lines.length) lines.push(cur);
    return lines;
  }

  function memoSize(lines) {
    return { w: MEMO.w, h: MEMO.pad * 2 + lines.length * MEMO.lh };
  }

  function closeMemoEdit() {
    state.cards.forEach(function (c) { c.editingMemo = false; });
  }

  // 자리를 아직 못 정한 옛 카드를 위한 최소한의 자리
  function fallbackPin(card, size) {
    var pw = state.pageW || 1, ph = state.pageH || 1;
    var x = card.rect.x + card.rect.w + 6 / pw;
    if (x + size.w / pw > 1) x = Math.max(0, 1 - size.w / pw);
    return { x: x, y: Math.max(0, Math.min(card.rect.y, 1 - size.h / ph)) };
  }

  /*
   * 범위 테두리 그리기 · 옮기기 · 크기 바꾸기
   *
   * card.box는 card.rect를 베껴 시작하지만 그 뒤로는 따로 논다.
   * rect는 AI에 보낸 그림의 범위라 손대면 이미 받은 정리와 어긋난다.
   */
  function drawBoxes() {
    if (!state.layer || !state.viewport) return;
    Array.prototype.forEach.call(state.layer.querySelectorAll(".boxsel"), function (b) { b.remove(); });

    var W = state.viewport.width / state.dprUsed;
    var H = state.viewport.height / state.dprUsed;

    state.cards.forEach(function (card) {
      if (!card.inserted || card.page !== state.page || !card.box) return;

      var el = document.createElement("div");
      el.className = "boxsel";
      function place() {
        el.style.left = (card.box.x * W) + "px";
        el.style.top = (card.box.y * H) + "px";
        el.style.width = (card.box.w * W) + "px";
        el.style.height = (card.box.h * H) + "px";
      }
      place();
      el.title = "끌어서 옮기고, 모서리로 크기를 맞춥니다";

      ["nw", "ne", "sw", "se"].forEach(function (k) {
        var hd = document.createElement("div");
        hd.className = "bh " + k;
        hd.dataset.k = k;
        el.appendChild(hd);
      });

      var del = document.createElement("button");
      del.className = "bdel";
      del.textContent = "테두리 빼기";
      del.onclick = function (e) {
        e.stopPropagation();
        var had = card.box;
        card.box = null;
        saveCard(card);
        drawBoxes();
        offerUndo("테두리를 뺐습니다.", function () {
          card.box = had; saveCard(card); drawBoxes(); setStatus("되돌렸습니다.");
        });
      };
      del.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      el.appendChild(del);

      var drag = null;
      el.addEventListener("pointerdown", function (e) {
        e.stopPropagation();                 // 레이어의 영역 선택이 시작되지 않게
        el.setPointerCapture(e.pointerId);
        var r = state.layer.getBoundingClientRect();
        drag = {
          k: e.target.dataset ? e.target.dataset.k : null,   // 모서리면 크기 조절
          px: e.clientX - r.left,
          py: e.clientY - r.top,
          box: { x: card.box.x, y: card.box.y, w: card.box.w, h: card.box.h }
        };
      });

      el.addEventListener("pointermove", function (e) {
        if (!drag) return;
        var r = state.layer.getBoundingClientRect();
        var dx = (e.clientX - r.left - drag.px) / W;
        var dy = (e.clientY - r.top - drag.py) / H;
        var b = drag.box, n;

        if (!drag.k) {
          n = { x: b.x + dx, y: b.y + dy, w: b.w, h: b.h };
        } else {
          n = { x: b.x, y: b.y, w: b.w, h: b.h };
          if (drag.k.indexOf("w") >= 0) { n.x = b.x + dx; n.w = b.w - dx; }
          if (drag.k.indexOf("e") >= 0) { n.w = b.w + dx; }
          if (drag.k.indexOf("n") >= 0) { n.y = b.y + dy; n.h = b.h - dy; }
          if (drag.k.indexOf("s") >= 0) { n.h = b.h + dy; }
          var MIN = 8 / W;                   // 너무 작아지면 다시 잡을 수 없다
          if (n.w < MIN) { n.w = MIN; n.x = b.x; }
          if (n.h < MIN) { n.h = MIN; n.y = b.y; }
        }
        n.x = Math.max(0, Math.min(n.x, 1 - n.w));
        n.y = Math.max(0, Math.min(n.y, 1 - n.h));
        card.box = n;
        place();
      });

      function done() {
        if (!drag) return;
        drag = null;
        saveCard(card);
      }
      el.addEventListener("pointerup", done);
      el.addEventListener("pointercancel", done);

      state.layer.appendChild(el);
    });
  }

  function drawMemos() {
    if (!state.layer || !state.viewport) return;
    Array.prototype.forEach.call(state.layer.querySelectorAll(".memo"), function (m) { m.remove(); });

    var k = ptPx();
    var W = state.viewport.width / state.dprUsed;
    var H = state.viewport.height / state.dprUsed;

    state.cards.forEach(function (card) {
      if (!card.inserted || card.page !== state.page) return;

      var lines = memoLines(card.memo || "");
      var size = memoSize(lines);
      if (!card.pin) card.pin = fallbackPin(card, size);

      var el = document.createElement("div");
      el.className = "memo" + (card.manual ? " manual" : "") + (card.editingMemo ? " editing" : "");
      el.style.left = (card.pin.x * W) + "px";
      el.style.top = (card.pin.y * H) + "px";
      el.style.width = (size.w * k) + "px";
      el.style.height = (size.h * k) + "px";
      el.style.padding = (MEMO.pad * k) + "px";
      el.style.borderLeftWidth = (MEMO.bar * k) + "px";
      el.style.fontSize = (MEMO.fs * k) + "px";
      el.style.lineHeight = (MEMO.lh * k) + "px";
      el.title = "끌어서 옮기고, 눌러서 고칩니다";

      if (card.editingMemo) {
        var ta = document.createElement("textarea");
        ta.value = card.memo || "";
        ta.setAttribute("aria-label", "메모 내용");
        el.appendChild(ta);

        var acts = document.createElement("div");
        acts.className = "memoacts";
        var ok = document.createElement("button");
        ok.className = "primary";
        ok.textContent = "저장";
        ok.onclick = function () {
          card.memo = ta.value;
          card.editingMemo = false;
          saveCard(card);
          drawMemos();
          renderCards();
        };
        var rm = document.createElement("button");
        rm.textContent = card.manual ? "지우기" : "메모 빼기";
        rm.onclick = function () {
          if (card.manual) {
            var at = state.cards.indexOf(card);
            state.cards = state.cards.filter(function (c) { return c !== card; });
            deleteCard(card);
            drawMemos(); renderCards();
            offerUndo("직접 쓴 메모를 지웠습니다.", function () {
              card.editingMemo = false;      // 편집하다 지웠어도 되살릴 땐 평소 모습으로
              state.cards.splice(at, 0, card);
              saveCard(card);
              drawMemos(); renderCards();
              setStatus("되돌렸습니다.");
            });
          } else {
            var pin = card.pin;
            card.inserted = false;
            card.declined = true;
            card.editingMemo = false;
            saveCard(card);
            drawMemos(); renderCards();
            offerUndo("메모를 뺐습니다.", function () {
              card.inserted = true;
              card.declined = false;
              card.pin = pin;
              saveCard(card);
              drawMemos(); renderCards();
              setStatus("되돌렸습니다.");
            });
          }
        };
        acts.appendChild(ok); acts.appendChild(rm);
        acts.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        el.appendChild(acts);

        state.layer.appendChild(el);
        ta.focus();
        return;
      }

      lines.forEach(function (ln) {
        var d = document.createElement("div");
        d.className = "mline";
        d.textContent = ln;
        el.appendChild(d);
      });

      /*
       * 끌어 옮기기. 3px까지는 클릭으로 쳐서 손 떨림에 편집이 막히지 않게 한다.
       * 옮긴 자리는 정규화해 card.pin에 적고 내보낼 때 그대로 쓴다.
       */
      var drag = null;
      el.addEventListener("pointerdown", function (e) {
        if (card.editingMemo) return;
        e.stopPropagation();                 // 레이어의 영역 선택이 시작되지 않게
        el.setPointerCapture(e.pointerId);
        var r = state.layer.getBoundingClientRect();
        drag = {
          dx: e.clientX - r.left - parseFloat(el.style.left),
          dy: e.clientY - r.top - parseFloat(el.style.top),
          moved: false
        };
        el.style.cursor = "grabbing";
      });

      el.addEventListener("pointermove", function (e) {
        if (!drag) return;
        var r = state.layer.getBoundingClientRect();
        var x = e.clientX - r.left - drag.dx;
        var y = e.clientY - r.top - drag.dy;
        if (Math.abs(x - parseFloat(el.style.left)) > 3 ||
            Math.abs(y - parseFloat(el.style.top)) > 3) drag.moved = true;
        x = Math.max(0, Math.min(x, W - size.w * k));
        y = Math.max(0, Math.min(y, H - size.h * k));
        el.style.left = x + "px";
        el.style.top = y + "px";
      });

      el.addEventListener("pointerup", function () {
        if (!drag) return;
        var moved = drag.moved;
        drag = null;
        el.style.cursor = "grab";
        if (!moved) {
          closeMemoEdit();
          card.editingMemo = true;
          drawMemos();
          return;
        }
        card.pin = { x: parseFloat(el.style.left) / W, y: parseFloat(el.style.top) / H };
        saveCard(card);
      });

      el.addEventListener("pointercancel", function () { drag = null; });
      state.layer.appendChild(el);
    });
  
    // 테두리는 메모와 늘 같이 움직인다. 여기서 함께 그려야 지우고도 남는 일이 없다
    drawBoxes();
  }

  /*
   * 메모를 붙이는 순간 자리를 정한다.
   * 예전에는 내보낼 때 잡아서 화면에서 본 위치와 결과가 달랐다.
   */
  /* ---------- 내보낸 PDF를 다시 열기 위한 표시 ---------- */

  var CAPNOTE_KEY = "Capnote";

  function addMemoAnnot(doc, page, pngRef, x, y, w, h, text) {
    var ap = doc.context.stream("q " + w + " 0 0 " + h + " 0 0 cm /Img Do Q", {
      Type: "XObject", Subtype: "Form", FormType: 1,
      BBox: [0, 0, w, h],
      Resources: { XObject: { Img: pngRef } }
    });
    var annot = doc.context.obj({
      Type: "Annot", Subtype: "Stamp",
      Rect: [x, y, x + w, y + h],
      F: 4,                                    // 인쇄에도 나오게
      AP: { N: doc.context.register(ap) },
      T: PDFLib.PDFString.of("오려둔 공책"),
      Contents: PDFLib.PDFString.of(String(text).slice(0, 300)),
      Capnote: PDFLib.PDFBool.True             // 다음에 찾아 지우기 위한 표시
    });
    page.node.addAnnot(doc.context.register(annot));
  }

  /*
   * 형광펜은 PDF 표준 Highlight 주석으로 넣는다.
   *
   * 굿노트 같은 뷰어가 형광펜으로 알아보고, 진짜 형광펜처럼 글자가 비쳐 보인다.
   * 그림으로 구우면 글자를 덮어 버린다. Multiply를 쓰는 모양(AP)도 같이 넣어
   * 자체 렌더링을 안 하는 뷰어에서도 같게 보이게 한다.
   * 메모와 같은 /Capnote 표시를 달아 다시 내보낼 때 지우고 새로 넣는다.
   */
  function addMarkAnnot(doc, page, r, rgb) {
    var x = r.x, y = r.y, w = r.w, h = r.h;
    var ap = doc.context.stream(
      "/GS gs " + rgb[0] + " " + rgb[1] + " " + rgb[2] + " rg 0 0 " + w + " " + h + " re f",
      {
        Type: "XObject", Subtype: "Form", FormType: 1,
        BBox: [0, 0, w, h],
        Resources: { ExtGState: { GS: { Type: "ExtGState", BM: "Multiply", ca: 1 } } }
      }
    );
    var annot = doc.context.obj({
      Type: "Annot", Subtype: "Highlight",
      Rect: [x, y, x + w, y + h],
      // 왼위, 오른위, 왼아래, 오른아래 순서다
      QuadPoints: [x, y + h, x + w, y + h, x, y, x + w, y],
      C: rgb,
      CA: 1,
      F: 4,
      AP: { N: doc.context.register(ap) },
      T: PDFLib.PDFString.of("오려둔 공책"),
      Capnote: PDFLib.PDFBool.True
    });
    page.node.addAnnot(doc.context.register(annot));
  }

  /*
   * 범위 테두리는 Square 주석으로 넣는다. 화면에서 맞춰 둔 자리를 그대로 쓴다.
   * 메모·형광펜과 같은 /Capnote 표시를 달아 다시 내보낼 때 겹치지 않는다.
   */
  function addBoxAnnot(doc, page, r) {
    var ap = doc.context.stream(
      "1 0.85 0.24 RG 1.5 w 0.75 0.75 " + (r.w - 1.5) + " " + (r.h - 1.5) + " re S",
      { Type: "XObject", Subtype: "Form", FormType: 1, BBox: [0, 0, r.w, r.h] }
    );
    var annot = doc.context.obj({
      Type: "Annot", Subtype: "Square",
      Rect: [r.x, r.y, r.x + r.w, r.y + r.h],
      C: [1, 0.85, 0.24],
      BS: { W: 1.5, S: "S" },
      F: 4,
      AP: { N: doc.context.register(ap) },
      T: PDFLib.PDFString.of("오려둔 공책"),
      Capnote: PDFLib.PDFBool.True
    });
    page.node.addAnnot(doc.context.register(annot));
  }

  function removeMemoAnnots(doc, page) {
    var a = page.node.Annots();
    if (!a) return 0;
    var n = 0;
    for (var i = a.size() - 1; i >= 0; i--) {
      var d = doc.context.lookup(a.get(i));
      if (d && d.get && d.get(PDFLib.PDFName.of(CAPNOTE_KEY))) { a.remove(i); n++; }
    }
    return n;
  }

  function saveCardsIntoPdf(doc, cards, carriedMarks) {
    try {
      var slim = cards.map(function (c) {
        var o = {};
        Object.keys(c).forEach(function (k) {
