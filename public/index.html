<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>오려둔 공책</title>
<script src="storage.js"></script>
</head>
<body>
<div id="root">
<style>
  :root {
    --ink: #141d27;
    --ink-2: #1b2836;
    --ink-3: #22323f;
    --rule: #2f4457;
    --paper: #ffffff;
    --text: #dfe8f0;
    --muted: #8ba0b4;
    --marker: #ffd83d;
    --marker-soft: rgba(255, 216, 61, 0.22);
    --danger: #ff8b6b;
    --notes-w: 350px;              /* 정리 패널 폭 — 쪽 번호 표시가 이 값을 따라간다 */
    --note-fs: 14px;        /* 정리 패널 글자 크기. 사용자가 바꾼다 */
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; overflow: hidden; }

  #root {
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    /*
     * min-height가 아니라 height다.
     * min-height면 정리 패널 내용이 길어질 때 #root가 화면 밖으로 늘어나고,
     * flex:1인 PDF 영역까지 같이 늘어나 비율이 무너졌다.
     * 높이를 화면에 고정하고, 넘치는 건 안쪽 패널이 스스로 스크롤한다.
     */
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-size: 15px;
    line-height: 1.6;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--ink-2);
    flex-wrap: wrap;
  }

  .mark {
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-right: 4px;
    font-size: 15px;
  }
  .mark span { color: var(--marker); }
  /* 어느 빌드를 보고 있는지 한눈에 — 설치파일 이름만으로는 구분이 안 된다 */
  .ver {
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-left: -2px;
    align-self: center;
  }

  button {
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--marker); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }

  .primary {
    background: var(--marker);
    color: #1c1500;
    border-color: var(--marker);
    font-weight: 650;
  }

  .pageno {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .pageno input {
    width: 42px;
    text-align: center;
    font: inherit;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 4px 2px;
  }
  .pageno input:focus { outline: none; border-color: var(--marker); }

  .spacer { flex: 1; }

  .toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  /* 자동 넣기 고르기 — 접힌 버튼 하나 + 누를 때만 펴지는 목록 */
  .autow { position: relative; flex: 0 0 auto; }
  .autobtn { font-size: 12.5px; padding: 6px 11px; color: var(--muted); }
  .autobtn b { color: var(--marker); font-weight: 600; }
  .autobtn.on { border-color: rgba(255, 216, 61, 0.5); }
  .autopop {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 20;
    width: 236px;
    padding: 8px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--ink-2);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
  }
  .autopop.gone { display: none; }
  .aphead { font-size: 11.5px; color: var(--muted); padding: 2px 4px 7px; }
  .aplist { display: flex; flex-direction: column; gap: 3px; }
  .aplist button {
    text-align: left;
    font-size: 12.5px;
    padding: 6px 9px;
    border-radius: 6px;
    background: transparent;
    border-color: transparent;
  }
  .aplist button:hover { background: var(--ink-3); }
  .aplist button.on {
    background: var(--ink-3);
    border-color: rgba(255, 216, 61, 0.5);
    color: var(--marker);
  }
  .apfree { display: flex; gap: 5px; margin-top: 8px; }
  .apfree input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .apfree button { font-size: 12px; padding: 6px 9px; flex: 0 0 auto; }
  .apbulk { margin-top: 8px; border-top: 1px solid var(--rule); padding-top: 8px; }
  .apbulk button { width: 100%; font-size: 12.5px; padding: 7px 9px; }

  /* 모든 쪽 정리 창 */
  .bulkrow {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .bulkrow input, .bulkrow select {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 6px 8px;
  }
  .bulkrow input { width: 68px; text-align: center; }
  .toggle input { accent-color: var(--marker); width: 15px; height: 15px; }

  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .stage {
    flex: 1;
    overflow: auto;
    padding: 20px;
    display: flex;
    justify-content: center;
    /*
     * safe를 붙이는 이유: 그냥 center면 페이지가 화면보다 클 때
     * 위쪽이 잘려 나가고 스크롤로도 못 올라간다.
     * safe는 넘칠 때만 자동으로 시작 정렬로 돌아간다.
     */
    align-items: safe center;
    min-width: 0;
  }

  .empty {
    margin: auto;
    text-align: center;
    max-width: 380px;
    color: var(--muted);
  }
  .empty h2 {
    color: var(--text);
    font-size: 19px;
    font-weight: 650;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .empty p { margin: 0 0 18px; font-size: 14px; }

  .pagewrap {
    position: relative;
    background: var(--paper);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    line-height: 0;
  }
  canvas { display: block; }

  .layer {
    position: absolute;
    inset: 0;
    cursor: crosshair;
    touch-action: none;
  }

  .sel {
    position: absolute;
    border: 2px solid var(--marker);
    background: var(--marker-soft);
    pointer-events: none;
  }

  /*
   * 화면의 메모 = 내보낸 PDF의 메모
   *
   * 예전에는 화면엔 21px 핀을, PDF엔 230pt 상자를 그렸다. 서로 다른 물건이라
   * "넣을 때 본 자리"가 내보내면 의미가 없었다. 이제 치수를 PDF 포인트로 한 번만
   * 정하고, 화면은 그걸 배율만 맞춰 그린다. 크기·줄바꿈·자리가 같아진다.
   */
  .memo {
    position: absolute;
    box-sizing: border-box;
    background: #fff8dc;
    color: #241d00;
    border-left-style: solid;
    border-left-color: var(--marker);
    font-family: sans-serif;
    cursor: grab;
    overflow: hidden;
    z-index: 4;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
  }
  .memo.manual { border-left-color: #4aa3e0; }
  .memo:hover { outline: 1px solid var(--marker); }
  .memo.editing { cursor: default; overflow: visible; z-index: 8; }
  .memo .mline { white-space: pre; }
  .memo textarea {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    border: 0;
    background: #fffdf2;
    color: inherit;
    font: inherit;
    padding: inherit;
    resize: none;
    outline: none;
  }
  .memoacts {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 5px;
    display: flex;
    gap: 6px;
    white-space: nowrap;
  }
  .memoacts button { font-size: 12px; line-height: 1.35; padding: 4px 9px; border-radius: 5px; }

  .notes {
    /* 폭은 --notes-w 하나로 정한다. 모서리를 끌면 그 값이 바뀐다 */
    position: relative;
    flex: 0 0 var(--notes-w);
    width: var(--notes-w);
    min-width: 0;
    border-left: 1px solid var(--rule);
    background: var(--ink-2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* 폭 잡이 — 평소엔 안 보이다가 가져가면 드러난다 */
  .ngrip {
    position: absolute;
    left: -4px;
    top: 0;
    bottom: 0;
    width: 9px;
    z-index: 7;
    cursor: col-resize;
    touch-action: none;
  }
  .ngrip::after {
    content: "";
    position: absolute;
    left: 3px;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
    transition: background 0.15s;
  }
  .ngrip:hover::after, .ngrip.on::after { background: var(--marker); }

  /*
   * PDF만 보기.
   *
   * 수업 중에 자료만 크게 볼 때가 있다. 위 줄도 정리 패널도 접고 종이만 남긴다.
   * 창 전체화면까지 같이 요청하지만, 막히는 환경도 있어 화면 접기는 따로 한다.
   */
  #root.focus .bar,
  #root.focus .notes,
  #root.focus .status { display: none; }
  #root.focus .main { height: 100vh; }
  .exitfocus {
    position: fixed;
    right: 14px;
    top: 12px;
    z-index: 30;
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 999px;
    background: rgba(16, 26, 35, 0.86);
    opacity: 0.35;
    transition: opacity 0.15s;
  }
  .exitfocus:hover { opacity: 1; }
  .exitfocus.gone { display: none; }

  .noteshead {
    padding: 12px 14px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .noteshead strong { font-size: 14px; font-weight: 650; }
  .noteshead .count { color: var(--muted); font-size: 13px; }
  .noteshead .fs {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }
  .noteshead .fs button {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 5px;
    color: var(--muted);
  }

  .cards { flex: 1; overflow-y: auto; padding: 12px; }

  .hint {
    color: var(--muted);
    font-size: calc(var(--note-fs) - 1px);
    padding: 22px 8px;
    text-align: center;
    line-height: 1.7;
  }

  .card {
    background: var(--ink-3);
    border: 1px solid var(--rule);
    border-radius: 9px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .card img {
    width: 100%;
    display: block;
    background: #fff;
    border-bottom: 1px solid var(--rule);
  }
  .cardbody { padding: 10px 12px 12px; }
  .cardmeta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  /* 카드의 쪽 표시를 눌러 그 쪽으로 간다 */
  .gopage {
    background: none;
    border: 0;
    padding: 0;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 3px;
  }
  .gopage:hover { color: var(--marker); }

  .cardmeta button {
    padding: 2px 7px;
    font-size: 11px;
    border-radius: 5px;
    color: var(--muted);
  }
  /* 띄어쓰기 없는 긴 문자열이 들어와도 패널을 밀지 않게 강제로 접는다 */
  .cardtext {
    font-size: var(--note-fs);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  /* 앱이 자료를 얼마나 읽어냈는지 알리는 줄 */
  .cardnote {
    font-size: 12px;
    line-height: 1.5;
    color: #ffd06b;
    background: rgba(255, 208, 107, 0.09);
    border: 1px solid rgba(255, 208, 107, 0.25);
    border-radius: 7px;
    padding: 7px 9px;
    margin-bottom: 8px;
  }

  /* 답에 섞여 오는 마크다운 표시를 읽을 수 있는 모양으로 (renderText 참고) */
  .cardtext .mdh { font-weight: 600; margin-top: 7px; }
  .cardtext .mdli { padding-left: 13px; position: relative; }
  .cardtext .mdli::before {
    content: "·";
    position: absolute;
    left: 3px;
    color: var(--muted);
  }
  .cardtext .mdgap { height: 7px; }
  .cardtext b { color: var(--marker); font-weight: 600; }
  .cardtext code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.92em;
    background: var(--ink-3);
    padding: 0 3px;
    border-radius: 3px;
  }
  .cardtext.loading { color: var(--muted); }

  .cardedit label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 4px;
  }
  .cardedit input,
  .cardedit textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 9px;
    resize: vertical;
  }
  .cardedit input:focus,
  .cardedit textarea:focus { outline: none; border-color: var(--marker); }
  .cardedit .editbtns { display: flex; gap: 8px; margin-top: 10px; }
  .cardedit .editbtns button { padding: 5px 14px; font-size: 13px; }

  .ask {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-size: 13px;
    color: var(--muted);
  }
  .askrow { display: flex; gap: 8px; margin-top: 7px; }
  .askrow button { padding: 5px 14px; font-size: 13px; }

  .done {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px dashed var(--rule);
    font-size: 12px;
    color: var(--marker);
  }

  .more { margin-top: 9px; }
  .more button { font-size: 13px; padding: 5px 11px; }

  /*
   * Claude 상태 칩 — 늘 보인다.
   * 예전에는 AI를 부르다 실패해야만 안내가 떴다. 그때는 이미 늦다.
   */
  .chip {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: var(--ink-2);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { display: inline-flex; }
  .chip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
  }
  .chip.ready { color: var(--muted); }
  .chip.ready .dot { background: #57c98a; }
  .chip.need { color: var(--marker); border-color: rgba(255,216,61,0.45); }
  .chip.need .dot { background: var(--marker); }
  .chip:hover { border-color: var(--marker); }

  /* Claude Code가 준비 안 됐을 때만 뜨는 띠 */
  .cliwarn {
    display: none;
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    background: rgba(255, 139, 107, 0.10);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text);
  }
  .cliwarn.on { display: block; }
  .cliwarn .why { color: var(--muted); margin-bottom: 8px; }
  .cliwarn .row { display: flex; gap: 8px; }
  .cliwarn button { font-size: 12px; padding: 6px 10px; }
  .cliwarn code {
    background: var(--ink);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11.5px;
  }

  /* 질문 입력칸 — 내보내기 버튼 위, 카드 목록 바로 아래 */
  .askbar {
    padding: 10px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 8px;
  }
  .askbar input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 8px 10px;
  }
  .askbar input:focus { outline: none; border-color: var(--marker); }
  /* 쪽 범위 칸 — "여러 쪽"일 때만 나온다 */
  .askbar input.qrange {
    flex: 0 0 74px;
    width: 74px;
    text-align: center;
    font-size: 12px;
    padding: 8px 4px;
  }
  .askbar input.qrange.gone { display: none; }
  .askbar button { font-size: 13px; padding: 8px 12px; }

  /* 질문 카드는 오려낸 카드와 구분되게 왼쪽에 띠를 둔다 */
  .card.qna { border-left: 3px solid var(--marker); }
  .qtext {
    font-size: calc(var(--note-fs) - 1px);
    overflow-wrap: anywhere;
    color: var(--marker);
    margin-bottom: 8px;
    line-height: 1.5;
  }

  /* 질문 범위 토글 — 이 쪽 / 전체 */
  /* 오려낸 뒤 무엇을 시킬지 고르는 칸 */
  .pick { padding-top: 2px; }
  .picktitle { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .pickrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
  .pickrow button { font-size: 12px; padding: 5px 10px; border-radius: 6px; }

  /* 몇 문장으로 정리할지 — 숫자 칸과 버튼을 한 벌로 붙인다 */
  .nsent { display: inline-flex; align-items: stretch; }
  .nsent input {
    font: inherit;
    font-size: 12px;
    width: 44px;
    text-align: center;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-right: 0;
    border-radius: 6px 0 0 6px;
    padding: 4px 2px;
  }
  .nsent input:focus { outline: none; border-color: var(--marker); }
  .nsent button {
    border-radius: 0 6px 6px 0 !important;
    font-size: 12px;
    padding: 5px 9px;
  }
  .apn { display: flex; padding: 1px 0; }
  .apn .nsent { width: 100%; }
  .apn .nsent button { flex: 1; text-align: left; }
  .aplist .apn.on .nsent button {
    background: var(--ink-3);
    border-color: rgba(255, 216, 61, 0.5);
    color: var(--marker);
  }
  .pickfree { display: flex; gap: 6px; }
  .pickfree input {
    flex: 1; min-width: 0; font: inherit; font-size: 12.5px;
    color: var(--text); background: var(--ink);
    border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px;
  }
  .pickfree input:focus { outline: none; border-color: var(--marker); }
  .pickfree button { font-size: 12px; padding: 6px 10px; }
  .modetag { color: var(--marker); font-size: 11.5px; }

  .scope {
    font-size: 11.5px;
    padding: 6px 8px;
    border-radius: 7px;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .scope.all { color: var(--marker); border-color: rgba(255, 216, 61, 0.5); }
  .scope.chat { color: #7fc4ff; border-color: rgba(127, 196, 255, 0.5); }

  /* 답에서 쪽 번호를 뽑아 만든 이동 버튼 */
  .jump { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .jump button { font-size: 11.5px; padding: 3px 9px; border-radius: 5px; }

  .foot select {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 7px 6px;
    flex: 0 0 auto;

    width: 20px; height: 20px; padding: 0;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  .pens button.on { border-color: var(--text); }

  /*
   * 형광펜 자국. 클래스 이름이 .mark면 앱 로고(.mark)와 부딪힌다.
   * multiply를 쓰는 이유는 진짜 형광펜처럼 글자가 비쳐 보이게 하려는 것이다.
   * 불투명하게 덮으면 정작 읽어야 할 글자가 가려진다.
   */
  /*
   * 범위 표시 테두리
   *
   * 오려낸 자리를 알려 주는 노란 네모다. AI에 보낸 그림 범위(card.rect)와는
   * 따로 둔다 — 이건 눈으로 보기 좋게 글자에 맞추려고 만지는 것이라,
   * 여기를 옮긴다고 이미 물어본 그림이 달라지면 안 된다.
   */
  /*
   * 테두리 안쪽은 눌러도 통과한다.
   *
   * 전에는 테두리가 그 자리를 통째로 덮어서, 메모를 붙여 둔 곳에는 다시 드래그도
   * 더블클릭도 안 됐다. 테두리를 지워야만 그 자리를 쓸 수 있었다.
   * 이제 잡히는 건 테두리 선(.be)과 모서리(.bh)뿐이고, 안쪽은 종이로 돌려준다.
   */
  .boxsel {
    position: absolute;
    border: 2px solid var(--marker);
    border-radius: 2px;
    background: transparent;
    pointer-events: none;
    z-index: 3;
  }
  .boxsel .bh, .boxsel .be { pointer-events: auto; }
  .boxsel .be { position: absolute; cursor: move; }
  .boxsel .be.t { left: 0; right: 0; top: -5px; height: 10px; }
  .boxsel .be.b { left: 0; right: 0; bottom: -5px; height: 10px; }
  .boxsel .be.l { top: 0; bottom: 0; left: -5px; width: 10px; }
  .boxsel .be.r { top: 0; bottom: 0; right: -5px; width: 10px; }
  .boxsel .bh {
    position: absolute;
    width: 11px;
    height: 11px;
    background: var(--marker);
    border: 1px solid #6b5500;
    border-radius: 2px;
  }
  .boxsel .bh.nw { left: -6px; top: -6px; cursor: nwse-resize; }
  .boxsel .bh.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .boxsel .bh.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
  .boxsel .bh.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  /*
   * .pagewrap이 line-height:0이라(캔버스 아래 빈 틈을 없애려고) 이 버튼의
   * 글줄도 0이 돼 납작하게 잘렸다. 여기서 다시 세워 준다.
   */
  /*
   * 이 버튼은 테두리(.boxsel) 안이 아니라 층 바로 밑에 둔다.
   * .boxsel이 z-index를 가지고 있어 그 안에 넣으면 메모 밑에 깔려 못 누른다.
   * 자리는 테두리 오른쪽 위 모서리에 맞춘다(translateX로 오른쪽 끝 정렬).
   */
  .bdel {
    position: absolute;
    z-index: 6;
    transform: translateX(-100%);
    font-size: 11px;
    /* .pagewrap이 line-height:0이라 여기서 글줄을 다시 세워야 납작해지지 않는다 */
    line-height: 1.35;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
  }

  /*
   * 형광펜 자국도 자리를 막지 않는다. 그어 둔 곳에 다시 드래그해서 물어볼 수
   * 있어야 한다. 고르는 건 층에서 눌린 자리로 찾는다(bindSelection 참고).
   */
  .hlmark {
    position: absolute;
    z-index: 2;              /* 테두리·메모보다 아래 */
    mix-blend-mode: multiply;
    border-radius: 2px;
    pointer-events: none;
  }
  /* 고른 자국은 테두리로 알린다. 지우기는 X 버튼이나 Delete 키로 한다 */
  .hlmark.on { outline: 2px solid #333; }
  .hldel {
    position: absolute;
    z-index: 6;
    width: 20px;
    height: 20px;
    padding: 0;
    line-height: 1;
    font-size: 13px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--text);
    border: 1px solid var(--rule);
  }
  .hldel:hover { border-color: var(--danger); color: var(--danger); }

  .pageflip {
    position: sticky;
    top: 42vh;
    align-self: flex-start;
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    margin: 0 10px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: rgba(34, 50, 63, 0.78);
    color: var(--text);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    /* 수업 중에 시선을 뺏지 않도록 평소엔 흐리게 두고, 가져가면 또렷해진다 */
    opacity: 0.32;
    transition: opacity 0.15s;
  }
  .pageflip:hover { opacity: 1; }

  .pagebadge {
    position: fixed;
    right: calc(var(--notes-w) + 16px);
    bottom: 42px;                        /* 아래 상태줄을 비켜선다 */
    z-index: 6;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(16, 26, 35, 0.86);
    border: 1px solid var(--rule);
    color: var(--text);
    font-size: 12.5px;
    letter-spacing: 0.2px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .pagebadge.show { opacity: 1; }
  /* 첫/끝 쪽에서는 감추되 자리는 남긴다 — 사라지면 페이지가 좌우로 튄다 */
  .pageflip:disabled { opacity: 0; pointer-events: none; }
  .pageflip.gone { display: none; }


  @media (max-width: 820px) {
    .main { flex-direction: column; }
    .notes { width: auto; border-left: 0; border-top: 1px solid var(--rule); max-height: 46vh; }
    .stage { padding: 12px; }
    .pagebadge { right: 16px; bottom: calc(46vh + 16px); }
  }
</style>

<script>
(function () {
  "use strict";

  var PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";

  /*
   * 한글 PDF에서 글자를 읽으려면 CMap이 있어야 한다.
   *
   * 한글 자료는 글꼴 인코딩이 /UniKS-UTF16-H 같은 "미리 정해진 CMap"인 일이
   * 흔하다. pdf.js는 그 표를 따로 받아야 글자를 풀 수 있는데, 안 주면 조용히
   * 빈 글을 돌려준다 — 크롬에서는 잘 긁히는 자료가 여기서는 "글자를 읽어낼 수
   * 없습니다"로 나오던 이유다(크롬의 PDF 엔진은 그 표를 안고 있다).
   * standard_fonts는 글꼴이 안 박힌 PDF의 모양을 제대로 그리기 위한 것이다.
   */
  var PDF_OPTS = {
    cMapUrl: PDFJS_BASE + "cmaps/",
    cMapPacked: true,
    standardFontDataUrl: PDFJS_BASE + "standard_fonts/"
  };
  function pdfSource(data) {
    var o = { data: data };
    for (var k in PDF_OPTS) o[k] = PDF_OPTS[k];
    return o;
  }

  var $ = function (id) { return document.getElementById(id); };

  // 버전 표시. 실패해도 조용히 넘어간다 — 이것 때문에 앱이 안 뜨면 안 된다
  fetch("/api/version")
    .then(function (r) { return r.json(); })
    .then(function (d) { $("ver").textContent = "v" + d.version; })
    .catch(function () {});

  /*
   * Claude Code 준비 상태
   *
   * "정리를 받아오지 못했습니다"만 뜨면 사용자는 뭘 해야 할지 알 수 없다.
   * 깔려 있는지 먼저 확인해서, 아니면 무엇이 문제인지와 할 일을 같이 보여준다.
   */
  function setChip(cls, text) {
    var c = $("chip");
    c.className = "chip on " + cls;
    $("chipText").textContent = text;
  }

  function showCliWarn(msg, open) {
    $("cliwhy").innerHTML = msg;
    if (open) $("cliwarn").classList.add("on");
  }

  /*
   * 시작하자마자 확인한다.
   * 설치 여부만 보면 "깔려는 있는데 로그인 안 된" 상태가 통과해서,
   * 정작 AI를 부를 때가 되어서야 실패했다. 로그인까지 본다.
   */
  function checkCli() {
    setChip("", "확인 중…");
    return fetch("/api/status")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.mode !== "cli") {              // API 모드면 Claude Code가 필요 없다
          setChip("ready", "API 모드");
          $("cliwarn").classList.remove("on");
          return true;
        }
        var c = d.claude || {};
        if (!c.installed) {
          setChip("need", "Claude Code 설치 필요");
          showCliWarn(
            "AI 정리를 쓰려면 Claude Code가 필요합니다.<br />" +
            "터미널에서 <code>npm i -g @anthropic-ai/claude-code</code> 로 설치한 뒤, " +
            "아래 버튼으로 로그인하세요.", true);
          return false;
        }
        if (!c.loggedIn) {
          setChip("need", "Claude 로그인 필요");
          showCliWarn(
            "Claude Code는 설치돼 있는데 <b>로그인이 안 돼 있습니다.</b><br />" +
            "아래 버튼을 누르면 로그인 창이 열립니다. 마치고 “다시 확인”을 눌러 주세요.", true);
          return false;
        }
        setChip("ready", "Claude 준비됨");
        showCliWarn(
          "Claude Code에 로그인돼 있습니다" + (c.version ? " (" + c.version + ")" : "") + ".<br />" +
          "계정을 바꾸려면 아래에서 다시 로그인하세요.", false);
        $("cliwarn").classList.remove("on");
        return true;
      })
      .catch(function () {
        setChip("", "상태 확인 실패");
        return true;                          // 확인이 안 될 뿐이니 굳이 막지 않는다
      });
  }

  // 칩을 누르면 언제든 로그인 칸을 열 수 있다 — 준비된 상태에서도 계정을 바꿀 수 있어야 한다
  $("chip").onclick = function () {
    var w = $("cliwarn");
    if (w.classList.contains("on")) { w.classList.remove("on"); return; }
    w.classList.add("on");
    checkCli().then(function (ok) { if (ok) w.classList.add("on"); });
  };

  $("cliLogin").onclick = function () {
    var b = $("cliLogin");
    b.disabled = true;
    b.textContent = "여는 중…";
    fetch("/api/login", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        b.textContent = d.ok ? "터미널을 열었습니다" : "열지 못했습니다";
        if (!d.ok) {
          showCliWarn("터미널을 열지 못했습니다. 직접 터미널에서 <code>claude auth login</code> 을 실행해 주세요.", true);
        }
      })
      .catch(function () { b.textContent = "열지 못했습니다"; })
      .then(function () {
        setTimeout(function () { b.disabled = false; b.textContent = "로그인 창 열기"; }, 2500);
      });
  };

  $("cliRecheck").onclick = function () {
    $("cliRecheck").textContent = "확인 중…";
    checkCli().then(function (ok) {
      $("cliRecheck").textContent = "다시 확인";
      if (ok) setStatus("Claude Code가 준비됐습니다.");
    });
  };

  checkCli();

  var state = {
    pdf: null,
    bytes: null,          // 내보내기용 원본 사본
    docKey: null,
    docName: "",
    page: 1,
    pages: 0,
    scale: 1.25,
    userZoomed: false,      // 손으로 확대한 뒤에는 자동 맞춤이 끼어들지 않게
    dpr: Math.min(window.devicePixelRatio || 1, 2),
    dprUsed: Math.min(window.devicePixelRatio || 1, 2),   // 픽셀 상한을 걸고 실제로 쓴 배율
    viewport: null,
    slots: [],              // 화면에 보이는 쪽들의 자리. 두 쪽 보기면 둘이다
    spread: false,          // 두 쪽씩 보기
    focus: false,           // PDF만 보기
    pageW: 0,               // 쪽 크기(PDF 포인트). 메모를 같은 치수로 그리려면 필요하다
    pageH: 0,
    canvas: null,
    layer: null,
    cards: [],            // {id,page,img,memo,summary,detail,rect,inserted}
    marks: [],            // 형광펜 자국 {id,page,color,rects:[정규화]}
    selMark: null,        // 고른 형광펜
    nSent: 5,               // "n문장으로 정리"에서 쓸 문장 수
    tool: "clip",
    hlColor: 0,
    openPin: null,
    renderTask: null
  };

  /*
   * 되돌리기
   *
   * 붙인 메모를 빼거나 카드를 지우면 되살릴 방법이 없었다. 특히 직접 쓴
   * 메모는 지우는 순간 글까지 사라진다. 마지막 한 번은 되돌릴 수 있게 한다
   * (상태줄의 되돌리기 버튼, 또는 Ctrl+Z).
   */
  var undoFn = null;

  function offerUndo(msg, fn) {
    undoFn = fn;
    var el = $("status");
    el.className = "status";
    el.textContent = msg + " ";
    var b = document.createElement("button");
    b.textContent = "되돌리기";
    b.onclick = doUndo;
    el.appendChild(b);
  }

  function doUndo() {
    if (!undoFn) { setStatus("되돌릴 것이 없습니다."); return; }
    var f = undoFn;
    undoFn = null;
    f();
  }

  function setStatus(msg, isErr) {
    undoFn = null;
    var el = $("status");
    el.textContent = msg || "";
    el.className = "status" + (isErr ? " err" : "");
  }

  /* ---------- 저장 ---------- */

  function hasStorage() {
    return typeof window !== "undefined" && window.storage && window.storage.get;
  }

  function indexKey() { return "capnote:" + state.docKey + ":index"; }
  function cardKey(id) { return "capnote:" + state.docKey + ":card:" + id; }

  /*
   * 지금 고치는 중이라는 표시는 저장하지 않는다.
   * 저장해 두면 다음에 열었을 때 그 메모가 편집칸인 채로 되살아난다.
   */
  function slimCard(card) {
    var o = {};
    Object.keys(card).forEach(function (k) {
      if (k === "editing" || k === "editingMemo") return;
      o[k] = card[k];
    });
    return o;
  }

  async function saveCard(card) {
    if (!hasStorage() || !state.docKey) return;
    try {
      await window.storage.set(cardKey(card.id), JSON.stringify(slimCard(card)));
      await window.storage.set(
        indexKey(),
        JSON.stringify({ name: state.docName, ids: state.cards.map(function (c) { return c.id; }) })
      );
    } catch (e) { /* 저장 실패는 사용을 막지 않음 */ }
  }

  async function deleteCard(card) {
    if (!hasStorage() || !state.docKey) return;
    try {
      await window.storage.delete(cardKey(card.id));
      await window.storage.set(
        indexKey(),
        JSON.stringify({ name: state.docName, ids: state.cards.map(function (c) { return c.id; }) })
      );
    } catch (e) {}
  }

  /*
   * 저장된 게 없을 때도 화면을 다시 그려야 한다.
   *
   * 예전에는 불러올 게 없으면 renderCards()를 부르기 전에 빠져나갔다.
   * state.cards는 비웠는데 화면에는 앞서 열었던 PDF의 카드가 그대로 남아,
   * 다른 자료로 바꿔도 남의 정리가 붙어 있는 것처럼 보였다.
   */
  async function loadCards() {
    state.cards = [];
    try {
      if (hasStorage() && state.docKey) {
        var r = await window.storage.get(indexKey());
        var idx = r ? JSON.parse(r.value) : null;
        if (idx && idx.ids) {
          for (var i = 0; i < idx.ids.length; i++) {
            try {
              var c = await window.storage.get(cardKey(idx.ids[i]));
              if (c) state.cards.push(JSON.parse(c.value));
            } catch (e) {}
          }
        }
      }
    } catch (e) { /* 못 읽으면 빈 채로 간다 */ }

    renderCards();
    drawMemos();
    drawMarks();
  }

  /* ---------- 형광펜 ---------- */

  /*
   * 글자에 붙는 형광펜
   *
   * 손이 그은 궤적을 그대로 칠하면 강의 중에는 삐뚤빼뚤해서 보기 나쁘다.
   * 그은 영역 안에 있는 글자 줄만 찾아 그 줄에 딱 맞게 띠를 씌운다.
   * 대충 그어도 결과가 반듯하다. 글자 정보가 없는 스캔 PDF에서는
   * 그은 자리를 그대로 칠하는 쪽으로 물러난다.
   */
  var PENS = [
    { id: "y", name: "노랑", css: "#ffe14d", rgb: [1, 0.882, 0.302] },
    { id: "g", name: "초록", css: "#9fe6a0", rgb: [0.624, 0.902, 0.627] },
    { id: "p", name: "분홍", css: "#ffb3c8", rgb: [1, 0.702, 0.784] }
  ];

  function marksKey() { return "capnote:" + state.docKey + ":marks"; }

  async function saveMarks() {
    if (!hasStorage() || !state.docKey) return;
    try { await window.storage.set(marksKey(), JSON.stringify(state.marks)); } catch (e) {}
  }

  async function loadMarks() {
    state.marks = [];
    if (!hasStorage() || !state.docKey) return;
    try {
      var r = await window.storage.get(marksKey());
      if (r) state.marks = JSON.parse(r.value) || [];
    } catch (e) { state.marks = []; }
  }

  /*
   * 그은 영역 안의 글자를 줄 단위로 묶는다.
   * 같은 줄인지는 세로 중심이 글자 높이의 절반 안에 드는지로 본다.
   */
  async function bandsInRect(rect, slot) {
    var d = state.dprUsed;
    var tc = await textContentOf(slot.page);
    var items = [];
    tc.items.forEach(function (it) {
      // 글자 자리는 그 쪽 안의 값이므로, 층 좌표로 옮기려면 자리만큼 민다
      var t = pdfjsLib.Util.transform(slot.vp.transform, it.transform);
      var h = Math.hypot(t[2], t[3]) / d;
      var w = (it.width || 0) * state.scale;
      var x = t[4] / d + slot.x, base = t[5] / d + slot.y;
      if (!(w > 0 && h > 0)) return;
      /*
       * 글자 중심이 그은 네모 안에 드는지로 따지면, 두 줄 사이를 스치듯 그었을
       * 때 위아래 어느 줄도 안 잡혀 줄에 붙지 못하고 그은 자리가 그대로
       * 칠해졌다. 얼마나 겹쳤는지로 따진다 — 스친 줄이 잡힌다.
       */
      var top = base - h, cx = x + w / 2, cy = base - h / 2;
      var ovY = Math.min(top + h, rect.y + rect.h) - Math.max(top, rect.y);
      var ovX = Math.min(x + w, rect.x + rect.w) - Math.max(x, rect.x);
      if (ovY < h * 0.4) return;
      if (ovX < Math.min(w, rect.w) * 0.15) return;
      items.push({ x: x, y: top, w: w, h: h, cy: cy });
    });
    if (!items.length) return null;

    items.sort(function (a, b) { return a.cy - b.cy || a.x - b.x; });
    var bands = [], cur = null;
    items.forEach(function (it) {
      if (cur && Math.abs(it.cy - cur.cy) <= Math.max(it.h, cur.h) * 0.5) {
        cur.x0 = Math.min(cur.x0, it.x);
        cur.x1 = Math.max(cur.x1, it.x + it.w);
        cur.y0 = Math.min(cur.y0, it.y);
        cur.y1 = Math.max(cur.y1, it.y + it.h);
        cur.cy = (cur.cy + it.cy) / 2;
        cur.h = Math.max(cur.h, it.h);
      } else {
        cur = { x0: it.x, x1: it.x + it.w, y0: it.y, y1: it.y + it.h, cy: it.cy, h: it.h };
        bands.push(cur);
      }
    });

    var pad = 1.5;
    return bands.map(function (b) {
      return { x: b.x0 - pad, y: b.y0 - pad, w: (b.x1 - b.x0) + pad * 2, h: (b.y1 - b.y0) + pad * 2 };
    });
  }

  /*
   * 글자 정보가 없는 자료에서 줄 찾기.
   *
   * bandsInRect는 PDF 안에 적힌 글자 위치를 읽어 줄에 맞춘다. 그런데 스캔해서
   * 만든 자료(또는 글꼴 정보가 빠진 PDF)에는 그 정보가 아예 없어서, 그은 자리를
   * 네모째 칠해 버렸다. "글자에만 칠해지는 게 아니라 드래그한 범위가 통째로
   * 칠해진다"는 게 이것이다.
   *
   * 글자를 못 읽어도 화면에는 그려져 있다. 그래서 그린 그림에서 어두운 가로줄을
   * 찾는다 — 글자가 있는 줄만 어둡다. OCR이 아니라 줄 자리만 보는 것이라 가볍고,
   * 어떤 자료에서든 된다.
   */
  function bandsByInk(rect) {
    if (!state.canvas) return null;
    var d = state.dprUsed;
    var x0 = Math.max(0, Math.round(rect.x * d));
    var y0 = Math.max(0, Math.round(rect.y * d));
    var w = Math.min(state.canvas.width - x0, Math.round(rect.w * d));
    var h = Math.min(state.canvas.height - y0, Math.round(rect.h * d));
    if (w < 4 || h < 4) return null;

    var img;
    try {
      img = state.canvas.getContext("2d", { willReadFrequently: true })
              .getImageData(x0, y0, w, h).data;
    } catch (e) { return null; }

    // 줄마다 어두운 화소가 몇 개인지, 그리고 그 줄의 왼쪽·오른쪽 끝
    var need = Math.max(2, Math.round(w * 0.012));
    var rows = [];
    for (var y = 0; y < h; y++) {
      var n = 0, lo = -1, hi = -1, base = y * w * 4;
      for (var x = 0; x < w; x++) {
        var i = base + x * 4;
        // 사람 눈에 가까운 밝기. 노란 형광펜 위에 또 그어도 글자는 어둡다
        var lum = (img[i] * 0.299 + img[i + 1] * 0.587 + img[i + 2] * 0.114);
        if (img[i + 3] > 20 && lum < 190) { n++; if (lo < 0) lo = x; hi = x; }
      }
      rows.push(n >= need ? { lo: lo, hi: hi } : null);
    }

    // 이어지는 어두운 줄을 한 띠로 묶는다. 한두 화소짜리는 얼룩이라 버린다
    var bands = [], cur = null;
    var minH = Math.max(3, Math.round(3 * d));
    for (var y2 = 0; y2 <= h; y2++) {
      var r = y2 < h ? rows[y2] : null;
      if (r) {
        if (!cur) cur = { y0: y2, y1: y2, lo: r.lo, hi: r.hi };
        else { cur.y1 = y2; cur.lo = Math.min(cur.lo, r.lo); cur.hi = Math.max(cur.hi, r.hi); }
      } else if (cur) {
        if (cur.y1 - cur.y0 + 1 >= minH) bands.push(cur);
        cur = null;
      }
    }
    if (!bands.length) return null;

    var pad = 1.5;
    return bands.map(function (b) {
      var bx = (x0 + b.lo) / d - pad;
      var bw = (b.hi - b.lo + 1) / d + pad * 2;
      var by = (y0 + b.y0) / d - pad;
      var bh = (b.y1 - b.y0 + 1) / d + pad * 2;
      // 그은 네모 밖으로는 나가지 않게 가로만 잘라 둔다
      var left = Math.max(bx, rect.x), right = Math.min(bx + bw, rect.x + rect.w);
      return { x: left, y: by, w: Math.max(2, right - left), h: bh };
    });
  }

  async function addMark(rect) {
    var slot = slotAt(rect.x + rect.w / 2);   // 두 쪽 보기면 어느 쪽에 그었는지
    if (!slot) return;
    var bands = await bandsInRect(rect, slot);  // PDF가 알려 주는 글자 자리
    if (!bands) bands = bandsByInk(rect);       // 없으면 그림에서 줄을 찾는다
    if (!bands) bands = [rect];                 // 그것도 못 찾으면 그은 자리를 그대로

    var mark = {
      id: "m" + Date.now(),
      page: slot.page,
      color: PENS[state.hlColor].id,
      rects: bands.map(function (b) {
        return toPageRect(b, slot);
      })
    };
    state.marks.push(mark);
    saveMarks();
    drawMarks();

    /*
     * 방금 칠한 것도 되돌릴 수 있어야 한다.
     * 지우는 것만 되돌릴 수 있고 칠하는 건 안 됐다 — 잘못 그었을 때 Ctrl+Z가
     * 안 먹는 게 이것이다.
     */
    offerUndo("형광펜을 칠했습니다.", function () {
      state.marks = state.marks.filter(function (m) { return m !== mark; });
      state.selMark = null;
      saveMarks();
      drawMarks();
      setStatus("되돌렸습니다.");
    });
  }

  function penOf(id) {
    for (var i = 0; i < PENS.length; i++) if (PENS[i].id === id) return PENS[i];
    return PENS[0];
  }

  /*
   * 형광펜 자국 그리기
   *
   * 예전에는 누르면 바로 지워졌다. 스치기만 해도 사라져서 위험했다.
   * 이제 누르면 고르기만 하고, 지우려면 오른쪽 위 X를 누르거나 Delete를 친다.
   */
  function drawMarks() {
    if (!state.layer || !state.viewport) return;
    Array.prototype.forEach.call(state.layer.querySelectorAll(".hlmark, .hldel"),
      function (m) { m.remove(); });

    state.marks.forEach(function (mk) {
      var slot = slotOf(mk.page);
      if (!slot) return;
      var W = slot.w, H = slot.h;
      var picked = state.selMark === mk.id;
      var top = null, right = null;

      mk.rects.forEach(function (r) {
        var el = document.createElement("div");
        el.className = "hlmark" + (picked ? " on" : "");
        el.style.left = (slot.x + r.x * W) + "px";
        el.style.top = (slot.y + r.y * H) + "px";
        el.style.width = (r.w * W) + "px";
        el.style.height = (r.h * H) + "px";
        el.style.background = penOf(mk.color).css;
        el.title = "누르면 골라집니다. 지우려면 X 또는 Delete";
        state.layer.appendChild(el);

        if (top === null || r.y < top) top = r.y;
        if (right === null || r.x + r.w > right) right = r.x + r.w;
      });

      if (picked && top !== null) {
        var x = document.createElement("button");
        x.className = "hldel";
        x.textContent = "×";
        x.title = "이 형광펜 지우기";
        x.style.left = (slot.x + Math.min(right * W - 6, W - 22)) + "px";
        x.style.top = (slot.y + Math.max(0, top * H - 22)) + "px";
        x.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        x.onclick = function (e) { e.stopPropagation(); removeMark(mk); };
        state.layer.appendChild(x);
      }
    });
  }

  function removeMark(mk) {
    var at = state.marks.indexOf(mk);
    state.marks = state.marks.filter(function (x) { return x !== mk; });
    state.selMark = null;
    saveMarks();
    drawMarks();
    offerUndo("형광펜을 지웠습니다.", function () {
      state.marks.splice(at, 0, mk);
      saveMarks();
      drawMarks();
      setStatus("되돌렸습니다.");
    });
  }

  // 도구 · 색 고르기
  function setTool(t) {
    state.tool = t;
    $("toolClip").classList.toggle("on", t === "clip");
    $("toolHl").classList.toggle("on", t === "hl");
    $("pens").classList.toggle("on", t === "hl");
    if (state.layer) state.layer.style.cursor = t === "hl" ? "text" : "crosshair";
  }
  $("toolClip").onclick = function () { setTool("clip"); };
  $("toolHl").onclick = function () { setTool("hl"); };

  PENS.forEach(function (pen, i) {
    var b = document.createElement("button");
    b.style.background = pen.css;
    b.title = pen.name;
    b.className = i === 0 ? "on" : "";
    b.onclick = function () {
      state.hlColor = i;
      Array.prototype.forEach.call($("pens").children, function (c, j) {
        c.classList.toggle("on", j === i);
      });
    };
    $("pens").appendChild(b);
  });

  /* ---------- PDF 열기 ---------- */

  $("open").onclick = $("open2").onclick = function () { $("file").click(); };

  $("file").onchange = async function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    setStatus("여는 중…");
    try {
      /*
       * 다른 자료로 바꾸면 정리 패널을 먼저 비운다.
       * 저장소를 읽는 동안 앞 PDF의 카드가 남아 있으면, 새 자료에 남의 정리가
       * 붙어 있는 것처럼 보인다. 같은 PDF를 다시 열면 아래에서 되살아난다.
       */
      state.cards = [];
      state.marks = [];
      pendingCrops = {};
      undoFn = null;
      $("q").value = "";
      renderCards();
      if (state.layer) { drawMemos(); drawMarks(); }

      var buf = await f.arrayBuffer();
      state.bytes = buf.slice(0);                       // pdf.js가 원본을 가져가므로 사본 보관
      state.pdf = await pdfjsLib.getDocument(pdfSource(buf)).promise;

      /*
       * 우리가 내보낸 PDF라면 메모를 되살린다.
       *
       * 메모 주석은 벗겨내고 다시 읽는다. 안 벗기면 주석이 그려진 그림 위에
       * 우리 메모 상자가 또 얹혀 두 겹으로 보이고, 다시 내보낼 때도 지저분해진다.
       * 벗겨낸 바이트를 원본 삼아 두므로 이후 흐름은 처음 여는 것과 같다.
       */
      var carried = await readCardsFromPdf(state.pdf);
      if (carried) {
        var cleaned = await stripMemoAnnots(state.bytes);
        if (cleaned) {
          state.bytes = cleaned.slice(0);
          state.pdf = await pdfjsLib.getDocument(pdfSource(cleaned)).promise;
        }
      }

      state.pages = state.pdf.numPages;
      state.page = 1;
      state.docName = f.name.replace(/\.pdf$/i, "");
      state.docKey = (f.name + ":" + f.size).replace(/[^\w가-힣.:-]/g, "_").slice(0, 120);
      $("empty").style.display = "none";
      _textCache = {};
      _tcCache = {};
      _pageText = null;
      cacheReset();

      // 열자마자 창에 맞춘다
      state.scale = fitScale(await state.pdf.getPage(1));
      state.userZoomed = false;

      /*
       * 메모는 적는 즉시 IndexedDB에 들어간다. 내보내기 전에 앱이 꺼져도
       * 같은 PDF를 다시 열면 그대로 돌아온다. 다만 그게 되고 있는지
       * 사용자가 알 방법이 없어서 몇 개를 불러왔는지 알려 준다.
       */
      await loadCards();
      await loadMarks();
      var restored = state.cards.length;
      if (carried && !state.cards.length) {
        state.cards = carried.cards;
        state.cards.forEach(function (c) { saveCard(c); });
      }
      if (carried && carried.marks.length && !state.marks.length) {
        state.marks = carried.marks;
        saveMarks();
      }
      await renderPage();
      setStatus(state.docName + " · " + state.pages + "쪽" +
                (restored ? " · 저장해 둔 정리 " + restored + "개를 불러왔습니다" : ""));
    } catch (err) {
      setStatus("이 파일을 열지 못했습니다. 다른 PDF로 시도해 보세요.", true);
    }
    e.target.value = "";
  };

  /*
   * 창에 맞는 배율 찾기
   *
   * 배율이 1.25로 고정이라 창 크기와 상관없이 같은 크기로 그려졌다.
   * 16:9 강의 슬라이드는 옆이 남고 A4는 아래가 잘리는 식으로 매번 어긋났다.
   * 페이지 전체가 들어오도록 맞춘다 — 강의자료는 한 장을 통째로 보는 게 먼저다.
   */
  function fitScale(page) {
    var vp = page.getViewport({ scale: 1 });
    var st = $("stage");
    var cs = getComputedStyle(st);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var flips = (46 + 20) * 2;      // 양옆 넘김 버튼이 차지하는 폭
    var w = st.clientWidth - padX - flips;
    var h = st.clientHeight - padY;
    if (!(w > 0 && h > 0)) return state.scale;
    // 두 쪽 보기면 나란히 놓은 폭(+틈)이 들어가야 한다
    var needW = state.spread ? vp.width * 2 + SPREAD_GAP : vp.width;
    return Math.max(0.25, Math.min(3, Math.min(w / needW, h / vp.height)));
  }

  /* ---------- 페이지 그리기 ---------- */

  /*
   * 한 쪽 보기 / 두 쪽 보기
   *
   * 책은 원래 펼쳐 보는 것이라 두 쪽을 나란히 놓으면 훨씬 읽기 좋다. 그런데
   * 메모·형광펜·오려내기는 모두 "쪽 안에서 0~1" 좌표로 적어 두므로, 화면에
   * 두 쪽이 있으면 어느 쪽의 좌표인지 가려야 한다.
   *
   * 그래서 자리(slot)를 둔다 — 보이는 쪽마다 {쪽 번호, 층 안에서의 자리}를
   * 적어 두고, 그리거나 집을 때 그 자리를 거친다. 한 쪽 보기는 자리가 하나뿐인
   * 두 쪽 보기일 뿐이라 코드가 갈라지지 않는다.
   */
  var SPREAD_GAP = 14;                    // 두 쪽 사이 틈 (CSS px)

  function visiblePages() {
    if (!state.spread) return [state.page];
    return state.page + 1 <= state.pages ? [state.page, state.page + 1] : [state.page];
  }

  function slotOf(page) {
    var s = state.slots || [];
    for (var i = 0; i < s.length; i++) if (s[i].page === page) return s[i];
    return null;
  }

  // 층 안의 x가 어느 쪽에 떨어지는지. 틈에 걸쳤으면 가까운 쪽으로 친다
  function slotAt(x) {
    var s = state.slots || [];
    if (!s.length) return null;
    for (var i = 0; i < s.length; i++) if (x >= s[i].x && x <= s[i].x + s[i].w) return s[i];
    var best = s[0], d = Infinity;
    s.forEach(function (q) {
      var dd = Math.min(Math.abs(x - q.x), Math.abs(x - (q.x + q.w)));
      if (dd < d) { d = dd; best = q; }
    });
    return best;
  }

  // 층 좌표의 네모를 그 쪽 안의 0~1 좌표로. 쪽 밖으로 나간 부분은 자른다
  function toPageRect(rect, slot) {
    var x0 = Math.max(rect.x, slot.x), x1 = Math.min(rect.x + rect.w, slot.x + slot.w);
    var y0 = Math.max(rect.y, slot.y), y1 = Math.min(rect.y + rect.h, slot.y + slot.h);
    return {
      x: (x0 - slot.x) / slot.w,
      y: (y0 - slot.y) / slot.h,
      w: Math.max(0, x1 - x0) / slot.w,
      h: Math.max(0, y1 - y0) / slot.h
    };
  }

  async function renderPage() {
    if (!state.pdf) return;

    var want = state.page;
    var nums = visiblePages();
    var pages = [];
    for (var i = 0; i < nums.length; i++) pages.push(await state.pdf.getPage(nums[i]));

    /*
     * 캔버스 화소 수에 상한을 둔다.
     *
     * 4K 화면을 꽉 채우면 폭*배율*dpr 로 8백만 화소가 넘어가고, 쪽을 넘길
     * 때마다 그만큼을 새로 그리느라 눈에 띄게 느려진다. 화질 차이는 거의
     * 없으면서 그 구간을 없앤다. 두 쪽 보기면 두 쪽 몫으로 친다.
     */
    var dpr = state.dpr, total = 0;
    pages.forEach(function (p) {
      var v = p.getViewport({ scale: state.scale * dpr });
      total += v.width * v.height;
    });
    var budget = 4.5e6 * pages.length;
    if (total > budget) dpr = dpr * Math.sqrt(budget / total);
    state.dprUsed = dpr;

    var gap = Math.round(SPREAD_GAP * dpr);
    var shots = [], x = 0, maxH = 0;
    pages.forEach(function (p, i) {
      var vp = p.getViewport({ scale: state.scale * dpr });
      var v1 = p.getViewport({ scale: 1 });
      var cw = Math.round(vp.width), ch = Math.round(vp.height);
      shots.push({ page: nums[i], pg: p, vp: vp, cw: cw, ch: ch, dx: x, pw: v1.width, ph: v1.height });
      x += cw + (i < pages.length - 1 ? gap : 0);
      if (ch > maxH) maxH = ch;
    });
    var totalW = x, totalH = maxH;

    state.viewport = { width: totalW, height: totalH };
    state.pageW = shots[0].pw;
    state.pageH = shots[0].ph;

    var wrap = document.querySelector(".pagewrap");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.className = "pagewrap";
      var cv = document.createElement("canvas");
      var ly = document.createElement("div");
      ly.className = "layer";
      wrap.appendChild(cv);
      wrap.appendChild(ly);
      $("stage").insertBefore(wrap, $("flipNext"));   // 두 넘김 버튼 사이에 놓는다
      state.canvas = cv;
      state.layer = ly;
      bindSelection(ly);
    }

    if (state.renderTask) { try { state.renderTask.cancel(); } catch (e) {} }

    /*
     * 쪽마다 그림을 갖춘 뒤 한 번에 옮겨 붙인다.
     *
     * 보이는 캔버스에 바로 그리면 크기를 맞추는 순간 내용이 지워져서, 다
     * 그릴 때까지 흰 종이가 보인다. 밖에서 그리면 그동안 앞 쪽이 그대로
     * 남아 있다가 한 번에 바뀐다 — 노트 앱이 그렇게 보이는 이유다.
     *
     * 캔버스 화소 수는 정수다. vp.width는 소수라서 그대로 비교하면 미리 그려
     * 둔 쪽을 두고도 늘 "없다"가 나온다(606 !== 606.87).
     */
    for (var k = 0; k < shots.length; k++) {
      var sh = shots[k];
      var hit = cacheValid() ? cache.map[sh.page] : null;
      if (hit && hit.width === sh.cw && hit.height === sh.ch) { sh.img = hit; continue; }

      var off = document.createElement("canvas");
      off.width = sh.cw; off.height = sh.ch;
      var scaleAtRender = state.scale;
      state.renderTask = sh.pg.render({ canvasContext: off.getContext("2d"), viewport: sh.vp });
      try { await state.renderTask.promise; } catch (e) { return; }

      // 그리는 사이 배율이 바뀌었다면 이 그림은 지금 캐시와 맞지 않는다
      if (state.scale === scaleAtRender && dpr === state.dprUsed) {
        if (!cacheValid()) { cacheReset(); cache.scale = scaleAtRender; cache.dpr = dpr; }
        if (!cache.map[sh.page]) {
          cache.map[sh.page] = off;
          cache.px += sh.cw * sh.ch;
          cacheEvict();
        }
      }
      if (state.page !== want) return;        // 더 넘겼으면 화면은 뒤에 온 쪽이 맡는다
      sh.img = off;
    }

    // 지우기와 붙이기를 한 숨에 한다. 사이에 한 번이라도 쉬면 흰 화면이 비친다
    if (state.canvas.width !== totalW) state.canvas.width = totalW;
    if (state.canvas.height !== totalH) state.canvas.height = totalH;
    state.canvas.style.width = totalW / dpr + "px";
    state.canvas.style.height = totalH / dpr + "px";
    wrap.style.width = totalW / dpr + "px";
    // 확대 중에 임시로 늘려 두었던 것을 되돌린다 (zoomPdf 참고)
    state.layer.style.transform = "none";
    state.layer.style.width = "";
    state.layer.style.height = "";
    state.drawnScale = state.scale;        // 지금 캔버스에 그려진 배율

    var vis = state.canvas.getContext("2d");
    vis.clearRect(0, 0, totalW, totalH);
    if (shots.length > 1) {                // 쪽 사이 틈은 옅은 선으로 남긴다
      vis.fillStyle = "#c3ced8";
      vis.fillRect(0, 0, totalW, totalH);
    }
    shots.forEach(function (sh) { vis.drawImage(sh.img, sh.dx, 0); });

    state.slots = shots.map(function (sh) {
      return {
        page: sh.page, vp: sh.vp, pw: sh.pw, ph: sh.ph,
        x: sh.dx / dpr, y: 0, w: sh.cw / dpr, h: sh.ch / dpr
      };
    });

    $("pageIn").value = state.page;
    $("pageTotal").textContent = state.pages;
    showPageBadge();
    ["prev", "next", "zoomin", "zoomout", "expMd", "expPdf", "q", "qsend", "qscope", "expScope", "expBurn", "spread", "focus", "toolClip", "toolHl", "mfsUp", "mfsDown"].forEach(function (id) {
      $(id).disabled = false;
    });
    $("prev").disabled = state.page <= 1;
    $("next").disabled = state.page + step() > state.pages;

    // 양옆 버튼은 위 툴바 버튼과 같은 상태를 따른다
    ["flipPrev", "flipNext"].forEach(function (id) { $(id).classList.remove("gone"); });
    applyMemoFs(MEMO.fs, true);            // 버튼 활성 상태만 맞춘다
    prefetchAround();
    $("flipPrev").disabled = $("prev").disabled;
    $("flipNext").disabled = $("next").disabled;

    drawMarks();
    drawMemos();
    refillThumbs();
  }

  /*
   * 되살린 카드에는 썸네일이 없다 (파일을 가볍게 하려고 안 심었다).
   * 지금 그린 쪽에 해당하는 것만 다시 잘라 채운다.
   */
  async function refillThumbs() {
    var changed = false;
    for (var i = 0; i < state.cards.length; i++) {
      var c = state.cards[i];
      if (c.img || c.qna || c.manual || c.page !== state.page) continue;
      if (!c.rect || !(c.rect.w > 0)) continue;
      try {
        c.img = shrinkTo(await cropFromPdf(c.page, c.rect, 1600), 560)
                  .toDataURL("image/jpeg", 0.8);
        changed = true;
      } catch (e) { /* 못 만들면 그림 없이 둔다 */ }
    }
    if (changed) renderCards();
  }

  /*
   * 쪽을 미리 다 그려 둔다.
   *
   * 넘길 때마다 처음부터 그리느라 한 박자 쉬었다. 노트 앱처럼 미리 그려 두면
   * 넘기는 순간은 그림을 옮겨 붙이는 일만 남는다.
   *
   * 다만 전부 메모리에 이고 있을 수는 없다. 쪽 하나가 2백만 화소면 8MB쯤
   * 되므로, 화소 예산을 두고 현재 쪽에서 먼 것부터 버린다. 100쪽짜리를 열어도
   * 앞뒤로 십수 쪽은 늘 준비돼 있어 체감상 "다 불러온" 것과 같다.
   */
  var PAGE_BUDGET_PX = 40e6;
  var cache = { scale: 0, dpr: 0, map: {}, px: 0 };
  var prefetching = false;

  function cacheReset() {
    cache = { scale: 0, dpr: 0, map: {}, px: 0 };
  }

  function cacheValid() {
    return cache.scale === state.scale && cache.dpr === state.dprUsed;
  }

  function cacheEvict() {
    // 예산을 넘으면 지금 보는 쪽에서 가장 먼 것부터 버린다
    while (cache.px > PAGE_BUDGET_PX) {
      var far = null, farD = -1;
      Object.keys(cache.map).forEach(function (k) {
        var d = Math.abs(Number(k) - state.page);
        if (d > farD) { farD = d; far = k; }
      });
      if (far == null || farD <= 1) return;        // 현재 쪽 언저리는 남긴다
      var c = cache.map[far];
      cache.px -= c.width * c.height;
      delete cache.map[far];
    }
  }

  async function renderToCache(n) {
    if (!state.pdf || cache.map[n]) return cache.map[n];
    var scale = state.scale, dpr = state.dprUsed;
    var pg = await state.pdf.getPage(n);
    var vp = pg.getViewport({ scale: scale * dpr });
    var cv = document.createElement("canvas");
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    // 그리는 사이 배율이 바뀌었으면 버린다
    if (scale !== state.scale || dpr !== state.dprUsed) return null;
    if (!cacheValid()) { cacheReset(); cache.scale = scale; cache.dpr = dpr; }
    cache.map[n] = cv;
    cache.px += cv.width * cv.height;
    cacheEvict();
    return cv;
  }

  /*
   * 한가할 때 한 쪽씩 채운다. 현재 쪽에서 가까운 순서로 — 다음 쪽이 가장
   * 급하고, 그다음이 이전 쪽이다. 한 번에 몰아 그리면 화면이 멈춘다.
   */
  function prefetchAround() {
    if (prefetching || !state.pdf) return;
    if (!cacheValid()) { cacheReset(); cache.scale = state.scale; cache.dpr = state.dprUsed; }

    var order = [];
    for (var d = 1; d <= state.pages; d++) {
      if (state.page + d <= state.pages) order.push(state.page + d);
      if (state.page - d >= 1) order.push(state.page - d);
    }
    var next = null;
    for (var i = 0; i < order.length; i++) {
      if (!cache.map[order[i]]) { next = order[i]; break; }
    }
    if (next == null) return;
    if (cache.px > PAGE_BUDGET_PX) return;         // 예산을 다 썼으면 그만

    prefetching = true;
    var run = function () {
      renderToCache(next)
        .catch(function () {})
        .then(function () {
          prefetching = false;
          prefetchAround();                        // 다음 쪽으로 이어 간다
        });
    };
    if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 800 });
    else setTimeout(run, 60);
  }

  // 두 쪽 보기면 두 장씩 넘긴다 — 넘겼는데 한 쪽만 바뀌면 책장이 아니다
  function step() { return state.spread ? 2 : 1; }
  function flip(d) {
    var n = Math.max(1, Math.min(state.pages, state.page + d * step()));
    if (n === state.page) return;
    state.page = n;
    closeMemoEdit();
    renderPage();
  }
  $("prev").onclick = $("flipPrev").onclick = function () { flip(-1); };
  $("next").onclick = $("flipNext").onclick = function () { flip(1); };
  /*
   * 쪽 번호를 직접 넣어 이동한다. 12쪽짜리는 화살표로 넘겨도 되지만
   * 100쪽 자료에서 "37쪽 봐" 소리를 들으면 화살표로는 답이 없다.
   */
  function gotoPage(n) {
    n = parseInt(n, 10);
    if (!state.pdf || !(n >= 1 && n <= state.pages)) { $("pageIn").value = state.page; return; }
    if (n === state.page) return;
    state.page = n;
    closeMemoEdit();
    renderPage();
  }
  $("pageIn").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); gotoPage($("pageIn").value); $("pageIn").blur(); }
    e.stopPropagation();                    // 좌우 화살표로 쪽이 넘어가지 않게
  });
  $("pageIn").addEventListener("focus", function () { $("pageIn").select(); });
  $("pageIn").addEventListener("blur", function () { $("pageIn").value = state.page; });

  /*
   * 한 쪽 / 두 쪽 보기.
   *
   * 자료마다 취향이 갈린다 — 슬라이드는 한 장씩 크게, 책은 펼쳐서. 자료를
   * 바꿔도 그대로 쓰게 브라우저에 적어 둔다.
   */
  function applySpread(on, quiet) {
    state.spread = !!on;
    $("spread").textContent = state.spread ? "두 쪽" : "한 쪽";
    $("spread").classList.toggle("on", state.spread);
    try { localStorage.setItem("capnote:spread", state.spread ? "1" : "0"); } catch (e) {}
    if (quiet || !state.pdf) return;
    closeMemoEdit();
    (async function () {
      // 폭이 두 배로 달라지므로 창에 다시 맞춘다 (손으로 확대해 둔 게 아니면)
      if (!state.userZoomed) state.scale = fitScale(await state.pdf.getPage(state.page));
      cacheReset();
      renderPage();
    })();
  }

  $("spread").onclick = function () { applySpread(!state.spread); };
  (function () {
    try { state.spread = localStorage.getItem("capnote:spread") === "1"; } catch (e) {}
    applySpread(state.spread, true);
  })();

  $("zoomin").onclick = function () { zoomPdf(0.25); };
  $("zoomout").onclick = function () { zoomPdf(-0.25); };

  /*
   * 창 크기가 바뀌면 다시 맞춘다. 손으로 확대한 뒤에는 건드리지 않는다 —
   * 일부러 키워 놓은 걸 창 옮겼다고 되돌리면 성가시다.
   */
  var fitTimer = null;
  async function refit() {
    if (!state.pdf || state.userZoomed) return;
    var s = fitScale(await state.pdf.getPage(state.page));
    if (Math.abs(s - state.scale) < 0.01) return;
    state.scale = s;
    closeMemoEdit();
    renderPage();
  }
  function refitSoon(ms) {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(refit, ms || 150);
  }
  window.addEventListener("resize", function () { refitSoon(150); });

  /*
   * 정리 패널 폭 — 모서리를 끌어 바꾼다.
   *
   * 자료를 크게 볼 때가 있고 정리를 길게 볼 때가 있다. 폭은 CSS 변수 하나로
   * 정해 두었으므로 그 값만 바꾸면 쪽 번호 표시까지 따라온다. 고른 폭은 기억한다.
   */
  var NOTES_MIN = 260;
  function setNotesWidth(px, quiet) {
    var max = Math.max(NOTES_MIN, Math.round(window.innerWidth * 0.6));
    var w = Math.max(NOTES_MIN, Math.min(max, Math.round(px)));
    document.documentElement.style.setProperty("--notes-w", w + "px");
    try { localStorage.setItem("capnote:noteswidth", String(w)); } catch (e) {}
    if (!quiet) refitSoon(120);
    return w;
  }
  (function () {
    var v = 0;
    try { v = parseInt(localStorage.getItem("capnote:noteswidth"), 10) || 0; } catch (e) {}
    if (v) setNotesWidth(v, true);
  })();

  (function () {
    var g = $("ngrip"), dragging = false;
    g.addEventListener("pointerdown", function (e) {
      dragging = true;
      g.classList.add("on");
      g.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    g.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      // 오른쪽 끝에서 마우스까지의 거리가 곧 패널 폭이다
      setNotesWidth(window.innerWidth - e.clientX, true);
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      g.classList.remove("on");
      refitSoon(60);
    }
    g.addEventListener("pointerup", end);
    g.addEventListener("pointercancel", end);
    // 두 번 누르면 기본 폭으로
    g.addEventListener("dblclick", function () { setNotesWidth(350); });
  })();

  /*
   * PDF만 보기. 위 줄과 정리 패널을 접고 창 전체화면도 함께 요청한다.
   * 전체화면이 막히는 환경도 있으므로 화면 접기와 전체화면은 따로 다룬다.
   */
  function setFocus(on) {
    state.focus = !!on;
    $("root").classList.toggle("focus", state.focus);
    $("exitFocus").classList.toggle("gone", !state.focus);
    $("focus").classList.toggle("on", state.focus);
    try {
      if (state.focus && !document.fullscreenElement) {
        var p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      } else if (!state.focus && document.fullscreenElement) {
        var q = document.exitFullscreen();
        if (q && q.catch) q.catch(function () {});
      }
    } catch (e) { /* 전체화면이 막혀도 접기는 된다 */ }
    refitSoon(80);
  }
  $("focus").onclick = function () { setFocus(!state.focus); };
  $("exitFocus").onclick = function () { setFocus(false); };
  document.addEventListener("fullscreenchange", function () {
    // 창 전체화면을 밖에서 풀었으면 화면도 같이 돌려놓는다
    if (!document.fullscreenElement && state.focus) setFocus(false);
  });

  /* ---------- 영역 선택 ---------- */

  function bindSelection(layer) {
    var box = null, start = null, wasSel = null;

    layer.addEventListener("pointerdown", function (e) {
      if (e.target !== layer) return;
      // 누르는 순간 고르기를 푼다. 같은 자국을 다시 눌러 끄려면 뭐가 골라져
      // 있었는지 기억해 둬야 한다
      wasSel = state.selMark;
      if (state.selMark) { state.selMark = null; drawMarks(); }
      closeMemoEdit();
      layer.setPointerCapture(e.pointerId);
      var r = layer.getBoundingClientRect();
      start = { x: e.clientX - r.left, y: e.clientY - r.top };
      box = document.createElement("div");
      box.className = "sel";
      layer.appendChild(box);
    });

    layer.addEventListener("pointermove", function (e) {
      if (!start || !box) return;
      var r = layer.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      box.style.left = Math.min(x, start.x) + "px";
      box.style.top = Math.min(y, start.y) + "px";
      box.style.width = Math.abs(x - start.x) + "px";
      box.style.height = Math.abs(y - start.y) + "px";
    });

    /*
     * 눌린 자리에 형광펜 자국이 있는지 본다.
     *
     * 자국이 이벤트를 받으면 그어 둔 곳에 다시 드래그를 못 한다. 그래서 자국은
     * 통과시키고, 끌지 않고 톡 눌렀을 때만 여기서 찾아 고른다.
     */
    function markAt(x, y) {
      var hit = null;
      state.marks.forEach(function (mk) {
        var slot = slotOf(mk.page);
        if (!slot) return;
        mk.rects.forEach(function (q) {
          var bx = slot.x + q.x * slot.w, by = slot.y + q.y * slot.h;
          if (x >= bx && x <= bx + q.w * slot.w && y >= by && y <= by + q.h * slot.h) hit = mk;
        });
      });
      return hit;
    }

    function finish(e) {
      if (!start || !box) return;
      var r = layer.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      var rect = {
        x: Math.min(x, start.x), y: Math.min(y, start.y),
        w: Math.abs(x - start.x), h: Math.abs(y - start.y)
      };
      box.remove(); box = null; start = null;

      // 끌지 않고 톡 눌렀다 — 그 자리의 형광펜을 고른다
      if (rect.w < 6 && rect.h < 6) {
        var mk = markAt(x, y);
        if (mk) {
          state.selMark = wasSel === mk.id ? null : mk.id;
          drawMarks();
        }
        return;
      }

      if (state.tool === "hl") {
        // 형광펜은 한 줄만 그어도 되므로 문턱을 낮춘다
        if (rect.w > 6 && rect.h > 4) addMark(rect);
      } else if (rect.w > 14 && rect.h > 14) {
        capture(rect);
      }
    }

    layer.addEventListener("pointerup", finish);
    layer.addEventListener("pointercancel", function () {
      if (box) box.remove();
      box = null; start = null;
    });

    // 직접 쓰는 메모: 빈 곳을 더블클릭하면 그 자리에 생기고 바로 고칠 수 있다
    layer.addEventListener("dblclick", function (e) {
      if (e.target !== layer) return;
      var r = layer.getBoundingClientRect();
      var px = e.clientX - r.left, py = e.clientY - r.top;
      var slot = slotAt(px);
      if (!slot) return;
      var at = { x: (px - slot.x) / slot.w, y: (py - slot.y) / slot.h };
      var card = {
        id: "n" + Date.now(),
        page: slot.page,
        manual: true,
        inserted: true,
        memo: "",
        summary: "",
        rect: { x: at.x, y: at.y, w: 0, h: 0 },
        pin: at            // 누른 자리가 곧 의도다. 자동 배치를 끼워 넣지 않는다
      };
      state.cards.push(card);
      saveCard(card);
      closeMemoEdit();
      card.editingMemo = true;
      drawMemos();

      // 잘못 눌러 생긴 메모도 되돌릴 수 있게 (글 치는 중에는 Ctrl+Z가 글자를 맡는다)
      offerUndo("메모를 만들었습니다.", function () {
        closeMemoEdit();
        state.cards = state.cards.filter(function (c) { return c !== card; });
        deleteCard(card);
        drawMemos(); renderCards();
        setStatus("되돌렸습니다.");
      });
    });
  }

  /* ---------- 잘라내기 + 텍스트 뽑기 ---------- */

  /*
   * 오려낸 자리를 PDF에서 다시, 크게 그려 온다.
   *
   * 화면 캔버스에서 잘라 쓰면 창에 맞춘 배율 그대로다. A4 원본을 창에 맞추면
   * 한 줄 글자가 열몇 화소밖에 안 되므로, 그걸 잘라 정리 PDF에 키워 넣으면
   * 뭉개져 보였다. 원본은 벡터니까 필요한 만큼 배율을 올려 다시 그리면
   * 화면 배율과 상관없이 선명하다.
   */
  var CROP_MAX_PX = 6e6;                   // 너무 키우면 메모리만 먹는다
  async function cropFromPdf(pageNo, r, targetW) {
    var pg = await state.pdf.getPage(pageNo);
    var v1 = pg.getViewport({ scale: 1 });
    var wpt = Math.max(1, r.w * v1.width);
    var hpt = Math.max(1, r.h * v1.height);
    var scale = Math.max(1, Math.min(8, (targetW || 1400) / wpt));
    var px = (wpt * scale) * (hpt * scale);
    if (px > CROP_MAX_PX) scale *= Math.sqrt(CROP_MAX_PX / px);

    var vp = pg.getViewport({ scale: scale });
    var cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(r.w * vp.width));
    cv.height = Math.max(1, Math.round(r.h * vp.height));
    var g = cv.getContext("2d");
    g.fillStyle = "#fff";                  // 빈 곳이 투명하면 JPEG에서 까맣게 나온다
    g.fillRect(0, 0, cv.width, cv.height);
    // 오려낼 자리가 원점에 오도록 밀어 두고 그 쪽 전체를 그린다
    await pg.render({
      canvasContext: g,
      viewport: vp,
      transform: [1, 0, 0, 1, -r.x * vp.width, -r.y * vp.height]
    }).promise;
    return cv;
  }

  /*
   * 오려낸 그림 위에 그 쪽의 형광펜 자국을 얹는다.
   * 원본에서 다시 그려 오면 형광펜은 우리가 화면에만 그려 둔 것이라 빠진다.
   * 곱하기로 얹어야 글자가 비쳐 화면에서 보던 것과 같아진다.
   */
  function paintMarksOn(cv, pageNo, r) {
    if (!state.marks.length) return cv;
    var g = cv.getContext("2d");
    g.save();
    g.globalCompositeOperation = "multiply";
    state.marks.forEach(function (m) {
      if (m.page !== pageNo) return;
      var c = penOf(m.color).rgb;
      g.fillStyle = "rgb(" + Math.round(c[0] * 255) + "," +
                             Math.round(c[1] * 255) + "," +
                             Math.round(c[2] * 255) + ")";
      m.rects.forEach(function (q) {
        g.fillRect((q.x - r.x) / r.w * cv.width, (q.y - r.y) / r.h * cv.height,
                   q.w / r.w * cv.width, q.h / r.h * cv.height);
      });
    });
    g.restore();
    return cv;
  }

  function shrinkTo(cv, maxW) {
    if (cv.width <= maxW) return cv;
    var out = document.createElement("canvas");
    out.width = maxW;
    out.height = Math.max(1, Math.round(cv.height * maxW / cv.width));
    var g = out.getContext("2d");
    g.imageSmoothingQuality = "high";
    g.drawImage(cv, 0, 0, out.width, out.height);
    return out;
  }

  function cropImage(rect, maxW) {
    var d = state.dprUsed;
    var sx = rect.x * d, sy = rect.y * d, sw = rect.w * d, sh = rect.h * d;
    var out = document.createElement("canvas");
    var k = Math.min(1, (maxW || 1400) / sw);
    out.width = Math.max(1, Math.round(sw * k));
    out.height = Math.max(1, Math.round(sh * k));
    var ctx = out.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(state.canvas, sx, sy, sw, sh, 0, 0, out.width, out.height);
    return out;
  }

  // 같은 쪽의 글자를 드래그할 때마다 다시 읽고 있었다. 한 번만 읽고 쟁여 둔다
  var _tcCache = {};
  async function textContentOf(pageNo) {
    if (_tcCache[pageNo]) return _tcCache[pageNo];
    var page = await state.pdf.getPage(pageNo);
    _tcCache[pageNo] = await page.getTextContent();
    return _tcCache[pageNo];
  }

  /*
   * 형광펜 띠에 걸친 글자를 뽑는다.
   *
   * 글자 중심이 띠 안에 드는지로 따지면, 띠가 글줄에 딱 붙어 있어 아슬아슬하게
   * 빠진다. 그렇다고 띠를 넓혀 잡으면 윗줄 아랫줄이 통째로 따라 들어온다.
   * 글자 상자와 띠가 세로로 얼마나 겹치는지로 따지면 둘 다 피할 수 있다.
   *
   * 쪽 번호를 받는 것도 뜻이 있다 — textInRect는 지금 보고 있는 쪽의 화면
   * 좌표만 받아서 다른 쪽에 그은 형광펜을 읽을 수 없었다.
   */
  async function textUnderBands(pageNo, rects) {
    try {
      var pg = await state.pdf.getPage(pageNo);
      var vp = pg.getViewport({ scale: 1 });
      var tc = await textContentOf(pageNo);
      var out = [];
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(vp.transform, it.transform);
        var h = Math.hypot(t[2], t[3]) / vp.height;
        var y = t[5] / vp.height - h;                  // 글자 상자 위쪽
        var cx = (t[4] + (it.width || 0) / 2) / vp.width;
        for (var i = 0; i < rects.length; i++) {
          var r = rects[i];
          if (cx < r.x || cx > r.x + r.w) continue;
          var ov = Math.min(y + h, r.y + r.h) - Math.max(y, r.y);
          if (ov > h * 0.5) { out.push(it.str); return; }
        }
      });
      return out.join(" ").replace(/\s+/g, " ").trim().slice(0, 2500);
    } catch (e) { return ""; }
  }

  async function textInRect(rect, slot) {
    try {
      var tc = await textContentOf(slot.page);
      var d = state.dprUsed;
      var out = [];
      tc.items.forEach(function (it) {
        var t = pdfjsLib.Util.transform(slot.vp.transform, it.transform);
        var x = t[4] / d + slot.x, y = t[5] / d + slot.y;
        var h = Math.hypot(t[2], t[3]) / d;
        var w = (it.width || 0) * state.scale;
        var cx = x + w / 2, cy = y - h / 2;
        if (cx >= rect.x && cx <= rect.x + rect.w && cy >= rect.y && cy <= rect.y + rect.h) {
          out.push(it.str);
        }
      });
      return out.join(" ").replace(/\s+/g, " ").trim().slice(0, 2500);
    } catch (e) { return ""; }
  }

  /* ---------- Claude 호출 ---------- */

  async function callClaude(messages) {
    var res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages })
    });
    if (!res.ok) {
      // 서버가 알려준 진짜 이유를 그대로 올려보낸다.
      // 그러지 않으면 Claude Code 미설치도 그냥 "연결 실패"로만 보인다.
      var why = "";
      try { why = (await res.json()).error || ""; } catch (e) {}
      if (/ENOENT|claude CLI/.test(why)) {
        why = "Claude Code가 설치돼 있지 않습니다. 터미널에서 npm i -g @anthropic-ai/claude-code 후 claude auth login 하세요.";
      }
      // 실패했으면 준비 상태를 다시 살펴 안내를 띄운다
      if (/claude|ENOENT|찾지 못했|끝났습니다/.test(why)) checkCli();
      throw new Error(why || ("http " + res.status));
    }
    var data = await res.json();
    return (data.content || [])
      .map(function (i) { return i.type === "text" ? i.text : ""; })
      .filter(Boolean)
      .join("\n");
  }

  function recentContext() {
    return state.cards.slice(-2).map(function (c) {
      return "(" + c.page + "쪽) " + (c.memo || "");
    }).join(" / ");
  }

  /*
   * 오려낸 다음에 무엇을 시킬지 고른다.
   *
   * 예전에는 드래그하자마자 "핵심 정리"를 써 버렸다. 그런데 필요한 게 매번
   * 다르다 — 시험 포인트만 볼 때가 있고, 아예 모르는 개념이라 12살에게
   * 설명하듯 풀어야 할 때가 있다. 한 번 부르고 마는 대신 고르게 한다.
   * 위쪽 "묻지 말고 자동으로 넣기"를 켜면 핵심 정리로 바로 간다.
   */
  var ASK_MODES = [
    { id: "core",  label: "핵심만 정리",
      how: "3~5줄로 짧고 구체적으로 정리하세요. 수업 중에 읽을 것입니다." },
    { id: "deep",  label: "자세히 설명",
      how: "왜 그런지, 어디에 쓰이는지까지 풀어서 설명하세요. 10줄 이내." },
    { id: "kid",   label: "12살에게 설명하듯",
      how: "12살이 알아들을 수 있게 쉬운 말과 비유로 풀어서 설명하세요. " +
           "전문용어를 쓰면 바로 옆에 뜻을 붙이세요. 10줄 이내." },
    { id: "exam",  label: "시험 포인트",
      how: "시험에 나올 만한 것만 뽑으세요. 외워야 할 정의·수치·조건 위주로 5줄 이내." },
    { id: "terms", label: "용어 풀이",
      how: "이 부분에 나오는 용어만 뽑아 '용어 — 뜻' 형식으로 한 줄씩 적으세요." },
    /*
     * 몇 문장으로 정리할지 직접 정하는 칸.
     *
     * "자세히"와 "짧게" 사이의 눈금이 사람마다 다르다. 어떤 대목은 두 문장이면
     * 되고 어떤 대목은 열 문장이 필요하다. 이름표와 시킬 말이 숫자를 따라가야
     * 하므로 글이 아니라 함수로 둔다.
     */
    { id: "n",
      label: function () { return state.nSent + "문장으로 정리"; },
      how: function () {
        return "정확히 " + state.nSent + "문장으로 정리하세요. " +
               "문장 수를 지키되, 한 문장에 여러 내용을 욱여넣지는 마세요.";
      } }
  ];

  function modeLabel(m) { return typeof m.label === "function" ? m.label() : m.label; }
  function modeHow(m) { return typeof m.how === "function" ? m.how() : m.how; }

  var N_MIN = 1, N_MAX = 20;
  function setNSent(v) {
    var n = Math.max(N_MIN, Math.min(N_MAX, parseInt(v, 10) || 5));
    state.nSent = n;
    try { localStorage.setItem("capnote:nsent", String(n)); } catch (e) {}
    return n;
  }
  (function () {
    var v = 5;
    try { v = parseInt(localStorage.getItem("capnote:nsent"), 10) || 5; } catch (e) {}
    state.nSent = Math.max(N_MIN, Math.min(N_MAX, v));
  })();

  /*
   * 숫자 칸 + 버튼 한 벌. 오려낸 뒤 고르는 줄에도, 자동 넣기 목록에도 쓴다.
   */
  function nSentRow(onPick) {
    var wrap = document.createElement("span");
    wrap.className = "nsent";
    var num = document.createElement("input");
    num.type = "number";
    num.min = String(N_MIN);
    num.max = String(N_MAX);
    num.value = String(state.nSent);
    num.title = "몇 문장으로 정리할지";
    num.addEventListener("keydown", function (e) { e.stopPropagation(); });
    num.addEventListener("change", function () { num.value = String(setNSent(num.value)); });
    var b = document.createElement("button");
    b.textContent = "문장으로 정리";
    b.onclick = function () { setNSent(num.value); onPick(); };
    wrap.appendChild(num);
    wrap.appendChild(b);
    return wrap;
  }

  /*
   * 자동 넣기 — 켜고 끄는 것만이 아니라 "무엇으로" 정리할지까지 고른다.
   *
   * 전에는 켜면 늘 핵심만 정리로 갔다. 그런데 수업마다 필요한 게 다르다.
   * 이번 수업은 시험 포인트만, 다음 수업은 용어 풀이만 — 그걸 미리 정해 두고
   * 오려내기만 하면 되게 했다. 수업이 끝나면 잊어도 되는 설정이라 저장하지
   * 않는다("이번 수업은"이라는 말 그대로다).
   */
  state.auto = null;                       // null이면 오려낸 뒤 묻고 고른다

  function autoLabel() {
    if (!state.auto) return "끔";
    if (state.auto.mode) return modeLabel(state.auto.mode);
    var t = state.auto.free || "";
    return t.length > 10 ? t.slice(0, 10) + "…" : t;
  }

  function renderAuto() {
    $("autoWhat").textContent = autoLabel();
    $("autoBtn").classList.toggle("on", !!state.auto);
    $("autoBtn").title = state.auto
      ? "오려내면 묻지 않고 바로 " + (state.auto.mode ? modeLabel(state.auto.mode) : "\u0027" + state.auto.free + "\u0027") + "(으)로 정리해 붙입니다"
      : "오려내면 무엇을 시킬지 고르게 합니다";
    Array.prototype.forEach.call($("apList").children, function (b) {
      b.classList.toggle("on",
        (!state.auto && b.dataset.m === "off") ||
        !!(state.auto && state.auto.mode && state.auto.mode.id === b.dataset.m));
    });
    // 숫자 칸은 지금 값을 따라간다
    Array.prototype.forEach.call($("apList").querySelectorAll(".nsent input"),
      function (i) { i.value = String(state.nSent); });
  }

  function closeAuto() { $("autoPop").classList.add("gone"); }

  (function buildAuto() {
    var list = $("apList");
    function item(id, label, pick) {
      var b = document.createElement("button");
      b.dataset.m = id;
      b.textContent = label;
      b.onclick = function () { pick(); renderAuto(); closeAuto(); };
      list.appendChild(b);
    }
    item("off", "묻고 고르기", function () { state.auto = null; });
    ASK_MODES.forEach(function (m) {
      if (m.id === "n") {
        var row = document.createElement("div");
        row.className = "apn";
        row.dataset.m = m.id;
        row.appendChild(nSentRow(function () {
          state.auto = { mode: m };
          renderAuto();
          closeAuto();
        }));
        list.appendChild(row);
        return;
      }
      item(m.id, modeLabel(m), function () { state.auto = { mode: m }; });
    });

    $("autoBtn").onclick = function (e) {
      e.stopPropagation();
      $("autoPop").classList.toggle("gone");
    };
    $("autoPop").addEventListener("click", function (e) { e.stopPropagation(); });
    document.addEventListener("click", closeAuto);

    $("autoFreeGo").onclick = function () {
      var t = $("autoFree").value.trim();
      if (!t) { setStatus("무엇을 시킬지 적어 주세요."); return; }
      state.auto = { free: t };
      renderAuto(); closeAuto();
    };
    $("bulkAll").onclick = function () { showBulkSheet(); };

    $("autoFree").addEventListener("keydown", function (e) {
      e.stopPropagation();                 // Delete·Ctrl+Z 단축키가 끼어들지 않게
      if (e.key === "Enter") { e.preventDefault(); $("autoFreeGo").onclick(); }
    });

    renderAuto();
  })();

  /*
   * 모든 쪽 정리.
   *
   * 쪽마다 AI를 한 번씩 부른다 — 쪽이 많으면 그만큼 걸린다. "순식간"은 만들 수
   * 없으니 대신 몇 쪽씩 나란히 돌리고, 끝나는 대로 바로 붙이고, 언제든 멈출 수
   * 있게 했다. 이미 정리해 둔 쪽은 건너뛴다 — 두 번 물으면 시간만 든다.
   */
  var BULK_AT_ONCE = 3;
  var bulk = null;

  async function summarizePage(pageNo, mode) {
    var shot = await cropFromPdf(pageNo, { x: 0, y: 0, w: 1, h: 1 }, 1100);
    var txt = "";
    try {
      var tc = await textContentOf(pageNo);
      txt = tc.items.map(function (x) { return x.str; }).join(" ")
              .replace(/\s+/g, " ").trim().slice(0, 3000);
    } catch (e) { /* 글자가 없어도 그림으로 답한다 */ }

    var content = [
      { type: "image", source: { type: "base64", media_type: "image/jpeg",
                                 data: shot.toDataURL("image/jpeg", 0.75).split(",")[1] } },
      { type: "text", text:
          "대학 강의자료 " + pageNo + "쪽 전체입니다.\n" +
          (txt ? "이 쪽의 원문 텍스트: " + txt + "\n" : "") +
          "\n" + modeHow(mode) + "\n" +
          "\n한국어로 답하고, 아래 JSON만 출력하세요. 설명이나 코드블록 표시는 넣지 마세요.\n" +
          "글 안에도 마크다운 표시(**, ##)는 쓰지 마세요. 목록은 \"- \"로만 적으세요.\n" +
          '{"memo": "PDF에 붙일 핵심 3~5줄. 각 줄 28자 이내로 끊고 줄바꿈 \\n 으로 구분. ' +
          '나중에 이 줄만 봐도 무슨 내용인지 알 수 있게 구체적으로.", ' +
          '"summary": "위에서 시킨 대로 쓴 본문"}' }
    ];

    var raw = await callClaude([{ role: "user", content: content }]);
    var clean = raw.replace(/```json|```/g, "").trim();
    var parsed;
    try { parsed = JSON.parse(clean); }
    catch (e) { parsed = { memo: clean.slice(0, 60), summary: clean }; }

    var card = {
      id: "b" + pageNo + "-" + Date.now(),
      page: pageNo,
      mode: modeLabel(mode),
      bulk: true,
      rect: { x: 0, y: 0, w: 0, h: 0 },   // 오려낸 자리가 없다 — 테두리도 안 만든다
      memo: (parsed.memo || "").slice(0, 300),
      summary: parsed.summary || clean,
      detail: "",
      inserted: true
    };
    state.cards.push(card);
    await placeMemoFor(card);
    saveCard(card);
  }

  function bulkStatus() {
    var el = $("status");
    el.className = "status";
    el.textContent = "모든 쪽 정리 " + bulk.done + " / " + bulk.total + "쪽… ";
    var b = document.createElement("button");
    b.textContent = "멈추기";
    b.onclick = function () { if (bulk) bulk.stop = true; };
    el.appendChild(b);
  }

  async function runBulk(from, to, mode) {
    if (bulk) { setStatus("이미 정리하는 중입니다."); return; }

    var todo = [];
    for (var p = from; p <= to; p++) {
      var has = state.cards.some(function (c) {
        return c.page === p && c.inserted && !c.manual && !c.qna;
      });
      if (!has) todo.push(p);
    }
    if (!todo.length) { setStatus("그 범위는 이미 다 정리돼 있습니다."); return; }

    bulk = { stop: false, done: 0, total: todo.length, fail: 0 };
    var atStart = state.docKey, idx = 0, pending = false;
    bulkStatus();

    // 쪽마다 다시 그리면 카드가 많을 때 화면이 버벅인다. 조금 모아서 그린다
    function soft() {
      if (pending) return;
      pending = true;
      setTimeout(function () { pending = false; renderCards(); drawMemos(); }, 350);
    }

    async function worker() {
      while (bulk && !bulk.stop) {
        var n = todo[idx++];
        if (n == null) return;
        try { await summarizePage(n, mode); }
        catch (e) { if (bulk) bulk.fail++; }
        if (!bulk) return;
        if (state.docKey !== atStart) { bulk.stop = true; return; }   // 다른 자료로 옮겼다
        bulk.done++;
        bulkStatus();
        soft();
      }
    }

    var runners = [];
    for (var i = 0; i < Math.min(BULK_AT_ONCE, todo.length); i++) runners.push(worker());
    await Promise.all(runners);

    var stopped = bulk.stop, done = bulk.done, fail = bulk.fail;
    bulk = null;
    renderCards(); drawMemos();
    setStatus((stopped ? "멈췄습니다. " : "") + done + "쪽 정리해 붙였습니다." +
              (fail ? " " + fail + "쪽은 받아오지 못했습니다." : ""));
  }

  function showBulkSheet() {
    if (!state.pdf) { setStatus("먼저 PDF를 여세요."); closeAuto(); return; }
    closeSheet();
    closeAuto();

    var veil = document.createElement("div");
    veil.className = "veil";
    veil.addEventListener("pointerdown", function (e) { if (e.target === veil) closeSheet(); });
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

    var h = document.createElement("h3");
    h.textContent = "모든 쪽 정리";
    sheet.appendChild(h);

    var body = document.createElement("div");
    body.className = "sbody";
    var note = document.createElement("p");
    note.className = "note";
    note.textContent = "쪽마다 한 번씩 물어 정리를 붙입니다. " + state.pages +
                       "쪽이면 그만큼 걸립니다(한 쪽에 몇 초, " + BULK_AT_ONCE +
                       "쪽씩 나란히 돌립니다). 이미 정리해 둔 쪽은 건너뜁니다. " +
                       "도중에 멈출 수 있고, 그때까지 붙인 것은 남습니다.";
    body.appendChild(note);

    var row = document.createElement("div");
    row.className = "bulkrow";
    var from = document.createElement("input");
    from.type = "number"; from.min = "1"; from.max = String(state.pages);
    from.value = "1";
    var to = document.createElement("input");
    to.type = "number"; to.min = "1"; to.max = String(state.pages);
    to.value = String(state.pages);
    var dash = document.createElement("span");
    dash.textContent = "–";
    var tail = document.createElement("span");
    tail.textContent = "쪽";
    row.appendChild(document.createTextNode("범위"));
    row.appendChild(from); row.appendChild(dash); row.appendChild(to); row.appendChild(tail);
    body.appendChild(row);

    var row2 = document.createElement("div");
    row2.className = "bulkrow";
    var sel = document.createElement("select");
    ASK_MODES.forEach(function (m, i) {
      var o = document.createElement("option");
      o.value = String(i);
      o.textContent = modeLabel(m);
      sel.appendChild(o);
    });
    // 지금 자동 넣기로 정해 둔 방식이 있으면 그것을 먼저 보여 준다
    if (state.auto && state.auto.mode) {
      ASK_MODES.forEach(function (m, i) { if (m.id === state.auto.mode.id) sel.value = String(i); });
    }
    row2.appendChild(document.createTextNode("방식"));
    row2.appendChild(sel);
    body.appendChild(row2);
    sheet.appendChild(body);

    var foot = document.createElement("div");
    foot.className = "sfoot";
    var go = document.createElement("button");
    go.className = "primary";
    go.textContent = "시작";
    go.onclick = function () {
      var a = Math.max(1, Math.min(state.pages, parseInt(from.value, 10) || 1));
      var b = Math.max(1, Math.min(state.pages, parseInt(to.value, 10) || state.pages));
      if (b < a) { var t = a; a = b; b = t; }
      closeSheet();
      runBulk(a, b, ASK_MODES[parseInt(sel.value, 10) || 0]);
    };
    var sp = document.createElement("div");
    sp.className = "spacer";
    var close = document.createElement("button");
    close.textContent = "닫기";
    close.onclick = closeSheet;
    foot.appendChild(go); foot.appendChild(sp); foot.appendChild(close);
    sheet.appendChild(foot);
    veil.appendChild(sheet);
    $("root").appendChild(veil);
  }

  // 오려낸 원본 그림과 원문은 카드에 넣지 않는다. 저장소에 들어가면 무겁다
  var pendingCrops = {};

  async function capture(rect) {
    var slot = slotAt(rect.x + rect.w / 2);   // 두 쪽 보기면 어느 쪽을 오렸는지
    if (!slot) return;
    var r01 = toPageRect(rect, slot);
    if (!(r01.w > 0 && r01.h > 0)) return;

    // 원본에서 크게 다시 그려 온다. 못 하면 화면에서 잘라 쓴다
    var hi = null;
    try { hi = await cropFromPdf(slot.page, r01, 1600); } catch (e) {}
    var full = hi || cropImage(rect, 1400);
    var thumb = hi ? shrinkTo(hi, 560) : cropImage(rect, 560);
    var id = "c" + Date.now();

    var card = {
      id: id,
      page: slot.page,
      img: thumb.toDataURL("image/jpeg", 0.8),
      rect: r01,
      memo: "", summary: "", detail: "",
      inserted: false,
      awaiting: true                       // 무엇을 시킬지 아직 안 골랐다
    };

    pendingCrops[id] = {
      b64: full.toDataURL("image/jpeg", 0.9).split(",")[1],
      text: await textInRect(rect, slot)
    };
